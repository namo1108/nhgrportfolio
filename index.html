<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 가계부</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%231a1f2c'/><path d='M30 40h40v30H30z' fill='%233b82f6'/><path d='M70 45h5v20h-5z' fill='%2360a5fa'/><circle cx='50' cy='55' r='8' fill='white' opacity='0.8'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        :root { --primary: #1a1f2c; --accent: #3b82f6; --bg: #f8fafc; }
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: var(--bg); 
            color: #0f172a; 
            word-break: keep-all; 
            -webkit-tap-highlight-color: transparent; 
            overflow-x: hidden; 
        }
        .main-gradient { background: linear-gradient(135deg, #1a1f2c 0%, #2d364d 100%); border-radius: 2rem; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 1.25rem; }
        
        .swipe-item { position: relative; overflow: hidden; border-radius: 1.25rem; transition: transform 0.3s ease; touch-action: pan-y; margin-bottom: 0.75rem; }
        .swipe-content { position: relative; z-index: 10; background: white; transition: transform 0.3s ease; border: 1px solid #e2e8f0; border-radius: 1.25rem; cursor: pointer; }
        .swipe-content:active { background: #f1f5f9; }
        .swipe-action { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: #ef4444; color: white; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; z-index: 5; border-radius: 0 1.25rem 1.25rem 0; cursor: pointer; }
        
        .input-premium { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1.5px solid #e2e8f0; font-size: 15px; font-weight: 600; outline: none; transition: 0.2s; background: white; }
        .input-premium:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        
        .btn-primary { background-color: var(--primary); color: white; border-radius: 0.75rem; font-weight: 800; transition: 0.2s; border: none; cursor: pointer; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-edit { background-color: #f59e0b; color: white; }
        
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.1); border-top: 2px solid #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tab-active { background-color: var(--primary) !important; color: white !important; font-weight: 800; border-color: var(--primary) !important; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (min-width: 1024px) {
            .pc-delete-btn { display: flex !important; }
            .swipe-action { display: none !important; }
            .swipe-content { transform: none !important; }
        }
    </style>
</head>
<body class="antialiased">
    <div class="max-w-6xl mx-auto p-4 md:p-8 min-h-screen">
        <!-- Header -->
        <header class="main-gradient p-6 md:p-10 text-white shadow-2xl mb-8">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1 bg-blue-500/30 text-blue-300 text-[10px] font-black rounded-full border border-blue-500/30 uppercase tracking-widest">NamHo GaRam</span>
                        <div id="sync-status" class="flex items-center gap-1.5 text-[10px] font-bold text-slate-400">
                            <span id="status-dot" class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> <span id="status-text">CLOUD SYNCED</span>
                        </div>
                    </div>
                    <p class="text-xs font-bold text-slate-400 mb-[-10px] ml-1">남호가람 통합 자산 현황</p>
                    <h1 id="total-wealth" class="text-4xl md:text-5xl font-black font-mono tracking-tighter">₩0</h1>
                </div>
                <div class="flex gap-4">
                    <div class="bg-white/5 px-6 py-3 rounded-2xl border border-white/10">
                        <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">실시간 환율 (USD)</p>
                        <p id="rate-display" class="text-xl font-black text-blue-300 font-mono">1,400.0</p>
                    </div>
                    <div class="bg-white/5 px-6 py-3 rounded-2xl border border-white/10">
                        <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">이번 달 현금흐름</p>
                        <p id="flow-display" class="text-xl font-black font-mono text-emerald-400">+₩0</p>
                        <p class="text-[8px] text-slate-500 font-bold mt-1">(자산증가 - 지출)</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-8">
            <!-- Sidebar -->
            <aside class="space-y-6">
                <div id="input-card" class="glass-card p-6 shadow-xl border-t-4 border-t-blue-500 transition-all duration-300 sticky top-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="input-title" class="text-xl font-black tracking-tight">기록하기</h2>
                        <div class="flex items-center bg-slate-100 rounded-xl p-1 font-mono text-[11px] font-black">
                            <button onclick="moveMonth(-1)" class="p-2 hover:bg-white rounded-lg transition-colors">◀</button>
                            <span id="current-month" class="px-2">2026. 04</span>
                            <button onclick="moveMonth(1)" class="p-2 hover:bg-white rounded-lg transition-colors">▶</button>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-2">
                            <button id="btn-user-h" onclick="toggleUser('남호')" class="py-3 btn-primary text-xs tracking-tighter">남호</button>
                            <button id="btn-user-w" onclick="toggleUser('가람')" class="py-3 bg-white text-slate-300 border border-slate-100 rounded-xl font-black text-xs tracking-tighter transition-all">가람</button>
                        </div>
                        
                        <div class="flex p-1 bg-slate-100 rounded-xl">
                            <button id="btn-type-in" onclick="toggleType('수입')" class="flex-1 py-2 rounded-lg font-black text-[11px] bg-white text-primary shadow-sm transition-all">수입/자산</button>
                            <button id="btn-type-out" onclick="toggleType('지출')" class="flex-1 py-2 rounded-lg font-black text-[11px] text-slate-400 transition-all">지출</button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="input-date" class="input-premium text-xs">
                            <input type="number" id="input-amount" placeholder="금액" class="input-premium text-xs font-mono">
                        </div>
                        
                        <select id="input-cat" onchange="toggleStockFields()" class="input-premium text-xs"></select>
                        
                        <div id="stock-fields" class="hidden p-4 bg-blue-50/50 border border-blue-100 rounded-xl space-y-2">
                            <input type="text" id="input-ticker" placeholder="티커 (예: AAPL, 005930)" class="input-premium text-xs font-mono uppercase">
                            <input type="number" id="input-qty" placeholder="수량" step="any" class="input-premium text-xs font-mono">
                        </div>
                        
                        <input type="text" id="input-desc" placeholder="메모 (선택사항)" class="input-premium text-xs">
                        
                        <div class="flex flex-col gap-2 pt-2">
                            <button id="btn-save" onclick="saveData()" class="w-full py-4 btn-primary shadow-lg flex justify-center items-center gap-2">
                                <span id="save-text">데이터 저장하기</span>
                                <div id="save-loader" class="spinner hidden" style="border-top-color: white;"></div>
                            </button>
                            <button id="btn-cancel-edit" onclick="cancelEdit()" class="hidden w-full py-3 bg-slate-200 text-slate-600 rounded-xl font-black text-xs">수정 취소</button>
                        </div>
                    </div>
                </div>

                <div id="date-picker-box" class="glass-card p-6 shadow-lg border-t-4 border-t-emerald-500 hidden">
                    <h3 class="text-sm font-black mb-3 text-slate-500 uppercase tracking-wider">특정 날짜 조회</h3>
                    <input type="date" id="filter-specific-date" onchange="setFilter('date')" class="input-premium text-xs">
                </div>
            </aside>

            <!-- Main Content -->
            <main class="space-y-4">
                <div id="filter-nav" class="flex gap-2 overflow-x-auto py-1 hide-scrollbar sticky top-0 bg-[#f8fafc]/90 backdrop-blur-md z-30">
                    <button onclick="setFilter('all')" id="f-all" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm tab-active">전체보기</button>
                    <button onclick="setFilter('income')" id="f-income" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400">수입</button>
                    <button onclick="setFilter('expense')" id="f-expense" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400">지출</button>
                    <button onclick="setFilter('asset')" id="f-asset" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400">자산현황</button>
                    <button onclick="setFilter('date')" id="f-date" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400">날짜별</button>
                </div>
                
                <div id="main-list" class="space-y-3 pb-20">
                    <div class="text-center py-24">
                        <div class="spinner mx-auto mb-4"></div>
                        <p class="text-slate-400 font-bold">클라우드 데이터 동기화 중...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, query, orderBy, getDocs, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        let dataRecords = [], currentFilter = 'all', viewDate = new Date("2026-04-24");
        let exchangeRate = 1400, livePrices = {};
        const state = { user: '남호', type: '수입', editId: null, authUser: null };

        const categorySet = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '주거', '금융/대출', '의류', '생활용품', '교통', '문화/여가', '경조사', '의료', '통신', '보험', '기타'],
            '자산': ['보증금', '저축/예금', '적금', '주식 (해외)', '주식 (국내)', '연금/퇴직금', '청약']
        };

        // 초기 자산 및 지출 데이터 (이미지 기반)
        const initialSeedData = [
            // 남호 자산
            { id: "seed_1", user_name: "남호", type: "자산", category: "주식 (국내)", amount: 98000, date: "2026. 04. 24.", description: "KODEX200", ticker: "069500", qty: 27 },
            { id: "seed_2", user_name: "남호", type: "자산", category: "주식 (국내)", amount: 198761, date: "2026. 04. 24.", description: "삼성전자", ticker: "005930", qty: 31 },
            { id: "seed_3", user_name: "남호", type: "자산", category: "주식 (국내)", amount: 8590, date: "2026. 04. 24.", description: "우리금융지주", ticker: "316141", qty: 1 },
            { id: "seed_4", user_name: "남호", type: "자산", category: "주식 (국내)", amount: 2306, date: "2026. 04. 24.", description: "이스트에이드", ticker: "239340", qty: 166 },
            { id: "seed_5", user_name: "남호", type: "자산", category: "연금/퇴직금", amount: 18898783, date: "2026. 04. 24.", description: "퇴직연금" },
            { id: "seed_6", user_name: "남호", type: "자산", category: "청약", amount: 5760000, date: "2026. 04. 24.", description: "주택청약" },
            { id: "seed_7", user_name: "남호", type: "자산", category: "보증금", amount: 15800000, date: "2026. 04. 24.", description: "아파트보증금" },
            { id: "seed_8", user_name: "남호", type: "자산", category: "적금", amount: 7000000, date: "2026. 04. 24.", description: "청년도약적금" },
            { id: "seed_9", user_name: "남호", type: "자산", category: "저축/예금", amount: 3510000, date: "2026. 04. 24.", description: "연지곤지" },
            
            // 가람 자산
            { id: "seed_10", user_name: "가람", type: "자산", category: "주식 (국내)", amount: 195000, date: "2026. 04. 24.", description: "주식 (국내)", ticker: "005930", qty: 47 },
            { id: "seed_11", user_name: "가람", type: "자산", category: "주식 (해외)", amount: 482.52, date: "2026. 04. 24.", description: "QQQ", ticker: "QQQ", qty: 0.69 },
            { id: "seed_12", user_name: "가람", type: "자산", category: "주식 (해외)", amount: 33.15, date: "2026. 04. 24.", description: "SCHD", ticker: "SCHD", qty: 0.78 },
            { id: "seed_13", user_name: "가람", type: "자산", category: "연금/퇴직금", amount: 5000000, date: "2026. 04. 24.", description: "퇴직금" },
            { id: "seed_14", user_name: "가람", type: "자산", category: "청약", amount: 6200000, date: "2026. 04. 24.", description: "주택청약" },

            // 가람 지출
            { id: "seed_15", user_name: "가람", type: "지출", category: "교통", amount: 54000, date: "2026. 04. 24.", description: "자동차검사비" },
            { id: "seed_16", user_name: "가람", type: "지출", category: "문화/여가", amount: 4000, date: "2026. 04. 24.", description: "복권구매" },
            { id: "seed_17", user_name: "가람", type: "지출", category: "주거", amount: 251200, date: "2026. 04. 24.", description: "관리비" },
            { id: "seed_18", user_name: "가람", type: "지출", category: "식비", amount: 6000, date: "2026. 04. 23.", description: "직원들 커피" },
            { id: "seed_19", user_name: "가람", type: "지출", category: "문화/여가", amount: 45000, date: "2026. 04. 23.", description: "야구장티켓" },
            { id: "seed_20", user_name: "가람", type: "지출", category: "주거", amount: 271000, date: "2026. 04. 23.", description: "임대료" },
            { id: "seed_21", user_name: "가람", type: "지출", category: "교통", amount: 154200, date: "2026. 04. 20.", description: "자동차보험" },
            { id: "seed_22", user_name: "가람", type: "지출", category: "문화/여가", amount: 6000, date: "2026. 04. 18.", description: "에버랜드게임" }
        ];

        window.toggleUser = (u) => {
            state.user = u;
            document.getElementById('btn-user-h').className = (u === '남호') ? 'py-3 btn-primary text-xs tracking-tighter' : 'py-3 bg-white text-slate-300 border border-slate-100 rounded-xl font-black text-xs tracking-tighter transition-all';
            document.getElementById('btn-user-w').className = (u === '가람') ? 'py-3 btn-primary text-xs tracking-tighter' : 'py-3 bg-white text-slate-300 border border-slate-100 rounded-xl font-black text-xs tracking-tighter transition-all';
        };

        window.toggleType = (t) => {
            state.type = t;
            document.getElementById('btn-type-in').className = `flex-1 py-2 rounded-lg font-black text-[11px] transition-all ${t === '수입' ? 'bg-white text-primary shadow-sm' : 'text-slate-400'}`;
            document.getElementById('btn-type-out').className = `flex-1 py-2 rounded-lg font-black text-[11px] transition-all ${t === '지출' ? 'bg-white text-primary shadow-sm' : 'text-slate-400'}`;
            updateCategoryUI();
        };

        window.toggleStockFields = () => {
            const isStock = document.getElementById('input-cat').value.includes("주식");
            document.getElementById('stock-fields').classList.toggle('hidden', !isStock);
        };

        window.moveMonth = (d) => { viewDate.setMonth(viewDate.getMonth() + d); updateMonthLabel(); renderList(); };
        
        window.setFilter = (f) => {
            currentFilter = f;
            ['all', 'income', 'expense', 'asset', 'date'].forEach(key => {
                const el = document.getElementById('f-' + key);
                if(f === key) el.classList.add('tab-active');
                else el.classList.remove('tab-active');
            });
            document.getElementById('date-picker-box').classList.toggle('hidden', f !== 'date');
            renderList();
        };

        window.startEdit = (id) => {
            const r = dataRecords.find(item => String(item.id) === String(id));
            if(!r) return;
            state.editId = id;
            window.toggleUser(r.user_name);
            const isAsset = r.type === '자산' || categorySet.자산.includes(r.category);
            window.toggleType(isAsset ? '수입' : r.type); 
            
            const dPart = r.date.match(/\d+/g);
            if(dPart && dPart.length === 3) {
                document.getElementById('input-date').value = `${dPart[0]}-${dPart[1].padStart(2, '0')}-${dPart[2].padStart(2, '0')}`;
            }
            document.getElementById('input-amount').value = r.amount;
            document.getElementById('input-cat').value = r.category;
            document.getElementById('input-desc').value = r.description;
            document.getElementById('input-ticker').value = r.ticker || "";
            document.getElementById('input-qty').value = r.qty || "";
            window.toggleStockFields();
            
            const saveBtn = document.getElementById('btn-save');
            saveBtn.classList.add('btn-edit');
            document.getElementById('save-text').innerText = "데이터 수정하기";
            document.getElementById('input-title').innerText = "내역 수정 중";
            document.getElementById('input-card').classList.replace('border-t-blue-500', 'border-t-amber-500');
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = () => {
            state.editId = null;
            document.getElementById('input-amount').value = '';
            document.getElementById('input-desc').value = '';
            document.getElementById('input-ticker').value = '';
            document.getElementById('input-qty').value = '';
            const saveBtn = document.getElementById('btn-save');
            saveBtn.classList.remove('btn-edit');
            document.getElementById('save-text').innerText = "데이터 저장하기";
            document.getElementById('input-title').innerText = "기록하기";
            document.getElementById('input-card').classList.replace('border-t-amber-500', 'border-t-blue-500');
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        };

        window.globalDeleteItem = async (id) => {
            if(!id || !state.authUser || !confirm("이 내역을 삭제하시겠습니까?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
                if(state.editId === id) window.cancelEdit();
            } catch(e) {
                console.error("Delete Error:", e);
            }
        };

        window.saveData = async () => {
            if(!state.authUser) return;
            const dateVal = document.getElementById('input-date').value;
            const amountVal = document.getElementById('input-amount').value;
            if(!dateVal || !amountVal) return;
            
            setLoading(true);
            const d = dateVal.split('-');
            const cat = document.getElementById('input-cat').value;
            const isAsset = categorySet.자산.includes(cat);
            
            const id = state.editId || Date.now().toString();
            const payload = {
                id: id,
                user_name: state.user,
                type: isAsset ? '자산' : state.type,
                category: cat,
                amount: Number(amountVal),
                date: `${d[0]}. ${d[1]}. ${d[2]}.`,
                description: document.getElementById('input-desc').value || "",
                ticker: document.getElementById('input-ticker').value?.toUpperCase().trim() || null,
                qty: document.getElementById('input-qty').value ? Number(document.getElementById('input-qty').value) : null,
                updatedAt: Date.now()
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id), payload);
                if (state.editId) window.cancelEdit();
                else {
                    document.getElementById('input-amount').value = '';
                    document.getElementById('input-desc').value = '';
                    document.getElementById('input-ticker').value = '';
                    document.getElementById('input-qty').value = '';
                }
                if(payload.ticker) fetchPrice(payload.ticker);
            } catch(e) {
                console.error("Save Error:", e);
            } finally {
                setLoading(false);
            }
        };

        async function fetchRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json());
                if(res && res.rates && res.rates.KRW) {
                    exchangeRate = res.rates.KRW;
                    document.getElementById('rate-display').innerText = exchangeRate.toLocaleString(undefined, {maximumFractionDigits:1});
                    renderList();
                }
            } catch(e) { console.error("Rate Fetch Error:", e); }
        }

        async function fetchPrice(ticker) {
            if (!ticker) return;
            const symbol = /^\d{6}$/.test(ticker) ? (ticker + '.KS') : ticker;
            try {
                const proxy = 'https://api.allorigins.win/get?url=';
                const url = encodeURIComponent("https://query1.finance.yahoo.com/v8/finance/chart/" + symbol + "?interval=1m&range=1d");
                const res = await fetch(proxy + url).then(r => r.json());
                const result = JSON.parse(res.contents);
                const price = result.chart.result[0].meta.regularMarketPrice;
                if (price) {
                    livePrices[ticker.toUpperCase()] = price;
                    renderList();
                }
            } catch(e) { console.warn(`Price fetch failed for ${ticker}`); }
        }

        function calculateItemValue(r) {
            const isOverseas = r.category && r.category.indexOf("해외") !== -1;
            const ticker = r.ticker ? r.ticker.toUpperCase() : null;
            const qty = Number(r.qty) || 0;
            const unitPrice = Number(r.amount) || 0;
            let val = qty > 0 ? (unitPrice * qty) : unitPrice;
            if (ticker && qty > 0 && livePrices[ticker]) {
                val = livePrices[ticker] * qty;
            }
            return isOverseas ? (val * exchangeRate) : val;
        }

        function renderList() {
            let totalWealth = 0; 
            let monthlyAssetIncrease = 0; 
            let monthlyExpense = 0;      
            const vY = viewDate.getFullYear(), vM = viewDate.getMonth() + 1;

            dataRecords.forEach(r => {
                const val = calculateItemValue(r);
                const isAsset = r.type === '자산' || categorySet.자산.includes(r.category);
                if (isAsset) totalWealth += val;

                const dPart = r.date ? r.date.match(/\d+/g) : [];
                const isTargetMonth = dPart && dPart.length >= 2 && parseInt(dPart[0]) === vY && parseInt(dPart[1]) === vM;
                
                if (isTargetMonth) {
                    if (isAsset) monthlyAssetIncrease += val;
                    else if (r.type === '지출') monthlyExpense += val;
                }
            });

            document.getElementById('total-wealth').innerText = '₩' + Math.round(totalWealth).toLocaleString();
            const monthlyFlow = monthlyAssetIncrease - monthlyExpense;
            const flowEl = document.getElementById('flow-display');
            flowEl.innerText = (monthlyFlow >= 0 ? '+₩' : '-₩') + Math.round(Math.abs(monthlyFlow)).toLocaleString();
            flowEl.className = "text-xl font-black font-mono " + (monthlyFlow >= 0 ? 'text-emerald-400' : 'text-rose-400');

            const filtered = dataRecords.filter(r => {
                const isAssetItem = r.type === '자산' || categorySet.자산.includes(r.category);
                if (currentFilter === 'asset') return isAssetItem;
                if (currentFilter === 'date') {
                    const selDate = document.getElementById('filter-specific-date').value;
                    if(!selDate) return false;
                    const d = selDate.split('-');
                    return r.date === `${d[0]}. ${d[1]}. ${d[2]}.`;
                }
                const dPart = r.date ? r.date.match(/\d+/g) : [];
                const isCurrentMonth = dPart && dPart.length >= 2 && parseInt(dPart[0]) === vY && parseInt(dPart[1]) === vM;
                
                if (currentFilter === 'all') return !isAssetItem && isCurrentMonth;
                if (currentFilter === 'income') return r.type === '수입' && !isAssetItem && isCurrentMonth;
                if (currentFilter === 'expense') return r.type === '지출' && isCurrentMonth;
                return false;
            });

            filtered.sort((a, b) => b.date.localeCompare(a.date));

            const container = document.getElementById('main-list');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-24 text-slate-300 font-bold">내역이 없습니다</div>';
                return;
            }

            container.innerHTML = filtered.map(r => {
                const val = calculateItemValue(r);
                const isHusband = (r.user_name === '남호' || r.user_name === '남편');
                const userColor = isHusband ? 'text-blue-500' : 'text-purple-500';
                const isAsset = r.type === '자산' || categorySet.자산.includes(r.category);
                let typeColor = r.type === '지출' ? 'text-rose-500' : 'text-emerald-500';
                let sign = r.type === '지출' ? '-' : '+';
                if(isAsset) { typeColor = "text-emerald-500"; sign = ""; }

                return `
                <div class="swipe-item" id="item-${r.id}">
                    <div class="swipe-action" onclick="globalDeleteItem('${r.id}')">삭제</div>
                    <div class="swipe-content p-5 flex justify-between items-center relative" onclick="startEdit('${r.id}')">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1 text-[10px] font-black uppercase">
                                <span class="${userColor}">${r.user_name}</span>
                                <span class="text-slate-300">|</span><span class="text-slate-500">${r.category}</span>
                                ${isAsset ? '<span class="ml-1 px-1 bg-emerald-100 text-emerald-600 rounded-sm">ASSET</span>' : ''}
                            </div>
                            <p class="font-bold text-slate-800 text-[15px]">${r.description || r.category}</p>
                            <p class="text-[11px] font-mono font-bold text-slate-400">
                                ${r.date}${r.ticker ? ' • ' + r.ticker : ''}${r.qty ? ' • ' + r.qty + '주' : ''}
                            </p>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <p class="text-[17px] font-black font-mono ${typeColor}">${sign}₩${Math.round(val).toLocaleString()}</p>
                            <button class="pc-delete-btn hidden w-8 h-8 items-center justify-center rounded-full bg-slate-50 text-slate-300 hover:bg-rose-50 hover:text-rose-500 transition-all" onclick="event.stopPropagation(); globalDeleteItem('${r.id}')">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            bindSwipeEvents();
        }

        function bindSwipeEvents() {
            document.querySelectorAll('.swipe-item').forEach(item => {
                let startX = 0;
                const content = item.querySelector('.swipe-content');
                item.ontouchstart = e => { startX = e.touches[0].clientX; };
                item.ontouchmove = e => {
                    if(window.innerWidth >= 1024) return;
                    const diff = startX - e.touches[0].clientX;
                    if (diff > 10 && diff < 120) {
                        content.style.transition = 'none';
                        content.style.transform = `translateX(-${diff}px)`;
                    }
                };
                item.ontouchend = e => {
                    if(window.innerWidth >= 1024) return;
                    const diff = startX - e.changedTouches[0].clientX;
                    content.style.transition = 'transform 0.3s ease';
                    content.style.transform = (diff > 60) ? "translateX(-80px)" : "translateX(0)";
                };
            });
        }

        function updateCategoryUI() {
            const list = (state.type === '수입') ? categorySet.수입.concat(categorySet.자산) : categorySet.지출;
            const catSelect = document.getElementById('input-cat');
            const currentVal = catSelect.value;
            catSelect.innerHTML = list.map(item => `<option value="${item}">${item}</option>`).join('');
            if(list.includes(currentVal)) catSelect.value = currentVal;
            window.toggleStockFields();
        }

        function updateMonthLabel() { 
            document.getElementById('current-month').innerText = `${viewDate.getFullYear()}. ${String(viewDate.getMonth() + 1).padStart(2, '0')}`; 
        }

        function setLoading(b) { 
            const dot = document.getElementById('status-dot');
            if(dot) dot.className = b ? "w-1.5 h-1.5 bg-amber-500 rounded-full animate-pulse" : "w-1.5 h-1.5 bg-emerald-500 rounded-full";
            const txt = document.getElementById('status-text');
            if(txt) txt.innerText = b ? "SYNCING..." : "CLOUD SYNCED";
            const saveLoader = document.getElementById('save-loader');
            if(saveLoader) saveLoader.classList.toggle('hidden', !b);
        }

        async function seedDatabaseIfEmpty() {
            const recordsCol = collection(db, 'artifacts', appId, 'public', 'data', 'records');
            const snapshot = await getDocs(recordsCol);
            if (snapshot.empty) {
                console.log("Seeding initial data...");
                const batch = writeBatch(db);
                initialSeedData.forEach(record => {
                    const docRef = doc(recordsCol, record.id);
                    batch.set(docRef, record);
                });
                await batch.commit();
            }
        }

        const init = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, async (user) => {
                state.authUser = user;
                if(user) {
                    await seedDatabaseIfEmpty();
                    const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'records'));
                    onSnapshot(q, (snapshot) => {
                        dataRecords = [];
                        snapshot.forEach(doc => dataRecords.push(doc.data()));
                        const uniqueTickers = [...new Set(dataRecords.filter(r => r.ticker).map(r => r.ticker.toUpperCase()))];
                        uniqueTickers.forEach(t => fetchPrice(t));
                        renderList();
                        setLoading(false);
                    }, (error) => { console.error("Snapshot Error:", error); });
                }
            });

            document.getElementById('input-date').valueAsDate = viewDate;
            document.getElementById('filter-specific-date').valueAsDate = viewDate;
            updateMonthLabel();
            updateCategoryUI();
            fetchRate();
        };

        init();
    </script>
</body>
</html>
