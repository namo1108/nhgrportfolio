<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 가계부 - Cloud</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%231a1f2c'/><path d='M30 40h40v30H30z' fill='%233b82f6'/><path d='M70 45h5v20h-5z' fill='%2360a5fa'/><circle cx='50' cy='55' r='8' fill='white' opacity='0.8'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        :root { --primary: #1a1f2c; --accent: #3b82f6; --bg: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg); color: #0f172a; word-break: keep-all; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .main-gradient { background: linear-gradient(135deg, #1a1f2c 0%, #2d364d 100%); border-radius: 2rem; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 1.25rem; }
        .swipe-item { position: relative; overflow: hidden; border-radius: 1.25rem; transition: transform 0.3s ease; touch-action: pan-y; margin-bottom: 0.75rem; }
        .swipe-content { position: relative; z-index: 10; background: white; transition: transform 0.3s ease; border: 1px solid #e2e8f0; border-radius: 1.25rem; cursor: pointer; }
        .swipe-content:active { background: #f1f5f9; }
        .swipe-action { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: #ef4444; color: white; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 13px; z-index: 5; border-radius: 0 1.25rem 1.25rem 0; cursor: pointer; }
        .input-premium { width: 100%; padding: 0.75rem 1rem; border-radius: 0.75rem; border: 1.5px solid #e2e8f0; font-size: 15px; font-weight: 600; outline: none; transition: 0.2s; }
        .input-premium:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .btn-primary { background-color: var(--primary); color: white; border-radius: 0.75rem; font-weight: 800; transition: 0.2s; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-edit { background-color: #f59e0b; color: white; }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tab-active { background-color: var(--primary) !important; color: white !important; font-weight: 800; border-color: var(--primary) !important; }
        @media (min-width: 1024px) {
            .pc-delete-btn { display: flex !important; }
            .swipe-action { display: none !important; }
            .swipe-content { transform: none !important; }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">
    <div class="max-w-6xl mx-auto p-4 md:p-8 min-h-screen">
        <header class="main-gradient p-6 md:p-10 text-white shadow-2xl mb-8">
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1 bg-blue-500/30 text-blue-300 text-[10px] font-black rounded-full border border-blue-500/30 uppercase tracking-widest">NamHo GaRam</span>
                        <div id="sync-status" class="flex items-center gap-1.5 text-[10px] font-bold text-slate-400">
                            <span id="status-dot" class="w-1.5 h-1.5 bg-rose-500 rounded-full"></span> <span id="status-text">CONNECTING...</span>
                        </div>
                    </div>
                    <p class="text-xs font-bold text-slate-400 mb-[-10px] ml-1">실시간 통합 자산 현황</p>
                    <h1 id="total-wealth" class="text-4xl md:text-5xl font-black font-mono tracking-tighter">₩0</h1>
                </div>
                <div class="flex gap-4">
                    <div class="bg-white/5 px-6 py-3 rounded-2xl border border-white/10">
                        <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">실시간 환율 (USD)</p>
                        <p id="rate-display" class="text-xl font-black text-blue-300 font-mono">1,400.0</p>
                    </div>
                    <div class="bg-white/5 px-6 py-3 rounded-2xl border border-white/10">
                        <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">이번 달 현금흐름</p>
                        <p id="flow-display" class="text-xl font-black font-mono text-emerald-400">+₩0</p>
                        <p class="text-[8px] text-slate-500 font-bold mt-1">(자산증가 - 지출)</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-[380px_1fr] gap-8">
            <aside class="space-y-6">
                <div id="input-card" class="glass-card p-6 shadow-xl border-t-4 border-t-blue-500">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="input-title" class="text-xl font-black tracking-tight">기록하기</h2>
                        <div class="flex items-center bg-slate-100 rounded-xl p-1 font-mono text-[11px] font-black">
                            <button onclick="window.moveMonth(-1)" class="p-2">◀</button>
                            <span id="current-month" class="px-2"></span>
                            <button onclick="window.moveMonth(1)" class="p-2">▶</button>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-2">
                            <button id="btn-user-h" onclick="window.toggleUser('남호')" class="py-3 btn-primary text-xs tracking-tighter">남호</button>
                            <button id="btn-user-w" onclick="window.toggleUser('가람')" class="py-3 bg-white text-slate-300 border border-slate-100 rounded-xl font-black text-xs tracking-tighter">가람</button>
                        </div>
                        <div class="flex p-1 bg-slate-100 rounded-xl">
                            <button id="btn-type-in" onclick="window.toggleType('수입')" class="flex-1 py-2 rounded-lg font-black text-[11px] bg-white text-primary shadow-sm">수입/자산</button>
                            <button id="btn-type-out" onclick="window.toggleType('지출')" class="flex-1 py-2 rounded-lg font-black text-[11px] text-slate-400">지출</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="input-date" class="input-premium text-xs font-bold">
                            <input type="number" id="input-amount" placeholder="금액" class="input-premium text-xs font-mono font-bold">
                        </div>
                        <select id="input-cat" onchange="window.toggleStockFields()" class="input-premium text-xs font-bold"></select>
                        <div id="stock-fields" class="hidden p-4 bg-blue-50/50 border border-blue-100 rounded-xl space-y-2">
                            <input type="text" id="input-ticker" placeholder="티커 (예: AAPL, 005930)" class="input-premium text-xs font-mono uppercase">
                            <input type="number" id="input-qty" placeholder="수량" step="any" class="input-premium text-xs font-mono">
                        </div>
                        <input type="text" id="input-desc" placeholder="메모" class="input-premium text-xs">
                        
                        <div class="flex flex-col gap-2">
                            <button id="btn-save" onclick="window.saveData()" class="w-full py-4 btn-primary shadow-lg">
                                <span id="save-text">데이터 저장하기</span>
                                <div id="save-loader" class="spinner hidden"></div>
                            </button>
                            <button id="btn-cancel-edit" onclick="window.cancelEdit()" class="hidden w-full py-3 bg-slate-200 text-slate-600 rounded-xl font-black text-xs">수정 취소</button>
                        </div>
                    </div>
                </div>

                <div id="date-picker-box" class="glass-card p-6 shadow-lg border-t-4 border-t-emerald-500 hidden">
                    <h3 class="text-sm font-black mb-3 text-slate-500 uppercase tracking-wider">특정 날짜 조회</h3>
                    <input type="date" id="filter-specific-date" onchange="window.setFilter('date')" class="input-premium text-xs">
                </div>
            </aside>

            <main class="space-y-4">
                <div id="filter-nav" class="flex gap-2 overflow-x-auto py-1 sticky top-0 bg-[#f8fafc]/90 backdrop-blur-md z-30 no-scrollbar">
                    <button onclick="window.setFilter('all')" id="f-all" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm tab-active">전체보기</button>
                    <button onclick="window.setFilter('income')" id="f-income" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400">수입</button>
                    <button onclick="window.setFilter('expense')" id="f-expense" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400">지출</button>
                    <button onclick="window.setFilter('asset')" id="f-asset" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400">자산현황</button>
                    <button onclick="window.setFilter('date')" id="f-date" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black border border-slate-200 bg-white shadow-sm text-slate-400 bg-emerald-50">날짜별</button>
                </div>
                <div id="main-list" class="space-y-3 pb-20"></div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // [중요] GitHub에 올릴 때 아래 config 부분을 본인의 Firebase 설정으로 교체하세요.
        let firebaseConfig = {};
        try {
            firebaseConfig = JSON.parse(__firebase_config);
        } catch (e) {
            console.warn("Canvas 환경 설정 없음. 실제 Config를 사용하세요.");
            // firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", ... };
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-v1';

        let dataRecords = [], currentFilter = 'all', viewDate = new Date();
        let exchangeRate = 1400, livePrices = {}, user = null;
        const state = { user: '남호', type: '수입', editId: null };

        const categorySet = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '주거', '금융/대출', '의류', '생활용품', '교통', '문화/여가', '경조사', '의료', '통신', '보험', '기타'],
            '자산': ['보증금', '저축/예금', '적금', '주식 (해외)', '주식 (국내)', '연금/퇴직금', '청약']
        };

        // 초기화 및 인증
        window.addEventListener('load', async () => {
            document.getElementById('input-date').valueAsDate = new Date();
            document.getElementById('filter-specific-date').valueAsDate = new Date();
            window.updateMonthLabel();
            window.updateCategoryUI();
            fetchRate();

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error("Auth Fail:", err); }
        });

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('status-dot').className = "w-1.5 h-1.5 bg-emerald-500 rounded-full";
                document.getElementById('status-text').innerText = "CLOUD SYNCED";
                startSync();
            }
        });

        // 데이터 실시간 동기화
        function startSync() {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'account_book');
            onSnapshot(q, (snap) => {
                dataRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                
                // 새로운 티커 발견 시 가격 정보 업데이트
                const tickers = dataRecords.filter(r => r.ticker).map(r => r.ticker.toUpperCase());
                [...new Set(tickers)].forEach(t => { if(!livePrices[t]) fetchPrice(t); });
                
                renderList();
            }, (err) => console.error("Sync Error:", err));
        }

        async function fetchRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json());
                if(res?.rates?.KRW) {
                    exchangeRate = res.rates.KRW;
                    document.getElementById('rate-display').innerText = exchangeRate.toLocaleString(undefined, {maximumFractionDigits:1});
                }
            } catch(e) {}
        }

        async function fetchPrice(ticker) {
            const symbol = /^\d{6}$/.test(ticker) ? (ticker + '.KS') : ticker;
            try {
                const proxy = 'https://api.allorigins.win/get?url=';
                const url = encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`);
                const res = await fetch(proxy + url).then(r => r.json());
                const result = JSON.parse(res.contents);
                const price = result.chart.result[0].meta.regularMarketPrice;
                if (price) {
                    livePrices[ticker.toUpperCase()] = price;
                    renderList();
                }
            } catch(e) {}
        }

        function calculateItemValue(r) {
            const isOverseas = r.category?.includes("해외");
            const ticker = r.ticker?.toUpperCase();
            const qty = Number(r.qty) || 0;
            const unitPrice = Number(r.amount) || 0;
            let val = qty > 0 ? (unitPrice * qty) : unitPrice;
            if (ticker && qty > 0 && livePrices[ticker]) val = livePrices[ticker] * qty;
            return isOverseas ? (val * exchangeRate) : val;
        }

        function renderList() {
            let totalWealth = 0, monthlyAssetIncrease = 0, monthlyExpense = 0;
            const vY = viewDate.getFullYear(), vM = viewDate.getMonth() + 1;

            dataRecords.forEach(r => {
                const val = calculateItemValue(r);
                const isAsset = r.type === '자산' || categorySet.자산.includes(r.category);
                if (isAsset) totalWealth += val;

                const dPart = r.date?.match(/\d+/g);
                const isTargetMonth = dPart && parseInt(dPart[0]) === vY && parseInt(dPart[1]) === vM;
                if (isTargetMonth) {
                    if (isAsset) monthlyAssetIncrease += val;
                    else if (r.type === '지출') monthlyExpense += val;
                }
            });

            document.getElementById('total-wealth').innerText = '₩' + Math.round(totalWealth).toLocaleString();
            const monthlyFlow = monthlyAssetIncrease - monthlyExpense;
            const flowEl = document.getElementById('flow-display');
            flowEl.innerText = (monthlyFlow >= 0 ? '+₩' : '-₩') + Math.round(Math.abs(monthlyFlow)).toLocaleString();
            flowEl.className = "text-xl font-black font-mono " + (monthlyFlow >= 0 ? 'text-emerald-400' : 'text-rose-400');

            const filtered = dataRecords.filter(r => {
                const isAssetItem = r.type === '자산' || categorySet.자산.includes(r.category);
                if (currentFilter === 'asset') return isAssetItem;
                if (currentFilter === 'date') {
                    const selDate = document.getElementById('filter-specific-date').value;
                    if(!selDate) return false;
                    const d = selDate.split('-');
                    return r.date === `${d[0]}. ${d[1]}. ${d[2]}.`;
                }
                const dPart = r.date?.match(/\d+/g);
                const isCurrentMonth = dPart && parseInt(dPart[0]) === vY && parseInt(dPart[1]) === vM;
                if (currentFilter === 'all') return !isAssetItem && isCurrentMonth;
                if (currentFilter === 'income') return r.type === '수입' && !isAssetItem && isCurrentMonth;
                if (currentFilter === 'expense') return r.type === '지출' && isCurrentMonth;
                return false;
            }).sort((a, b) => b.date.localeCompare(a.date));

            const container = document.getElementById('main-list');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="text-center py-24 text-slate-300 font-bold">내역이 존재하지 않습니다</div>';
                return;
            }

            container.innerHTML = filtered.map(r => {
                const val = calculateItemValue(r);
                const userColor = (r.user_name === '남호' || r.user_name === '남편') ? 'text-blue-500' : 'text-purple-500';
                const isAsset = r.type === '자산' || categorySet.자산.includes(r.category);
                let typeColor = r.type === '지출' ? 'text-rose-500' : 'text-emerald-500';
                let sign = r.type === '지출' ? '-' : '+';
                if(isAsset) { typeColor = "text-emerald-500"; sign = ""; }

                return `
                <div class="swipe-item" id="item-${r.id}">
                    <div class="swipe-action" onclick="window.globalDeleteItem('${r.id}')">삭제</div>
                    <div class="swipe-content p-5 flex justify-between items-center relative" onclick="window.startEdit('${r.id}')">
                        <div class="flex-1 pointer-events-none">
                            <div class="flex items-center gap-2 mb-1 text-[10px] font-black uppercase">
                                <span class="${userColor}">${r.user_name}</span>
                                <span class="text-slate-300">|</span><span class="text-slate-500">${r.category}</span>
                                ${isAsset ? '<span class="ml-1 px-1 bg-emerald-100 text-emerald-600 rounded-sm">ASSET</span>' : ''}
                            </div>
                            <p class="font-bold text-slate-800 text-[15px]">${r.description || r.category}</p>
                            <p class="text-[11px] font-mono font-bold text-slate-400">${r.date}${r.ticker ? ' • '+r.ticker : ''}${r.qty ? ' • '+r.qty+'주' : ''}</p>
                        </div>
                        <div class="text-right flex items-center gap-4">
                            <p class="text-[17px] font-black font-mono ${typeColor} pointer-events-none">${sign}₩${Math.round(val).toLocaleString()}</p>
                            <button class="pc-delete-btn hidden w-8 h-8 items-center justify-center rounded-full bg-slate-50 text-slate-300 hover:bg-rose-50 hover:text-rose-500 transition-all" onclick="event.stopPropagation(); window.globalDeleteItem('${r.id}')">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            // 스와이프 이벤트 재바인딩
            document.querySelectorAll('.swipe-item').forEach(item => {
                const id = item.id.replace('item-', '');
                let startX = 0;
                item.ontouchstart = e => startX = e.touches[0].clientX;
                item.ontouchmove = e => {
                    if(window.innerWidth >= 1024) return;
                    const diff = startX - e.touches[0].clientX;
                    const content = item.querySelector('.swipe-content');
                    if (content && diff > 10 && diff < 120) content.style.transform = `translateX(-${diff}px)`;
                };
                item.ontouchend = e => {
                    if(window.innerWidth >= 1024) return;
                    const diff = startX - e.changedTouches[0].clientX;
                    const content = item.querySelector('.swipe-content');
                    if(!content) return;
                    content.style.transition = 'transform 0.3s ease';
                    content.style.transform = (diff > 60) ? "translateX(-80px)" : "translateX(0)";
                };
            });
        }

        // 글로벌 함수 바인딩
        window.saveData = async () => {
            if(!user) return alert("연결 중입니다...");
            const dateVal = document.getElementById('input-date').value;
            const amountVal = document.getElementById('input-amount').value;
            if(!dateVal || !amountVal) return alert("필수 항목을 입력하세요.");

            const loader = document.getElementById('save-loader');
            const saveBtn = document.getElementById('btn-save');
            loader.classList.remove('hidden');
            saveBtn.disabled = true;

            const d = dateVal.split('-');
            const cat = document.getElementById('input-cat').value;
            const isAsset = categorySet.자산.includes(cat);
            const id = state.editId || Date.now().toString();

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'account_book', id), {
                    user_name: state.user,
                    type: isAsset ? '자산' : state.type,
                    category: cat,
                    amount: Number(amountVal),
                    date: `${d[0]}. ${d[1]}. ${d[2]}.`,
                    description: document.getElementById('input-desc').value || "",
                    ticker: document.getElementById('input-ticker').value?.toUpperCase().trim() || null,
                    qty: document.getElementById('input-qty').value ? Number(document.getElementById('input-qty').value) : null,
                    updatedAt: Date.now()
                });
                window.cancelEdit();
                document.getElementById('input-amount').value = '';
                document.getElementById('input-desc').value = '';
                document.getElementById('input-ticker').value = '';
                document.getElementById('input-qty').value = '';
            } catch(e) { alert("저장 에러: " + e.message); }

            loader.classList.add('hidden');
            saveBtn.disabled = false;
        };

        window.globalDeleteItem = async (id) => {
            if(!user || !confirm("이 내역을 삭제하시겠습니까?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'account_book', id));
                if(state.editId === id) window.cancelEdit();
            } catch(e) { alert("삭제 실패"); }
        };

        window.startEdit = (id) => {
            const r = dataRecords.find(item => String(item.id) === String(id));
            if(!r) return;
            state.editId = id;
            window.toggleUser(r.user_name);
            window.toggleType(r.type === '자산' ? '수입' : r.type);
            const dPart = r.date.match(/\d+/g);
            if(dPart) document.getElementById('input-date').value = `${dPart[0]}-${dPart[1].padStart(2,'0')}-${dPart[2].padStart(2,'0')}`;
            document.getElementById('input-amount').value = r.amount;
            document.getElementById('input-cat').value = r.category;
            document.getElementById('input-desc').value = r.description;
            document.getElementById('input-ticker').value = r.ticker || "";
            document.getElementById('input-qty').value = r.qty || "";
            window.toggleStockFields();
            
            document.getElementById('btn-save').classList.add('btn-edit');
            document.getElementById('save-text').innerText = "데이터 수정하기";
            document.getElementById('input-title').innerText = "내역 수정 중";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = () => {
            state.editId = null;
            document.getElementById('btn-save').classList.remove('btn-edit');
            document.getElementById('save-text').innerText = "데이터 저장하기";
            document.getElementById('input-title').innerText = "기록하기";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        };

        window.toggleUser = (u) => {
            state.user = u;
            const h = document.getElementById('btn-user-h'), w = document.getElementById('btn-user-w');
            h.className = u === '남호' ? 'py-3 btn-primary text-xs tracking-tighter' : 'py-3 bg-white text-slate-300 border border-slate-100 rounded-xl font-black text-xs tracking-tighter';
            w.className = u === '가람' ? 'py-3 btn-primary text-xs tracking-tighter' : 'py-3 bg-white text-slate-300 border border-slate-100 rounded-xl font-black text-xs tracking-tighter';
        };

        window.toggleType = (t) => {
            state.type = t;
            document.getElementById('btn-type-in').className = `flex-1 py-2 rounded-lg font-black text-[11px] ${t === '수입' ? 'bg-white text-primary shadow-sm' : 'text-slate-400'}`;
            document.getElementById('btn-type-out').className = `flex-1 py-2 rounded-lg font-black text-[11px] ${t === '지출' ? 'bg-white text-primary shadow-sm' : 'text-slate-400'}`;
            window.updateCategoryUI();
        };

        window.updateCategoryUI = () => {
            const list = state.type === '수입' ? categorySet.수입.concat(categorySet.자산) : categorySet.지출;
            const sel = document.getElementById('input-cat');
            const prev = sel.value;
            sel.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            if(list.includes(prev)) sel.value = prev;
            window.toggleStockFields();
        };

        window.toggleStockFields = () => {
            const isStock = document.getElementById('input-cat').value.includes("주식");
            document.getElementById('stock-fields').classList.toggle('hidden', !isStock);
        };

        window.setFilter = (f) => {
            currentFilter = f;
            ['all', 'income', 'expense', 'asset', 'date'].forEach(k => {
                const el = document.getElementById('f-' + k);
                if(f === k) el.classList.add('tab-active'); else el.classList.remove('tab-active');
            });
            document.getElementById('date-picker-box').classList.toggle('hidden', f !== 'date');
            renderList();
        };

        window.moveMonth = (v) => { viewDate.setMonth(viewDate.getMonth() + v); window.updateMonthLabel(); renderList(); };
        window.updateMonthLabel = () => document.getElementById('current-month').innerText = `${viewDate.getFullYear()}. ${String(viewDate.getMonth()+1).padStart(2,'0')}`;

    </script>
</body>
</html>
