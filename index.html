<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --accent: #6366f1; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #f8fafc; letter-spacing: -0.02em; overflow-x: hidden; }
        .glass-card { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-active { background: #6366f1 !important; color: white !important; box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39); }
        .form-input { 
            width: 100%; 
            padding: 0.875rem 1rem; 
            border-radius: 0.75rem; 
            font-size: 0.9rem; 
            font-weight: 600; 
            background: #f8fafc !important; 
            color: #1e293b !important; 
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .list-item { transition: transform 0.2s, background-color 0.2s; }
        .list-item:hover { transform: translateX(4px); background: rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="pb-10">

    <!-- Header & Stats -->
    <header class="pt-10 pb-6 px-6 max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> TOTAL NET WORTH
                </p>
                <h1 class="text-5xl md:text-6xl font-black tracking-tight mb-4" id="total-wealth">₩0</h1>
                <div class="flex items-center gap-2 text-slate-400 text-xs">
                    <div class="flex -space-x-1">
                        <div class="w-6 h-6 rounded-full bg-indigo-500 border border-slate-900 flex items-center justify-center text-[8px] font-bold">남</div>
                        <div class="w-6 h-6 rounded-full bg-rose-500 border border-slate-900 flex items-center justify-center text-[8px] font-bold">가</div>
                    </div>
                    <span>가족 멤버 (남호&가람)</span>
                </div>
            </div>
            
            <div class="flex gap-4">
                <div class="glass-card px-5 py-3.5 rounded-2xl">
                    <p class="text-[9px] font-bold text-slate-500 mb-1">이번달 지출</p>
                    <p class="text-lg font-black text-rose-400" id="monthly-expense">₩0</p>
                </div>
                <div class="glass-card px-5 py-3.5 rounded-2xl">
                    <p class="text-[9px] font-bold text-slate-500 mb-1">환율 (USD)</p>
                    <p class="text-lg font-black text-emerald-400">₩1,481.5</p>
                </div>
            </div>
        </div>

        <!-- Charts Area -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
            <div class="glass-card rounded-[2rem] p-6 h-[260px] relative">
                <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4">Asset Allocation</h3>
                <div class="h-[180px] w-full flex items-center justify-center">
                    <canvas id="assetChart"></canvas>
                </div>
            </div>
            <div class="glass-card rounded-[2rem] p-6 h-[260px]">
                <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4">Expense Trend</h3>
                <div class="h-[180px]">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Input Form Section (레이아웃 수정) -->
        <aside class="lg:col-span-4">
            <div class="bg-white text-slate-900 rounded-[2.5rem] p-7 sticky top-6 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black tracking-tight" id="form-title">기록하기</h2>
                    <button onclick="resetForm()" class="text-[10px] font-bold text-slate-400 hover:text-indigo-600">초기화 ↺</button>
                </div>
                
                <div class="space-y-4">
                    <input type="hidden" id="edit-id">
                    
                    <!-- 멤버 선택 -->
                    <div class="flex p-1 bg-slate-100 rounded-xl">
                        <button onclick="setWriter('남호')" id="w-namho" class="flex-1 py-2.5 text-xs font-black rounded-lg transition-all btn-active">남호</button>
                        <button onclick="setWriter('가람')" id="w-garam" class="flex-1 py-2.5 text-xs font-black rounded-lg transition-all text-slate-400">가람</button>
                    </div>
                    
                    <!-- 유형 선택 -->
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setType('asset')" id="t-asset" class="py-2.5 text-xs font-black rounded-lg border border-indigo-200 bg-indigo-50 text-indigo-600">자산/수입</button>
                        <button onclick="setType('expense')" id="t-expense" class="py-2.5 text-xs font-black rounded-lg border border-transparent bg-slate-50 text-slate-400">지출/소비</button>
                    </div>

                    <div class="space-y-3">
                        <div>
                            <label class="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase">Date</label>
                            <input type="date" id="i-date" class="form-input">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase">Amount (₩)</label>
                            <input type="number" id="i-amount" placeholder="금액을 입력하세요" class="form-input">
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase">Category</label>
                            <select id="i-category" class="form-input"></select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-slate-400 ml-1 mb-1 block uppercase">Name / Item</label>
                            <input type="text" id="i-name" placeholder="항목 내용을 입력하세요" class="form-input">
                        </div>
                    </div>
                    
                    <button id="save-btn" onclick="save()" class="w-full py-4 bg-slate-900 text-white font-black rounded-xl hover:bg-indigo-600 active:scale-95 transition-all shadow-lg mt-2">
                        저장하기
                    </button>
                </div>
            </div>
        </aside>

        <!-- History List Section -->
        <section class="lg:col-span-8">
            <div class="flex p-1 bg-white/5 rounded-2xl w-fit mb-6 overflow-x-auto no-scrollbar">
                <button onclick="setFilter('all')" id="f-all" class="px-5 py-2 text-xs font-black rounded-xl transition-all btn-active whitespace-nowrap">전체</button>
                <button onclick="setFilter('asset')" id="f-asset" class="px-5 py-2 text-xs font-black rounded-xl transition-all text-slate-500 whitespace-nowrap">자산</button>
                <button onclick="setFilter('income')" id="f-income" class="px-5 py-2 text-xs font-black rounded-xl transition-all text-slate-500 whitespace-nowrap">수입</button>
                <button onclick="setFilter('expense')" id="f-expense" class="px-5 py-2 text-xs font-black rounded-xl transition-all text-slate-500 whitespace-nowrap">지출</button>
            </div>
            
            <div id="main-list" class="space-y-3">
                <!-- 리스트 항목들이 여기에 생성됨 -->
            </div>
            
            <div id="empty-state" class="hidden py-32 text-center">
                <p class="text-slate-600 font-bold">기록된 데이터가 없습니다.</p>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-white text-slate-900 text-xs font-black rounded-full shadow-2xl opacity-0 transition-all z-[200]"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // GitHub 등 외부 실행을 위한 Fallback 설정
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: ""
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-default';

        let user = null;
        let records = [];
        let curWriter = '남호';
        let curType = 'asset';
        let curFilter = 'all';
        let assetChart, expenseChart;

        // 초기 데이터 (백업용)
        const BACKUP_DATA = [
            { id: 'b1', user: '남호', type: 'asset', category: '주식(국내)', name: 'KODEX200', amount: 2646000, date: '2026-04-24' },
            { id: 'b2', user: '남호', type: 'asset', category: '주식(국내)', name: '삼성전자', amount: 6161591, date: '2026-04-24' },
            { id: 'b3', user: '남호', type: 'asset', category: '연금/퇴직금', name: '퇴직연금', amount: 23548120, date: '2026-04-24' },
            { id: 'b4', user: '가람', type: 'asset', category: '보증금', name: '아파트 전세보증금', amount: 45000000, date: '2026-04-24' },
            { id: 'b5', user: '남호', type: 'income', category: '월급', name: '4월 정기급여', amount: 3800000, date: '2026-04-25' },
            { id: 'b6', user: '가람', type: 'expense', category: '주거/통신', name: '관리비', amount: 251200, date: '2026-04-24' }
        ];

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth Error", e);
                // 오프라인/로컬 모드 실행을 위해 가상 데이터 로드
                records = [...BACKUP_DATA];
                render();
            }
        };

        const startSync = (u) => {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'records');
            onSnapshot(q, (snap) => {
                const cloudData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // 클라우드 데이터와 백업 데이터 병합 (중복 제거)
                const merged = [...BACKUP_DATA];
                cloudData.forEach(cd => {
                    const idx = merged.findIndex(m => m.id === cd.id);
                    if (idx > -1) merged[idx] = cd;
                    else merged.push(cd);
                });
                records = merged;
                render();
            }, (err) => {
                console.warn("Firestore sync failed, using local only.");
                records = [...BACKUP_DATA];
                render();
            });
        };

        onAuthStateChanged(auth, (u) => {
            if (u) { user = u; startSync(u); }
            else initAuth();
        });

        window.setWriter = (w) => {
            curWriter = w;
            document.getElementById('w-namho').className = `flex-1 py-2.5 text-xs font-black rounded-lg transition-all ${w==='남호'?'btn-active':'text-slate-400'}`;
            document.getElementById('w-garam').className = `flex-1 py-2.5 text-xs font-black rounded-lg transition-all ${w==='가람'?'btn-active':'text-slate-400'}`;
        };

        window.setType = (t) => {
            curType = t;
            document.getElementById('t-asset').className = `py-2.5 text-xs font-black rounded-lg border ${t==='asset'?'border-indigo-200 bg-indigo-50 text-indigo-600':'border-transparent bg-slate-50 text-slate-400'}`;
            document.getElementById('t-expense').className = `py-2.5 text-xs font-black rounded-lg border ${t==='expense'?'border-rose-200 bg-rose-50 text-rose-600':'border-transparent bg-slate-50 text-slate-400'}`;
            
            const cats = {
                asset: ["주식(국내)", "주식(해외)", "현금", "연금/퇴직금", "청약", "보증금", "저축/예금", "월급", "기타수입"],
                expense: ["식비", "주거/통신", "쇼핑", "교통", "의료", "문화/생활", "기타"]
            };
            document.getElementById('i-category').innerHTML = cats[t].map(c => `<option value="${c}">${c}</option>`).join('');
        };

        window.setFilter = (f) => {
            curFilter = f;
            ['all', 'asset', 'income', 'expense'].forEach(id => {
                document.getElementById('f-'+id).className = `px-5 py-2 text-xs font-black rounded-xl transition-all ${id===f?'btn-active':'text-slate-500'}`;
            });
            render();
        };

        window.save = async () => {
            if (!user) { showToast("로그인 중입니다..."); return; }
            const cat = document.getElementById('i-category').value;
            const amount = parseInt(document.getElementById('i-amount').value) || 0;
            const name = document.getElementById('i-name').value;
            const date = document.getElementById('i-date').value;
            const editId = document.getElementById('edit-id').value;

            if (!name || amount === 0 || !date) { showToast("모든 항목을 입력해 주세요."); return; }

            const type = (cat === '월급' || cat === '기타수입') ? 'income' : curType;
            const data = {
                user: curWriter,
                type: type,
                category: cat,
                date: date,
                name: name,
                amount: amount,
                timestamp: Date.now()
            };

            try {
                if (editId) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', editId), data, { merge: true });
                    showToast("수정 완료!");
                } else {
                    const newDoc = doc(collection(db, 'artifacts', appId, 'public', 'data', 'records'));
                    await setDoc(newDoc, data);
                    showToast("기록 완료!");
                }
                resetForm();
            } catch (e) {
                console.error(e);
                showToast("저장 실패 (Firestore 연결 확인)");
            }
        };

        window.editItem = (id) => {
            const item = records.find(r => r.id === id);
            if (!item) return;
            document.getElementById('form-title').innerText = "내역 수정";
            document.getElementById('edit-id').value = item.id;
            document.getElementById('i-date').value = item.date;
            document.getElementById('i-amount').value = item.amount;
            document.getElementById('i-name').value = item.name;
            setWriter(item.user);
            setType(item.type === 'expense' ? 'expense' : 'asset');
            document.getElementById('i-category').value = item.category;
            document.getElementById('save-btn').innerText = "수정하기";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteItem = async (id) => {
            if (!confirm("항목을 삭제할까요?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
                showToast("삭제되었습니다.");
            } catch (e) {
                records = records.filter(r => r.id !== id);
                render();
                showToast("항목이 제거되었습니다.");
            }
        };

        window.resetForm = () => {
            document.getElementById('form-title').innerText = "기록하기";
            document.getElementById('edit-id').value = "";
            document.getElementById('i-amount').value = "";
            document.getElementById('i-name').value = "";
            document.getElementById('save-btn').innerText = "저장하기";
            document.getElementById('i-date').valueAsDate = new Date();
        };

        function render() {
            const filtered = records
                .filter(r => curFilter === 'all' || r.type === curFilter)
                .sort((a,b) => new Date(b.date) - new Date(a.date));

            let total = 0, mExp = 0, assetMap = {}, expTrend = {};
            const now = new Date();
            const thisMonth = now.getMonth() + 1;

            const listEl = document.getElementById('main-list');
            if (filtered.length === 0) {
                listEl.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
            } else {
                document.getElementById('empty-state').classList.add('hidden');
                listEl.innerHTML = filtered.map(r => {
                    const val = r.amount || 0;
                    if (r.type === 'asset' || r.type === 'income') {
                        if (r.type === 'asset') {
                            total += val;
                            assetMap[r.category] = (assetMap[r.category]||0) + val;
                        }
                    } else if (r.type === 'expense') {
                        const rDate = new Date(r.date);
                        if (rDate.getMonth() + 1 === thisMonth) mExp += val;
                        const m = rDate.getMonth() + 1;
                        expTrend[m] = (expTrend[m]||0) + val;
                    }

                    const typeColor = r.type === 'expense' ? 'text-rose-400' : (r.type === 'income' ? 'text-indigo-400' : 'text-emerald-400');
                    const badgeClass = r.user === '남호' ? 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';

                    return `
                    <div class="glass-card p-4 rounded-2xl flex justify-between items-center group list-item border-l-2 ${r.type==='expense'?'border-l-rose-500':'border-l-indigo-500'}">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-lg border flex items-center justify-center font-black text-[10px] ${badgeClass}">
                                ${r.user}
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-0.5">
                                    <span class="text-[8px] font-bold text-slate-500 uppercase">${r.category}</span>
                                    <h4 class="font-bold text-sm text-slate-100">${r.name}</h4>
                                </div>
                                <p class="text-[9px] text-slate-500 font-medium">${r.date}</p>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end gap-1">
                            <p class="font-black text-sm ${typeColor}">
                                ${r.type === 'expense' ? '-' : ''}₩${val.toLocaleString()}
                            </p>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
                                <button onclick="editItem('${r.id}')" class="text-[9px] font-bold text-slate-500 hover:text-white bg-white/5 px-2 py-1 rounded">수정</button>
                                <button onclick="deleteItem('${r.id}')" class="text-[9px] font-bold text-slate-500 hover:text-rose-500 bg-white/5 px-2 py-1 rounded">삭제</button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            document.getElementById('total-wealth').innerText = '₩' + total.toLocaleString();
            document.getElementById('monthly-expense').innerText = '₩' + mExp.toLocaleString();
            updateCharts(assetMap, expTrend);
        }

        function updateCharts(assetMap, expTrend) {
            const assetCtx = document.getElementById('assetChart');
            if (assetChart) assetChart.destroy();
            assetChart = new Chart(assetCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(assetMap),
                    datasets: [{
                        data: Object.values(assetMap),
                        backgroundColor: ['#6366f1', '#a855f7', '#ec4899', '#10b981', '#f59e0b', '#3b82f6'],
                        borderWidth: 0, hoverOffset: 12
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, cutout: '75%', 
                    plugins: { legend: { display: false } } 
                }
            });

            const months = [1, 2, 3, 4];
            const expCtx = document.getElementById('expenseChart');
            if (expenseChart) expenseChart.destroy();
            expenseChart = new Chart(expCtx, {
                type: 'line',
                data: {
                    labels: months.map(m => m + '월'),
                    datasets: [{
                        data: months.map(m => expTrend[m] || 0),
                        borderColor: '#f43f5e',
                        backgroundColor: 'rgba(244, 63, 94, 0.1)',
                        fill: true, tension: 0.4, borderWidth: 3, pointRadius: 0
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { 
                        x: { grid: { display: false }, ticks: { color: '#475569', font: { size: 9, weight: 'bold' } } }, 
                        y: { display: false } 
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 3000);
        }

        document.getElementById('i-date').valueAsDate = new Date();
        setType('asset');
    </script>
</body>
</html>
