<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; }
        .input-card { background: white; border-radius: 24px; color: #1e293b; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        .btn-writer, .btn-type { background: #f1f5f9; color: #94a3b8; border-radius: 12px; font-weight: 700; transition: all 0.2s; font-size: 13px; border: none; cursor: pointer; }
        .btn-writer.active, .btn-type.active { background: #6366f1 !important; color: white !important; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        
        .filter-btn { background: rgba(30, 41, 59, 0.6); color: #64748b; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; border: 1px solid transparent; transition: all 0.2s; }
        .filter-btn.active { background: #6366f1; color: white; border-color: transparent; }
        
        .list-item { background: rgba(30, 41, 59, 0.3); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 20px; padding: 18px 24px; margin-bottom: 12px; transition: all 0.2s; border-left: 4px solid transparent; position: relative; cursor: pointer; }
        .list-item.type-asset { border-left-color: #6366f1; }
        .list-item.type-expense { border-left-color: #f43f5e; }
        .list-item:hover { background: rgba(30, 41, 59, 0.5); transform: translateY(-2px); }
        
        input, select { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; width: 100%; color: #1e293b; font-size: 14px; outline: none; }
        input:focus { border-color: #6366f1; ring: 2px ring-indigo-500; }
        label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; display: block; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .status-online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-8">
            <div>
                <div class="flex items-center gap-2 mb-2">
                    <span class="text-[10px] font-black tracking-widest text-indigo-400 uppercase">Total Net Worth</span>
                    <span id="update-indicator" class="flex items-center text-[9px] font-bold text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded-full">
                        <span class="status-dot status-online"></span> <span id="sync-text">CONNECTING...</span>
                    </span>
                </div>
                <div class="flex items-center gap-4">
                    <h1 class="text-6xl font-black tracking-tighter" id="total-wealth">₩0</h1>
                    <button onclick="window.refreshStockPrices()" title="전체 주가 새로고침" class="p-3 glass-card hover:bg-slate-700 transition-colors">
                        <svg id="refresh-icon" class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-4 w-full md:w-auto">
                <div class="glass-card px-6 py-4 flex-1 min-w-[140px] border-b-4 border-indigo-500">
                    <p class="text-[10px] text-slate-500 font-bold mb-1 uppercase">자산 총액</p>
                    <p class="text-xl font-black text-indigo-400" id="stat-asset">₩0</p>
                </div>
                <div class="glass-card px-6 py-4 flex-1 min-w-[140px] border-b-4 border-emerald-500">
                    <p class="text-[10px] text-slate-500 font-bold mb-1 uppercase">이번달 수입</p>
                    <p class="text-xl font-black text-emerald-400" id="stat-income">₩0</p>
                </div>
                <div class="glass-card px-6 py-4 flex-1 min-w-[140px] border-b-4 border-rose-500">
                    <p class="text-[10px] text-slate-500 font-bold mb-1 uppercase">이번달 지출</p>
                    <p class="text-xl font-black text-rose-400" id="stat-expense">₩0</p>
                </div>
            </div>
        </header>

        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="glass-card p-6 h-[300px]"><canvas id="assetChart"></canvas></div>
            <div class="glass-card p-6 h-[300px]"><canvas id="expenseChart"></canvas></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <aside class="lg:col-span-4">
                <div class="input-card">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-black tracking-tight" id="form-title">내역 추가</h2>
                        <button onclick="window.resetForm()" class="text-[11px] text-slate-400 font-bold uppercase">초기화 ↺</button>
                    </div>
                    
                    <div class="space-y-5">
                        <input type="hidden" id="edit-id">
                        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-2xl">
                            <button onclick="window.setWriter('남호')" id="w-namho" class="btn-writer py-3 active">남호</button>
                            <button onclick="window.setWriter('가람')" id="w-garam" class="btn-writer py-3">가람</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-2xl">
                            <button onclick="window.setType('asset')" id="t-asset" class="btn-type py-3 active">자산/수입</button>
                            <button onclick="window.setType('expense')" id="t-expense" class="btn-type py-3">지출/소비</button>
                        </div>

                        <div>
                            <label>카테고리</label>
                            <select id="i-category" onchange="window.handleCategoryChange()"></select>
                        </div>
                        
                        <div id="stock-group" class="space-y-4 p-4 bg-indigo-50 rounded-2xl border border-indigo-100 hidden">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label>티커 (AAPL / 005930)</label>
                                    <input type="text" id="i-ticker" placeholder="입력 후 엔터" onkeydown="if(event.key==='Enter') window.fetchSingleStockPrice()" onblur="window.fetchSingleStockPrice()">
                                </div>
                                <div>
                                    <label>보유 수량</label>
                                    <input type="number" id="i-quantity" placeholder="0" oninput="window.calcStockTotal()">
                                </div>
                            </div>
                            <div>
                                <label class="flex justify-between items-center">
                                    현재가 (자동 로드)
                                    <span id="price-status" class="text-[8px] font-bold text-indigo-400"></span>
                                </label>
                                <input type="number" id="i-price" step="0.01" placeholder="0" oninput="window.calcStockTotal()">
                            </div>
                            <div>
                                <label>평가 금액 (원화 환산)</label>
                                <input type="text" id="i-display-amount" readonly class="bg-indigo-100 font-black text-indigo-700 border-none" placeholder="₩0">
                            </div>
                            <input type="hidden" id="i-amount-val">
                        </div>

                        <div id="normal-group">
                            <label>금액 (₩)</label>
                            <input type="number" id="i-amount" placeholder="0">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div><label>날짜</label><input type="date" id="i-date"></div>
                            <div><label>항목명/메모</label><input type="text" id="i-name" placeholder="내용"></div>
                        </div>
                        
                        <button onclick="window.save()" class="w-full py-5 bg-slate-900 text-white font-black rounded-2xl hover:bg-indigo-600 transition-all text-lg mt-2 shadow-lg">기록 저장</button>
                    </div>
                </div>
            </aside>

            <section class="lg:col-span-8">
                <div class="flex gap-3 mb-8 overflow-x-auto no-scrollbar">
                    <button onclick="window.setFilter('all')" id="f-all" class="filter-btn active">전체보기</button>
                    <button onclick="window.setFilter('asset-only')" id="f-asset-only" class="filter-btn">자산현황</button>
                    <button onclick="window.setFilter('income-only')" id="f-income-only" class="filter-btn">수입내역</button>
                    <button onclick="window.setFilter('expense')" id="f-expense" class="filter-btn">지출내역</button>
                </div>
                <div id="main-list" class="space-y-3 pb-24"></div>
            </section>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "firebase/auth";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch, query, getDocs } from "firebase/firestore";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const USD_RATE = 1481.5; 
        let records = [];
        let curWriter = '남호';
        let curType = 'asset';
        let curFilter = 'all';
        let assetChart, expenseChart;
        let currentUser = null;

        const categories = {
            asset: ['급여(수입)', '기타 수입', '주식(국내)', '주식(해외)', '현금/예적금', '보증금', '연금/퇴직금', '주택청약'],
            expense: ['생활비', '식비/카페', '문화/여가', '보험', '교통/통신', '쇼핑/기타']
        };

        // --- 자동 동기화 데이터 정의 ---
        const initialData = [
            { user: '남호', type: 'asset', category: '주식(국내)', ticker: '005930', date: '2026-04-25', name: '삼성전자', amount: 6804500, quantity: 31, price: 219500 },
            { user: '남호', type: 'asset', category: '주식(국내)', ticker: '069500', date: '2026-04-25', name: 'KODEX200', amount: 2646000, quantity: 27, price: 98000 },
            { user: '남호', type: 'asset', category: '주식(국내)', ticker: '316141', date: '2026-04-25', name: '우리금융지주', amount: 35050, quantity: 1, price: 35050 },
            { user: '남호', type: 'asset', category: '주식(국내)', ticker: '239340', date: '2026-04-25', name: '이스트에이드', amount: 341130, quantity: 166, price: 2055 },
            { user: '가람', type: 'asset', category: '주식(국내)', ticker: '005930', date: '2026-04-25', name: '삼성전자', amount: 10316500, quantity: 47, price: 219500 },
            { user: '가람', type: 'asset', category: '주식(해외)', ticker: 'QQQ', date: '2026-04-25', name: 'QQQ', amount: 678641, quantity: 0.69, price: 663.88 },
            { user: '가람', type: 'asset', category: '주식(해외)', ticker: 'SCHD', date: '2026-04-25', name: 'SCHD', amount: 36054, quantity: 0.78, price: 31.2 },
            { user: '남호', type: 'asset', category: '연금/퇴직금', ticker: '', date: '2026-04-25', name: '퇴직연금', amount: 18898783, quantity: 0, price: 0 },
            { user: '남호', type: 'asset', category: '주택청약', ticker: '', date: '2026-04-25', name: '주택청약', amount: 5760000, quantity: 0, price: 0 },
            { user: '남호', type: 'asset', category: '보증금', ticker: '', date: '2026-04-25', name: '아파트보증금', amount: 15800000, quantity: 0, price: 0 },
            { user: '남호', type: 'asset', category: '현금/예적금', ticker: '', date: '2026-04-25', name: '청년도약적금', amount: 7000000, quantity: 0, price: 0 },
            { user: '남호', type: 'asset', category: '현금/예적금', ticker: '', date: '2026-04-25', name: '연지곤지', amount: 3510000, quantity: 0, price: 0 },
            { user: '가람', type: 'asset', category: '연금/퇴직금', ticker: '', date: '2026-04-25', name: '퇴직금', amount: 5000000, quantity: 0, price: 0 },
            { user: '가람', type: 'asset', category: '주택청약', ticker: '', date: '2026-04-25', name: '주택청약', amount: 6200000, quantity: 0, price: 0 },
            { user: '가람', type: 'expense', category: '식비/카페', ticker: '', date: '2026-04-25', name: '어머니케이크', amount: 28000, quantity: 0, price: 0 },
            { user: '가람', type: 'expense', category: '생활비', ticker: '', date: '2026-04-25', name: '바지수선', amount: 8000, quantity: 0, price: 0 },
            { user: '가람', type: 'expense', category: '생활비', ticker: '', date: '2026-04-25', name: '에어컨', amount: 378000, quantity: 0, price: 0 }
        ];

        async function authenticate() {
            try {
                if (initialToken) await signInWithCustomToken(auth, initialToken);
                else await signInAnonymously(auth);
            } catch (err) { console.error("Auth failed:", err); }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('sync-text').innerText = "CLOUD SYNCED";
                
                const recordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'records');
                
                // 데이터가 하나도 없을 때만 초기 데이터 삽입
                const snap = await getDocs(query(recordsRef));
                if (snap.empty) {
                    const batch = writeBatch(db);
                    initialData.forEach(item => {
                        const id = 'INIT-' + Math.random().toString(36).substr(2, 9);
                        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'records', id);
                        batch.set(ref, { ...item, id: id });
                    });
                    await batch.commit();
                }

                onSnapshot(recordsRef, (snapshot) => {
                    records = snapshot.docs.map(doc => ({...doc.data(), id: doc.id}));
                    render();
                }, (error) => console.error("Firestore error:", error));
            }
        });

        async function getLivePrice(ticker) {
            let symbol = ticker.trim().toUpperCase();
            if (/^\d{6}$/.test(symbol)) symbol += ".KS";
            const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d&_=${Date.now()}`;
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`);
                const proxyData = await res.json();
                const data = JSON.parse(proxyData.contents);
                return data.chart?.result?.[0]?.meta?.regularMarketPrice || null;
            } catch (e) { return null; }
        }

        window.fetchSingleStockPrice = async () => {
            const ticker = document.getElementById('i-ticker').value;
            const status = document.getElementById('price-status');
            if(!ticker) return;
            status.innerText = "⏳...";
            const price = await getLivePrice(ticker);
            if(price) {
                document.getElementById('i-price').value = price;
                status.innerText = "✅";
                window.calcStockTotal();
            } else { status.innerText = "❌"; }
        };

        window.calcStockTotal = () => {
            const cat = document.getElementById('i-category').value;
            if (!cat || !cat.includes('주식')) return;
            const qty = parseFloat(document.getElementById('i-quantity').value) || 0;
            const price = parseFloat(document.getElementById('i-price').value) || 0;
            let finalKrw = (cat === '주식(해외)') ? Math.round(qty * price * USD_RATE) : Math.round(qty * price);
            document.getElementById('i-display-amount').value = `₩${finalKrw.toLocaleString()}`;
            document.getElementById('i-amount-val').value = finalKrw;
        };

        window.refreshStockPrices = async () => {
            if (!currentUser) return;
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('loading-spinner');
            for (let r of records) {
                if (r.category && r.category.includes('주식') && r.ticker) {
                    const latestPrice = await getLivePrice(r.ticker);
                    if (latestPrice) {
                        r.price = latestPrice;
                        r.amount = r.category === '주식(해외)' ? Math.round(r.quantity * latestPrice * USD_RATE) : Math.round(r.quantity * latestPrice);
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', r.id), r);
                    }
                }
            }
            icon.classList.remove('loading-spinner');
        };

        window.setWriter = (w) => {
            curWriter = w;
            document.querySelectorAll('.btn-writer').forEach(b => b.classList.toggle('active', b.innerText === w));
        };

        window.setType = (t) => {
            curType = t;
            document.querySelectorAll('.btn-type').forEach(b => b.classList.toggle('active', b.id === 't-' + t));
            const select = document.getElementById('i-category');
            select.innerHTML = categories[t].map(cat => `<option value="${cat}">${cat}</option>`).join('');
            window.handleCategoryChange();
        };

        window.handleCategoryChange = () => {
            const cat = document.getElementById('i-category').value;
            const isStock = cat && cat.includes('주식');
            document.getElementById('stock-group').classList.toggle('hidden', !isStock);
            document.getElementById('normal-group').classList.toggle('hidden', isStock);
            if(isStock) window.calcStockTotal();
        };

        window.save = async () => {
            if (!currentUser) return alert("연결 중...");
            const cat = document.getElementById('i-category').value;
            const isStock = cat && cat.includes('주식');
            const editId = document.getElementById('edit-id').value;
            let amount = isStock ? parseInt(document.getElementById('i-amount-val').value) : parseInt(document.getElementById('i-amount').value);
            if (isNaN(amount) || amount <= 0) return alert("금액을 정확히 입력해주세요.");
            const id = editId || 'ID-' + Date.now();
            const data = {
                id: id, user: curWriter, type: curType, category: cat,
                name: document.getElementById('i-name').value || (isStock ? document.getElementById('i-ticker').value : '항목'),
                amount: amount, date: document.getElementById('i-date').value || new Date().toISOString().split('T')[0],
                ticker: isStock ? document.getElementById('i-ticker').value.toUpperCase() : '',
                quantity: isStock ? parseFloat(document.getElementById('i-quantity').value) : 0,
                price: isStock ? parseFloat(document.getElementById('i-price').value) : 0
            };
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id), data);
                window.resetForm();
            } catch (err) { console.error(err); }
        };

        window.deleteItem = async (e, id) => {
            e.stopPropagation();
            if(!currentUser || !confirm("삭제하시겠습니까?")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
        };

        window.editItem = (id) => {
            const r = records.find(x => x.id === id);
            if (!r) return;
            document.getElementById('edit-id').value = r.id;
            document.getElementById('form-title').innerText = "기록 수정";
            window.setWriter(r.user);
            window.setType(r.type);
            setTimeout(() => {
                document.getElementById('i-category').value = r.category;
                window.handleCategoryChange();
                document.getElementById('i-name').value = r.name;
                document.getElementById('i-date').value = r.date;
                if (r.category.includes('주식')) {
                    document.getElementById('i-ticker').value = r.ticker;
                    document.getElementById('i-quantity').value = r.quantity;
                    document.getElementById('i-price').value = r.price;
                    window.calcStockTotal();
                } else document.getElementById('i-amount').value = r.amount;
            }, 50);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = () => {
            document.getElementById('edit-id').value = "";
            document.getElementById('form-title').innerText = "내역 추가";
            document.querySelectorAll('input').forEach(i => i.type !== 'date' && (i.value = ""));
            document.getElementById('i-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('price-status').innerText = "";
        };

        window.setFilter = (f) => {
            curFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === 'f-' + f));
            render();
        };

        function render() {
            const listEl = document.getElementById('main-list');
            const filtered = records.filter(r => {
                if (curFilter === 'all') return true;
                if (curFilter === 'expense') return r.type === 'expense';
                if (curFilter === 'asset-only') return r.type === 'asset' && r.category && !(r.category.includes('수입'));
                if (curFilter === 'income-only') return r.type === 'asset' && r.category && r.category.includes('수입');
                return true;
            });
            let totalAsset = 0, monthIncome = 0, monthExpense = 0, dist = {}, timeline = {};
            listEl.innerHTML = '';
            filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(r => {
                const isInc = r.category && r.category.includes('수입');
                const isThisMonth = r.date && r.date.startsWith(new Date().toISOString().slice(0, 7));
                if (r.type === 'asset' && !isInc) totalAsset += r.amount;
                if (isInc && isThisMonth) monthIncome += r.amount;
                if (r.type === 'expense' && isThisMonth) monthExpense += r.amount;
                if (r.type === 'asset') dist[r.category] = (dist[r.category] || 0) + r.amount;
                if (r.type === 'expense') timeline[r.date] = (timeline[r.date] || 0) + r.amount;
                listEl.innerHTML += `
                    <div class="list-item flex justify-between items-center ${r.type === 'asset' ? 'type-asset' : 'type-expense'}" onclick="window.editItem('${r.id}')">
                        <div class="flex gap-4 items-center">
                            <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center font-black text-[10px] text-indigo-400 border border-slate-700">${r.user}</div>
                            <div>
                                <div class="flex items-center gap-2 mb-0.5"><span class="text-[9px] font-black uppercase text-slate-500">${r.category}</span>
                                ${r.ticker ? `<span class="text-[8px] font-bold bg-indigo-500/20 text-indigo-400 px-1 py-0.5 rounded">${r.ticker}</span>` : ''}
                                <span class="text-[8px] text-slate-500">${r.date}</span></div>
                                <h4 class="text-sm font-bold text-slate-100">${r.name}</h4>
                            </div>
                        </div>
                        <div class="flex items-center gap-6">
                            <div class="text-right"><p class="text-lg font-black ${r.type === 'asset' ? 'text-indigo-400' : 'text-rose-400'}">${r.type === 'asset' ? '+' : '-'} ₩${(r.amount || 0).toLocaleString()}</p>
                            ${r.quantity ? `<p class="text-[9px] text-slate-500">${r.quantity}주 @ ₩${(r.price || 0).toLocaleString()}</p>` : ''}</div>
                            <button class="text-slate-600 hover:text-rose-500 text-xl font-bold p-2" onclick="window.deleteItem(event, '${r.id}')">×</button>
                        </div>
                    </div>`;
            });
            document.getElementById('total-wealth').innerText = '₩' + (totalAsset + monthIncome - monthExpense).toLocaleString();
            document.getElementById('stat-asset').innerText = '₩' + totalAsset.toLocaleString();
            document.getElementById('stat-income').innerText = '₩' + monthIncome.toLocaleString();
            document.getElementById('stat-expense').innerText = '₩' + monthExpense.toLocaleString();
            updateCharts(dist, timeline);
        }

        function updateCharts(dist, timeline) {
            const aCtx = document.getElementById('assetChart');
            if(assetChart) assetChart.destroy();
            if(Object.keys(dist).length > 0) {
                assetChart = new Chart(aCtx, {
                    type: 'doughnut',
                    data: { labels: Object.keys(dist), datasets: [{ data: Object.values(dist), backgroundColor: ['#6366f1', '#10b981', '#fbbf24', '#f43f5e', '#38bdf8', '#8b5cf6', '#ec4899'] }] },
                    options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10, weight: 'bold' } } }, title: { display: true, text: '자산 비중', color: '#f1f5f9', font: { size: 12, weight: '900' } } }, cutout: '75%' }
                });
            }
            const eCtx = document.getElementById('expenseChart');
            if(expenseChart) expenseChart.destroy();
            const dates = Object.keys(timeline).sort();
            if(dates.length > 0) {
                expenseChart = new Chart(eCtx, {
                    type: 'line',
                    data: { labels: dates, datasets: [{ label: '지출액', data: dates.map(d => timeline[d]), borderColor: '#f43f5e', tension: 0.4, fill: true, backgroundColor: 'rgba(244, 63, 94, 0.1)', borderWidth: 3, pointRadius: 4 }] },
                    options: { maintainAspectRatio: false, scales: { x: { grid: { display: false }, ticks: { color: '#475569', font: { size: 9 } } }, y: { display: false } }, plugins: { legend: { display: false }, title: { display: true, text: '지출 추이', color: '#f1f5f9', font: { size: 12, weight: '900' } } } }
                });
            }
        }

        authenticate();
        document.addEventListener('DOMContentLoaded', () => {
            window.setType('asset');
        });
    </script>
</body>
</html>
