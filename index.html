<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부부 자산관리 Pro v6.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 15px -3px rgba(0,0,0,0.05); }
        .input-style { width: 100%; padding: 0.8rem; border-radius: 0.8rem; border: 1px solid #e2e8f0; outline: none; font-size: 16px; background: #fff; }
        .btn-active { background-color: #0f172a !important; color: white !important; }
        .animate-pulse-fast { animation: pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="p-4 md:p-8 pb-20">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-xl font-bold">💎 우리집 자산 현황</h1>
                <p id="last-sync" class="text-[10px] text-slate-400 font-medium">실시간 동기화 활성</p>
            </div>
            <div class="font-bold bg-white px-4 py-2 rounded-2xl shadow-sm border border-slate-100 text-sm">2026.04</div>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="card p-5 border-l-4 border-blue-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">가용 현금</p>
                <p id="sum-avail" class="text-lg font-extrabold tracking-tight text-slate-800">₩0</p>
            </div>
            <div class="card p-5 border-l-4 border-emerald-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">예적금/청약</p>
                <p id="sum-save" class="text-lg font-extrabold tracking-tight text-slate-800">₩0</p>
            </div>
            <div class="card p-5 border-l-4 border-purple-600 relative overflow-hidden">
                <p class="text-[10px] text-slate-400 font-bold mb-1">주식 평가액</p>
                <p id="sum-stock" class="text-lg font-extrabold tracking-tight text-slate-800">₩0</p>
                <div id="price-loading" class="absolute top-2 right-2 hidden"><div class="w-2 h-2 bg-purple-400 rounded-full animate-pulse-fast"></div></div>
            </div>
            <div class="card p-5 border-l-4 border-orange-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">미래/퇴직금</p>
                <p id="sum-future" class="text-lg font-extrabold tracking-tight text-slate-800">₩0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-4">
                <div class="flex justify-between items-center px-1">
                    <h2 class="font-bold text-slate-700">자산 변동 로그</h2>
                    <button onclick="fetchData()" class="text-xs font-bold text-blue-500 hover:text-blue-700 transition-colors">새로고침 🔄</button>
                </div>
                <div id="list" class="space-y-3">
                    </div>
            </div>

            <div class="lg:col-span-5">
                <section class="card p-6 sticky top-8">
                    <form id="finance-form" class="space-y-5">
                        <div class="flex gap-2">
                            <button type="button" onclick="setUser('남편')" id="btn-h" class="flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white transition-all border-slate-100">🧔 남편</button>
                            <button type="button" onclick="setUser('아내')" id="btn-w" class="flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white transition-all border-slate-100">👩 아내</button>
                            <input type="hidden" id="user-name" value="남편">
                        </div>
                        <div class="flex bg-slate-100 p-1 rounded-xl">
                            <button type="button" onclick="setType('수입')" id="btn-inc" class="flex-1 py-2 rounded-lg font-bold text-sm transition-all">수입/자산</button>
                            <button type="button" onclick="setType('지출')" id="btn-exp" class="flex-1 py-2 rounded-lg font-bold text-sm transition-all text-slate-500">지출</button>
                            <input type="hidden" id="type-select" value="수입">
                        </div>
                        <select id="category-select" class="input-style font-semibold" onchange="toggleStock()"></select>
                        
                        <div id="stock-inputs" class="hidden space-y-4 p-5 bg-blue-50/50 rounded-2xl border border-blue-100">
                            <div>
                                <label class="text-[10px] font-bold text-blue-500 uppercase ml-1">Stock Ticker</label>
                                <input type="text" id="ticker" placeholder="예: AAPL, 069500.KS" class="input-style mt-1 shadow-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] font-bold text-blue-500 ml-1">매수 단가</label>
                                    <input type="number" id="buy-price" placeholder="₩" class="input-style mt-1 shadow-sm font-bold">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-blue-500 ml-1">수량</label>
                                    <input type="number" id="qty" step="0.01" placeholder="0" class="input-style mt-1 shadow-sm font-bold">
                                </div>
                            </div>
                        </div>

                        <div id="amt-container">
                            <label class="text-[10px] font-bold text-slate-400 ml-1">금액</label>
                            <input type="number" id="amount" placeholder="₩ 0" class="input-style font-bold text-lg">
                        </div>
                        <input type="text" id="desc" placeholder="내용 메모" class="input-style">
                        <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all text-lg">저장하기</button>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let stockCache = {};
        const categories = {
            "수입": ["월급", "주식", "주식(미환산이익)", "저축/예금", "적금", "청약", "퇴직연금", "퇴직금", "기타수입"],
            "지출": ["식비/마트", "카페/외식", "주거비", "통신/OTT", "교통/차량", "보험료", "의료비", "취미/문화", "경조사", "기타지출"]
        };

        async function getPrice(ticker) {
            if (!ticker) return 0;
            if (stockCache[ticker]) return stockCache[ticker];
            try {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), 2500); // 2.5초 타임아웃
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`)}`, { signal: controller.signal });
                const json = await res.json();
                const price = JSON.parse(json.contents).chart.result[0].meta.regularMarketPrice;
                clearTimeout(id);
                stockCache[ticker] = price;
                return price;
            } catch (e) { return 0; }
        }

        function setUser(name) {
            document.getElementById('user-name').value = name;
            document.getElementById('btn-h').className = name === '남편' ? 'flex-1 py-3 rounded-xl border-2 font-bold text-sm btn-active border-slate-900 transition-all' : 'flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white text-slate-400 border-slate-100 transition-all';
            document.getElementById('btn-w').className = name === '아내' ? 'flex-1 py-3 rounded-xl border-2 font-bold text-sm btn-active border-slate-900 transition-all' : 'flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white text-slate-400 border-slate-100 transition-all';
        }

        function setType(type) {
            document.getElementById('type-select').value = type;
            document.getElementById('btn-inc').className = type === '수입' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('btn-exp').className = type === '지출' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('category-select').innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStock();
        }

        function toggleStock() {
            const isStock = document.getElementById('category-select').value.includes("주식");
            document.getElementById('stock-inputs').style.display = isStock ? 'block' : 'none';
            document.getElementById('amt-container').style.display = isStock ? 'none' : 'block';
        }

        async function fetchData() {
            document.getElementById('price-loading').classList.remove('hidden');
            const { data } = await sb.from('account_v3').select('*').order('created_at', { ascending: false });
            if (data) {
                const tickers = [...new Set(data.filter(r => r.ticker).map(r => r.ticker))];
                // 병렬 실행으로 속도 극대화
                await Promise.all(tickers.map(t => getPrice(t)));
                render(data);
                document.getElementById('last-sync').innerText = "최근 업데이트: " + new Date().toLocaleTimeString();
            }
            document.getElementById('price-loading').classList.add('hidden');
        }

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const isStock = document.getElementById('category-select').value.includes("주식");
            const btn = document.getElementById('submit-btn');
            
            const record = {
                user_name: document.getElementById('user-name').value,
                type: document.getElementById('type-select').value,
                category: document.getElementById('category-select').value,
                amount: isStock ? parseInt(document.getElementById('buy-price').value) : parseInt(document.getElementById('amount').value),
                ticker: document.getElementById('ticker').value.toUpperCase(),
                qty: parseFloat(document.getElementById('qty').value) || 0,
                description: document.getElementById('desc').value,
                date: "2026. 04. 11."
            };

            // 즉시 UI 반영 (Optimistic UI)
            btn.innerText = "저장 중...";
            btn.disabled = true;

            const { error } = await sb.from('account_v3').insert([record]);
            if (!error) {
                e.target.reset(); 
                setType('수입'); 
                fetchData();
            } else {
                alert("저장 실패. 인터넷을 확인하세요.");
            }
            btn.innerText = "저장하기";
            btn.disabled = false;
        };

        async function deleteItem(id) {
            if (confirm("삭제하시겠습니까?")) {
                await sb.from('account_v3').delete().eq('id', id);
                fetchData();
            }
        }

        function render(records) {
            let sums = { avail: 0, save: 0, stock: 0, future: 0 };
            document.getElementById('list').innerHTML = records.map(r => {
                // 실시간 평가액 계산
                let currentVal = r.amount * (r.qty || 1);
                if (r.ticker && stockCache[r.ticker] && stockCache[r.ticker] > 0) {
                    currentVal = Math.round(stockCache[r.ticker] * r.qty);
                }

                if (r.type === "수입") {
                    if (["월급", "기타수입"].includes(r.category)) sums.avail += r.amount;
                    else if (["저축/예금", "적금", "청약"].includes(r.category)) sums.save += r.amount;
                    else if (["퇴직연금", "퇴직금"].includes(r.category)) sums.future += r.amount;
                    else if (r.category.includes("주식")) sums.stock += currentVal;
                } else { sums.avail -= r.amount; }

                return `
                <div class="card p-4 flex justify-between items-center hover:scale-[1.01] transition-transform">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-xs ${r.user_name === '남편' ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'bg-rose-500 text-white shadow-lg shadow-rose-100'}">${r.user_name[0]}</div>
                        <div>
                            <p class="font-bold text-slate-800 text-sm mb-0.5">${r.description || r.category}</p>
                            <p class="text-[10px] text-slate-400 font-semibold tracking-wide">
                                ${r.ticker ? `<span class="text-blue-500">${r.ticker}</span> • ${r.qty}주 • 현재 ₩${(stockCache[r.ticker] || 0).toLocaleString()}` : r.category}
                            </p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4 text-right">
                        <span class="font-extrabold text-sm ${r.type === '수입' ? 'text-emerald-600' : 'text-slate-600'}">
                            ${r.type === '수입' ? '+' : '-'} ${currentVal.toLocaleString()}
                        </span>
                        <button onclick="deleteItem('${r.id}')" class="text-slate-200 hover:text-red-500 font-bold px-2 text-xl">×</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('sum-avail').innerText = `₩${sums.avail.toLocaleString()}`;
            document.getElementById('sum-save').innerText = `₩${sums.save.toLocaleString()}`;
            document.getElementById('sum-stock').innerText = `₩${sums.stock.toLocaleString()}`;
            document.getElementById('sum-future').innerText = `₩${sums.future.toLocaleString()}`;
        }

        setUser('남편'); setType('수입'); fetchData();
        // 30초마다 자동 새로고침 (실시간 느낌 강화)
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
