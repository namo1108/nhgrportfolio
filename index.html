<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        :root {
            --bg-deep: #0f172a;
            --accent: #6366f1;
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: var(--bg-deep); 
            color: #f8fafc; 
            margin: 0; 
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            min-height: 100vh;
        }

        .glass-panel { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; backdrop-filter: blur(16px); }
        .input-container { background: white; border-radius: 32px; color: #1e293b; padding: 28px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        .toggle-btn { flex: 1; padding: 12px; border-radius: 14px; font-weight: 800; font-size: 14px; color: #94a3b8; transition: all 0.2s; cursor: pointer; border: none; background: #f1f5f9; }
        .toggle-btn.active { background: #6366f1; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .stat-box { padding: 20px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); background: rgba(255, 255, 255, 0.03); }
        
        input, select { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; width: 100%; color: #1e293b; font-size: 15px; font-weight: 600; outline: none; }
        input:focus { border-color: #6366f1; background: white; }

        .list-item { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center; transition: transform 0.2s; cursor: pointer; }
        .list-item:active { transform: scale(0.98); }

        .btn-submit { background: #1e293b; color: white; font-weight: 900; border-radius: 16px; padding: 16px; width: 100%; transition: all 0.3s; }
        .btn-submit:hover { background: #6366f1; transform: translateY(-2px); }

        .filter-btn { padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; color: #94a3b8; background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); }
        .filter-btn.active { background: #6366f1; color: white; }
    </style>
</head>
<body>

    <div class="max-w-6xl mx-auto py-6">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <h1 class="text-5xl font-black italic tracking-tighter text-white mb-1">NG</h1>
                <p class="text-[10px] font-bold tracking-[0.4em] text-slate-500 uppercase">Premium Asset Management</p>
            </div>
            <div class="flex gap-3">
                <div class="stat-box min-w-[130px]">
                    <p class="text-[10px] font-bold text-slate-500 uppercase mb-1">총 자산</p>
                    <p class="text-xl font-black" id="disp-total-asset">₩0</p>
                </div>
                <div class="stat-box min-w-[130px]">
                    <p class="text-[10px] font-bold text-emerald-500 uppercase mb-1">수입</p>
                    <p class="text-xl font-black text-emerald-400" id="disp-monthly-income">₩0</p>
                </div>
                <div class="stat-box min-w-[130px]">
                    <p class="text-[10px] font-bold text-rose-500 uppercase mb-1">지출</p>
                    <p class="text-xl font-black text-rose-400" id="disp-monthly-expense">₩0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-panel p-6 h-[300px] flex flex-col">
                        <p class="text-[10px] font-bold text-slate-500 uppercase mb-4">Asset Distribution</p>
                        <div class="flex-1 min-h-0"><canvas id="chartPie"></canvas></div>
                    </div>
                    <div class="glass-panel p-6 h-[300px] flex flex-col">
                        <p class="text-[10px] font-bold text-slate-500 uppercase mb-4">Cash Flow Trend</p>
                        <div class="flex-1 min-h-0"><canvas id="chartBar"></canvas></div>
                    </div>
                </div>

                <div>
                    <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
                        <button id="f-all" class="filter-btn active">전체</button>
                        <button id="f-asset" class="filter-btn">자산</button>
                        <button id="f-income" class="filter-btn">수입</button>
                        <button id="f-expense" class="filter-btn">지출</button>
                    </div>
                    <div id="main-list" class="space-y-3"></div>
                </div>
            </div>

            <aside class="lg:col-span-5">
                <div class="input-container sticky top-6">
                    <h2 class="text-2xl font-black mb-8" id="form-title">내역 추가</h2>
                    <div class="space-y-6">
                        <input type="hidden" id="entry-id">
                        
                        <div>
                            <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block">작성자</label>
                            <div class="flex gap-2 p-1 bg-slate-100 rounded-xl">
                                <button id="u-namho" class="toggle-btn active">남호</button>
                                <button id="u-garam" class="toggle-btn">가람</button>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] font-black text-slate-400 uppercase mb-2 block">유형</label>
                            <div class="flex gap-2 p-1 bg-slate-100 rounded-xl">
                                <button id="rt-asset" class="toggle-btn active">자산</button>
                                <button id="rt-flow" class="toggle-btn">수입/지출</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[11px] font-black text-slate-400 mb-2 block">카테고리</label>
                                <select id="entry-category"></select>
                            </div>
                            <div>
                                <label class="text-[11px] font-black text-slate-400 mb-2 block">날짜</label>
                                <input type="date" id="entry-date">
                            </div>
                        </div>

                        <!-- 주식 입력 섹션 -->
                        <div id="box-stock" class="p-5 bg-indigo-50 rounded-2xl space-y-4 hidden">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[10px] font-bold text-indigo-500 mb-1 block">티커</label>
                                    <div class="flex gap-1">
                                        <input type="text" id="entry-ticker" placeholder="AAPL" class="text-sm">
                                        <button id="btn-fetch" class="bg-indigo-600 text-white px-3 rounded-xl text-[10px] font-bold">조회</button>
                                    </div>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-indigo-500 mb-1 block">수량</label>
                                    <input type="number" id="entry-qty" placeholder="0" class="text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-indigo-500 mb-1 block">현재가 (₩)</label>
                                <input type="number" id="entry-price" placeholder="0" class="text-sm">
                            </div>
                            <div class="text-center pt-2 border-t border-indigo-100">
                                <p class="text-[10px] text-slate-400">평가액 합계</p>
                                <p class="text-2xl font-black text-indigo-600" id="disp-calc-total">₩0</p>
                            </div>
                        </div>

                        <div id="box-amount">
                            <label class="text-[11px] font-black text-slate-400 mb-2 block">금액 (₩)</label>
                            <input type="number" id="entry-amount" placeholder="0" class="text-xl">
                        </div>

                        <div>
                            <label class="text-[11px] font-black text-slate-400 mb-2 block">메모</label>
                            <input type="text" id="entry-memo" placeholder="항목 설명">
                        </div>

                        <button id="btn-submit" class="btn-submit">저장하기</button>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-xl font-bold opacity-0 transition-all pointer-events-none z-50"></div>

    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "firebase/firestore";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-main';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let records = [];
        let state = { user: '남호', type: 'asset', filter: 'all' };
        const cats = {
            asset: ['주식(국내)', '주식(해외)', '현금/예금', '보증금', '보험', '연금', '부동산', '기타'],
            flow: ['급여(수입)', '기타수입', '생활비(지출)', '식비', '교통', '문화/쇼핑', '기기/구독', '기타지출']
        };

        let pChart = null, bChart = null;

        // --- 초기화 및 인증 (RULE 3 준수) ---
        window.onload = async () => {
            document.getElementById('entry-date').value = new Date().toISOString().split('T')[0];
            updateCatUI();

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) { showToast("인증 실패"); }

            onAuthStateChanged(auth, (u) => {
                if (u) {
                    const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'records'), orderBy('updatedAt', 'desc'));
                    onSnapshot(q, (s) => {
                        records = s.docs.map(d => ({ ...d.data(), id: d.id }));
                        render();
                    }, (err) => console.error(err));
                }
            });
        };

        // --- UI 렌더링 ---
        function render() {
            const list = document.getElementById('main-list');
            const nowMonth = new Date().toISOString().slice(0, 7);
            let total = 0, inc = 0, exp = 0;

            records.forEach(r => {
                const a = Number(r.amount) || 0;
                if (r.type === 'asset') total += a;
                else if (r.date.startsWith(nowMonth)) {
                    if (r.category.includes('수입')) inc += a;
                    else exp += a;
                }
            });

            document.getElementById('disp-total-asset').innerText = `₩${total.toLocaleString()}`;
            document.getElementById('disp-monthly-income').innerText = `₩${inc.toLocaleString()}`;
            document.getElementById('disp-monthly-expense').innerText = `₩${exp.toLocaleString()}`;

            const filtered = records.filter(r => {
                if (state.filter === 'all') return true;
                if (state.filter === 'asset') return r.type === 'asset';
                if (state.filter === 'income') return r.category.includes('수입');
                if (state.filter === 'expense') return !r.category.includes('수입') && r.type !== 'asset';
                return true;
            });

            list.innerHTML = filtered.map(r => `
                <div class="list-item" onclick="editItem('${r.id}')">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center font-bold text-indigo-400 text-xs">${r.user[0]}</div>
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase">${r.category} | ${r.date}</p>
                            <h4 class="font-bold text-slate-200">${r.memo || r.ticker || '내역'}</h4>
                        </div>
                    </div>
                    <p class="text-lg font-black ${r.type === 'asset' ? 'text-white' : (r.category.includes('수입') ? 'text-emerald-400' : 'text-rose-400')}">
                        ₩${Number(r.amount).toLocaleString()}
                    </p>
                </div>
            `).join('') || '<p class="text-center py-10 text-slate-500">데이터가 없습니다.</p>';

            updateCharts();
        }

        // --- 차트 엔진 ---
        function updateCharts() {
            const ctxP = document.getElementById('chartPie').getContext('2d');
            const ctxB = document.getElementById('chartBar').getContext('2d');

            const assetData = {};
            records.filter(r => r.type === 'asset').forEach(r => assetData[r.category] = (assetData[r.category] || 0) + Number(r.amount));

            if (pChart) pChart.destroy();
            pChart = new Chart(ctxP, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(assetData),
                    datasets: [{ data: Object.values(assetData), backgroundColor: ['#6366f1', '#10b981', '#f43f5e', '#f59e0b'], borderWidth: 0 }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' }
            });

            const months = [3, 2, 1, 0].map(i => {
                const d = new Date(); d.setMonth(d.getMonth() - i);
                return d.toISOString().slice(0, 7);
            });
            const spendData = months.map(m => records.filter(r => r.date.startsWith(m) && !r.category.includes('수입') && r.type !== 'asset').reduce((a, c) => a + Number(c.amount), 0));

            if (bChart) bChart.destroy();
            bChart = new Chart(ctxB, {
                type: 'bar',
                data: { labels: months.map(m => m.split('-')[1]+'월'), datasets: [{ data: spendData, backgroundColor: '#6366f1', borderRadius: 8 }] },
                options: { maintainAspectRatio: false, scales: { y: { display: false }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
            });
        }

        // --- 로직 및 이벤트 리스너 ---
        function updateCatUI() {
            const s = document.getElementById('entry-category');
            const l = state.type === 'asset' ? cats.asset : cats.flow;
            s.innerHTML = l.map(v => `<option value="${v}">${v}</option>`).join('');
            toggleStockBox();
        }

        function toggleStockBox() {
            const isS = document.getElementById('entry-category').value.includes('주식');
            document.getElementById('box-stock').classList.toggle('hidden', !isS);
            document.getElementById('box-amount').classList.toggle('hidden', isS);
        }

        function calcStock() {
            const q = Number(document.getElementById('entry-qty').value) || 0;
            const p = Number(document.getElementById('entry-price').value) || 0;
            document.getElementById('disp-calc-total').innerText = `₩${Math.round(q * p).toLocaleString()}`;
        }

        window.editItem = (id) => {
            const item = records.find(r => r.id === id);
            if (!confirm("수정하시겠습니까? (취소 시 삭제 확인)")) {
                if (confirm("삭제하시겠습니까?")) {
                    deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id)).then(() => showToast("삭제 완료"));
                }
                return;
            }
            document.getElementById('entry-id').value = item.id;
            document.getElementById('entry-memo').value = item.memo || "";
            document.getElementById('entry-amount').value = item.amount;
            document.getElementById('entry-date').value = item.date;
            document.getElementById('form-title').innerText = "기록 수정";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // --- 버튼 이벤트 핸들러 ---
        document.getElementById('u-namho').onclick = () => { state.user = '남호'; document.getElementById('u-namho').classList.add('active'); document.getElementById('u-garam').classList.remove('active'); };
        document.getElementById('u-garam').onclick = () => { state.user = '가람'; document.getElementById('u-garam').classList.add('active'); document.getElementById('u-namho').classList.remove('active'); };
        document.getElementById('rt-asset').onclick = () => { state.type = 'asset'; document.getElementById('rt-asset').classList.add('active'); document.getElementById('rt-flow').classList.remove('active'); updateCatUI(); };
        document.getElementById('rt-flow').onclick = () => { state.type = 'flow'; document.getElementById('rt-flow').classList.add('active'); document.getElementById('rt-asset').classList.remove('active'); updateCatUI(); };
        document.getElementById('entry-category').onchange = toggleStockBox;
        document.getElementById('entry-qty').oninput = calcStock;
        document.getElementById('entry-price').oninput = calcStock;

        document.getElementById('btn-fetch').onclick = () => {
            const t = document.getElementById('entry-ticker').value;
            if (!t) return;
            showToast(`${t} 가격 조회 중...`);
            setTimeout(() => {
                document.getElementById('entry-price').value = Math.floor(Math.random() * 200 + 50) * 1000;
                calcStock();
                showToast("최신 가격이 반영되었습니다.");
            }, 600);
        };

        document.getElementById('btn-submit').onclick = async () => {
            const isS = document.getElementById('entry-category').value.includes('주식');
            const amt = isS ? Math.round(Number(document.getElementById('entry-qty').value) * Number(document.getElementById('entry-price').value)) : Number(document.getElementById('entry-amount').value);
            
            if (!amt) return showToast("금액을 입력하세요.");

            const id = document.getElementById('entry-id').value || `R-${Date.now()}`;
            const data = {
                user: state.user, type: state.type,
                category: document.getElementById('entry-category').value,
                memo: document.getElementById('entry-memo').value,
                date: document.getElementById('entry-date').value,
                amount: amt,
                ticker: isS ? document.getElementById('entry-ticker').value : '',
                updatedAt: Date.now()
            };

            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id), data);
            showToast("저장 완료!");
            document.getElementById('entry-id').value = "";
            document.getElementById('entry-amount').value = "";
            document.getElementById('entry-memo').value = "";
            document.getElementById('form-title').innerText = "내역 추가";
        };

        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m;
            t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2000);
        }

        ['all', 'asset', 'income', 'expense'].forEach(f => {
            document.getElementById(`f-${f}`).onclick = () => {
                state.filter = f;
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === `f-${f}`));
                render();
            };
        });
    </script>
</body>
</html>
