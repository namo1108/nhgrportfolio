<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부부 자산관리 v6.3 (단가 기반 연동)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .input-style { width: 100%; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; outline: none; font-size: 16px; }
        .btn-active { background-color: #1e293b !important; color: white !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold">📊 실시간 자산 관리 (단가연동)</h1>
            <div id="month-display" class="font-bold bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">2026.04</div>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
            <div class="card p-4 border-l-4 border-blue-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">가용 현금</p>
                <p id="sum-avail" class="text-lg font-extrabold text-slate-700">₩0</p>
            </div>
            <div class="card p-4 border-l-4 border-emerald-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">예적금/청약</p>
                <p id="sum-save" class="text-lg font-extrabold text-slate-700">₩0</p>
            </div>
            <div class="card p-4 border-l-4 border-purple-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">실시간 주식 평가액</p>
                <p id="sum-stock" class="text-lg font-extrabold text-slate-700 font-mono">₩0</p>
            </div>
            <div class="card p-4 border-l-4 border-orange-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">미래/퇴직금</p>
                <p id="sum-future" class="text-lg font-extrabold text-slate-700">₩0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 space-y-6">
                <div class="card p-6 min-h-[300px]"><canvas id="expenseChart"></canvas></div>
                <div id="list" class="space-y-2 max-h-[500px] overflow-y-auto"></div>
            </div>

            <div class="lg:col-span-5">
                <section class="card p-6 sticky top-4">
                    <form id="finance-form" class="space-y-4">
                        <div class="flex gap-2">
                            <button type="button" onclick="setUser('남편')" id="btn-h" class="flex-1 py-3 rounded-xl border font-bold text-sm bg-white transition-all">🧔 남편</button>
                            <button type="button" onclick="setUser('아내')" id="btn-w" class="flex-1 py-3 rounded-xl border font-bold text-sm bg-white transition-all">👩 아내</button>
                            <input type="hidden" id="user-name" value="남편">
                        </div>
                        <div class="flex bg-slate-100 p-1 rounded-xl">
                            <button type="button" onclick="setType('수입')" id="btn-inc" class="flex-1 py-2 rounded-lg font-bold text-sm">수입/자산</button>
                            <button type="button" onclick="setType('지출')" id="btn-exp" class="flex-1 py-2 rounded-lg font-bold text-sm">지출</button>
                            <input type="hidden" id="type-select" value="수입">
                        </div>
                        <select id="category-select" class="input-style" onchange="toggleStock()"></select>
                        
                        <div id="stock-inputs" class="hidden space-y-3 p-4 bg-blue-50 rounded-xl border border-blue-100">
                            <div>
                                <label class="text-[10px] font-bold text-blue-500">종목 티커 (예: AAPL, 005930.KS)</label>
                                <input type="text" id="ticker" placeholder="AAPL" class="input-style mt-1">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] font-bold text-blue-500">평균 매수 단가</label>
                                    <input type="number" id="buy-price" placeholder="₩ 0" class="input-style mt-1">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-blue-500">보유 수량</label>
                                    <input type="number" id="qty" step="0.01" placeholder="0" class="input-style mt-1">
                                </div>
                            </div>
                        </div>

                        <div id="amt-container">
                            <label class="text-[10px] font-bold text-slate-400">금액 ₩</label>
                            <input type="number" id="amount" placeholder="0" class="input-style font-bold">
                        </div>
                        <input type="text" id="desc" placeholder="메모" class="input-style">
                        <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold active:scale-95 transition-all">데이터 저장하기</button>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let stockPrices = {};
        const categories = {
            "수입": ["월급", "주식", "주식(미환산이익)", "저축/예금", "적금", "청약", "퇴직연금", "퇴직금", "기타수입"],
            "지출": ["식비/마트", "카페/외식", "주거비", "통신/OTT", "교통/차량", "보험료", "의료비", "취미/문화", "경조사", "기타지출"]
        };

        async function fetchLivePrice(ticker) {
            if (!ticker) return 0;
            if (stockPrices[ticker]) return stockPrices[ticker];
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`)}`);
                const json = await res.json();
                const data = JSON.parse(json.contents);
                const price = data.chart.result[0].meta.regularMarketPrice;
                stockPrices[ticker] = price;
                return price;
            } catch (e) { return 0; }
        }

        function setUser(name) {
            document.getElementById('user-name').value = name;
            document.getElementById('btn-h').className = name === '남편' ? 'flex-1 py-3 rounded-xl border font-bold text-sm btn-active' : 'flex-1 py-3 rounded-xl border font-bold text-sm bg-white text-slate-400';
            document.getElementById('btn-w').className = name === '아내' ? 'flex-1 py-3 rounded-xl border font-bold text-sm btn-active' : 'flex-1 py-3 rounded-xl border font-bold text-sm bg-white text-slate-400';
        }

        function setType(type) {
            document.getElementById('type-select').value = type;
            document.getElementById('btn-inc').className = type === '수입' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('btn-exp').className = type === '지출' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('category-select').innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStock();
        }

        function toggleStock() {
            const isStock = document.getElementById('category-select').value.includes("주식");
            document.getElementById('stock-inputs').style.display = isStock ? 'block' : 'none';
            document.getElementById('amt-container').style.display = isStock ? 'none' : 'block';
        }

        async function fetchData() {
            const { data } = await sb.from('account_v3').select('*').order('created_at', { ascending: false });
            if (data) {
                const tickers = [...new Set(data.filter(r => r.ticker).map(r => r.ticker))];
                await Promise.all(tickers.map(t => fetchLivePrice(t)));
                render(data);
            }
        }

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const cat = document.getElementById('category-select').value;
            const isStock = cat.includes("주식");
            
            // 주식일 경우 '입력한 단가'를 amount로 일단 저장함
            const record = {
                user_name: document.getElementById('user-name').value,
                type: document.getElementById('type-select').value,
                category: cat,
                amount: isStock ? parseInt(document.getElementById('buy-price').value) : parseInt(document.getElementById('amount').value),
                ticker: document.getElementById('ticker').value.toUpperCase(),
                qty: parseFloat(document.getElementById('qty').value) || 0,
                description: document.getElementById('desc').value,
                date: "2026. 04. 11." // 현재 날짜
            };

            await sb.from('account_v3').insert([record]);
            e.target.reset(); setType('수입'); fetchData();
        };

        async function deleteItem(id) {
            if (confirm("삭제하시겠습니까?")) {
                await sb.from('account_v3').delete().eq('id', id);
                fetchData();
            }
        }

        function render(records) {
            let sums = { avail: 0, save: 0, stock: 0, future: 0 };
            document.getElementById('list').innerHTML = records.map(r => {
                let currentVal = r.amount * (r.qty || 1); // 기본값: 저장된 금액(단가) * 수량
                
                // 주식인 경우 실시간가 반영하여 평가액 계산
                if (r.ticker && stockPrices[r.ticker]) {
                    currentVal = Math.round(stockPrices[r.ticker] * r.qty);
                }

                if (r.type === "수입") {
                    if (["월급", "기타수입"].includes(r.category)) sums.avail += (r.amount);
                    else if (["저축/예금", "적금", "청약"].includes(r.category)) sums.save += (r.amount);
                    else if (["퇴직연금", "퇴직금"].includes(r.category)) sums.future += (r.amount);
                    else if (r.category.includes("주식")) sums.stock += currentVal;
                } else { sums.avail -= r.amount; }

                return `
                <div class="flex justify-between items-center p-4 bg-white rounded-xl border border-slate-50 shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-[10px] ${r.user_name === '남편' ? 'bg-blue-100 text-blue-600' : 'bg-rose-100 text-rose-600'}">${r.user_name[0]}</div>
                        <div>
                            <p class="font-bold text-slate-800 text-sm leading-tight">${r.description || r.category}</p>
                            <p class="text-[10px] text-slate-400 font-medium">${r.ticker ? `매수가: ₩${r.amount.toLocaleString()} | 현재가: ₩${(stockPrices[r.ticker] || 0).toLocaleString()}` : r.category}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 text-right">
                        <span class="font-bold text-sm ${r.type === '수입' ? 'text-emerald-600' : 'text-slate-600'}">
                            ${r.type === '수입' ? '+' : '-'} ${currentVal.toLocaleString()}
                        </span>
                        <button onclick="deleteItem('${r.id}')" class="text-slate-200 hover:text-red-500 font-bold px-1">×</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('sum-avail').innerText = `₩${sums.avail.toLocaleString()}`;
            document.getElementById('sum-save').innerText = `₩${sums.save.toLocaleString()}`;
            document.getElementById('sum-stock').innerText = `₩${sums.stock.toLocaleString()}`;
            document.getElementById('sum-future').innerText = `₩${sums.future.toLocaleString()}`;
        }

        setUser('남편'); setType('수입'); fetchData();
    </script>
</body>
</html>
