<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0;
            padding: 24px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 20px;
        }
        .input-card {
            background: white;
            border-radius: 24px;
            color: #1e293b;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .btn-writer, .btn-type {
            background: #f1f5f9;
            color: #94a3b8;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
        .btn-writer.active, .btn-type.active {
            background: #6366f1 !important;
            color: white !important;
        }
        .filter-btn {
            background: rgba(30, 41, 59, 0.6);
            color: #64748b;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-color: rgba(99, 102, 241, 0.5);
        }
        .list-item {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .list-item:hover {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(30, 41, 59, 0.5);
        }
        .delete-btn {
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        input, select {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            width: 100%;
            color: #1e293b;
        }
        .chart-container { height: 180px; position: relative; }
        label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-6">
            <div>
                <p class="text-[9px] font-black tracking-widest text-indigo-400 mb-1 uppercase">Net Worth Status</p>
                <h1 class="text-5xl font-black tracking-tighter" id="total-wealth">₩0</h1>
            </div>
            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                <div class="glass-card px-4 py-3 flex-1 min-w-[100px] border-l-4 border-l-indigo-500">
                    <p class="text-[9px] text-slate-500 font-bold mb-0.5 uppercase">Asset</p>
                    <p class="text-sm font-black text-indigo-400" id="stat-asset">₩0</p>
                </div>
                <div class="glass-card px-4 py-3 flex-1 min-w-[100px] border-l-4 border-l-emerald-500">
                    <p class="text-[9px] text-slate-500 font-bold mb-0.5 uppercase">Income</p>
                    <p class="text-sm font-black text-emerald-400" id="stat-income">₩0</p>
                </div>
                <div class="glass-card px-4 py-3 flex-1 min-w-[100px] border-l-4 border-l-rose-500">
                    <p class="text-[9px] text-slate-500 font-bold mb-0.5 uppercase">Expense</p>
                    <p class="text-sm font-black text-rose-400" id="stat-expense">₩0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass-card p-5">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Allocation</p>
                <div class="chart-container"><canvas id="assetChart"></canvas></div>
            </div>
            <div class="glass-card p-5">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Timeline</p>
                <div class="chart-container"><canvas id="expenseChart"></canvas></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <aside class="lg:col-span-4">
                <div class="input-card">
                    <h2 class="text-xl font-black mb-5" id="form-title">기록하기</h2>
                    <div class="space-y-4">
                        <input type="hidden" id="edit-id">
                        <div class="flex p-1 bg-slate-100 rounded-xl">
                            <button onclick="setWriter('남호')" id="w-namho" class="btn-writer flex-1 py-2 active">남호</button>
                            <button onclick="setWriter('가람')" id="w-garam" class="btn-writer flex-1 py-2">가람</button>
                        </div>
                        <div class="flex p-1 bg-slate-100 rounded-xl">
                            <button onclick="setType('asset')" id="t-asset" class="btn-type flex-1 py-2 active">자산</button>
                            <button onclick="setType('income')" id="t-income" class="btn-type flex-1 py-2">수입</button>
                            <button onclick="setType('expense')" id="t-expense" class="btn-type flex-1 py-2">지출</button>
                        </div>
                        <div>
                            <label>카테고리</label>
                            <select id="i-category" onchange="handleCategoryChange()"></select>
                        </div>
                        <div id="stock-group" class="space-y-3 hidden">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="i-ticker" placeholder="티커 (예: AAPL)">
                                <input type="number" id="i-quantity" placeholder="수량" oninput="calcTotal()">
                            </div>
                            <input type="number" id="i-price" step="0.01" placeholder="단가" oninput="calcTotal()">
                            <input type="text" id="i-display-amount" readonly class="bg-slate-50 font-bold" placeholder="원화 계산 금액">
                            <input type="hidden" id="i-amount-val">
                        </div>
                        <div id="normal-group">
                            <label>금액 (₩)</label>
                            <input type="number" id="i-amount" placeholder="0">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="i-date">
                            <input type="text" id="i-name" placeholder="항목명">
                        </div>
                        <button onclick="save()" class="w-full py-4 bg-slate-900 text-white font-black rounded-xl hover:bg-indigo-600">저장하기</button>
                        <button onclick="resetForm()" class="w-full py-2 text-[10px] text-slate-400 font-bold">새로 입력 / 취소</button>
                    </div>
                </div>
            </aside>

            <section class="lg:col-span-8">
                <div class="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-2">
                    <button onclick="setFilter('all')" id="f-all" class="filter-btn active">전체</button>
                    <button onclick="setFilter('asset')" id="f-asset" class="filter-btn">자산</button>
                    <button onclick="setFilter('income')" id="f-income" class="filter-btn">수입</button>
                    <button onclick="setFilter('expense')" id="f-expense" class="filter-btn">지출</button>
                </div>
                <div id="main-list" class="space-y-3 pb-20"></div>
            </section>
        </div>
    </div>

    <script>
        const USD_RATE = 1481.5;
        let records = [];
        let curWriter = '남호';
        let curType = 'asset';
        let curFilter = 'all';
        let assetChart = null;
        let expenseChart = null;

      const categories = {
            asset: ['주식(국내)', '주식(해외)', '현금/예적금', '보증금', '연금/퇴직금', '청약', '현금'],
            income: ['급여', '보너스', '부수입', '이자/배당'],
            expense: ['생활비', '문화/여가, '금융/대출', '주거/통신', '교통/차량', '기기구입', '경조사','보험', '기타지출']
        };

        // 전역 함수 등록 (GitHub 환경 안정성)
        window.setWriter = (w) => {
            curWriter = w;
            document.querySelectorAll('.btn-writer').forEach(b => b.classList.toggle('active', b.innerText === w));
        };

        window.setType = (t) => {
            curType = t;
            document.querySelectorAll('.btn-type').forEach(b => b.classList.toggle('active', b.id === 't-' + t));
            const select = document.getElementById('i-category');
            if (select) {
                select.innerHTML = categories[t].map(cat => `<option value="${cat}">${cat}</option>`).join('');
                handleCategoryChange();
            }
            render();
        };

        window.handleCategoryChange = () => {
            const cat = document.getElementById('i-category').value;
            const isStock = cat.includes('주식');
            document.getElementById('stock-group').classList.toggle('hidden', !isStock);
            document.getElementById('normal-group').classList.toggle('hidden', isStock);
            calcTotal();
        };

        window.calcTotal = () => {
            const cat = document.getElementById('i-category').value;
            const qty = parseFloat(document.getElementById('i-quantity').value) || 0;
            const price = parseFloat(document.getElementById('i-price').value) || 0;
            const total = qty * price;
            const isOverseas = cat === '주식(해외)';
            const finalKrw = isOverseas ? Math.round(total * USD_RATE) : Math.round(total);
            
            document.getElementById('i-display-amount').value = isOverseas ? `₩${finalKrw.toLocaleString()} (환율적용)` : `₩${finalKrw.toLocaleString()}`;
            document.getElementById('i-amount-val').value = finalKrw;
        };

        window.save = () => {
            const cat = document.getElementById('i-category').value;
            const isStock = cat.includes('주식');
            const editId = document.getElementById('edit-id').value;
            let amount = isStock ? parseInt(document.getElementById('i-amount-val').value) : parseInt(document.getElementById('i-amount').value);
            
            if (isNaN(amount)) return alert("금액을 입력하세요.");

            const data = {
                id: editId || 'ID-' + Date.now(),
                user: curWriter,
                type: curType,
                category: cat,
                name: document.getElementById('i-name').value || '항목 없음',
                amount: amount,
                date: document.getElementById('i-date').value,
                ticker: isStock ? document.getElementById('i-ticker').value : ''
            };

            if (editId) records = records.map(r => r.id === editId ? data : r);
            else records.push(data);
            
            localStorage.setItem('nhgr_asset_v1', JSON.stringify(records));
            render();
            resetForm();
        };

        window.deleteItem = (e, id) => {
            e.stopPropagation();
            if (confirm('삭제할까요?')) {
                records = records.filter(r => r.id !== id);
                localStorage.setItem('nhgr_asset_v1', JSON.stringify(records));
                render();
            }
        };

        window.editItem = (id) => {
            const r = records.find(x => x.id === id);
            if (!r) return;
            document.getElementById('edit-id').value = r.id;
            setWriter(r.user);
            setType(r.type);
            document.getElementById('i-category').value = r.category;
            handleCategoryChange();
            document.getElementById('i-name').value = r.name;
            document.getElementById('i-date').value = r.date;
            if (r.category.includes('주식')) {
                document.getElementById('i-ticker').value = r.ticker || '';
                document.getElementById('i-amount-val').value = r.amount;
                calcTotal();
            } else {
                document.getElementById('i-amount').value = r.amount;
            }
            document.getElementById('form-title').innerText = "내역 수정";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = () => {
            document.getElementById('edit-id').value = "";
            document.getElementById('i-name').value = "";
            document.getElementById('i-amount').value = "";
            document.getElementById('i-ticker').value = "";
            document.getElementById('i-quantity').value = "";
            document.getElementById('i-price').value = "";
            document.getElementById('form-title').innerText = "기록하기";
        };

        window.setFilter = (f) => {
            curFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === 'f-' + f));
            render();
        };

        function render() {
            const listEl = document.getElementById('main-list');
            if (!listEl) return;

            const filtered = records.filter(r => curFilter === 'all' || r.type === curFilter);
            let sums = { asset: 0, income: 0, expense: 0 };
            let dist = {}, timeline = {};

            listEl.innerHTML = filtered.length ? '' : '<div class="text-center py-10 opacity-30">내역이 없습니다.</div>';
            
            filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(r => {
                sums[r.type] += r.amount;
                if (r.type === 'asset') dist[r.category] = (dist[r.category] || 0) + r.amount;
                if (r.type === 'expense') timeline[r.date] = (timeline[r.date] || 0) + r.amount;

                const color = r.type === 'asset' ? 'text-indigo-400' : (r.type === 'income' ? 'text-emerald-400' : 'text-rose-400');
                const bg = r.type === 'asset' ? 'bg-indigo-600' : (r.type === 'income' ? 'bg-emerald-500' : 'bg-rose-500');

                listEl.innerHTML += `
                    <div class="list-item flex justify-between items-center" onclick="editItem('${r.id}')">
                        <div class="flex gap-3 items-center">
                            <div class="w-8 h-8 rounded-lg ${bg} flex items-center justify-center font-bold text-[10px]">${r.user}</div>
                            <div>
                                <p class="text-[9px] ${color} font-bold uppercase">${r.category}</p>
                                <h4 class="text-sm font-bold text-slate-100">${r.name}</h4>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <p class="text-sm font-black ${color}">${r.type==='expense'?'-':'+'}₩${r.amount.toLocaleString()}</p>
                            <button class="delete-btn" onclick="deleteItem(event, '${r.id}')">×</button>
                        </div>
                    </div>`;
            });

            document.getElementById('total-wealth').innerText = '₩' + (sums.asset + sums.income - sums.expense).toLocaleString();
            document.getElementById('stat-asset').innerText = '₩' + sums.asset.toLocaleString();
            document.getElementById('stat-income').innerText = '₩' + sums.income.toLocaleString();
            document.getElementById('stat-expense').innerText = '₩' + sums.expense.toLocaleString();
            
            updateCharts(dist, timeline);
        }

        function updateCharts(dist, timeline) {
            const aCtx = document.getElementById('assetChart');
            if (aCtx) {
                if(assetChart) assetChart.destroy();
                assetChart = new Chart(aCtx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(dist),
                        datasets: [{ data: Object.values(dist), backgroundColor: ['#6366f1', '#10b981', '#fbbf24', '#f43f5e', '#38bdf8'], borderWidth: 0 }]
                    },
                    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '80%' }
                });
            }
            const eCtx = document.getElementById('expenseChart');
            if (eCtx) {
                if(expenseChart) expenseChart.destroy();
                const dates = Object.keys(timeline).sort();
                expenseChart = new Chart(eCtx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{ data: dates.map(d => timeline[d]), borderColor: '#f43f5e', tension: 0.4, fill: true, backgroundColor: 'rgba(244, 63, 94, 0.1)' }]
                    },
                    options: { maintainAspectRatio: false, scales: { x: { display: false }, y: { display: false } }, plugins: { legend: { display: false } } }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            try {
                const saved = localStorage.getItem('nhgr_asset_v1');
                const parsed = saved ? JSON.parse(saved) : [];
                records = Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                records = [];
            }
            document.getElementById('i-date').value = new Date().toISOString().split('T')[0];
            setType('asset');
        });
    </script>
</body>
</html>
