<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남호가람 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .tab-active { background-color: #0f172a !important; color: white !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: white; border: 1px solid #f1f5f9; border-radius: 1.5rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <!-- 상단 자산 요약 카드 -->
        <header class="bg-slate-900 text-white p-8 rounded-[2.5rem] mb-8 shadow-2xl">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Total Asset Wealth</p>
                    <h1 id="total-wealth-display" class="text-4xl md:text-5xl font-black tracking-tighter">₩0</h1>
                    <div class="flex items-center gap-2 mt-4 text-slate-400 text-sm">
                        <div class="w-6 h-6 bg-blue-500 rounded-full flex items-center justify-center text-white text-[10px] font-bold">U</div>
                        <span>가족 통합 자산 관리 시스템</span>
                    </div>
                </div>
                <div class="flex gap-3">
                    <div class="bg-white/5 border border-white/10 p-4 rounded-2xl min-w-[120px]">
                        <p class="text-[10px] text-slate-500 font-bold mb-1 uppercase">이번달 수지</p>
                        <p id="balance-display" class="text-lg font-black font-mono text-emerald-400">+₩0</p>
                    </div>
                    <div class="bg-white/5 border border-white/10 p-4 rounded-2xl min-w-[100px]">
                        <p class="text-[10px] text-slate-500 font-bold mb-1 uppercase">환율 (USD)</p>
                        <p class="text-lg font-black font-mono text-blue-400">1,400.0</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 왼쪽: 기록 영역 -->
            <aside class="lg:col-span-4">
                <div class="glass-card p-6 sticky top-8">
                    <h2 class="text-lg font-black mb-6 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        기록하기
                    </h2>
                    
                    <div class="space-y-4">
                        <div class="flex p-1 bg-slate-100 rounded-xl">
                            <button onclick="setUser('남호')" id="user-namho" class="flex-1 py-2 text-xs font-black rounded-lg bg-slate-900 text-white">남호</button>
                            <button onclick="setUser('가람')" id="user-garam" class="flex-1 py-2 text-xs font-bold text-slate-400">가람</button>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setType('asset')" id="type-asset" class="py-2.5 text-xs font-black rounded-lg border-2 border-blue-100 bg-blue-50 text-blue-600">수입/자산</button>
                            <button onclick="setType('expense')" id="type-expense" class="py-2.5 text-xs font-bold rounded-lg border-2 border-transparent text-slate-400 bg-slate-50">지출</button>
                        </div>

                        <div class="space-y-2">
                            <input type="date" id="input-date" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm outline-none focus:ring-2 ring-blue-500/20">
                            <input type="number" id="input-amount" placeholder="금액" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm outline-none focus:ring-2 ring-blue-500/20">
                            <select id="input-category" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm outline-none focus:ring-2 ring-blue-500/20">
                                <option>주식(국내)</option>
                                <option>저축/예금</option>
                                <option>보증금</option>
                                <option>연금/퇴직금</option>
                                <option>청약</option>
                                <option>주거(지출)</option>
                                <option>기타</option>
                            </select>
                            <input type="text" id="input-name" placeholder="항목명 (예: 삼성전자)" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm outline-none focus:ring-2 ring-blue-500/20">
                        </div>

                        <button onclick="addRecord()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl hover:bg-slate-800 transition-all shadow-lg shadow-slate-200">
                            데이터 저장하기
                        </button>
                    </div>
                </div>
            </aside>

            <!-- 오른쪽: 리스트 영역 -->
            <main class="lg:col-span-8">
                <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar mb-2">
                    <button onclick="setFilter('all')" id="filter-all" class="px-6 py-2.5 rounded-full text-xs font-black bg-white border border-slate-200 shadow-sm tab-active">전체보기</button>
                    <button onclick="setFilter('asset')" id="filter-asset" class="px-6 py-2.5 rounded-full text-xs font-black bg-white border border-slate-200 shadow-sm">자산현황</button>
                    <button onclick="setFilter('expense')" id="filter-expense" class="px-6 py-2.5 rounded-full text-xs font-black bg-white border border-slate-200 shadow-sm">지출내역</button>
                </div>

                <div id="list-container" class="space-y-3">
                    <!-- 리스트 아이템이 자바스크립트로 주입됩니다 -->
                </div>
            </main>
        </div>
    </div>

    <script>
        // 초기 데이터 (이미지 기반 자산 정보)
        let records = [
            { id: 1, user: '남호', type: 'asset', category: '주식(국내)', name: 'KODEX200', amount: 2646000, date: '2026-04-24' },
            { id: 2, user: '남호', type: 'asset', category: '주식(국내)', name: '삼성전자', amount: 6161591, date: '2026-04-24' },
            { id: 3, user: '남호', type: 'asset', category: '주식(국내)', name: '우리금융지주', amount: 8590, date: '2026-04-24' },
            { id: 4, user: '남호', type: 'asset', category: '주식(국내)', name: '이스트에이드', amount: 382796, date: '2026-04-24' },
            { id: 5, user: '남호', type: 'asset', category: '연금/퇴직금', name: '퇴직연금', amount: 18898783, date: '2026-04-24' },
            { id: 6, user: '남호', type: 'asset', category: '청약', name: '주택청약', amount: 5760000, date: '2026-04-24' },
            { id: 7, user: '남호', type: 'asset', category: '보증금', name: '아파트보증금', amount: 15800000, date: '2026-04-24' },
            { id: 8, user: '남호', type: 'asset', category: '저축/예금', name: '청년도약적금', amount: 7000000, date: '2026-04-24' },
            { id: 9, user: '남호', type: 'asset', category: '저축/예금', name: '연지곤지', amount: 3510000, date: '2026-04-24' },
            { id: 10, user: '가람', type: 'asset', category: '주식(국내)', name: '주식 합산', amount: 9165000, date: '2026-04-24' },
            { id: 11, user: '가람', type: 'asset', category: '연금/퇴직금', name: '퇴직금', amount: 5000000, date: '2026-04-24' },
            { id: 12, user: '가람', type: 'asset', category: '청약', name: '주택청약', amount: 6200000, date: '2026-04-24' },
            { id: 13, user: '가람', type: 'expense', category: '주거(지출)', name: '관리비', amount: 251200, date: '2026-04-24' }
        ];

        let currentUser = '남호';
        let currentType = 'asset';
        let currentFilter = 'all';

        function setUser(user) {
            currentUser = user;
            document.getElementById('user-namho').className = user === '남호' ? 'flex-1 py-2 text-xs font-black rounded-lg bg-slate-900 text-white' : 'flex-1 py-2 text-xs font-bold text-slate-400';
            document.getElementById('user-garam').className = user === '가람' ? 'flex-1 py-2 text-xs font-black rounded-lg bg-slate-900 text-white' : 'flex-1 py-2 text-xs font-bold text-slate-400';
        }

        function setType(type) {
            currentType = type;
            document.getElementById('type-asset').className = type === 'asset' ? 'py-2.5 text-xs font-black rounded-lg border-2 border-blue-100 bg-blue-50 text-blue-600' : 'py-2.5 text-xs font-bold rounded-lg border-2 border-transparent text-slate-400 bg-slate-50';
            document.getElementById('type-expense').className = type === 'expense' ? 'py-2.5 text-xs font-black rounded-lg border-2 border-rose-100 bg-rose-50 text-rose-600' : 'py-2.5 text-xs font-bold rounded-lg border-2 border-transparent text-slate-400 bg-slate-50';
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('[id^="filter-"]').forEach(btn => btn.classList.remove('tab-active'));
            document.getElementById('filter-' + f).classList.add('tab-active');
            render();
        }

        function addRecord() {
            const amount = document.getElementById('input-amount').value;
            const name = document.getElementById('input-name').value;
            const date = document.getElementById('input-date').value;
            const category = document.getElementById('input-category').value;

            if(!amount || !name || !date) return alert("내용을 모두 입력해주세요.");

            const newRecord = {
                id: Date.now(),
                user: currentUser,
                type: currentType,
                category: category,
                name: name,
                amount: parseInt(amount),
                date: date
            };

            records.push(newRecord);
            render();
            
            // 입력창 초기화
            document.getElementById('input-amount').value = '';
            document.getElementById('input-name').value = '';
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            render();
        }

        function render() {
            const container = document.getElementById('list-container');
            const totalDisplay = document.getElementById('total-wealth-display');
            const balanceDisplay = document.getElementById('balance-display');

            // 1. 자산 총계 계산 (오직 type === 'asset'인 것만!)
            const totalAssets = records
                .filter(r => r.type === 'asset')
                .reduce((sum, r) => sum + r.amount, 0);
            
            totalDisplay.innerText = '₩' + totalAssets.toLocaleString();

            // 2. 이번달 지출 합계 (간단히 계산)
            const totalExpenses = records
                .filter(r => r.type === 'expense')
                .reduce((sum, r) => sum + r.amount, 0);
            balanceDisplay.innerText = '-₩' + totalExpenses.toLocaleString();
            balanceDisplay.className = "text-lg font-black font-mono text-rose-400";

            // 3. 필터링 및 렌더링
            const filtered = records.filter(r => {
                if (currentFilter === 'asset') return r.type === 'asset';
                if (currentFilter === 'expense') return r.type === 'expense';
                return true;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = filtered.map(r => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center group transition-all hover:border-blue-200">
                    <div class="flex items-center gap-4">
                        <div class="p-2.5 rounded-xl ${r.type === 'asset' ? 'bg-blue-50 text-blue-600' : 'bg-rose-50 text-rose-600'}">
                            ${r.type === 'asset' ? 
                                '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a2 2 0 0 0 0 4h15a1 1 0 0 0 1-1v-4"/><path d="M12 11h.01"/></svg>' : 
                                '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'
                            }
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-black px-2 py-0.5 rounded ${r.user === '남호' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600'}">${r.user}</span>
                                <span class="text-[10px] font-bold text-slate-400">${r.category}</span>
                                ${r.type === 'asset' ? '<span class="bg-emerald-500 text-white text-[8px] font-black px-1.5 rounded">ASSET</span>' : ''}
                            </div>
                            <h3 class="text-sm font-bold text-slate-800">${r.name}</h3>
                            <p class="text-[10px] font-mono text-slate-400 mt-0.5">${r.date}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="text-lg font-black font-mono ${r.type === 'expense' ? 'text-rose-500' : 'text-slate-900'}">
                            ${r.type === 'expense' ? '-' : ''}₩${r.amount.toLocaleString()}
                        </p>
                        <button onclick="deleteRecord(${r.id})" class="p-2 text-slate-200 hover:text-rose-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 초기 실행
        document.getElementById('input-date').valueAsDate = new Date();
        render();
    </script>
</body>
</html>
