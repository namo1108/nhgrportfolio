<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; overflow-x: hidden; min-height: 100vh; }
        
        .glass-card { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
        .input-card { background: white; border-radius: 28px; color: #1e293b; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        .btn-toggle { background: #f1f5f9; color: #94a3b8; border-radius: 14px; font-weight: 800; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); font-size: 14px; border: none; cursor: pointer; }
        .btn-toggle.active { background: #6366f1 !important; color: white !important; transform: scale(1.02); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4); }
        
        .filter-btn { background: rgba(30, 41, 59, 0.6); color: #64748b; padding: 12px 24px; border-radius: 14px; font-size: 14px; font-weight: 700; transition: all 0.2s; border: 1px solid rgba(255,255,255,0.05); }
        .filter-btn.active { background: #6366f1; color: white; border-color: transparent; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
        
        .list-item { background: rgba(30, 41, 59, 0.3); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 24px; padding: 20px 28px; margin-bottom: 16px; transition: all 0.3s; position: relative; cursor: pointer; overflow: hidden; }
        .list-item:hover { background: rgba(30, 41, 59, 0.5); transform: translateX(4px); }
        .list-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
        .type-asset::before { background: #6366f1; box-shadow: 4px 0 12px rgba(99, 102, 241, 0.4); }
        .type-expense::before { background: #f43f5e; box-shadow: 4px 0 12px rgba(244, 63, 94, 0.4); }
        
        input, select { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 14px; padding: 14px; width: 100%; color: #1e293b; font-size: 15px; font-weight: 600; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #6366f1; }
        label { font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 0.05em; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-online { background: #10b981; box-shadow: 0 0 10px #10b981; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-8">
            <div class="animate-in fade-in duration-700">
                <div class="flex items-center gap-2 mb-3">
                    <span class="text-xs font-black tracking-[0.2em] text-indigo-400 uppercase">Total Net Worth</span>
                    <span id="update-indicator" class="flex items-center text-[10px] font-bold text-emerald-400 bg-emerald-400/10 px-3 py-1 rounded-full">
                        <span class="status-dot status-online"></span> <span id="sync-text">LIVE SYNC ACTIVE</span>
                    </span>
                </div>
                <div class="flex items-center gap-5">
                    <h1 class="text-7xl font-black tracking-tighter" id="total-wealth">₩0</h1>
                    <button id="btn-refresh-data" class="p-3.5 glass-card hover:bg-slate-700 transition-all active:scale-95">
                        <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-4 w-full md:w-auto">
                <div class="glass-card px-8 py-5 flex-1 min-w-[160px] border-l-4 border-indigo-500">
                    <p class="text-xs text-slate-500 font-black mb-1 uppercase">자산 총액</p>
                    <p class="text-2xl font-black text-indigo-400" id="stat-asset">₩0</p>
                </div>
                <div class="glass-card px-8 py-5 flex-1 min-w-[160px] border-l-4 border-emerald-500">
                    <p class="text-xs text-slate-500 font-black mb-1 uppercase">이번달 수입</p>
                    <p class="text-2xl font-black text-emerald-400" id="stat-income">₩0</p>
                </div>
                <div class="glass-card px-8 py-5 flex-1 min-w-[160px] border-l-4 border-rose-500">
                    <p class="text-xs text-slate-500 font-black mb-1 uppercase">이번달 지출</p>
                    <p class="text-2xl font-black text-rose-400" id="stat-expense">₩0</p>
                </div>
            </div>
        </header>

        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <div class="glass-card p-8 h-[350px]"><canvas id="assetChart"></canvas></div>
            <div class="glass-card p-8 h-[350px]"><canvas id="expenseChart"></canvas></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Form -->
            <aside class="lg:col-span-4">
                <div class="input-card sticky top-8">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-3xl font-black tracking-tight" id="form-title">기록하기</h2>
                        <button id="btn-reset" class="text-xs text-slate-400 font-black uppercase hover:text-indigo-500 transition-colors">초기화 ↺</button>
                    </div>
                    
                    <div class="space-y-6">
                        <input type="hidden" id="edit-id">
                        
                        <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-100 rounded-2xl">
                            <button id="w-namho" class="btn-toggle py-3.5 active">남호</button>
                            <button id="w-garam" class="btn-toggle py-3.5">가람</button>
                        </div>
                        
                        <div class="grid grid-cols-3 gap-2 p-1.5 bg-slate-100 rounded-2xl">
                            <button id="t-asset" class="btn-toggle py-3 active">자산</button>
                            <button id="t-income" class="btn-toggle py-3">수입</button>
                            <button id="t-expense" class="btn-toggle py-3">지출</button>
                        </div>

                        <div>
                            <label>카테고리</label>
                            <select id="i-category"></select>
                        </div>
                        
                        <!-- Stock Section -->
                        <div id="stock-group" class="space-y-4 p-5 bg-indigo-50 rounded-2xl border-2 border-indigo-100 hidden">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label>티커 (005930 / QQQ)</label>
                                    <input type="text" id="i-ticker" placeholder="입력">
                                </div>
                                <div>
                                    <label>수량</label>
                                    <input type="number" id="i-quantity" step="any" placeholder="0">
                                </div>
                            </div>
                            <div>
                                <label class="flex justify-between items-center">
                                    현재가 (단가)
                                    <span class="text-[9px] font-black text-indigo-400 uppercase">수동 입력 권장</span>
                                </label>
                                <input type="number" id="i-price" step="any" placeholder="0">
                            </div>
                            <div>
                                <label>평가 금액 (자동 계산)</label>
                                <div id="i-display-amount" class="w-full p-4 bg-indigo-200/50 rounded-xl text-indigo-900 font-black text-xl">₩0</div>
                                <input type="hidden" id="i-amount-val">
                            </div>
                        </div>

                        <!-- Normal Amount Section -->
                        <div id="normal-group">
                            <label>금액 (₩)</label>
                            <input type="number" id="i-amount" placeholder="0">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div><label>날짜</label><input type="date" id="i-date"></div>
                            <div><label>내용</label><input type="text" id="i-name" placeholder="메모"></div>
                        </div>
                        
                        <button id="btn-save" class="w-full py-5 bg-slate-900 text-white font-black rounded-2xl hover:bg-indigo-600 active:scale-[0.98] transition-all text-xl mt-4 shadow-xl shadow-indigo-500/10">데이터 저장하기</button>
                    </div>
                </div>
            </aside>

            <!-- List -->
            <section class="lg:col-span-8">
                <div class="flex gap-3 mb-10 overflow-x-auto no-scrollbar pb-2">
                    <button id="f-all" class="filter-btn active">전체보기</button>
                    <button id="f-asset" class="filter-btn">자산현황</button>
                    <button id="f-income" class="filter-btn">수입내역</button>
                    <button id="f-expense" class="filter-btn">지출내역</button>
                </div>
                <div id="main-list" class="space-y-4 pb-32">
                    <div class="py-20 text-center text-slate-500 font-bold animate-pulse">데이터를 불러오는 중입니다...</div>
                </div>
            </section>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"
      }
    }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "firebase/auth";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, getDocs, writeBatch } from "firebase/firestore";

        // CONFIG & INIT
        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // STATE
        let records = [];
        let curWriter = '남호';
        let curType = 'asset';
        let curFilter = 'all';
        let assetChart = null;
        let expenseChart = null;
        let user = null;

        const USD_RATE = 1481.5;
        const CATEGORIES = {
            asset: ['주식(국내)', '주식(해외)', '현금/예적금', '보증금', '연금/퇴직금', '주택청약'],
            income: ['급여(수입)', '기타 수입'],
            expense: ['생활비', '식비/카페', '문화/여가', '보험', '교통/통신', '쇼핑/기타']
        };

        const INITIAL_SEED = [
            { user: '남호', type: 'asset', category: '주식(국내)', ticker: '005930', date: '2026-04-25', name: '삼성전자', amount: 6804500, quantity: 31, price: 219500 },
            { user: '남호', type: 'asset', category: '주식(국내)', ticker: '069500', date: '2026-04-25', name: 'KODEX200', amount: 2646000, quantity: 27, price: 98000 },
            { user: '남호', type: 'income', category: '급여(수입)', date: '2026-04-25', name: '4월 월급', amount: 4500000 },
            { user: '가람', type: 'expense', category: '식비/카페', date: '2026-04-25', name: '어머니케이크', amount: 28000 }
        ];

        // STARTUP LOGIC
        async function startApp() {
            try {
                if (initialToken) await signInWithCustomToken(auth, initialToken);
                else await signInAnonymously(auth);
            } catch (e) { console.error("Auth Error", e); }
        }

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                user = u;
                document.getElementById('sync-text').innerText = "LIVE SYNC ACTIVE";
                
                const recordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'records');
                
                // Seed if empty
                const checkSnap = await getDocs(recordsRef);
                if (checkSnap.empty) {
                    const batch = writeBatch(db);
                    INITIAL_SEED.forEach(data => {
                        const newDoc = doc(recordsRef);
                        batch.set(newDoc, { ...data, id: newDoc.id });
                    });
                    await batch.commit();
                }

                // Listen
                onSnapshot(recordsRef, (snap) => {
                    records = snap.docs.map(d => d.data());
                    render();
                }, (err) => {
                    console.error("Firestore Listen Error", err);
                    document.getElementById('sync-text').innerText = "CONNECTION LOST";
                });
            }
        });

        // CORE RENDERING
        function render() {
            const listEl = document.getElementById('main-list');
            const now = new Date();
            const thisMonth = now.toISOString().slice(0, 7);

            let totalAsset = 0, monthInc = 0, monthExp = 0;
            let assetDist = {}, timeline = {};

            const filtered = records.filter(r => {
                if (curFilter === 'all') return true;
                return r.type === curFilter;
            }).sort((a,b) => new Date(b.date) - new Date(a.date));

            // Calc Stats
            records.forEach(r => {
                const amt = parseFloat(r.amount) || 0;
                const isThisMonth = r.date && r.date.startsWith(thisMonth);

                if (r.type === 'asset') {
                    totalAsset += amt;
                    assetDist[r.category] = (assetDist[r.category] || 0) + amt;
                }
                if (r.type === 'income' && isThisMonth) monthInc += amt;
                if (r.type === 'expense' && isThisMonth) {
                    monthExp += amt;
                    timeline[r.date] = (timeline[r.date] || 0) + amt;
                }
            });

            // Update UI
            document.getElementById('total-wealth').innerText = `₩${(totalAsset + monthInc - monthExp).toLocaleString()}`;
            document.getElementById('stat-asset').innerText = `₩${totalAsset.toLocaleString()}`;
            document.getElementById('stat-income').innerText = `₩${monthInc.toLocaleString()}`;
            document.getElementById('stat-expense').innerText = `₩${monthExp.toLocaleString()}`;

            listEl.innerHTML = filtered.length ? '' : '<div class="py-20 text-center text-slate-600 font-bold">표시할 내역이 없습니다.</div>';
            
            filtered.forEach(r => {
                const div = document.createElement('div');
                div.className = `list-item flex justify-between items-center type-${r.type}`;
                div.onclick = () => editItem(r.id);
                div.innerHTML = `
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 rounded-2xl bg-slate-800 flex items-center justify-center font-black text-xs text-indigo-400 border border-slate-700 shadow-inner">${r.user}</div>
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-black uppercase text-indigo-500/80">${r.category}</span>
                                ${r.ticker ? `<span class="text-[9px] font-bold bg-indigo-500/20 text-indigo-400 px-1.5 py-0.5 rounded-md">${r.ticker}</span>` : ''}
                                <span class="text-[10px] font-bold text-slate-500 ml-1">${r.date}</span>
                            </div>
                            <h4 class="text-base font-bold text-slate-100">${r.name}</h4>
                        </div>
                    </div>
                    <div class="flex items-center gap-6">
                        <div class="text-right">
                            <p class="text-xl font-black ${r.type === 'expense' ? 'text-rose-400' : 'text-indigo-400'}">${r.type === 'expense' ? '-' : '+'} ₩${(r.amount || 0).toLocaleString()}</p>
                            ${r.quantity ? `<p class="text-[10px] text-slate-500 font-bold">${r.quantity}주 × ₩${(r.price || 0).toLocaleString()}</p>` : ''}
                        </div>
                        <button class="w-8 h-8 rounded-full flex items-center justify-center text-slate-600 hover:text-rose-500 hover:bg-rose-500/10 transition-all text-2xl font-light" onclick="event.stopPropagation(); deleteItem('${r.id}')">×</button>
                    </div>
                `;
                listEl.appendChild(div);
            });

            updateCharts(assetDist, timeline);
        }

        function updateCharts(dist, timeline) {
            const chartConfig = {
                plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 11, weight: 'bold' }, padding: 20 } } },
                maintainAspectRatio: false
            };

            if (assetChart) assetChart.destroy();
            assetChart = new Chart(document.getElementById('assetChart'), {
                type: 'doughnut',
                data: { labels: Object.keys(dist), datasets: [{ data: Object.values(dist), backgroundColor: ['#6366f1', '#10b981', '#fbbf24', '#f43f5e', '#38bdf8', '#8b5cf6'], borderWidth: 0, hoverOffset: 20 }] },
                options: { ...chartConfig, cutout: '70%', plugins: { ...chartConfig.plugins, title: { display: true, text: '자산 포트폴리오', color: '#f1f5f9', font: { size: 16, weight: '900' }, padding: 20 } } }
            });

            if (expenseChart) expenseChart.destroy();
            const dates = Object.keys(timeline).sort();
            expenseChart = new Chart(document.getElementById('expenseChart'), {
                type: 'line',
                data: { labels: dates, datasets: [{ label: '지출', data: dates.map(d => timeline[d]), borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.1)', fill: true, tension: 0.4, pointRadius: 5, pointBackgroundColor: '#f43f5e' }] },
                options: { ...chartConfig, scales: { x: { grid: { display: false }, ticks: { color: '#64748b' } }, y: { display: false } }, plugins: { ...chartConfig.plugins, legend: { display: false }, title: { display: true, text: '지출 트렌드', color: '#f1f5f9', font: { size: 16, weight: '900' }, padding: 20 } } }
            });
        }

        // FORM LOGIC
        function setType(t) {
            curType = t;
            ['t-asset', 't-income', 't-expense'].forEach(id => {
                document.getElementById(id).classList.toggle('active', id === `t-${t}`);
            });
            const sel = document.getElementById('i-category');
            sel.innerHTML = CATEGORIES[t].map(c => `<option value="${c}">${c}</option>`).join('');
            handleCatChange();
        }

        function handleCatChange() {
            const cat = document.getElementById('i-category').value;
            const isStock = cat && cat.includes('주식');
            document.getElementById('stock-group').classList.toggle('hidden', !isStock);
            document.getElementById('normal-group').classList.toggle('hidden', isStock);
            if (isStock) calcStock();
        }

        function calcStock() {
            const cat = document.getElementById('i-category').value;
            const qty = parseFloat(document.getElementById('i-quantity').value) || 0;
            const price = parseFloat(document.getElementById('i-price').value) || 0;
            const krw = (cat === '주식(해외)') ? Math.round(qty * price * USD_RATE) : Math.round(qty * price);
            document.getElementById('i-display-amount').innerText = `₩${krw.toLocaleString()}`;
            document.getElementById('i-amount-val').value = krw;
        }

        async function save() {
            if (!user) return;
            const cat = document.getElementById('i-category').value;
            const isStock = cat.includes('주식');
            const editId = document.getElementById('edit-id').value;
            const id = editId || `ID-${Date.now()}`;
            
            const data = {
                id, user: curWriter, type: curType, category: cat,
                name: document.getElementById('i-name').value || '항목 없음',
                date: document.getElementById('i-date').value || new Date().toISOString().split('T')[0],
                amount: isStock ? parseInt(document.getElementById('i-amount-val').value) : parseInt(document.getElementById('i-amount').value) || 0,
                ticker: isStock ? document.getElementById('i-ticker').value.toUpperCase() : '',
                quantity: isStock ? parseFloat(document.getElementById('i-quantity').value) : 0,
                price: isStock ? parseFloat(document.getElementById('i-price').value) : 0
            };

            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id), data);
            resetForm();
        }

        function editItem(id) {
            const r = records.find(x => x.id === id);
            if (!r) return;
            document.getElementById('edit-id').value = r.id;
            document.getElementById('form-title').innerText = "기록 수정";
            curWriter = r.user;
            document.getElementById('w-namho').classList.toggle('active', r.user === '남호');
            document.getElementById('w-garam').classList.toggle('active', r.user === '가람');
            setType(r.type);
            setTimeout(() => {
                document.getElementById('i-category').value = r.category;
                handleCatChange();
                document.getElementById('i-name').value = r.name;
                document.getElementById('i-date').value = r.date;
                if (r.category.includes('주식')) {
                    document.getElementById('i-ticker').value = r.ticker;
                    document.getElementById('i-quantity').value = r.quantity;
                    document.getElementById('i-price').value = r.price;
                    calcStock();
                } else {
                    document.getElementById('i-amount').value = r.amount;
                }
            }, 50);
        }

        async function deleteItem(id) {
            if (confirm("정말로 삭제하시겠습니까?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
            }
        }

        function resetForm() {
            document.getElementById('edit-id').value = "";
            document.getElementById('form-title').innerText = "기록하기";
            document.querySelectorAll('input').forEach(i => i.type !== 'date' && (i.value = ""));
            document.getElementById('i-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('i-display-amount').innerText = "₩0";
        }

        // EVENT BINDING
        window.deleteItem = deleteItem;
        document.getElementById('w-namho').onclick = () => { curWriter = '남호'; document.getElementById('w-namho').classList.add('active'); document.getElementById('w-garam').classList.remove('active'); };
        document.getElementById('w-garam').onclick = () => { curWriter = '가람'; document.getElementById('w-garam').classList.add('active'); document.getElementById('w-namho').classList.remove('active'); };
        document.getElementById('t-asset').onclick = () => setType('asset');
        document.getElementById('t-income').onclick = () => setType('income');
        document.getElementById('t-expense').onclick = () => setType('expense');
        document.getElementById('i-category').onchange = handleCatChange;
        document.getElementById('i-quantity').oninput = calcStock;
        document.getElementById('i-price').oninput = calcStock;
        document.getElementById('btn-save').onclick = save;
        document.getElementById('btn-reset').onclick = resetForm;
        
        ['f-all', 'f-asset', 'f-income', 'f-expense'].forEach(id => {
            document.getElementById(id).onclick = () => {
                curFilter = id.split('-')[1];
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === id));
                render();
            };
        });

        // INIT
        document.getElementById('i-date').value = new Date().toISOString().split('T')[0];
        setType('asset');
        startApp();
    </script>
</body>
</html>
