<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #f1f5f9; 
            overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.5rem; }
        .input-field {
            width: 100%;
            padding: 0.75rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus { border-color: #0f172a; background: white; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        #login-screen {
            position: fixed; inset: 0; z-index: 100; background: #f1f5f9;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: 0.5s; }
    </style>
</head>
<body class="p-4">

    <!-- 로그인 화면 -->
    <div id="login-screen">
        <div class="w-full max-w-sm px-6 text-center">
            <div class="w-20 h-20 bg-slate-900 rounded-[2.5rem] mx-auto mb-6 flex items-center justify-center shadow-xl">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <h1 class="text-2xl font-black mb-8">남호가람 자산관리</h1>
            <div class="space-y-3">
                <input type="text" id="login-id" placeholder="ID" class="input-field">
                <input type="password" id="login-pw" placeholder="PW" class="input-field">
                <button onclick="handleLogin()" class="w-full p-4 bg-slate-900 text-white font-black rounded-2xl">로그인</button>
            </div>
        </div>
    </div>

    <!-- 대시보드 -->
    <div id="main-dashboard" class="max-w-7xl mx-auto hidden opacity-0 transition-opacity duration-500">
        <!-- 상단 요약 -->
        <header class="bg-slate-900 text-white p-6 rounded-[2rem] mb-6 shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-wider">Net Worth</p>
                    <h1 id="total-wealth" class="text-4xl font-black font-mono">₩0</h1>
                </div>
                <button onclick="updateMarketData()" class="p-3 bg-white/10 rounded-full">
                    <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8m0-5v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16m5 0H3v5"/></svg>
                </button>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <p class="text-[10px] text-slate-500 font-bold mb-1">삼성전자</p>
                    <p id="ss-price" class="text-sm font-black text-blue-400">₩0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <p class="text-[10px] text-slate-500 font-bold mb-1">환율(USD/KRW)</p>
                    <p id="ex-rate" class="text-sm font-black text-emerald-400">0.00</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <p class="text-[10px] text-slate-500 font-bold mb-1">총 자산</p>
                    <p id="sum-asset" class="text-sm font-black">₩0</p>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                    <p class="text-[10px] text-slate-500 font-bold mb-1">총 지출</p>
                    <p id="sum-expense" class="text-sm font-black text-rose-400">₩0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 입력 폼 (좌측) -->
            <aside class="lg:col-span-4">
                <div class="glass-card p-6 sticky top-4">
                    <div class="flex justify-between items-center mb-4">
                        <h2 id="form-title" class="font-black text-lg">데이터 입력</h2>
                        <button id="cancel-btn" onclick="resetForm()" class="hidden text-xs text-slate-400 underline">취소</button>
                    </div>
                    
                    <div class="space-y-4">
                        <input type="hidden" id="edit-id">
                        <!-- 작성자 선택 -->
                        <div class="flex p-1 bg-slate-100 rounded-xl">
                            <button onclick="setWriter('남호')" id="w-namho" class="flex-1 py-2 text-xs font-black rounded-lg bg-slate-900 text-white">남호</button>
                            <button onclick="setWriter('가람')" id="w-garam" class="flex-1 py-2 text-xs font-bold text-slate-400">가람</button>
                        </div>

                        <!-- 자산/지출 구분 -->
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="setType('asset')" id="t-asset" class="py-2 text-xs font-black rounded-lg border border-blue-500 bg-blue-50 text-blue-600">자산</button>
                            <button onclick="setType('expense')" id="t-expense" class="py-2 text-xs font-bold rounded-lg border border-slate-200 text-slate-400">지출</button>
                        </div>

                        <!-- 기본 필드 -->
                        <div class="space-y-2">
                            <input type="date" id="i-date" class="input-field text-xs">
                            <select id="i-category" onchange="toggleStockUI()" class="input-field text-xs">
                                <!-- JS에서 동적 생성됨 -->
                            </select>
                            <input type="text" id="i-name" placeholder="항목 이름" class="input-field font-bold">
                        </div>

                        <!-- 주식 상세 필드 (조건부) -->
                        <div id="stock-ui" class="hidden grid grid-cols-3 gap-2">
                            <input type="text" id="i-ticker" placeholder="티커" class="input-field text-xs uppercase">
                            <input type="number" id="i-qty" placeholder="수량" class="input-field text-xs">
                            <input type="number" id="i-avg" placeholder="평단" class="input-field text-xs">
                        </div>

                        <!-- 금액 -->
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold">₩</span>
                            <input type="number" id="i-amount" placeholder="금액" class="input-field pl-8 font-mono font-bold">
                        </div>

                        <button id="save-btn" onclick="save()" class="w-full py-4 bg-slate-900 text-white font-black rounded-2xl shadow-lg transition active:scale-95">저장하기</button>
                    </div>
                </div>
            </aside>

            <!-- 리스트 (우측) -->
            <main class="lg:col-span-8 space-y-6">
                <!-- 자산 목록 -->
                <div>
                    <h3 class="flex items-center gap-2 font-black text-slate-800 mb-3 px-2">
                        <span class="w-2 h-5 bg-blue-500 rounded-full"></span> 자산 현황
                    </h3>
                    <div id="list-asset" class="space-y-2"></div>
                </div>

                <!-- 지출 목록 -->
                <div>
                    <h3 class="flex items-center gap-2 font-black text-slate-800 mb-3 px-2">
                        <span class="w-2 h-5 bg-rose-500 rounded-full"></span> 지출 내역
                    </h3>
                    <div id="list-expense" class="space-y-2"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const apiKey = "";
        
        // 세분화된 카테고리 설정
        const categories = {
            asset: ["주식", "예적금", "현금", "보증금", "청약", "퇴직연금", "기타자산"],
            expense: ["관리비", "식비", "통신비", "보험", "세금", "경조사", "교육", "교통", "기타지출"]
        };

        let records = [
            { id: 1, user: '남호', type: 'asset', category: '주식', name: '삼성전자', ticker: '005930', qty: 81, avg: 76000, amount: 6161591, date: '2026-04-24' },
            { id: 2, user: '남호', type: 'asset', category: '보증금', name: '아파트 전세 보증금', amount: 15800000, date: '2026-04-24' },
            { id: 3, user: '가람', type: 'expense', category: '관리비', name: '아파트 관리비', amount: 251200, date: '2026-04-20' }
        ];

        let curWriter = '남호';
        let curType = 'asset';

        // 초기화 및 로그인
        window.handleLogin = () => {
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;
            if((id === 'bongmars1' && pw === 'rnjs9596@@') || (id === 'jin0ri' && pw === 'rkfka1993^^')) {
                document.getElementById('login-screen').classList.add('login-hidden');
                document.getElementById('main-dashboard').classList.remove('hidden');
                setTimeout(() => document.getElementById('main-dashboard').classList.remove('opacity-0'), 100);
                updateMarketData();
                updateCategorySelect();
                render();
            } else { alert("로그인 실패"); }
        };

        // UI 제어 함수들
        window.setWriter = (u) => {
            curWriter = u;
            document.getElementById('w-namho').className = u === '남호' ? 'flex-1 py-2 text-xs font-black rounded-lg bg-slate-900 text-white' : 'flex-1 py-2 text-xs font-bold text-slate-400';
            document.getElementById('w-garam').className = u === '가람' ? 'flex-1 py-2 text-xs font-black rounded-lg bg-slate-900 text-white' : 'flex-1 py-2 text-xs font-bold text-slate-400';
        };

        window.setType = (t) => {
            curType = t;
            const isAsset = t === 'asset';
            document.getElementById('t-asset').className = isAsset ? 'py-2 text-xs font-black rounded-lg border border-blue-500 bg-blue-50 text-blue-600' : 'py-2 text-xs font-bold rounded-lg border border-slate-200 text-slate-400';
            document.getElementById('t-expense').className = !isAsset ? 'py-2 text-xs font-black rounded-lg border border-rose-500 bg-rose-50 text-rose-600' : 'py-2 text-xs font-bold rounded-lg border border-slate-200 text-slate-400';
            updateCategorySelect();
            toggleStockUI();
        };

        function updateCategorySelect() {
            const select = document.getElementById('i-category');
            select.innerHTML = categories[curType].map(c => `<option value="${c}">${c}</option>`).join('');
        }

        window.toggleStockUI = () => {
            const isStock = document.getElementById('i-category').value === '주식' && curType === 'asset';
            document.getElementById('stock-ui').classList.toggle('hidden', !isStock);
        };

        async function updateMarketData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('animate-spin');
            try {
                const prompt = "Current USD/KRW exchange rate and Samsung Electronics(005930) KRW price as JSON: {rate: number, samsung: number}";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const data = await response.json();
                const res = JSON.parse(data.candidates[0].content.parts[0].text);
                
                document.getElementById('ex-rate').innerText = res.rate.toFixed(2);
                document.getElementById('ss-price').innerText = '₩' + res.samsung.toLocaleString();
                
                const ssIdx = records.findIndex(r => r.name === '삼성전자' || r.ticker === '005930');
                if(ssIdx !== -1 && records[ssIdx].qty > 0) {
                    records[ssIdx].amount = res.samsung * records[ssIdx].qty;
                }
                render();
            } catch (e) { console.error(e); } finally { icon.classList.remove('animate-spin'); }
        }

        // 저장 및 수정
        window.save = () => {
            const id = document.getElementById('edit-id').value;
            const category = document.getElementById('i-category').value;
            const name = document.getElementById('i-name').value;
            const date = document.getElementById('i-date').value;
            let amount = parseInt(document.getElementById('i-amount').value) || 0;
            
            const ticker = document.getElementById('i-ticker').value;
            const qty = parseFloat(document.getElementById('i-qty').value) || 0;
            const avg = parseFloat(document.getElementById('i-avg').value) || 0;

            if(!name) return;
            if(category === '주식' && qty > 0 && amount === 0) amount = qty * avg;

            const data = { id: id ? parseInt(id) : Date.now(), user: curWriter, type: curType, category, name, date, amount, ticker, qty, avg };

            if(id) {
                const idx = records.findIndex(r => r.id == id);
                records[idx] = data;
            } else {
                records.push(data);
            }

            resetForm();
            render();
        };

        window.edit = (id) => {
            const item = records.find(r => r.id === id);
            if(!item) return;

            document.getElementById('edit-id').value = item.id;
            setWriter(item.user);
            setType(item.type);
            document.getElementById('i-category').value = item.category;
            document.getElementById('i-name').value = item.name;
            document.getElementById('i-date').value = item.date;
            document.getElementById('i-amount').value = item.amount;
            document.getElementById('i-ticker').value = item.ticker || "";
            document.getElementById('i-qty').value = item.qty || "";
            document.getElementById('i-avg').value = item.avg || "";

            toggleStockUI();
            document.getElementById('form-title').innerText = "데이터 수정";
            document.getElementById('save-btn').innerText = "수정 완료";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = () => {
            document.getElementById('edit-id').value = "";
            document.getElementById('i-name').value = "";
            document.getElementById('i-amount').value = "";
            document.getElementById('i-ticker').value = "";
            document.getElementById('i-qty').value = "";
            document.getElementById('i-avg').value = "";
            document.getElementById('i-date').valueAsDate = new Date();
            document.getElementById('form-title').innerText = "데이터 입력";
            document.getElementById('save-btn').innerText = "저장하기";
            document.getElementById('cancel-btn').classList.add('hidden');
            toggleStockUI();
        };

        window.del = (id, e) => {
            e.stopPropagation();
            if(confirm("삭제하시겠습니까?")) {
                records = records.filter(r => r.id !== id);
                render();
            }
        };

        function render() {
            const assetBox = document.getElementById('list-asset');
            const expenseBox = document.getElementById('list-expense');
            
            const totalAsset = records.filter(r => r.type === 'asset').reduce((s, r) => s + r.amount, 0);
            const totalExp = records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);

            document.getElementById('total-wealth').innerText = '₩' + (totalAsset - totalExp).toLocaleString();
            document.getElementById('sum-asset').innerText = '₩' + totalAsset.toLocaleString();
            document.getElementById('sum-expense').innerText = '₩' + totalExp.toLocaleString();

            const createItem = (r) => `
                <div onclick="edit(${r.id})" class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center shadow-sm cursor-pointer hover:border-slate-300 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-[10px] ${r.user === '남호' ? 'bg-indigo-50 text-indigo-600' : 'bg-orange-50 text-orange-600'}">
                            ${r.user[0]}
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[9px] font-bold text-slate-400 uppercase">${r.category}</span>
                                <span class="text-[9px] text-slate-300 font-mono">${r.date}</span>
                            </div>
                            <h4 class="text-sm font-bold text-slate-800">${r.name} ${r.ticker ? `<span class="text-[10px] text-slate-400 font-mono font-medium ml-1">${r.ticker}</span>` : ''}</h4>
                            ${r.qty ? `<p class="text-[10px] text-slate-400 font-medium">${r.qty}주 · ₩${r.avg.toLocaleString()}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm font-black font-mono ${r.type === 'expense' ? 'text-rose-500' : 'text-slate-900'}">
                            ${r.type === 'expense' ? '-' : ''}₩${r.amount.toLocaleString()}
                        </span>
                        <button onclick="del(${r.id}, event)" class="p-2 text-slate-200 hover:text-rose-500"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
                    </div>
                </div>
            `;

            assetBox.innerHTML = records.filter(r => r.type === 'asset').sort((a,b)=>new Date(b.date)-new Date(a.date)).map(createItem).join('') || `<p class="text-center py-4 text-xs text-slate-300 italic">자산 내역이 없습니다.</p>`;
            expenseBox.innerHTML = records.filter(r => r.type === 'expense').sort((a,b)=>new Date(b.date)-new Date(a.date)).map(createItem).join('') || `<p class="text-center py-4 text-xs text-slate-300 italic">지출 내역이 없습니다.</p>`;
        }

        document.getElementById('i-date').valueAsDate = new Date();
    </script>
</body>
</html>
