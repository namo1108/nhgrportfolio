<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asset Intelligence Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        :root {
            --primary: #1a1f2c;
            --accent: #3b82f6;
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: #0f172a; 
            -webkit-tap-highlight-color: transparent;
            line-height: 1.5;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-gradient {
            background: linear-gradient(135deg, #1a1f2c 0%, #2d364d 100%);
            border-radius: 2rem;
        }

        .btn-navy { background-color: var(--primary); color: white; border-radius: 1rem; border: none; cursor: pointer; }
        .btn-navy:active { transform: scale(0.98); }

        .input-premium {
            width: 100%; padding: 0.875rem 1rem; border-radius: 1rem;
            border: 1.5px solid #e2e8f0; background: white;
            font-weight: 600; font-size: 0.95rem; transition: all 0.2s;
        }

        .spinner {
            width: 12px; height: 12px; border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #3b82f6; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        canvas { max-width: 100% !important; height: auto !important; }
    </style>
</head>
<body class="antialiased">

    <div class="max-w-6xl mx-auto p-4 md:p-8 lg:p-12 min-h-screen">
        
        <!-- Header -->
        <header class="main-gradient p-8 md:p-12 text-white shadow-2xl mb-8 relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-blue-500/20 text-blue-400 text-[10px] font-black rounded-full border border-blue-500/30 uppercase tracking-widest">Total Net Worth</span>
                        <div id="sync-indicator" class="flex items-center gap-1.5 text-[10px] font-bold text-slate-400 bg-black/20 px-2 py-1 rounded-lg">
                            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> SYNCED
                        </div>
                    </div>
                    <h1 id="display-total" class="text-4xl md:text-6xl font-black font-mono tracking-tighter italic">₩0</h1>
                </div>
                <div class="grid grid-cols-2 md:flex gap-4 md:gap-8 font-mono">
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center min-w-[120px]">
                        <p class="text-[10px] text-slate-500 mb-1 uppercase tracking-wider font-black">USD/KRW</p>
                        <p id="display-rate" class="text-lg font-bold text-blue-300">1,420.0</p>
                    </div>
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center min-w-[120px]">
                        <p class="text-[10px] text-slate-500 mb-1 uppercase tracking-wider font-black">Month Flow</p>
                        <p id="display-flow" class="text-lg font-bold text-emerald-400">+₩0</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="glass-card p-6 flex flex-col items-center">
                <h3 class="text-[10px] font-black text-slate-400 uppercase mb-4 self-start tracking-widest">Asset Allocation</h3>
                <div class="w-full max-w-[200px] aspect-square relative flex items-center justify-center">
                    <canvas id="assetChart"></canvas>
                </div>
            </div>
            <div class="glass-card p-6 flex flex-col items-center">
                <h3 class="text-[10px] font-black text-slate-400 uppercase mb-4 self-start tracking-widest">Monthly Cash Flow</h3>
                <div class="w-full h-full min-h-[180px] flex items-center">
                    <canvas id="flowChart"></canvas>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-[400px_1fr] gap-8">
            <!-- Form Side -->
            <aside class="space-y-6">
                <section id="form-card" class="glass-card p-6 md:p-8 shadow-xl lg:sticky lg:top-8 border-t-4 border-t-blue-500">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="form-title" class="text-xl font-black tracking-tight">📝 내역 입력</h2>
                        <div class="flex items-center bg-slate-100 rounded-xl p-1 font-mono text-xs font-black">
                            <button onclick="changeViewMonth(-1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition-all text-slate-400">◀</button>
                            <span id="month-label" class="px-3 min-w-[80px] text-center text-slate-700">2026. 04</span>
                            <button onclick="changeViewMonth(1)" class="w-8 h-8 flex items-center justify-center hover:bg-white rounded-lg transition-all text-slate-400">▶</button>
                        </div>
                    </div>

                    <div class="space-y-5">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="updateFormState('user_name', '남편')" id="user-h" class="py-3.5 font-black text-xs border-2 rounded-2xl transition-all">남편</button>
                            <button onclick="updateFormState('user_name', '아내')" id="user-w" class="py-3.5 font-black text-xs border-2 rounded-2xl transition-all">아내</button>
                        </div>

                        <div class="flex p-1 bg-slate-100 rounded-2xl">
                            <button onclick="updateFormState('type', '수입')" id="type-in" class="flex-1 py-3 rounded-xl font-black text-[11px] transition-all">수입 / 자산</button>
                            <button onclick="updateFormState('type', '지출')" id="type-out" class="flex-1 py-3 rounded-xl font-black text-[11px] transition-all">지출 내역</button>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Transaction Date</label>
                                <input type="date" id="f-date" class="input-premium">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-black text-slate-400 uppercase tracking-tighter flex justify-between">
                                    <span id="label-amount-text">Amount</span>
                                    <span id="currency-indicator" class="text-blue-500">KRW</span>
                                </label>
                                <input type="number" id="f-amount" placeholder="0" class="input-premium">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Category</label>
                            <select id="f-cat" onchange="handleCatChange()" class="input-premium appearance-none bg-slate-50"></select>
                        </div>

                        <div id="stock-section" class="hidden p-5 bg-blue-50/50 border border-blue-100 rounded-2xl space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-1.5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase">Ticker</label>
                                    <input type="text" id="f-ticker" placeholder="AAPL / 005930" class="input-premium text-xs uppercase font-mono">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase">Quantity</label>
                                    <input type="number" id="f-qty" placeholder="0.00" step="0.000001" class="input-premium text-xs font-mono">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Description</label>
                            <input type="text" id="f-desc" placeholder="메모를 입력하세요" class="input-premium">
                        </div>

                        <div class="pt-4 space-y-2">
                            <button id="btn-main-action" onclick="handleSubmit()" class="w-full py-5 btn-navy font-black text-base shadow-xl active:shadow-none transition-all">데이터 즉시 반영</button>
                            <div id="edit-actions" class="hidden grid grid-cols-2 gap-3">
                                <button onclick="exitEditMode()" class="py-4 bg-slate-200 text-slate-600 rounded-2xl font-black text-xs">취소</button>
                                <button onclick="handleDelete()" class="py-4 bg-rose-50 text-rose-500 border border-rose-100 rounded-2xl font-black text-xs">삭제</button>
                            </div>
                        </div>
                    </div>
                </section>
            </aside>

            <!-- List Side -->
            <main class="space-y-4">
                <div class="flex gap-2 overflow-x-auto no-scrollbar py-2 sticky top-0 z-20 bg-[#f8fafc]/80 backdrop-blur-md">
                    <button onclick="setFilter('all')" id="tab-all" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">ALL</button>
                    <button onclick="setFilter('asset')" id="tab-asset" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">ASSETS</button>
                    <button onclick="setFilter('income')" id="tab-income" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">INCOME</button>
                    <button onclick="setFilter('expense')" id="tab-expense" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">EXPENSE</button>
                </div>
                <div id="list-container" class="space-y-4 min-h-[500px]"></div>
            </main>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        let supabaseClient, records = [], filter = 'all', editId = null;
        let exchangeRate = 1420, priceMap = {}, viewDate = new Date();
        let assetChart = null, flowChart = null;
        
        const form = { user_name: '남편', type: '수입' };
        const categories = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '생활용품', '교통', '여가', '경조사', '의료', '통신', '보험', '기타'],
            '자산': ['보증금', '저축/예금', '적금', '주식 (해외)', '주식 (국내)', '연금/퇴직금', '청약']
        };

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SB_URL, SB_KEY);
            document.getElementById('f-date').valueAsDate = new Date();
            initForm();
            updateMonthUI();
            updateFormState('user_name', '남편');
            await fetchExchangeRate();
            await loadInitialData(); // 첫 로드만 대기
            
            document.getElementById('list-container').addEventListener('click', (e) => {
                const card = e.target.closest('[data-id]');
                if (card) enterEditMode(card.getAttribute('data-id'));
            });
        });

        async function fetchExchangeRate() {
            try {
                const res = await fetch(`https://open.er-api.com/v6/latest/USD`).then(r => r.json());
                if(res?.rates?.KRW) {
                    exchangeRate = res.rates.KRW;
                    document.getElementById('display-rate').innerText = exchangeRate.toLocaleString(undefined, {minimumFractionDigits:1});
                }
            } catch(e) {}
        }

        async function loadInitialData() {
            setSyncing(true);
            try {
                const { data } = await supabaseClient.from('account_v3').select('*').order('date', { ascending: false });
                if(data) {
                    records = data;
                    const tickers = [...new Set(records.filter(r => r.ticker).map(r => r.ticker.toUpperCase().trim()))];
                    if (tickers.length > 0) await Promise.all(tickers.map(t => fetchStockPrice(t)));
                    render();
                }
            } finally { setSyncing(false); }
        }

        async function fetchStockPrice(ticker) {
            if (!ticker || priceMap[ticker]) return;
            const originalTicker = ticker.toUpperCase().trim();
            const symbol = /^\d{6}$/.test(originalTicker) ? originalTicker + '.KS' : originalTicker;
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1m&range=1d`)}`);
                const json = await res.json();
                const meta = JSON.parse(json.contents)?.chart?.result?.[0]?.meta;
                if(meta?.regularMarketPrice) priceMap[originalTicker] = meta.regularMarketPrice;
            } catch (e) {}
        }

        function calculateValue(item) {
            const cat = item.category || "";
            const isStock = cat.includes("주식");
            const ticker = item.ticker ? item.ticker.toUpperCase().trim() : null;
            const qty = Number(item.qty) || 0;
            const isOverseas = cat.includes("해외");
            
            if (isStock && ticker && qty > 0 && priceMap[ticker]) {
                const unitPrice = isOverseas ? (priceMap[ticker] * exchangeRate) : priceMap[ticker];
                return unitPrice * qty;
            }
            const amt = Number(item.amount) || 0;
            if (isStock && qty > 0) return isOverseas ? (amt * qty * exchangeRate) : (amt * qty);
            return isOverseas ? (amt * exchangeRate) : amt;
        }

        function initCharts(assetData, flowIn, flowOut) {
            const assetCtx = document.getElementById('assetChart').getContext('2d');
            const flowCtx = document.getElementById('flowChart').getContext('2d');

            const commonOptions = {
                animation: { duration: 400 },
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            };

            if (assetChart) {
                assetChart.data.labels = Object.keys(assetData);
                assetChart.data.datasets[0].data = Object.values(assetData);
                assetChart.update();
            } else {
                assetChart = new Chart(assetCtx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(assetData),
                        datasets: [{
                            data: Object.values(assetData),
                            backgroundColor: ['#1e293b', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                            borderWidth: 0
                        }]
                    },
                    options: { ...commonOptions, cutout: '75%' }
                });
            }

            if (flowChart) {
                flowChart.data.datasets[0].data = [flowIn, flowOut];
                flowChart.update();
            } else {
                flowChart = new Chart(flowCtx, {
                    type: 'bar',
                    data: {
                        labels: ['INCOME', 'EXPENSE'],
                        datasets: [{
                            data: [flowIn, flowOut],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderRadius: 10,
                            barThickness: 35
                        }]
                    },
                    options: {
                        ...commonOptions,
                        scales: {
                            y: { display: false, beginAtZero: true },
                            x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' } } }
                        }
                    }
                });
            }
        }

        function render() {
            let totalWealth = 0, monthlyIn = 0, monthlyOut = 0;
            let assetDist = {};
            const curY = viewDate.getFullYear(), curM = viewDate.getMonth() + 1;

            records.forEach(r => {
                const val = calculateValue(r);
                const isAsset = ["보증금", "주식", "저축", "적금", "연금", "청약"].some(c => r.category?.includes(c));
                
                if (isAsset) {
                    totalWealth += val;
                    assetDist[r.category] = (assetDist[r.category] || 0) + val;
                } else {
                    if (r.type === '수입') totalWealth += val;
                    if (r.type === '지출') totalWealth -= val;
                }

                const d = r.date?.match(/\d+/g) || [];
                if(parseInt(d[0]) === curY && parseInt(d[1]) === curM) {
                    if(r.type === '수입') monthlyIn += val;
                    else if(r.type === '지출') monthlyOut += val;
                }
            });

            document.getElementById('display-total').innerText = '₩' + Math.round(totalWealth).toLocaleString();
            const flow = monthlyIn - monthlyOut;
            const flowEl = document.getElementById('display-flow');
            flowEl.innerText = (flow >= 0 ? '+₩' : '-₩') + Math.abs(flow).toLocaleString();
            flowEl.className = 'text-lg font-bold ' + (flow >= 0 ? 'text-emerald-400' : 'text-rose-400');

            initCharts(assetDist, monthlyIn, monthlyOut);

            const filtered = records.filter(r => {
                const d = r.date?.match(/\d+/g) || [];
                const isMonth = parseInt(d[0]) === curY && parseInt(d[1]) === curM;
                if(filter === 'all') return isMonth;
                if(filter === 'asset') return ["보증금", "주식", "저축", "적금", "연금", "청약"].some(c => r.category?.includes(c));
                return isMonth && r.type === (filter === 'income' ? '수입' : '지출');
            });

            document.getElementById('list-container').innerHTML = filtered.map(r => {
                const val = calculateValue(r);
                const ticker = r.ticker?.toUpperCase().trim();
                return `
                <div data-id="${r.id}" class="glass-card p-6 flex justify-between items-center cursor-pointer border-2 border-transparent hover:border-blue-200 active:scale-[0.99] transition-all">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-500 text-[9px] font-black uppercase tracking-tighter">${r.category}</span>
                            <span class="text-[10px] font-black text-blue-500 italic">${r.user_name}</span>
                        </div>
                        <p class="text-sm font-bold text-slate-800">${r.description || r.category}</p>
                        <p class="text-[9px] font-mono font-bold text-slate-400 uppercase tracking-tighter">
                            ${r.date || ''} ${ticker ? '• ' + ticker : ''} ${r.qty ? '• ' + r.qty + ' QTY' : ''}
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-base font-black font-mono ${r.type === '지출' ? 'text-rose-500' : 'text-emerald-500'}">
                            ₩${Math.round(val).toLocaleString()}
                        </p>
                        ${ticker && priceMap[ticker] ? '<span class="text-[7px] font-black text-blue-400 tracking-widest bg-blue-50 px-1 rounded">MKT LIVE</span>' : ''}
                    </div>
                </div>`;
            }).join('');
        }

        async function handleSubmit() {
            const rawDate = document.getElementById('f-date').value; 
            if(!rawDate) return alert("날짜를 선택하세요.");
            const d = rawDate.split('-');
            const formattedDate = `${d[0]}. ${d[1]}. ${d[2]}.`;

            const payload = {
                user_name: form.user_name,
                type: form.type,
                category: document.getElementById('f-cat').value,
                amount: Number(document.getElementById('f-amount').value) || 0,
                date: formattedDate,
                description: document.getElementById('f-desc').value || "",
                ticker: document.getElementById('f-ticker').value?.toUpperCase().trim() || null,
                qty: document.getElementById('f-qty').value !== "" ? Number(document.getElementById('f-qty').value) : null
            };

            // [Optimistic UI] 즉시 로컬 데이터 갱신
            const tempId = Date.now();
            if(editId) {
                const idx = records.findIndex(r => String(r.id) === String(editId));
                if(idx > -1) records[idx] = { ...payload, id: editId };
            } else {
                records.unshift({ ...payload, id: tempId });
            }
            
            render(); // 즉시 화면 업데이트 (총액, 차트, 리스트)
            const tickerToFetch = payload.ticker;
            exitEditMode();

            // 백그라운드 동기화
            setSyncing(true);
            try {
                let res = editId ? await supabaseClient.from('account_v3').update(payload).eq('id', editId) : await supabaseClient.from('account_v3').insert([payload]);
                if (res.error) throw res.error;
                if(tickerToFetch) await fetchStockPrice(tickerToFetch);
                // 최종 데이터 정합성을 위해 재로드 (조용히)
                const { data } = await supabaseClient.from('account_v3').select('*').order('date', { ascending: false });
                if(data) records = data;
                render();
            } catch (err) { 
                alert("동기화 중 오류가 발생했습니다. 다시 로드합니다.");
                loadInitialData();
            } finally { setSyncing(false); }
        }

        function handleCatChange() {
            const cat = document.getElementById('f-cat').value;
            const isStock = cat?.includes("주식"), isOverseas = cat?.includes("해외");
            document.getElementById('stock-section').classList.toggle('hidden', !isStock);
            document.getElementById('currency-indicator').innerText = isOverseas ? "USD" : "KRW";
            document.getElementById('label-amount-text').innerText = isStock ? "Price per share" : "Amount";
        }

        function updateFormState(key, val) {
            form[key] = val;
            if(key === 'user_name') {
                ['user-h', 'user-w'].forEach(id => {
                    const active = (id === 'user-h' && val === '남편') || (id === 'user-w' && val === '아내');
                    document.getElementById(id).className = 'py-3.5 font-black text-xs border-2 rounded-2xl transition-all ' + (active ? 'bg-[#1a1f2c] text-white border-[#1a1f2c]' : 'bg-white text-slate-300 border-slate-100');
                });
            } else {
                document.getElementById('type-in').className = 'flex-1 py-3 rounded-xl font-black text-[11px] transition-all ' + (val === '수입' ? 'bg-white text-[#1a1f2c] shadow-sm' : 'text-slate-400');
                document.getElementById('type-out').className = 'flex-1 py-3 rounded-xl font-black text-[11px] transition-all ' + (val === '지출' ? 'bg-white text-[#1a1f2c] shadow-sm' : 'text-slate-400');
                initForm();
            }
        }

        function initForm() {
            const list = form.type === '수입' ? [...categories.수입, ...categories.자산] : categories.지출;
            const catEl = document.getElementById('f-cat');
            catEl.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            handleCatChange();
        }

        function enterEditMode(id) {
            const item = records.find(r => String(r.id) === String(id));
            if(!item) return;
            editId = id;
            document.getElementById('form-title').innerText = "✏️ 내역 수정";
            document.getElementById('edit-actions').classList.remove('hidden');
            document.getElementById('f-amount').value = item.amount;
            document.getElementById('f-desc').value = item.description || '';
            document.getElementById('f-ticker').value = item.ticker || '';
            document.getElementById('f-qty').value = item.qty || '';
            if(item.date) {
                const cd = item.date.replace(/\s/g, '').split('.').filter(x => x).map(x => x.padStart(2,'0')).join('-');
                document.getElementById('f-date').value = cd.slice(0, 10);
            }
            updateFormState('user_name', item.user_name);
            document.getElementById('f-cat').value = item.category;
            handleCatChange();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exitEditMode() {
            editId = null;
            document.getElementById('form-title').innerText = "📝 내역 입력";
            document.getElementById('edit-actions').classList.add('hidden');
            ['f-amount', 'f-desc', 'f-ticker', 'f-qty'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('f-date').valueAsDate = new Date();
            initForm();
        }

        async function handleDelete() {
            if(!confirm("정말로 삭제하시겠습니까?")) return;
            const idToDelete = editId;
            // 낙관적 삭제
            records = records.filter(r => String(r.id) !== String(idToDelete));
            render();
            exitEditMode();

            setSyncing(true);
            try {
                await supabaseClient.from('account_v3').delete().eq('id', idToDelete);
            } catch (err) { loadInitialData(); } 
            finally { setSyncing(false); }
        }

        function setFilter(f) {
            filter = f;
            ['all','asset','income','expense'].forEach(x => {
                const btn = document.getElementById('tab-'+x);
                const active = f === x;
                btn.className = 'flex-none px-6 py-3 rounded-2xl text-[10px] font-black transition-all ' + (active ? 'bg-[#1a1f2c] text-white shadow-md' : 'bg-white text-slate-400 border border-slate-100');
            });
            render();
        }

        function changeViewMonth(delta) { 
            viewDate.setMonth(viewDate.getMonth() + delta); 
            updateMonthUI(); 
            render(); 
        }

        function updateMonthUI() { 
            document.getElementById('month-label').innerText = viewDate.getFullYear() + '. ' + String(viewDate.getMonth()+1).padStart(2,'0'); 
        }

        function setSyncing(b) { 
            const ind = document.getElementById('sync-indicator');
            ind.innerHTML = b ? '<div class="flex items-center gap-1"><div class="spinner"></div> SYNCING</div>' : '<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span> SYNCED'; 
        }
    </script>
</body>
</html>
