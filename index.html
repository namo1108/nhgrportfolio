<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NH&GR 가계부 - 통합 대시보드</title>
    <link rel="icon" href="https://fav.farm/💰">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #1e293b; letter-spacing: -0.025em; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.05); }
        .btn-active { background-color: #0f172a; color: white; border-color: #0f172a; }
        .font-mono { font-family: 'ui-monospace', monospace; }
        .spinner { width: 14px; height: 14px; border: 2px solid #f3f3f3; border-top: 2px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .bg-navy { background-color: #0f172a; }
    </style>
</head>
<body class="p-4 pb-24">
    <div class="max-w-xl mx-auto space-y-5">
        <!-- 상단 헤더 -->
        <header class="flex justify-between items-center px-1">
            <div>
                <h1 class="text-2xl font-extrabold flex items-center gap-2 tracking-tighter">
                    💰 NH&GR 가계부
                    <span id="loader" class="hidden"><span class="spinner"></span></span>
                </h1>
                <p id="last-update" class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Live Dashboard Initializing...</p>
            </div>
            <div class="bg-white px-4 py-2 rounded-2xl shadow-sm border flex items-center gap-4 font-bold text-sm">
                <button onclick="changeMonth(-1)" class="text-slate-400 hover:text-navy transition-colors">◀</button>
                <span id="month-display" class="w-16 text-center font-mono">2026.04</span>
                <button onclick="changeMonth(1)" class="text-slate-400 hover:text-navy transition-colors">▶</button>
            </div>
        </header>

        <!-- 이미지 디자인 복원: 4분할 자산 카드 -->
        <div class="grid grid-cols-2 gap-3">
            <!-- CASH 카드 -->
            <div class="card p-4 border-l-4 border-blue-500">
                <p class="text-[10px] text-slate-400 font-extrabold mb-1 tracking-widest">CASH</p>
                <p id="sum-avail" class="text-xl font-black font-mono">₩0</p>
            </div>
            <!-- SAVING 카드 -->
            <div class="card p-4 border-l-4 border-emerald-500">
                <p class="text-[10px] text-slate-400 font-extrabold mb-1 tracking-widest">SAVING</p>
                <p id="sum-save" class="text-xl font-black font-mono">₩0</p>
            </div>
            <!-- STOCKS 카드 -->
            <div class="card p-4 border-l-4 border-purple-500">
                <p class="text-[10px] text-slate-400 font-extrabold mb-1 tracking-widest flex justify-between">
                    STOCKS <span class="animate-pulse text-purple-400">●</span>
                </p>
                <p id="sum-stock" class="text-xl font-black font-mono">₩0</p>
            </div>
            <!-- FUTURE 카드 -->
            <div class="card p-4 border-l-4 border-amber-500">
                <p class="text-[10px] text-slate-400 font-extrabold mb-1 tracking-widest">FUTURE</p>
                <p id="sum-future" class="text-xl font-black font-mono">₩0</p>
            </div>
            
            <!-- TOTAL 통합 카드 (가로 전체) -->
            <div class="card p-6 col-span-2 bg-navy text-white flex flex-col items-center relative overflow-hidden shadow-xl">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-400 to-purple-400"></div>
                <p class="text-[11px] text-slate-400 font-black mb-1 tracking-[0.2em] uppercase">Total Asset Value</p>
                <p id="sum-total" class="text-3xl font-black font-mono text-white tracking-tighter">₩0</p>
                <div id="exchange-info" class="text-[9px] text-slate-500 mt-2 font-bold tracking-tight">Loading exchange rate...</div>
            </div>
        </div>

        <!-- 이미지 디자인 복원: 2분할 도넛 차트 -->
        <div class="grid grid-cols-2 gap-3">
            <div class="card p-4 h-44 flex flex-col items-center justify-center">
                <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Asset Ratio</p>
                <div class="relative w-full h-full max-h-[110px]">
                    <canvas id="chart-asset"></canvas>
                </div>
            </div>
            <div class="card p-4 h-44 flex flex-col items-center justify-center">
                <p class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Expenses</p>
                <div class="relative w-full h-full max-h-[110px]">
                    <canvas id="chart-expense"></canvas>
                </div>
            </div>
        </div>

        <!-- 입력 섹션 -->
        <section class="card p-5 space-y-4 border-2 border-dashed border-slate-200 bg-slate-50/50">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-black flex items-center gap-2">📝 내역 입력</h2>
                <div id="save-status" class="hidden text-[10px] text-blue-600 font-bold bg-blue-100 px-2 py-0.5 rounded-full">저장 중...</div>
            </div>
            
            <div class="flex gap-2">
                <button onclick="setUser('남편')" id="btn-user-h" class="flex-1 py-3 rounded-xl border-2 font-black text-xs btn-active transition-all">남편</button>
                <button onclick="setUser('아내')" id="btn-user-w" class="flex-1 py-3 rounded-xl border-2 font-black text-xs bg-white text-slate-400 border-slate-100 transition-all">아내</button>
            </div>

            <div class="flex gap-2 bg-white p-1 rounded-xl shadow-inner">
                <button onclick="setType('수입')" id="btn-type-in" class="flex-1 py-2 rounded-lg font-black text-xs btn-active transition-all">수입</button>
                <button onclick="setType('지출')" id="btn-type-out" class="flex-1 py-2 rounded-lg font-black text-xs text-slate-400">지출</button>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">Category</label>
                    <select id="category-select" onchange="checkCategory()" class="w-full p-3 rounded-xl border bg-white text-xs font-bold shadow-sm"></select>
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-slate-400 ml-1 uppercase">Amount</label>
                    <input type="number" id="input-amount" placeholder="0" class="w-full p-3 rounded-xl border text-xs font-bold shadow-sm">
                </div>
            </div>

            <div id="stock-fields" class="hidden grid grid-cols-2 gap-2 p-3 bg-white rounded-2xl border-2 border-purple-100 animate-fadeIn">
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-purple-400 ml-1">TICKER (ex: TSLA, 005930.KS)</label>
                    <input type="text" id="input-ticker" placeholder="AAPL" class="w-full p-3 rounded-xl border text-xs font-bold uppercase">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] font-black text-purple-400 ml-1">QTY (수량)</label>
                    <input type="number" id="input-qty" placeholder="0.0" step="0.0001" class="w-full p-3 rounded-xl border text-xs font-bold">
                </div>
            </div>

            <input type="text" id="input-desc" placeholder="메모 (선택사항)" class="w-full p-4 rounded-xl border text-xs font-bold shadow-sm">
            
            <button onclick="saveRecord()" class="w-full py-4 bg-navy text-white rounded-2xl font-black text-sm shadow-xl hover:bg-black active:scale-[0.98] transition-all">
                데이터 저장 및 실시간 갱신
            </button>
        </section>

        <!-- 탭 메뉴 -->
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar sticky top-0 bg-[#f1f5f9] z-10 py-2">
            <button onclick="setTab('all')" id="tab-all" class="px-5 py-2.5 rounded-xl text-xs font-black btn-active whitespace-nowrap shadow-sm">전체</button>
            <button onclick="setTab('asset')" id="tab-asset" class="px-5 py-2.5 rounded-xl text-xs font-black bg-white text-slate-400 border border-slate-100 whitespace-nowrap shadow-sm">자산</button>
            <button onclick="setTab('income')" id="tab-income" class="px-5 py-2.5 rounded-xl text-xs font-black bg-white text-slate-400 border border-slate-100 whitespace-nowrap shadow-sm">수입</button>
            <button onclick="setTab('expense')" id="tab-expense" class="px-5 py-2.5 rounded-xl text-xs font-black bg-white text-slate-400 border border-slate-100 whitespace-nowrap shadow-sm">지출</button>
        </div>

        <!-- 리스트 컨테이너 -->
        <div id="list-container" class="space-y-3 pb-12">
            <!-- 리스트 아이템 -->
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        let sb, allRecords = [], currentMonth = new Date(), currentTab = 'all';
        let exchangeRate = 1420, stockCache = {}, charts = {};
        
        let formData = { user: '남편', type: '수입' };
        const categories = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '생활용품', '교통', '문화/여가', '경조사', '교육', '의료', '보험', '통신', '기타'],
            '자산': ['저축/예금', '적금', '청약', '주식 (국내)', '주식 (해외)', '연금/퇴직금']
        };

        document.addEventListener('DOMContentLoaded', async () => {
            sb = supabase.createClient(SB_URL, SB_KEY);
            setType('수입');
            updateMonthDisplay();
            await refreshData();
            
            // 5분마다 주가 갱신
            setInterval(refreshData, 300000); 
        });

        async function refreshData() {
            document.getElementById('loader').classList.remove('hidden');
            await fetchExchangeRate();
            await fetchData();
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('last-update').innerText = `Updated: ${new Date().toLocaleTimeString()}`;
        }

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json());
                exchangeRate = res.rates.KRW;
                document.getElementById('exchange-info').innerText = `LIVE RATE: 1 USD = ${exchangeRate.toFixed(1)} KRW (Auto-synced)`;
            } catch(e) { console.error("Exchange fetch failed"); }
        }

        async function fetchData() {
            const { data, error } = await sb.from('account_v3').select('*').order('created_at', { ascending: false });
            if (data) {
                allRecords = data;
                const tickers = [...new Set(allRecords.filter(r => r.ticker).map(r => r.ticker))];
                await Promise.all(tickers.map(updateStockPrice));
                calculateAndRender();
            }
        }

        async function updateStockPrice(ticker) {
            if (!ticker) return;
            try {
                const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`)}`;
                const response = await fetch(proxy);
                const rawData = await response.json();
                const stockData = JSON.parse(rawData.contents);
                const price = stockData.chart.result[0].meta.regularMarketPrice;
                
                const isOverseas = !ticker.endsWith('.KS') && !ticker.endsWith('.KQ');
                stockCache[ticker] = isOverseas ? price * exchangeRate : price;
            } catch (e) { 
                if(!stockCache[ticker]) stockCache[ticker] = 0; 
            }
        }

        function calculateAndRender() {
            let sums = { avail: 0, stock: 0, save: 0, future: 0 };
            let expMap = {};

            allRecords.forEach(r => {
                let amt = parseFloat(r.amount) || 0;
                let isStock = r.category?.includes("주식") && r.ticker;
                
                if (isStock && stockCache[r.ticker]) {
                    amt = stockCache[r.ticker] * (parseFloat(r.qty) || 1);
                }

                const c = r.category || "";
                if (["월급", "기타", "상여금", "이자/배당"].includes(c) && r.type === "수입") sums.avail += amt;
                else if (c.includes("주식")) sums.stock += amt;
                else if (["저축/예금", "적금", "청약"].some(x => c.includes(x))) sums.save += amt;
                else if (c.includes("연금") || c.includes("퇴직")) sums.future += amt;

                if (r.type === "지출") {
                    expMap[c] = (expMap[c] || 0) + (parseFloat(r.amount) || 0);
                }
            });

            // 자산별 합계 텍스트 업데이트
            document.getElementById('sum-avail').innerText = `₩${Math.round(sums.avail).toLocaleString()}`;
            document.getElementById('sum-save').innerText = `₩${Math.round(sums.save).toLocaleString()}`;
            document.getElementById('sum-stock').innerText = `₩${Math.round(sums.stock).toLocaleString()}`;
            document.getElementById('sum-future').innerText = `₩${Math.round(sums.future).toLocaleString()}`;
            document.getElementById('sum-total').innerText = `₩${Math.round(sums.avail + sums.stock + sums.save + sums.future).toLocaleString()}`;
            
            updateCharts(sums, expMap);
            renderList();
        }

        function updateCharts(sums, expMap) {
            const chartConfig = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, cutout: '75%' };

            if (charts.asset) charts.asset.destroy();
            charts.asset = new Chart(document.getElementById('chart-asset'), {
                type: 'doughnut',
                data: { 
                    labels: ['Cash', 'Stocks', 'Saving', 'Future'], 
                    datasets: [{ data: [sums.avail, sums.stock, sums.save, sums.future], backgroundColor: ['#3b82f6', '#a855f7', '#10b981', '#f59e0b'], borderWidth: 0 }] 
                },
                options: chartConfig
            });

            if (charts.exp) charts.exp.destroy();
            const expLabels = Object.keys(expMap);
            charts.exp = new Chart(document.getElementById('chart-expense'), {
                type: 'doughnut',
                data: { 
                    labels: expLabels.length > 0 ? expLabels : ['지출 없음'], 
                    datasets: [{ 
                        data: expLabels.length > 0 ? Object.values(expMap) : [1], 
                        backgroundColor: expLabels.length > 0 ? ['#ef4444', '#f97316', '#facc15', '#4ade80', '#2dd4bf', '#38bdf8', '#818cf8', '#c084fc'] : ['#f1f5f9'], 
                        borderWidth: 0 
                    }] 
                },
                options: chartConfig
            });
        }

        function setUser(u) {
            formData.user = u;
            document.getElementById('btn-user-h').className = u==='남편' ? 'flex-1 py-3 rounded-xl border-2 font-black text-xs btn-active' : 'flex-1 py-3 rounded-xl border-2 font-black text-xs bg-white text-slate-400 border-slate-100 shadow-sm';
            document.getElementById('btn-user-w').className = u==='아내' ? 'flex-1 py-3 rounded-xl border-2 font-black text-xs btn-active' : 'flex-1 py-3 rounded-xl border-2 font-black text-xs bg-white text-slate-400 border-slate-100 shadow-sm';
        }

        function setType(t) {
            formData.type = t;
            document.getElementById('btn-type-in').className = t==='수입' ? 'flex-1 py-2 rounded-lg font-black text-xs btn-active shadow-sm' : 'flex-1 py-2 rounded-lg font-black text-xs text-slate-400';
            document.getElementById('btn-type-out').className = t==='지출' ? 'flex-1 py-2 rounded-lg font-black text-xs btn-active shadow-sm' : 'flex-1 py-2 rounded-lg font-black text-xs text-slate-400';
            
            const list = t === '수입' ? [...categories['수입'], ...categories['자산']] : categories['지출'];
            document.getElementById('category-select').innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            checkCategory();
        }

        function checkCategory() {
            const isStock = document.getElementById('category-select').value.includes("주식");
            document.getElementById('stock-fields').classList.toggle('hidden', !isStock);
        }

        async function saveRecord() {
            const category = document.getElementById('category-select').value;
            const amount = parseFloat(document.getElementById('input-amount').value) || 0;
            const ticker = document.getElementById('input-ticker').value.trim().toUpperCase();
            const qty = parseFloat(document.getElementById('input-qty').value) || 0;
            const description = document.getElementById('input-desc').value;

            if (amount <= 0 && !category.includes("주식")) return;

            document.getElementById('save-status').classList.remove('hidden');
            const { error } = await sb.from('account_v3').insert([{
                user_name: formData.user,
                type: formData.type,
                category,
                amount,
                ticker: ticker || null,
                qty: qty || null,
                description,
                date: `${currentMonth.getFullYear()}. ${String(currentMonth.getMonth()+1).padStart(2,'0')}. ${new Date().getDate()}`
            }]);
            
            if (!error) {
                document.getElementById('input-amount').value = '';
                document.getElementById('input-ticker').value = '';
                document.getElementById('input-qty').value = '';
                document.getElementById('input-desc').value = '';
                await refreshData();
            }
            document.getElementById('save-status').classList.add('hidden');
        }

        function renderList() {
            const container = document.getElementById('list-container');
            const filtered = allRecords.filter(r => {
                const parts = r.date.split('. ');
                const isMonth = parseInt(parts[0]) === currentMonth.getFullYear() && parseInt(parts[1]) === (currentMonth.getMonth() + 1);
                if (!isMonth) return false;
                
                if (currentTab === 'all') return true;
                if (currentTab === 'income') return r.type === '수입';
                if (currentTab === 'expense') return r.type === '지출';
                if (currentTab === 'asset') return ["저축","적금","청약","주식"].some(c => r.category.includes(c));
                return false;
            });

            if(filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-300 text-xs font-bold uppercase tracking-widest">No Records Found</div>`;
                return;
            }

            container.innerHTML = filtered.map(r => {
                let val = parseFloat(r.amount) || 0;
                let isStock = r.category.includes("주식") && r.ticker && stockCache[r.ticker];
                if (isStock) val = stockCache[r.ticker] * (parseFloat(r.qty) || 1);
                
                return `
                    <div class="card p-4 flex justify-between items-center active:scale-[0.98] transition-all">
                        <div class="flex flex-col">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[8px] font-black text-white bg-navy px-2 py-0.5 rounded-full uppercase tracking-tighter">${r.category}</span>
                                <span class="text-[9px] font-black text-blue-500">${r.user_name}</span>
                            </div>
                            <span class="font-bold text-sm text-slate-700">${r.description || r.category}</span>
                            <span class="text-[8px] text-slate-400 mt-1 font-mono">${r.date} ${r.ticker ? '· ' + r.ticker : ''}</span>
                        </div>
                        <div class="text-right">
                            <p class="font-mono font-black text-sm ${r.type==='수입' ? 'text-emerald-500' : 'text-rose-500'}">
                                ${r.type==='수입' ? '+' : '-'} ₩${Math.round(val).toLocaleString()}
                            </p>
                            ${isStock ? `<span class="text-[7px] text-blue-400 font-black bg-blue-50 px-1.5 py-0.5 rounded uppercase">Realtime</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function changeMonth(delta) {
            currentMonth.setMonth(currentMonth.getMonth() + delta);
            updateMonthDisplay();
            renderList();
        }

        function updateMonthDisplay() {
            document.getElementById('month-display').innerText = `${currentMonth.getFullYear()}.${String(currentMonth.getMonth() + 1).padStart(2, '0')}`;
        }

        function setTab(tab) {
            currentTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(b => {
                b.className = 'px-5 py-2.5 rounded-xl text-xs font-black bg-white text-slate-400 border border-slate-100 whitespace-nowrap shadow-sm';
            });
            document.getElementById(`tab-${tab}`).className = 'px-5 py-2.5 rounded-xl text-xs font-black btn-active whitespace-nowrap shadow-md';
            renderList();
        }
    </script>
</body>
</html>
