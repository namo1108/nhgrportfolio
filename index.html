<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 자산관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --accent: #6366f1; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #f8fafc; letter-spacing: -0.02em; }
        .glass-card { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-active { background: #6366f1 !important; color: white !important; box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39); }
        .stock-badge { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .gradient-text { background: linear-gradient(135deg, #fff 30%, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* 입력창 디자인 수정 */
        .form-input { 
            width: 100%; 
            padding: 1rem 1.25rem; 
            border-radius: 1rem; 
            font-size: 0.875rem; 
            font-weight: 600; 
            background: #f1f5f9 !important; 
            color: #1e293b !important; 
            border: 1px solid #e2e8f0 !important;
            transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: #6366f1 !important; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <!-- Header -->
    <header class="pt-12 pb-8 px-6 max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> TOTAL NET WORTH
                </p>
                <h1 class="text-5xl md:text-6xl font-black tracking-tight gradient-text mb-4" id="total-wealth">₩81,234,949</h1>
                <div class="flex items-center gap-2 text-slate-400 text-xs">
                    <div class="flex -space-x-1">
                        <div class="w-6 h-6 rounded-full bg-indigo-500 border border-slate-900 flex items-center justify-center text-[8px] font-bold">남</div>
                        <div class="w-6 h-6 rounded-full bg-rose-500 border border-slate-900 flex items-center justify-center text-[8px] font-bold">가</div>
                    </div>
                    <span>가족 멤버 (남호&가람)</span>
                </div>
            </div>
            
            <div class="flex gap-4">
                <div class="glass-card px-6 py-4 rounded-3xl min-w-[140px]">
                    <p class="text-[9px] font-bold text-slate-500 mb-1">이번달 지출</p>
                    <p class="text-lg font-black text-rose-400" id="monthly-expense">-₩417,400</p>
                </div>
                <div class="glass-card px-6 py-4 rounded-3xl min-w-[140px]">
                    <p class="text-[9px] font-bold text-slate-500 mb-1">환율 (USD)</p>
                    <p class="text-lg font-black text-emerald-400">₩1,481.5</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">
            <div class="glass-card rounded-[2rem] p-6 h-[250px]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase">Asset Allocation</h3>
                    <span id="top-asset-label" class="text-[10px] text-indigo-400 font-bold">주요 자산 비중</span>
                </div>
                <div class="h-[180px] flex items-center justify-center">
                    <canvas id="assetChart"></canvas>
                </div>
            </div>
            <div class="glass-card rounded-[2rem] p-6 h-[250px]">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase">Expense Trend</h3>
                </div>
                <div class="h-[180px]">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-10">
        <!-- Input Section -->
        <aside class="lg:col-span-4">
            <div class="bg-white text-slate-900 rounded-[2.5rem] p-8 sticky top-8 shadow-2xl">
                <h2 class="text-2xl font-black mb-8 flex justify-between items-center" id="form-title">
                    기록하기
                    <button onclick="resetForm()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm">↺</button>
                </h2>
                
                <div class="space-y-5">
                    <input type="hidden" id="edit-id">
                    <div class="flex p-1 bg-slate-100 rounded-2xl">
                        <button onclick="setWriter('남호')" id="w-namho" class="flex-1 py-3 text-xs font-black rounded-xl transition-all btn-active">남호</button>
                        <button onclick="setWriter('가람')" id="w-garam" class="flex-1 py-3 text-xs font-black rounded-xl transition-all text-slate-400">가람</button>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setType('asset')" id="t-asset" class="py-3 text-xs font-black rounded-xl border border-indigo-200 bg-indigo-50 text-indigo-600">자산/수입</button>
                        <button onclick="setType('expense')" id="t-expense" class="py-3 text-xs font-black rounded-xl border border-transparent bg-slate-50 text-slate-400">지출/소비</button>
                    </div>

                    <div class="space-y-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1">날짜</label>
                            <input type="date" id="i-date" class="form-input">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1">금액 (₩)</label>
                            <input type="number" id="i-amount" placeholder="0" class="form-input">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1">카테고리</label>
                            <select id="i-category" class="form-input appearance-none"></select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-slate-400 ml-1">항목 이름</label>
                            <input type="text" id="i-name" placeholder="내용을 입력하세요" class="form-input">
                        </div>
                    </div>
                    
                    <button id="save-btn" onclick="save()" class="w-full py-5 bg-slate-900 text-white font-black rounded-2xl hover:opacity-90 active:scale-95 transition-all shadow-lg">저장하기</button>
                </div>
            </div>
        </aside>

        <!-- Filter & List Section -->
        <section class="lg:col-span-8">
            <div class="flex p-1 bg-white/5 rounded-2xl w-fit mb-8 overflow-x-auto no-scrollbar">
                <button onclick="setFilter('all')" id="f-all" class="px-6 py-2.5 text-xs font-black rounded-xl transition-all btn-active whitespace-nowrap">전체 내역</button>
                <button onclick="setFilter('asset')" id="f-asset" class="px-6 py-2.5 text-xs font-black rounded-xl transition-all text-slate-500 whitespace-nowrap">자산</button>
                <button onclick="setFilter('income')" id="f-income" class="px-6 py-2.5 text-xs font-black rounded-xl transition-all text-slate-500 whitespace-nowrap">수입</button>
                <button onclick="setFilter('expense')" id="f-expense" class="px-6 py-2.5 text-xs font-black rounded-xl transition-all text-slate-500 whitespace-nowrap">지출</button>
            </div>
            
            <div id="main-list" class="space-y-3">
                <!-- 리스트 동적 생성 -->
            </div>
            
            <div id="empty-state" class="hidden py-40 text-center">
                <p class="text-slate-600 font-black">표시할 내역이 없습니다.</p>
            </div>
        </section>
    </main>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-8 py-4 bg-white text-slate-900 text-xs font-black rounded-full shadow-2xl opacity-0 transition-all z-[200] pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-v3';

        let user = null;
        let records = [];
        let curWriter = '남호';
        let curType = 'asset';
        let curFilter = 'all';
        let assetChart, expenseChart;

        // 초기 데이터 (이미지 기반 복구 데이터)
        const INITIAL_DATA = [
            { id: 'init-1', user: '남호', type: 'asset', category: '주식(국내)', name: 'KODEX200', amount: 2646000, date: '2026-04-24', ticker: '069500' },
            { id: 'init-2', user: '남호', type: 'asset', category: '주식(국내)', name: '삼성전자', amount: 6161591, date: '2026-04-24', ticker: '005930' },
            { id: 'init-3', user: '남호', type: 'asset', category: '연금/퇴직금', name: '퇴직연금', amount: 23548120, date: '2026-04-24' },
            { id: 'init-4', user: '가람', type: 'asset', category: '보증금', name: '아파트 전세보증금', amount: 45000000, date: '2026-04-24' },
            { id: 'init-5', user: '남호', type: 'income', category: '월급', name: '4월 정기급여', amount: 3800000, date: '2026-04-25' },
            { id: 'init-6', user: '가람', type: 'expense', category: '주거/통신', name: '관리비', amount: 251200, date: '2026-04-24' }
        ];

        const initAuth = async () => { await signInAnonymously(auth); };

        const startSync = (u) => {
            const q = collection(db, 'artifacts', appId, 'public', 'data', 'records');
            onSnapshot(q, (snap) => {
                const cloudData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                // 초기 데이터와 클라우드 데이터 병합
                const merged = [...INITIAL_DATA];
                cloudData.forEach(cd => {
                    const idx = merged.findIndex(m => m.id === cd.id);
                    if (idx > -1) merged[idx] = cd;
                    else merged.push(cd);
                });
                records = merged;
                render();
            }, (err) => { records = [...INITIAL_DATA]; render(); });
        };

        onAuthStateChanged(auth, (u) => {
            if (u) { user = u; startSync(u); }
            else initAuth();
        });

        window.setWriter = (w) => {
            curWriter = w;
            document.getElementById('w-namho').className = `flex-1 py-3 text-xs font-black rounded-xl transition-all ${w==='남호'?'btn-active':'text-slate-400'}`;
            document.getElementById('w-garam').className = `flex-1 py-3 text-xs font-black rounded-xl transition-all ${w==='가람'?'btn-active':'text-slate-400'}`;
        };

        window.setType = (t) => {
            curType = t;
            document.getElementById('t-asset').className = `py-3 text-xs font-black rounded-xl border ${t==='asset'?'border-indigo-200 bg-indigo-50 text-indigo-600':'border-transparent bg-slate-50 text-slate-400'}`;
            document.getElementById('t-expense').className = `py-3 text-xs font-black rounded-xl border ${t==='expense'?'border-rose-200 bg-rose-50 text-rose-600':'border-transparent bg-slate-50 text-slate-400'}`;
            
            const cats = {
                asset: ["주식(국내)", "주식(해외)", "현금", "연금/퇴직금", "청약", "보증금", "저축/예금", "월급", "기타수입"],
                expense: ["식비", "주거/통신", "쇼핑", "교통", "의료", "문화/생활", "기타"]
            };
            document.getElementById('i-category').innerHTML = cats[t].map(c => `<option value="${c}">${c}</option>`).join('');
        };

        window.setFilter = (f) => {
            curFilter = f;
            ['all', 'asset', 'income', 'expense'].forEach(id => {
                const el = document.getElementById('f-'+id);
                el.className = `px-6 py-2.5 text-xs font-black rounded-xl transition-all ${id===f?'btn-active':'text-slate-500'}`;
            });
            render();
        };

        window.save = async () => {
            if (!user) return;
            const cat = document.getElementById('i-category').value;
            const type = (cat === '월급' || cat === '기타수입') ? 'income' : curType;
            const amount = parseInt(document.getElementById('i-amount').value) || 0;
            const name = document.getElementById('i-name').value;
            const editId = document.getElementById('edit-id').value;

            if (!name || amount === 0) { showToast("내용과 금액을 입력해 주세요."); return; }

            const data = {
                user: curWriter,
                type: type,
                category: cat,
                date: document.getElementById('i-date').value || new Date().toISOString().split('T')[0],
                name: name,
                amount: amount,
                updatedAt: Date.now()
            };

            try {
                if (editId) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', editId), data, { merge: true });
                    showToast("수정되었습니다.");
                } else {
                    const newDoc = doc(collection(db, 'artifacts', appId, 'public', 'data', 'records'));
                    await setDoc(newDoc, data);
                    showToast("저장되었습니다.");
                }
                resetForm();
            } catch (e) { showToast("작업 실패"); }
        };

        window.editItem = (id) => {
            const item = records.find(r => r.id === id);
            if (!item) return;
            document.getElementById('form-title').innerText = "수정하기";
            document.getElementById('edit-id').value = item.id;
            document.getElementById('i-date').value = item.date;
            document.getElementById('i-amount').value = item.amount;
            document.getElementById('i-name').value = item.name;
            setWriter(item.user);
            setType(item.type === 'income' ? 'asset' : item.type);
            document.getElementById('i-category').value = item.category;
            document.getElementById('save-btn').innerText = "수정 완료";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteItem = async (id) => {
            if (!confirm("정말 삭제하시겠습니까?")) return;
            // 초기 데이터(init-)는 클라우드에 없으므로 클라이언트에만 표시되는 가상 데이터입니다. 
            // 실제 앱에서는 모든 데이터를 DB에서 관리하도록 설계해야 합니다.
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
                showToast("삭제되었습니다.");
            } catch (e) {
                // 초기 데이터 삭제 시 시각적 처리
                records = records.filter(r => r.id !== id);
                render();
                showToast("항목이 제거되었습니다.");
            }
        };

        window.resetForm = () => {
            document.getElementById('form-title').innerText = "기록하기";
            document.getElementById('edit-id').value = "";
            document.getElementById('i-amount').value = "";
            document.getElementById('i-name').value = "";
            document.getElementById('save-btn').innerText = "저장하기";
            document.getElementById('i-date').valueAsDate = new Date();
        };

        function render() {
            const filtered = records
                .filter(r => curFilter === 'all' || r.type === curFilter)
                .sort((a,b) => new Date(b.date) - new Date(a.date));

            let total = 0, mExp = 0, assetMap = {}, expTrend = {};
            const currentMonth = new Date().getMonth() + 1;

            const listEl = document.getElementById('main-list');
            if (filtered.length === 0) {
                listEl.innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
            } else {
                document.getElementById('empty-state').classList.add('hidden');
                listEl.innerHTML = filtered.map(r => {
                    const val = r.amount || 0;
                    if (r.type === 'asset') {
                        total += val;
                        assetMap[r.category] = (assetMap[r.category]||0) + val;
                    } else if (r.type === 'expense') {
                        mExp += val;
                        const m = parseInt(r.date.split('-')[1]);
                        expTrend[m] = (expTrend[m]||0) + val;
                    }

                    const typeColor = r.type === 'expense' ? 'text-rose-400' : (r.type === 'income' ? 'text-sky-400' : 'text-emerald-400');
                    const badgeClass = r.user === '남호' ? 'bg-indigo-500/20 text-indigo-400' : 'bg-rose-500/20 text-rose-400';

                    return `
                    <div class="glass-card p-5 rounded-[1.5rem] flex justify-between items-center group hover:bg-white/10 transition-all border-l-4 ${r.type==='expense'?'border-l-rose-500':'border-l-emerald-500'}">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-[10px] ${badgeClass}">
                                ${r.user}
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-0.5">
                                    <span class="text-[8px] font-bold px-1.5 py-0.5 bg-white/5 text-slate-500 rounded uppercase">${r.category}</span>
                                    <h4 class="font-bold text-sm text-white">${r.name}</h4>
                                </div>
                                <p class="text-[10px] text-slate-500 font-medium">${r.date}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <p class="font-black text-base ${typeColor}">
                                    ${r.type === 'expense' ? '-' : ''}₩${val.toLocaleString()}
                                </p>
                                <div class="flex gap-2 justify-end mt-1 opacity-0 group-hover:opacity-100 transition-all">
                                    <button onclick="editItem('${r.id}')" class="text-[9px] font-bold text-indigo-400 hover:underline">수정</button>
                                    <button onclick="deleteItem('${r.id}')" class="text-[9px] font-bold text-rose-400 hover:underline">삭제</button>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            }

            document.getElementById('total-wealth').innerText = '₩' + total.toLocaleString();
            document.getElementById('monthly-expense').innerText = '-₩' + mExp.toLocaleString();
            updateCharts(assetMap, expTrend);
        }

        function updateCharts(assetMap, expTrend) {
            const assetCtx = document.getElementById('assetChart');
            if (assetChart) assetChart.destroy();
            assetChart = new Chart(assetCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(assetMap),
                    datasets: [{
                        data: Object.values(assetMap),
                        backgroundColor: ['#6366f1', '#a855f7', '#ec4899', '#10b981', '#f59e0b', '#3b82f6'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, cutout: '80%', 
                    plugins: { legend: { display: false } } 
                }
            });

            const months = [11, 12, 1, 2, 3, 4];
            const expCtx = document.getElementById('expenseChart');
            if (expenseChart) expenseChart.destroy();
            expenseChart = new Chart(expCtx, {
                type: 'line',
                data: {
                    labels: months.map(m => m + '월'),
                    datasets: [{
                        data: months.map(m => expTrend[m] || 0),
                        borderColor: '#f43f5e',
                        backgroundColor: 'rgba(244, 63, 94, 0.1)',
                        fill: true, tension: 0.4, borderWidth: 3, pointRadius: 2
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { 
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10, weight: 'bold' } } }, 
                        y: { display: false } 
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function showToast(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 3000);
        }

        document.getElementById('i-date').valueAsDate = new Date();
        setType('asset');
        initAuth();
    </script>
</body>
</html>
