            <div class="lg:col-span-5 lg:sticky lg:top-8">

                                <select id="category-select" onchange="checkCategory()" class="w-full p-4 rounded-2xl border bg-white text-sm font-bold shadow-sm outline-none focus:ring-2 ring-blue-500/20"></select>

                                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">금액 (₩)</label>
                                <input type="number" id="input-amount" placeholder="0" class="w-full p-4 rounded-2xl border text-sm font-bold shadow-sm outline-none focus:ring-2 ring-blue-500/20">

                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[10px] font-black text-purple-500 uppercase ml-1">보유 수량</label>
                                    <input type="number" id="input-qty" placeholder="0.0" step="0.0001" class="w-full p-3 rounded-xl border-purple-200 text-sm font-bold outline-none focus:ring-2 ring-purple-400/20">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black text-slate-400 uppercase ml-1">메모</label>
                            <input type="text" id="input-desc" placeholder="상세 내용 입력" class="w-full p-4 rounded-2xl border text-sm font-bold shadow-sm outline-none focus:ring-2 ring-blue-500/20">

                    </div>

                    <div id="form-actions" class="flex flex-col gap-2">
                        <button id="btn-save" onclick="saveRecord()" class="w-full py-5 bg-[#0f172a] text-white rounded-2xl font-black text-sm shadow-xl shadow-slate-200 active:scale-[0.98] transition-all">
                            데이터 저장하기
                        </button>
                        <div id="edit-buttons" class="hidden flex gap-2">

                            <button onclick="deleteRecord()" class="flex-1 py-4 bg-rose-50 text-rose-500 rounded-2xl font-bold text-xs border border-rose-100 transition-all">삭제</button>

    <script>
        // Supabase 설정
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        let sb, allRecords = [], currentMonth = new Date(), currentTab = 'all';
        let exchangeRate = 1420, stockCache = {}, charts = {}, editingId = null;
        const BASE_DEPOSIT = 15800000;
        
        let formData = { user: '남편', type: '수입' };
        const categories = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '생활용품', '교통', '문화/여가', '경조사', '교육', '의료', '보험', '통신', '기타'],
            '자산': ['아파트 보증금', '저축/예금', '적금', '청약', '주식 (국내)', '주식 (해외)', '연금/퇴직금']
        };

        // 초기화
        window.onload = async () => {
            sb = supabase.createClient(SB_URL, SB_KEY);
            setType('수입');
            updateMonthDisplay();
            // 로딩 속도 최적화를 위해 환율/DB 로드를 병렬 실행 (최대 5초 이내 목표)
            await Promise.all([
                fetchExchangeRate(),
                refreshData()
            ]);
        };

        // 환율 정보 (초고속 API)
        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json());
                if(res?.rates?.KRW) {
                    exchangeRate = res.rates.KRW;
                    document.getElementById('rate-display').innerText = exchangeRate.toLocaleString(undefined, {minimumFractionDigits:1});
                }
            } catch(e) {}
        }

        // 주가 정보 최적화 (캐싱 활용)
        async function updateStockPrice(ticker) {
            if (!ticker || stockCache[ticker]) return; // 이미 이번 세션에 로드했다면 통과
            let ft = ticker.toUpperCase();
            if (/^\d{6}$/.test(ft)) ft += '.KS';
            const url = `https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + ft)}`;
            try {
                const res = await fetch(url).then(r => r.json());
                const data = JSON.parse(res.contents);
                const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
                if (price != null) {
                    const isKR = ft.includes('.KS') || ft.includes('.KQ');
                    stockCache[ticker] = isKR ? price : (price * exchangeRate);
                }
            } catch (e) {}
        }

        // 데이터 리프레시 로직 (5초 이내 완료 목표)
        async function refreshData() {
            document.getElementById('loader-icon').innerHTML = '<span class="spinner"></span>';
            document.getElementById('sync-status').innerText = "데이터 동기화 중...";
            
            try {
                const { data, error } = await sb.from('account_v3').select('*').order('created_at', { ascending: false });
                if (data) {
                    allRecords = data;
                    const tickers = [...new Set(allRecords.filter(r => r.ticker).map(r => r.ticker))];
                    // 주가 업데이트도 병렬로 실행하여 시간 단축
                    if (tickers.length > 0) {
                        await Promise.allSettled(tickers.map(updateStockPrice));
                    }
                    processAndRender();
                }
            } finally {
                document.getElementById('loader-icon').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                document.getElementById('sync-status').innerText = "실시간 동기화 완료";
                document.getElementById('time-display').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            }
        }

        function processAndRender() {
            let sums = { avail: BASE_DEPOSIT, stock: 0, save: 0, future: 0 };
            const viewY = currentMonth.getFullYear();
            const viewM = currentMonth.getMonth() + 1;

            allRecords.forEach(r => {
                const amt = Number(r.amount) || 0;
                const cat = (r.category || "").trim();
                const type = (r.type || "").trim();
                
                if (cat.includes("주식")) {
                    sums.stock += (r.ticker && stockCache[r.ticker]) ? (stockCache[r.ticker] * (r.qty || 0)) : amt;
                } else if (cat.includes("보증금") || (type === "수입" && ['월급','기타','상여금','이자/배당'].includes(cat))) {
                    sums.avail += amt;
                } else if (['저축','적금','청약'].some(k => cat.includes(k))) {
                    sums.save += amt;
                } else if (['연금','퇴직'].some(k => cat.includes(k))) {
                    sums.future += amt;
                }
            });

            document.getElementById('sum-avail').innerText = `₩${Math.round(sums.avail).toLocaleString()}`;
            document.getElementById('sum-save').innerText = `₩${Math.round(sums.save).toLocaleString()}`;
            document.getElementById('sum-stock').innerText = `₩${Math.round(sums.stock).toLocaleString()}`;
            document.getElementById('sum-future').innerText = `₩${Math.round(sums.future).toLocaleString()}`;
            document.getElementById('sum-total').innerText = `₩${Math.round(sums.avail + sums.stock + sums.save + sums.future).toLocaleString()}`;
            
            drawAssetChart(sums);
            renderList();
        }

        function drawAssetChart(sums) {
            const ctx = document.getElementById('chart-asset');
            if (charts.asset) charts.asset.destroy();
            charts.asset = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['현금','주식','예적금','미래'],
                    datasets: [{
                        data: [sums.avail, sums.stock, sums.save, sums.future],
                        backgroundColor: ['#3b82f6', '#a855f7', '#10b981', '#f59e0b'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { weight: 'bold', size: 10 } } } },
                    cutout: '75%'
                }
            });
        }

        // 수정 모드: 리스트 클릭 시 호출
        function editItem(id) {
            const item = allRecords.find(r => r.id === id);
            if (!item) return;

            editingId = id;
            document.getElementById('form-container').classList.add('edit-highlight');
            document.getElementById('form-title').innerText = "✏️ 내역 수정";
            document.getElementById('edit-indicator').classList.remove('hidden');
            document.getElementById('edit-buttons').classList.remove('hidden');
            document.getElementById('btn-save').innerText = "변경사항 저장하기";

            // 데이터 채우기
            setUser(item.user_name);
            setType(item.type);
            
            // 탭 변경/분류 로딩 대기 후 설정
            setTimeout(() => {
                document.getElementById('category-select').value = item.category;
                document.getElementById('input-amount').value = item.amount;
                document.getElementById('input-ticker').value = item.ticker || '';
                document.getElementById('input-qty').value = item.qty || '';
                document.getElementById('input-desc').value = item.description || '';
                checkCategory();
            }, 50);

            // 폼으로 스크롤 이동
            document.getElementById('form-container').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('form-container').classList.remove('edit-highlight');
            document.getElementById('form-title').innerText = "📝 내역 추가";
            document.getElementById('edit-indicator').classList.add('hidden');
            document.getElementById('edit-buttons').classList.add('hidden');
            document.getElementById('btn-save').innerText = "데이터 저장하기";
            
            // 폼 리셋
            document.getElementById('input-amount').value = '';
            document.getElementById('input-ticker').value = '';
            document.getElementById('input-qty').value = '';
            document.getElementById('input-desc').value = '';
        }

        async function saveRecord() {
            const cat = document.getElementById('category-select').value;
            const amt = Number(document.getElementById('input-amount').value) || 0;
            const tic = document.getElementById('input-ticker').value.trim().toUpperCase();
            const qty = Number(document.getElementById('input-qty').value) || 0;
            const dsc = document.getElementById('input-desc').value;
            
            if (amt === 0 && !editingId) return;

            const payload = {
                user_name: formData.user,
                type: formData.type,
                category: cat,
                amount: amt,
                ticker: tic || null,
                qty: qty || null,
                description: dsc
            };

            let result;
            if (editingId) {
                result = await sb.from('account_v3').update(payload).eq('id', editingId);
            } else {
                result = await sb.from('account_v3').insert([{
                    ...payload,
                    date: new Date().toLocaleDateString('ko-KR').replace(/\//g, '. ')
                }]);
            }

            if (!result.error) {
                cancelEdit();
                await refreshData();
            }
        }

        async function deleteRecord() {
            if (!editingId || !confirm("이 항목을 정말 삭제하시겠습니까?")) return;
            const { error } = await sb.from('account_v3').delete().eq('id', editingId);
            if (!error) {
                cancelEdit();
                await refreshData();
            }
        }

        function renderList() {
            const container = document.getElementById('list-container');
            const items = allRecords.filter(r => {
                if (!r.date) return false;
                const d = r.date.split('. ');
                const isM = parseInt(d[0]) === currentMonth.getFullYear() && parseInt(d[1]) === (currentMonth.getMonth()+1);
                
                if (currentTab === 'all') return isM;
                if (currentTab === 'income') return isM && r.type === '수입';
                if (currentTab === 'expense') return isM && r.type === '지출';
                if (currentTab === 'asset') return ["보증금","저축","적금","청약","주식","연금"].some(c => r.category?.includes(c));
                return false;
            });

            container.innerHTML = items.length ? items.map(r => {
                let v = Number(r.amount) || 0;
                const isS = r.category?.includes("주식") && r.ticker && stockCache[r.ticker];
                if (isS) v = stockCache[r.ticker] * (r.qty || 0);

                return `<div onclick="editItem(${r.id})" class="card p-5 flex justify-between items-center card-active cursor-pointer">
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[8px] font-black text-white bg-slate-800 px-1.5 py-0.5 rounded-md uppercase">${r.category}</span>
                            <span class="text-[9px] font-bold text-blue-500">${r.user_name}</span>
                        </div>
                        <span class="font-bold text-sm text-slate-800">${r.description || r.category}</span>
                        <span class="text-[8px] text-slate-400 font-mono">${r.date} ${r.ticker ? '· ' + r.ticker : ''}</span>
                    </div>
                    <div class="text-right">
                        <p class="font-mono font-black text-sm ${r.type==='지출' ? 'text-rose-500' : 'text-emerald-500'}">
                            ${r.type==='지출' ? '-' : '+'} ₩${Math.round(v).toLocaleString()}
                        </p>
                        ${isS ? '<span class="text-[7px] text-purple-400 font-bold uppercase">Live Eval</span>' : ''}
                    </div>
                </div>`;
            }).join('') : '<div class="col-span-full py-12 text-center text-slate-300 font-black text-[10px] uppercase tracking-widest">데이터가 없습니다</div>';
        }

        // UI Helpers
        function setUser(u) {
            formData.user = u;
            document.getElementById('btn-user-h').className = u==='남편' ? 'py-4 rounded-2xl border-2 font-black text-xs btn-navy transition-all' : 'py-4 rounded-2xl border-2 font-black text-xs bg-white text-slate-400 border-slate-100 transition-all';
            document.getElementById('btn-user-w').className = u==='아내' ? 'py-4 rounded-2xl border-2 font-black text-xs btn-navy transition-all' : 'py-4 rounded-2xl border-2 font-black text-xs bg-white text-slate-400 border-slate-100 transition-all';
        }

        function setType(t) {
            formData.type = t;
            document.getElementById('btn-type-in').className = t==='수입' ? 'flex-1 py-3 rounded-xl font-black text-xs btn-navy' : 'flex-1 py-3 rounded-xl font-black text-xs text-slate-400';
            document.getElementById('btn-type-out').className = t==='지출' ? 'flex-1 py-3 rounded-xl font-black text-xs btn-navy' : 'flex-1 py-3 rounded-xl font-black text-xs text-slate-400';
            const opts = t === '수입' ? [...categories['수입'], ...categories['자산']] : categories['지출'];
            document.getElementById('category-select').innerHTML = opts.map(o => `<option value="${o}">${o}</option>`).join('');
            checkCategory();
        }

        function checkCategory() {
            const isS = document.getElementById('category-select').value.includes("주식");
            document.getElementById('stock-fields').classList.toggle('hidden', !isS);
        }
        
        function changeMonth(d) { 
            currentMonth.setMonth(currentMonth.getMonth() + d); 
            updateMonthDisplay(); 
            processAndRender(); 
        }
        
        function updateMonthDisplay() { 
            document.getElementById('month-display').innerText = currentMonth.getFullYear() + "." + String(currentMonth.getMonth()+1).padStart(2,'0'); 
        }
        
        function setTab(t) {
            currentTab = t;
            document.querySelectorAll('[id^="tab-"]').forEach(b => b.className = 'px-5 py-2.5 rounded-xl text-xs font-black bg-white text-slate-400 border border-slate-200 shadow-sm transition-all whitespace-nowrap');
            document.getElementById('tab-' + t).className = 'px-5 py-2.5 rounded-xl text-xs font-black btn-navy shadow-lg shadow-slate-200 transition-all whitespace-nowrap';
            renderList();
        }
    </script>
</body>
</html>
