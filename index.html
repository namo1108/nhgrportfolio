<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f121a; color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: #1a1f2e; border: 1px solid rgba(255, 255, 255, 0.05); }
        input, select { outline: none; transition: all 0.2s; }
        input:focus { border-color: #6366f1 !important; }
        .toggle-btn.active { background-color: #6366f1; color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- 상단 대시보드 -->
        <header class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
            <div class="bg-gradient-to-br from-indigo-600 to-violet-700 p-6 rounded-[32px] shadow-2xl">
                <p class="text-indigo-100 text-[10px] font-bold uppercase tracking-widest mb-1">총 자산</p>
                <h2 class="text-3xl font-black text-white" id="stat-total">₩0</h2>
            </div>
            <div class="glass-card p-6 rounded-[32px]">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-1">이번달 수입</p>
                <h2 class="text-2xl font-bold text-emerald-400" id="stat-income">₩0</h2>
            </div>
            <div class="glass-card p-6 rounded-[32px]">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-1">이번달 지출</p>
                <h2 class="text-2xl font-bold text-rose-400" id="stat-expense">₩0</h2>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 입력 섹션 -->
            <div class="lg:col-span-5">
                <div class="bg-white text-slate-900 p-8 rounded-[40px] shadow-2xl sticky top-8">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-2xl font-black">내역 추가</h3>
                        <button onclick="resetForm()" class="text-slate-400 text-xs flex items-center gap-1 hover:text-indigo-500 transition-colors">
                            <i data-lucide="rotate-ccw" class="w-3 h-3"></i> 초기화
                        </button>
                    </div>

                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2 uppercase">작성자</label>
                                <div class="flex bg-slate-100 p-1 rounded-2xl">
                                    <button onclick="setWriter('남호')" id="btn-namho" class="toggle-btn active flex-1 py-2 rounded-xl text-sm font-bold">남호</button>
                                    <button onclick="setWriter('가람')" id="btn-garam" class="toggle-btn flex-1 py-2 rounded-xl text-sm font-bold text-slate-400">가람</button>
                                </div>
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2 uppercase">유형</label>
                                <div class="flex bg-slate-100 p-1 rounded-2xl">
                                    <button onclick="setType('asset')" id="btn-asset" class="toggle-btn active flex-1 py-2 rounded-xl text-sm font-bold">자산</button>
                                    <button onclick="setType('flow')" id="btn-flow" class="toggle-btn flex-1 py-2 rounded-xl text-sm font-bold text-slate-400">흐름</button>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-slate-400 block mb-2">카테고리</label>
                            <select id="field-category" onchange="toggleStockView()" class="w-full bg-slate-100 border-none rounded-2xl p-3.5 font-bold text-slate-700">
                                <!-- JS에서 옵션 생성 -->
                            </select>
                        </div>

                        <!-- 주식 전용 섹션 -->
                        <div id="stock-section" class="hidden bg-indigo-50 p-5 rounded-3xl border border-indigo-100 space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[10px] font-bold text-indigo-400 block mb-1">티커/종목</label>
                                    <input type="text" id="field-ticker" placeholder="예: AAPL" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-indigo-400 block mb-1">수량</label>
                                    <input type="number" id="field-qty" oninput="calcStock()" placeholder="0" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-indigo-400 block mb-1">현재가 (KRW)</label>
                                <input type="number" id="field-price" oninput="calcStock()" placeholder="0" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm">
                            </div>
                            <div class="pt-2 border-t border-indigo-100">
                                <p class="text-[10px] font-bold text-slate-400 mb-1">평가액 합계</p>
                                <p class="text-2xl font-black text-indigo-600" id="display-calc">₩0</p>
                            </div>
                        </div>

                        <div id="amount-section">
                            <label class="text-[11px] font-bold text-slate-400 block mb-2">금액 (₩)</label>
                            <input type="number" id="field-amount" class="w-full bg-slate-100 border-none rounded-2xl p-4 text-2xl font-black outline-none" placeholder="0">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2">날짜</label>
                                <input type="date" id="field-date" class="w-full bg-slate-100 border-none rounded-xl p-3 text-xs">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2">메모</label>
                                <input type="text" id="field-memo" placeholder="상세내용" class="w-full bg-slate-100 border-none rounded-xl p-3 text-xs">
                            </div>
                        </div>

                        <button onclick="saveRecord()" class="w-full py-5 bg-[#141824] hover:bg-black text-white font-black rounded-2xl shadow-xl transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i> 저장하기
                        </button>
                    </div>
                </div>
            </div>

            <!-- 리스트 섹션 -->
            <div class="lg:col-span-7">
                <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
                    <button onclick="setFilter('all')" class="filter-btn px-5 py-2 rounded-xl text-sm font-bold border border-indigo-500 bg-indigo-500 text-white" id="f-all">전체내역</button>
                    <button onclick="setFilter('asset')" class="filter-btn px-5 py-2 rounded-xl text-sm font-bold border border-slate-800 bg-[#1a1f2e] text-slate-500" id="f-asset">자산현황</button>
                    <button onclick="setFilter('income')" class="filter-btn px-5 py-2 rounded-xl text-sm font-bold border border-slate-800 bg-[#1a1f2e] text-slate-500" id="f-income">수입내역</button>
                    <button onclick="setFilter('expense')" class="filter-btn px-5 py-2 rounded-xl text-sm font-bold border border-slate-800 bg-[#1a1f2e] text-slate-500" id="f-expense">지출내역</button>
                </div>

                <div id="record-list" class="space-y-4">
                    <!-- JS에서 렌더링 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // [중요] 외부 배포 시 캔버스 밖에서는 __firebase_config가 없으므로 아래에 실제 설정을 넣으세요.
        let firebaseConfig = {};
        try {
            firebaseConfig = JSON.parse(__firebase_config);
        } catch(e) {
            console.error("Firebase config not found. Please set it manually for external use.");
        }

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-v2-html';

        // 전역 상태
        let records = [];
        let state = {
            writer: '남호',
            type: 'asset',
            filter: 'all'
        };

        const categories = {
            asset: ['주식(국내)', '주식(해외)', '코인', '예적금', '보험', '현금', '기타'],
            flow: ['수입(급여)', '수입(기타)', '지출(생활비)', '지출(식비)', '지출(교통)', '지출(쇼핑)', '지출(기타)']
        };

        // 초기화
        window.onload = async () => {
            lucide.createIcons();
            document.getElementById('field-date').value = new Date().toISOString().split('T')[0];
            updateCategoryUI();

            // 인증 (RULE 3)
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) { console.error("Auth Fail", e); }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // 데이터 구독 (RULE 1, 2)
                    const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'records'));
                    onSnapshot(q, (snapshot) => {
                        records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        render();
                    });
                }
            });
        };

        // UI 유틸리티
        window.setWriter = (name) => {
            state.writer = name;
            document.getElementById('btn-namho').className = `toggle-btn flex-1 py-2 rounded-xl text-sm font-bold ${name === '남호' ? 'active' : 'text-slate-400'}`;
            document.getElementById('btn-garam').className = `toggle-btn flex-1 py-2 rounded-xl text-sm font-bold ${name === '가람' ? 'active' : 'text-slate-400'}`;
        };

        window.setType = (type) => {
            state.type = type;
            document.getElementById('btn-asset').className = `toggle-btn flex-1 py-2 rounded-xl text-sm font-bold ${type === 'asset' ? 'active' : 'text-slate-400'}`;
            document.getElementById('btn-flow').className = `toggle-btn flex-1 py-2 rounded-xl text-sm font-bold ${type === 'flow' ? 'active' : 'text-slate-400'}`;
            updateCategoryUI();
        };

        window.updateCategoryUI = () => {
            const select = document.getElementById('field-category');
            const list = state.type === 'asset' ? categories.asset : categories.flow;
            select.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStockView();
        };

        window.toggleStockView = () => {
            const cat = document.getElementById('field-category').value;
            const isStock = cat.includes('주식') || cat.includes('코인');
            document.getElementById('stock-section').classList.toggle('hidden', !isStock);
            document.getElementById('amount-section').classList.toggle('hidden', isStock);
        };

        window.calcStock = () => {
            const qty = Number(document.getElementById('field-qty').value) || 0;
            const price = Number(document.getElementById('field-price').value) || 0;
            document.getElementById('display-calc').innerText = `₩${(qty * price).toLocaleString()}`;
        };

        window.resetForm = () => {
            document.getElementById('field-ticker').value = '';
            document.getElementById('field-qty').value = '';
            document.getElementById('field-price').value = '';
            document.getElementById('field-amount').value = '';
            document.getElementById('field-memo').value = '';
            document.getElementById('display-calc').innerText = '₩0';
        };

        // 데이터 처리
        window.saveRecord = async () => {
            const cat = document.getElementById('field-category').value;
            const isStock = cat.includes('주식') || cat.includes('코인');
            let amount = isStock ? (Number(document.getElementById('field-qty').value) * Number(document.getElementById('field-price').value)) : Number(document.getElementById('field-amount').value);

            if (!amount) return alert("금액을 확인하세요.");

            const data = {
                writer: state.writer,
                type: cat.includes('수입') ? 'income' : (cat.includes('지출') ? 'expense' : 'asset'),
                category: cat,
                ticker: document.getElementById('field-ticker').value,
                quantity: document.getElementById('field-qty').value,
                price: document.getElementById('field-price').value,
                amount: amount,
                memo: document.getElementById('field-memo').value,
                date: document.getElementById('field-date').value,
                updatedAt: serverTimestamp()
            };

            const docId = `rec_${Date.now()}`;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', docId), data);
                resetForm();
            } catch (e) { alert("저장 중 오류가 발생했습니다."); }
        };

        window.deleteRecord = async (id) => {
            if (confirm("삭제하시겠습니까?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
            }
        };

        window.setFilter = (f) => {
            state.filter = f;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-500', 'text-white', 'border-indigo-500');
                btn.classList.add('bg-[#1a1f2e]', 'text-slate-500', 'border-slate-800');
            });
            const active = document.getElementById(`f-${f}`);
            active.classList.remove('bg-[#1a1f2e]', 'text-slate-500', 'border-slate-800');
            active.classList.add('bg-indigo-500', 'text-white', 'border-indigo-500');
            render();
        };

        function render() {
            const listEl = document.getElementById('record-list');
            const thisMonth = new Date().toISOString().slice(0, 7);

            let total = 0, inc = 0, exp = 0;
            
            // 데이터 가공 및 정렬
            const sorted = records.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sorted.forEach(r => {
                const amt = Number(r.amount) || 0;
                if (r.type === 'asset') total += amt;
                else if (r.date.startsWith(thisMonth)) {
                    if (r.type === 'income') inc += amt;
                    if (r.type === 'expense') exp += amt;
                }
            });

            document.getElementById('stat-total').innerText = `₩${total.toLocaleString()}`;
            document.getElementById('stat-income').innerText = `₩${inc.toLocaleString()}`;
            document.getElementById('stat-expense').innerText = `₩${exp.toLocaleString()}`;

            const filtered = sorted.filter(r => state.filter === 'all' || r.type === state.filter);

            listEl.innerHTML = filtered.map(r => `
                <div class="glass-card p-5 rounded-[24px] flex justify-between items-center group transition-all hover:border-slate-600">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-[11px] ${r.writer === '남호' ? 'bg-blue-500/10 text-blue-400' : 'bg-purple-500/10 text-purple-400'}">
                            ${r.writer}
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[9px] font-black px-1.5 py-0.5 bg-slate-800 text-slate-500 rounded uppercase tracking-tighter">${r.category}</span>
                                <span class="text-[9px] text-slate-600 font-bold">${r.date}</span>
                            </div>
                            <h4 class="font-bold text-slate-300 text-sm">
                                ${r.ticker ? `<span class="text-indigo-400">[${r.ticker}]</span> ` : ''}${r.memo || '내역 없음'}
                                ${r.quantity ? `<span class="text-slate-600 text-xs font-medium ml-1">(${r.quantity}주)</span>` : ''}
                            </h4>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="text-lg font-black ${r.type === 'expense' ? 'text-rose-400' : (r.type === 'income' ? 'text-emerald-400' : 'text-white')}">
                            ${r.type === 'expense' ? '-' : ''}₩${Number(r.amount).toLocaleString()}
                        </p>
                        <button onclick="deleteRecord('${r.id}')" class="opacity-0 group-hover:opacity-100 p-2 text-slate-700 hover:text-rose-500 transition-all">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('') || '<div class="text-center py-20 text-slate-700 font-bold">내역이 없습니다.</div>';
            
            lucide.createIcons();
        }
    </script>
</body>
</html>
