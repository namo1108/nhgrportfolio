<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NH&GR 가계부</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; letter-spacing: -0.025em; padding: 1rem; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); padding: 1.25rem; }
        .grid { display: grid; gap: 1rem; }
        .btn-active { background-color: #0f172a !important; color: white !important; }
        .spinner { width: 14px; height: 14px; border: 2px solid #f3f3f3; border-top: 2px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body onload="init()">
    <div class="max-w-7xl mx-auto">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="font-size: 1.5rem; font-weight: 800;">💰 NH&GR 가계부 <span id="sync-status" class="hidden"><span class="spinner"></span></span></h1>
            <div style="font-weight: bold; background: white; padding: 0.5rem 1rem; border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                <button onclick="changeMonth(-1)">◀</button>
                <span id="month-display" style="margin: 0 10px;">2026.04</span>
                <button onclick="changeMonth(1)">▶</button>
            </div>
        </header>

        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 2rem;">
            <div class="card" style="border-top: 4px solid #3b82f6;">
                <p style="font-size: 10px; color: #64748b; font-weight: bold; margin-bottom: 5px;">CASH</p>
                <p id="sum-avail" style="font-size: 1.125rem; font-weight: 900;">₩0</p>
            </div>
            <div class="card" style="border-top: 4px solid #8b5cf6;">
                <p style="font-size: 10px; color: #64748b; font-weight: bold; margin-bottom: 5px;">STOCKS (실시간)</p>
                <p id="sum-stock" style="font-size: 1.125rem; font-weight: 900;">₩0</p>
            </div>
            <div class="card" style="background: #0f172a; color: white;">
                <p style="font-size: 10px; color: #94a3b8; font-weight: bold; text-align: center; margin-bottom: 5px;">TOTAL</p>
                <p id="sum-total" style="font-size: 1.25rem; font-weight: 900; color: #34d399; text-align: center;">₩0</p>
            </div>
        </div>

        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 2rem;">
            <div class="card" style="height: 200px;"><canvas id="assetRatioChart"></canvas></div>
            <div class="card" style="height: 200px;"><canvas id="expenseChart"></canvas></div>
        </div>

        <div id="list" class="grid" style="gap: 0.75rem;">
            <p style="text-align: center; color: #64748b;">데이터를 불러오는 중...</p>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let allRecords = [], currentMonth = new Date(), exchangeRate = 1400, stockCache = {}, charts = {};

        async function init() {
            await fetchExchangeRate();
            await fetchData();
        }

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD').then(r => r.json());
                exchangeRate = res.rates.KRW;
            } catch(e) { console.error("환율 로드 실패"); }
        }

        async function fetchData() {
            document.getElementById('sync-status').classList.remove('hidden');
            const { data } = await sb.from('account_v3').select('*').order('created_at', { ascending: false });
            if (data) {
                allRecords = data;
                const tickers = [...new Set(allRecords.filter(r => r.ticker).map(r => r.ticker))];
                await Promise.all(tickers.map(updateStockCache));
                calculateAndRender();
            }
            document.getElementById('sync-status').classList.add('hidden');
        }

        async function updateStockCache(ticker) {
            if (stockCache[ticker]) return;
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`)}`).then(r => r.json());
                let price = JSON.parse(res.contents).chart.result[0].meta.regularMarketPrice;
                // 해외 주식 원화 환산 로직
                if (!ticker.includes('.KS') && !ticker.includes('.KQ')) price *= exchangeRate;
                stockCache[ticker] = price;
            } catch (e) { stockCache[ticker] = 0; }
        }

        function calculateAndRender() {
            let sums = { avail: 0, save: 0, stock: 0, future: 0 };
            let expByCat = {};
            
            allRecords.forEach(r => {
                let val = r.amount;
                if (r.category.includes("주식") && r.ticker && stockCache[r.ticker]) {
                    val = stockCache[r.ticker] * (r.qty || 1); // 당일 종가 반영
                }

                if (["월급", "기타"].includes(r.category) && r.type === "수입") sums.avail += val;
                else if (r.category.includes("주식")) sums.stock += val;
                else if (["저축/예금", "적금", "청약"].includes(r.category)) sums.save += val;
                else sums.future += val;

                if (r.type === "지출") {
                    const cat = r.category.split(' (')[0];
                    expByCat[cat] = (expByCat[cat] || 0) + val;
                }
            });

            document.getElementById('sum-avail').innerText = `₩${Math.round(sums.avail).toLocaleString()}`;
            document.getElementById('sum-stock').innerText = `₩${Math.round(sums.stock).toLocaleString()}`;
            document.getElementById('sum-total').innerText = `₩${Math.round(sums.avail + sums.save + sums.stock + sums.future).toLocaleString()}`;
            
            updateCharts(sums, expByCat);
            renderList();
        }

        function updateCharts(sums, expCat) {
            const ctx1 = document.getElementById('assetRatioChart').getContext('2d');
            if (charts.asset) charts.asset.destroy();
            charts.asset = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['현금', '예금', '주식', '미래'],
                    datasets: [{
                        data: [sums.avail, sums.save, sums.stock, sums.future],
                        backgroundColor: ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
            // 지출 구조 차트도 동일한 방식으로 업데이트
        }

        function renderList() {
            const list = document.getElementById('list');
            const filtered = allRecords.filter(r => {
                const d = r.date.split('. ');
                return parseInt(d[0]) === currentMonth.getFullYear() && parseInt(d[1]) === (currentMonth.getMonth() + 1);
            });

            list.innerHTML = filtered.map(r => {
                let displayVal = r.amount;
                if (r.category.includes("주식") && r.ticker && stockCache[r.ticker]) {
                    displayVal = stockCache[r.ticker] * (r.qty || 1);
                }
                return `
                    <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <p style="font-weight: bold; font-size: 0.875rem;">${r.description || r.category}</p>
                            <p style="font-size: 10px; color: #64748b;">${r.ticker || r.category}</p>
                        </div>
                        <p style="font-weight: 900; color: ${r.type === '수입' ? '#10b981' : '#ef4444'}">
                            ${r.type === '수입' ? '+' : '-'} ${Math.round(displayVal).toLocaleString()}
                        </p>
                    </div>
                `;
            }).join('');
        }

        function changeMonth(val) {
            currentMonth.setMonth(currentMonth.getMonth() + val);
            document.getElementById('month-display').innerText = `${currentMonth.getFullYear()}.${String(currentMonth.getMonth() + 1).padStart(2, '0')}`;
            calculateAndRender();
        }
    </script>
</body>
</html>
