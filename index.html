<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남호가람 스마트 가계부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        * { font-family: 'Pretendard', sans-serif; }
        body { background-color: #0b0e14; color: #f8fafc; margin: 0; min-height: 100vh; }
        .glass-card { background: #161a23; border: 1px solid rgba(255,255,255,0.05); }
        .tab-active { background-color: #6366f1 !important; color: white !important; }
        input, select, textarea { background-color: #f1f5f9 !important; color: #1e293b !important; font-family: 'Pretendard', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        @media (max-width: 1023px) { .del-btn { opacity: 1 !important; } }
        .stock-panel { display: none; }
        .stock-panel.show { display: block; }
        .price-badge { display: inline-flex; align-items: center; gap: 4px; background: #1e3a5f; color: #60a5fa; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 999px; }
        @keyframes pulse-anim { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .fetching { animation: pulse-anim 1s infinite; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
        .fade-in { animation: fadeIn 0.35s ease forwards; }

        /* ── 로그인 화면 ── */
        #login-screen {
            position: fixed; inset: 0; z-index: 100;
            background: #0b0e14;
            display: flex; align-items: center; justify-content: center;
        }
        #login-screen.hidden { display: none; }

        /* ── 온보딩 화면 ── */
        #onboarding-screen {
            position: fixed; inset: 0; z-index: 99;
            background: #0b0e14; overflow-y: auto;
            display: flex; align-items: flex-start; justify-content: center;
            padding: 40px 16px;
        }
        #onboarding-screen.hidden { display: none; }

        /* ── 수정 모달 ── */
        #edit-modal {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            padding: 16px;
        }
        #edit-modal.hidden { display: none; }
        #edit-modal-inner {
            background: white; border-radius: 28px; padding: 28px;
            width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
            color: #1e293b;
        }

        /* 수정 가능한 항목 hover */
        .record-row { cursor: pointer; transition: all 0.15s; }
        .record-row:hover { background: #1e2330 !important; border-color: rgba(99,102,241,0.4) !important; }
        .edit-hint { opacity: 0; transition: opacity 0.15s; font-size: 9px; color: #6366f1; }
        .record-row:hover .edit-hint { opacity: 1; }

        /* 입력 스타일 통일 */
        .inp { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 13px; font-weight: 700; outline: none; transition: border-color 0.2s; }
        .inp:focus { border-color: #6366f1; }
    </style>
</head>
<body>

<!-- ════════════════════════════════════
     로그인 화면
════════════════════════════════════ -->
<div id="login-screen">
    <div class="w-full max-w-sm mx-auto px-6 fade-in">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black tracking-tighter mb-2">
                <span class="text-indigo-500">NHGR</span> 가계부
            </h1>
            <p class="text-slate-500 text-sm font-bold">남호가람 자산 관리</p>
        </div>

        <div class="glass-card rounded-3xl p-7 space-y-4">
            <div id="login-error" class="hidden text-rose-400 text-xs font-bold text-center bg-rose-500/10 rounded-xl py-2"></div>

            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">아이디</label>
                <input type="text" id="login-id" placeholder="아이디 입력"
                    class="inp mt-1" onkeydown="if(event.key==='Enter') doLogin()">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">비밀번호</label>
                <input type="password" id="login-pw" placeholder="비밀번호 입력"
                    class="inp mt-1" onkeydown="if(event.key==='Enter') doLogin()">
            </div>

            <button onclick="doLogin()" id="login-btn"
                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl transition-all text-sm">
                로그인
            </button>

            <div class="text-center pt-2">
                <button onclick="showOnboarding()" class="text-[11px] text-slate-500 font-bold hover:text-indigo-400 transition-colors">
                    처음 사용하시나요? 계정 설정 →
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════
     온보딩 / 계정 설정 화면
════════════════════════════════════ -->
<div id="onboarding-screen" class="hidden">
    <div class="w-full max-w-lg mx-auto fade-in">
        <button onclick="hideOnboarding()" class="flex items-center gap-2 text-slate-500 font-bold text-sm mb-6 hover:text-white transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> 로그인으로 돌아가기
        </button>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-black mb-1">계정 설정</h2>
            <p class="text-slate-500 text-sm">두 분의 계정 아이디/비밀번호를 설정하세요</p>
            <p class="text-slate-600 text-xs mt-1 font-bold">설정 정보는 이 기기에만 저장됩니다</p>
        </div>

        <div class="space-y-6">
            <!-- 남호 계정 -->
            <div class="glass-card rounded-3xl p-6">
                <div class="flex items-center gap-3 mb-5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-xs font-black">남호</div>
                    <div>
                        <p class="font-black text-sm">남호 계정</p>
                        <p class="text-[10px] text-slate-500">첫 번째 사용자</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">아이디</label>
                        <input type="text" id="ob-id1" placeholder="아이디 설정" class="inp mt-1"
                            value="">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">비밀번호</label>
                        <input type="password" id="ob-pw1" placeholder="비밀번호 설정" class="inp mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">표시 이름</label>
                        <input type="text" id="ob-name1" placeholder="남호" value="남호" class="inp mt-1">
                    </div>
                </div>
            </div>

            <!-- 가람 계정 -->
            <div class="glass-card rounded-3xl p-6">
                <div class="flex items-center gap-3 mb-5">
                    <div class="w-9 h-9 rounded-xl bg-slate-600 flex items-center justify-center text-xs font-black">가람</div>
                    <div>
                        <p class="font-black text-sm">가람 계정</p>
                        <p class="text-[10px] text-slate-500">두 번째 사용자</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">아이디</label>
                        <input type="text" id="ob-id2" placeholder="아이디 설정" class="inp mt-1"
                            value="">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">비밀번호</label>
                        <input type="password" id="ob-pw2" placeholder="비밀번호 설정" class="inp mt-1">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-wider ml-1">표시 이름</label>
                        <input type="text" id="ob-name2" placeholder="가람" value="가람" class="inp mt-1">
                    </div>
                </div>
            </div>

            <div id="ob-error" class="hidden text-rose-400 text-xs font-bold text-center bg-rose-500/10 rounded-xl py-2"></div>

            <button onclick="saveOnboarding()"
                class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl transition-all text-sm">
                계정 저장 및 로그인하기
            </button>

            <p class="text-center text-[10px] text-slate-600 font-bold pb-4">
                * 비밀번호는 이 기기의 로컬 저장소에 저장됩니다. GitHub에 업로드되지 않습니다.
            </p>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════
     수정 모달
════════════════════════════════════ -->
<div id="edit-modal" class="hidden">
    <div id="edit-modal-inner">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-lg font-black text-slate-900">내역 수정</h3>
            <button onclick="closeEditModal()" class="p-2 rounded-full hover:bg-slate-100 text-slate-400">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">분류</label>
                <select id="edit-cat" onchange="onEditCatChange()" class="w-full p-3 rounded-xl font-bold mt-1 text-sm outline-none">
                    <optgroup label="── 자산 ──">
                        <option value="자산|현금">현금</option>
                        <option value="자산|예금">예금</option>
                        <option value="자산|적금">적금</option>
                        <option value="자산|주택청약">주택청약</option>
                        <option value="자산|보증금">보증금</option>
                        <option value="자산|주식(국내)">주식 (국내)</option>
                        <option value="자산|주식(해외)">주식 (해외)</option>
                        <option value="자산|퇴직금">퇴직금</option>
                        <option value="자산|퇴직연금">퇴직연금</option>
                    </optgroup>
                    <optgroup label="── 수입 ──">
                        <option value="수입|급여">급여</option>
                        <option value="수입|상여금">상여금</option>
                        <option value="수입|이자배당금">이자배당금</option>
                        <option value="수입|스톡옵션">스톡옵션</option>
                    </optgroup>
                    <optgroup label="── 지출 ──">
                        <option value="지출|생활비">생활비</option>
                        <option value="지출|교통">교통</option>
                        <option value="지출|금융/대출">금융/대출</option>
                        <option value="지출|식비">식비</option>
                        <option value="지출|문화/여가">문화/여가</option>
                        <option value="지출|쇼핑">쇼핑</option>
                        <option value="지출|경조금">경조금</option>
                        <option value="지출|관리비">관리비</option>
                        <option value="지출|임대료">임대료</option>
                        <option value="지출|보험">보험</option>
                    </optgroup>
                </select>
            </div>

            <!-- 수정 - 주식 패널 -->
            <div id="edit-stock-panel" class="hidden bg-slate-50 rounded-xl p-3 space-y-2 border border-slate-200">
                <p id="edit-stock-label" class="text-[10px] font-black text-indigo-600 uppercase">주식 정보</p>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 ml-1">티커 심볼</label>
                    <input type="text" id="edit-ticker" placeholder="예: 005930 / AAPL"
                        class="w-full p-2.5 rounded-lg font-black mt-1 text-sm outline-none uppercase"
                        oninput="this.value=this.value.toUpperCase()">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-1">보유 수량</label>
                        <input type="number" id="edit-qty" placeholder="0" min="0" step="0.0001"
                            class="w-full p-2.5 rounded-lg font-bold mt-1 text-sm outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-1">매입 단가</label>
                        <input type="number" id="edit-unit" placeholder="0" min="0"
                            class="w-full p-2.5 rounded-lg font-bold mt-1 text-sm outline-none">
                    </div>
                </div>
            </div>

            <!-- 수정 - 일반 금액 -->
            <div id="edit-amt-row">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">금액 (₩)</label>
                <input type="number" id="edit-amt" placeholder="0"
                    class="w-full p-3 rounded-xl font-black text-xl mt-1 outline-none">
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">내용</label>
                <input type="text" id="edit-memo" placeholder="메모"
                    class="w-full p-3 rounded-xl font-bold mt-1 text-sm outline-none">
            </div>

            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">날짜</label>
                <input type="date" id="edit-date"
                    class="w-full p-3 rounded-xl font-bold mt-1 text-sm outline-none">
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="confirmDelete()" id="edit-del-btn"
                    class="flex-none px-5 py-4 bg-rose-50 text-rose-500 font-black rounded-2xl text-sm hover:bg-rose-100 transition-all flex items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> 삭제
                </button>
                <button onclick="submitEdit()" id="edit-save-btn"
                    class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-2xl text-sm transition-all">
                    수정 저장
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════
     메인 앱
════════════════════════════════════ -->
<div id="app" class="hidden p-4 md:p-8">
<div class="max-w-6xl mx-auto">

    <!-- 헤더 -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-black tracking-tighter flex items-center gap-2">
                <span class="text-indigo-500">NHGR</span> 가계부
            </h1>
            <div class="flex items-center gap-3 mt-1">
                <p id="status-text" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">● 연결 중...</p>
                <span class="text-slate-700">|</span>
                <div class="flex items-center gap-2">
                    <div id="user-badge" class="w-5 h-5 rounded-md bg-indigo-600 flex items-center justify-center text-[8px] font-black"></div>
                    <span id="user-label" class="text-[10px] font-black text-slate-400"></span>
                    <button onclick="doLogout()" class="text-[10px] font-bold text-slate-600 hover:text-rose-400 transition-colors ml-1">로그아웃</button>
                </div>
            </div>
        </div>
        <div class="flex gap-3 overflow-x-auto no-scrollbar w-full md:w-auto">
            <div class="glass-card px-5 py-3 rounded-2xl min-w-[120px]">
                <p class="text-[9px] text-slate-500 font-bold mb-1">자산 총액</p>
                <p class="text-lg font-black" id="stat-total">₩0</p>
            </div>
            <div class="glass-card px-5 py-3 rounded-2xl min-w-[120px] border-l-2 border-emerald-500">
                <p class="text-[9px] text-slate-500 font-bold mb-1">이달 수입</p>
                <p class="text-lg font-black text-emerald-400" id="stat-income">₩0</p>
            </div>
            <div class="glass-card px-5 py-3 rounded-2xl min-w-[120px] border-l-2 border-rose-500">
                <p class="text-[9px] text-slate-500 font-bold mb-1">이달 지출</p>
                <p class="text-lg font-black text-rose-400" id="stat-expense">₩0</p>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- ── 입력 폼 ── -->
        <div class="lg:col-span-4">
            <div class="bg-white rounded-[32px] p-6 shadow-xl text-slate-900">
                <div class="flex gap-2 mb-4 bg-slate-100 p-1 rounded-xl">
                    <button onclick="setWriter('user1')" id="w-user1" class="w-btn tab-active flex-1 py-2 rounded-lg text-xs font-bold transition-all" id="w-btn-1"></button>
                    <button onclick="setWriter('user2')" id="w-user2" class="w-btn flex-1 py-2 rounded-lg text-xs font-bold text-slate-400 transition-all" id="w-btn-2"></button>
                </div>
                <div class="space-y-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 ml-1">분류</label>
                        <select id="field-cat" onchange="onCatChange()" class="w-full p-3 rounded-xl font-bold mt-1 text-sm outline-none">
                            <optgroup label="── 자산 ──">
                                <option value="자산|현금">현금</option>
                                <option value="자산|예금">예금</option>
                                <option value="자산|적금">적금</option>
                                <option value="자산|주택청약">주택청약</option>
                                <option value="자산|보증금">보증금</option>
                                <option value="자산|주식(국내)">주식 (국내)</option>
                                <option value="자산|주식(해외)">주식 (해외)</option>
                                <option value="자산|퇴직금">퇴직금</option>
                                <option value="자산|퇴직연금">퇴직연금</option>
                            </optgroup>
                            <optgroup label="── 수입 ──">
                                <option value="수입|급여">급여</option>
                                <option value="수입|상여금">상여금</option>
                                <option value="수입|이자배당금">이자배당금</option>
                                <option value="수입|스톡옵션">스톡옵션</option>
                            </optgroup>
                            <optgroup label="── 지출 ──">
                                <option value="지출|생활비">생활비</option>
                                <option value="지출|교통">교통</option>
                                <option value="지출|금융/대출">금융/대출</option>
                                <option value="지출|식비">식비</option>
                                <option value="지출|문화/여가">문화/여가</option>
                                <option value="지출|쇼핑">쇼핑</option>
                                <option value="지출|경조금">경조금</option>
                                <option value="지출|관리비">관리비</option>
                                <option value="지출|임대료">임대료</option>
                                <option value="지출|보험">보험</option>
                            </optgroup>
                        </select>
                    </div>
                    <div id="stock-panel" class="stock-panel bg-slate-50 rounded-xl p-3 space-y-2 border border-slate-200">
                        <p id="stock-label" class="text-[10px] font-black text-indigo-600 uppercase">주식 정보</p>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 ml-1">티커 심볼</label>
                            <input type="text" id="field-ticker" placeholder="예: 005930 / AAPL"
                                class="w-full p-2.5 rounded-lg font-black mt-1 text-sm outline-none uppercase tracking-wider"
                                oninput="this.value=this.value.toUpperCase()" onblur="fetchAndShowPrice()">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 ml-1">보유 수량</label>
                                <input type="number" id="field-qty" placeholder="0" min="0" step="0.0001"
                                    class="w-full p-2.5 rounded-lg font-bold mt-1 text-sm outline-none" oninput="recalcEval()">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-400 ml-1">매입 단가</label>
                                <input type="number" id="field-unit" placeholder="0" min="0"
                                    class="w-full p-2.5 rounded-lg font-bold mt-1 text-sm outline-none">
                            </div>
                        </div>
                        <div id="price-info" class="hidden pt-1 space-y-1 text-xs border-t border-slate-200">
                            <div class="flex justify-between">
                                <span class="text-slate-500">현재가</span>

/* ══════════════════════════════════════════
   앱 상태
══════════════════════════════════════════ */
let state     = { writer: 'user1', filter: 'all', records: [] };
let usdRate   = 0;
let livePrice = {};
let editingId = null;

/* ── 환율 ── */
async function fetchUsdRate() {
    const apis = [
        () => fetch('https://open.er-api.com/v6/latest/USD', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).then(j => j?.rates?.KRW),
        () => fetch('https://frankfurter.app/latest?from=USD&to=KRW', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).then(j => j?.rates?.KRW),
        () => fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).then(j => j?.usd?.krw)
    ];
    for (const api of apis) {
        try {
            const rate = await api();
            if (rate && rate > 100) { usdRate = rate; console.log('환율 로드 완료:', Math.round(rate)); return; }
        } catch {}
    }
    usdRate = 1380; // 모든 API 실패 시 fallback
    console.warn('환율 API 실패, fallback 1380 사용');
}

/* ── 주가 ── */
async function getPrice(ticker, isUS) {
    const key = ticker.toUpperCase().trim();
    if (!key) return null;
    if (livePrice[key]) return livePrice[key];

    // 국내: 6자리 숫자면 .KS 추가
    const symbol = isUS ? key : (/^\d{6}$/.test(key) ? key + '.KS' : key);

    // proxy 두 개 시도
    const proxies = [
        'https://api.allorigins.win/get?url=' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + symbol + '?interval=1m&range=1d'),
        'https://corsproxy.io/?' + encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + symbol + '?interval=1m&range=1d')
    ];

    for (const proxy of proxies) {
        try {
            const resp = await fetch(proxy, { signal: AbortSignal.timeout(8000) });
            let data;
            const text = await resp.text();
            // allorigins는 {contents: "..."} 형식, corsproxy는 직접 JSON
            try { const wrap = JSON.parse(text); data = typeof wrap.contents === 'string' ? JSON.parse(wrap.contents) : wrap; }
            catch { data = JSON.parse(text); }
            const p = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
            if (p && p > 0) {
                const rate = usdRate > 0 ? usdRate : 1380; // 환율 fallback
                livePrice[key] = { raw: p, krw: isUS ? p * rate : p };
                return livePrice[key];
            }
        } catch(e) { /* 다음 proxy 시도 */ }
    }
    return null;
}

/* ── 분류 변경 ── */
function onCatChange() {
    const cat  = document.getElementById('field-cat').value;
    const isKR = cat === '자산|주식(국내)', isUS = cat === '자산|주식(해외)';
    const stock = isKR || isUS;

    document.getElementById('amt-row').style.display = stock ? 'none' : 'block';

    if (!stock) { ['field-ticker','field-qty','field-unit'].forEach(id => document.getElementById(id).value = ''); }
}

function onEditCatChange() {
    const cat  = document.getElementById('edit-cat').value;
    const isKR = cat === '자산|주식(국내)', isUS = cat === '자산|주식(해외)';
    const stock = isKR || isUS;

    document.getElementById('edit-amt-row').style.display = stock ? 'none' : 'block';

    else      document.getElementById('edit-stock-label').innerText = '국내 주식 정보';

/* ── 실시간 주가 조회 ── */
async function fetchAndShowPrice() {
    const ticker = document.getElementById('field-ticker').value.trim().toUpperCase();
    if (!ticker) return;
    const isUS = document.getElementById('field-cat').value === '자산|주식(해외)';
    const priceEl = document.getElementById('live-price');
    document.getElementById('price-info').classList.remove('hidden');
    priceEl.classList.add('fetching'); priceEl.innerText = '조회 중...';
    const p = await getPrice(ticker, isUS);
    priceEl.classList.remove('fetching');
    if (p) {
        priceEl.innerText = isUS ? `$${p.raw.toLocaleString()} → ₩${Math.round(p.krw).toLocaleString()}` : `₩${Math.round(p.krw).toLocaleString()}`;
        if (isUS) document.getElementById('rate-val').innerText = `₩${Math.round(usdRate).toLocaleString()}`;
        recalcEval();
    } else { priceEl.innerText = '조회 실패 (수동 입력)'; }
}

function recalcEval() {
    const ticker = document.getElementById('field-ticker').value.trim().toUpperCase();
    const qty    = parseFloat(document.getElementById('field-qty').value) || 0;
    let eval_ = 0;
    if (ticker && livePrice[ticker] && qty > 0) eval_ = livePrice[ticker].krw * qty;
    document.getElementById('eval-amt').innerText = '₩' + Math.round(eval_).toLocaleString();
    if (eval_) document.getElementById('field-amt').value = Math.round(eval_);
}

/* ── 초기 로드 ── */
async function init() {
    document.getElementById('field-date').value = new Date().toISOString().split('T')[0];
    setStatus('loading', '데이터 불러오는 중...');
    await fetchUsdRate();

    const { data, error } = await sb.from(TABLE).select('*').order('date', { ascending: false });
    if (error) { setStatus('error', '연결 실패: ' + error.message); return; }

    state.records = (data || []).map(toView);
    render();
    setStatus('live', '실시간 연결됨 ✓');

    sb.channel('nhgr_main_rt')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: TABLE }, ({ new: row }) => {
            if (!state.records.find(r => r.id === row.id)) state.records.unshift(toView(row));
            render();
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: TABLE }, ({ old: row }) => {
            state.records = state.records.filter(r => r.id !== row.id);
            render();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: TABLE }, ({ new: row }) => {
            const idx = state.records.findIndex(r => r.id === row.id);
            if (idx !== -1) state.records[idx] = toView(row);
            render();
        })
        .subscribe();

    refreshLivePrices();
}

async function refreshLivePrices() {
    const stocks = state.records.filter(r => r.ticker && r.qty);
    const pairs  = [...new Map(stocks.map(r => [r.ticker, r.isUS])).entries()];
    for (const [ticker, isUS] of pairs) await getPrice(ticker, isUS);
    if (pairs.length) render();
}

/* ── DB row → view ── */
function toView(r) {
    // nhgr_budget 컬럼: id(text), writer, type, cat, amt, memo, date
    // account_v3 컬럼: id(uuid), user_name, type, category, amount, description, date
    // 두 테이블 모두 지원
    const isNewTable = r.cat !== undefined;
    if (isNewTable) {
        let extra = {};
        try { extra = JSON.parse(r.memo || '{}'); } catch {}
        const isStockJson = typeof extra === 'object' && extra.ticker;
        return {
            id:       r.id,
            writer:   r.writer || 'user1',
            type:     r.type || '지출',
            cat:      r.cat || '',
            amt:      Number(r.amt) || 0,
            date:     r.date || '',
            memo:     isStockJson ? (extra.memo || '') : (r.memo || ''),
            raw_desc: r.memo || '',
            ticker:   extra.ticker || null,
            qty:      extra.qty    || null,
            isUS:     r.cat === '주식(해외)'
        };
    }
    // account_v3 fallback
    let extra = {};
    try { extra = JSON.parse(r.description || '{}'); } catch {}
    const isStockJson = typeof extra === 'object' && extra.ticker;
    return {
        id:       r.id ?? null,
        writer:   r.user_name || 'user1',
        type:     r.type || '지출',
        cat:      r.category || '',
        amt:      Number(r.amount) || 0,
        date:     r.date || '',
        memo:     isStockJson ? (extra.memo || '') : (r.description || ''),
        raw_desc: r.description || '',
        ticker:   extra.ticker  || null,
        qty:      extra.qty     || null,
        isUS:     r.category === '주식(해외)'
    };
}

/* ── 작성자 이름 조회 ── */
function writerName(key) {
    if (!accounts) return key;
    return (accounts[key] || accounts.user1).name;
}

/* ── 렌더 ── */
function render() {
    const thisMonth = new Date().toISOString().slice(0, 7);
    let stats = { asset: 0, inc: 0, exp: 0 };

    state.records.forEach(r => {
        let amt = r.amt;
        const tk = r.ticker?.toUpperCase();
        if (tk && r.qty && livePrice[tk]) amt = livePrice[tk].krw * r.qty;
        if (r.type === '자산') stats.asset += amt;
        else if (r.date?.startsWith(thisMonth)) {
            if (r.type === '수입') stats.inc += amt;
            else stats.exp += amt;
        }
    });

    document.getElementById('stat-total').innerText   = '₩' + Math.round(stats.asset).toLocaleString();
    document.getElementById('stat-income').innerText  = '₩' + Math.round(stats.inc).toLocaleString();
    document.getElementById('stat-expense').innerText = '₩' + Math.round(stats.exp).toLocaleString();

    const filtered = state.records
        .filter(r => state.filter === 'all' || r.type === state.filter)
        .sort((a, b) => new Date(b.date) - new Date(a.date));

    const container = document.getElementById('list-container');
    if (!filtered.length) {
        container.innerHTML = '<div class="text-center py-20 opacity-20 text-sm font-bold">기록된 내역이 없습니다.</div>';
        return;
    }

    const isUser1Color = (w) => w === 'user1' || w === '남호';

    container.innerHTML = filtered.map(r => {
        const tk = r.ticker?.toUpperCase();
        let dispAmt = r.amt, liveBadge = '';
        if (tk && r.qty && livePrice[tk]) {
            dispAmt = livePrice[tk].krw * r.qty;
            const cur = r.isUS ? `$${livePrice[tk].raw.toLocaleString(undefined,{maximumFractionDigits:2})}` : `₩${Math.round(livePrice[tk].krw).toLocaleString()}`;
            liveBadge = `<span class="price-badge">LIVE ${cur}</span>`;
        }
        const stockMeta = r.ticker ? `<span class="text-[9px] font-black text-blue-400 ml-1">${r.ticker}</span><span class="text-[9px] text-slate-500">${r.qty ? r.qty+'주' : ''}</span>` : '';
        const amtColor  = r.type === '수입' ? 'text-emerald-400' : r.type === '지출' ? 'text-rose-400' : 'text-white';
        const sign      = r.type === '지출' ? '-' : '';
        const wName     = writerName(r.writer);
        const wColor    = isUser1Color(r.writer) ? 'bg-indigo-600' : 'bg-slate-600';

        return `
        <div class="${r.id ? 'record-row cursor-pointer' : 'cursor-default'} glass-card p-4 rounded-2xl flex justify-between items-center group" ${r.id ? `data-record-id="${r.id}" onclick="openEditModal(this.dataset.recordId)"` : ''}>
            <div class="flex items-center gap-3 min-w-0 flex-1">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center text-[9px] font-black flex-shrink-0 ${wColor} text-white">${wName.slice(0,2)}</div>
                <div class="min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span class="text-[9px] font-bold text-slate-500">${r.date}</span>
                        <span class="text-[9px] font-black text-indigo-400">${r.cat}</span>
                        ${stockMeta}
                        <span class="edit-hint">✏️ 클릭하여 수정</span>
                    </div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <p class="font-bold text-sm text-slate-200 truncate">${r.memo || '-'}</p>
                        ${liveBadge}
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-shrink-0 ml-2">
                <div class="text-right">
                    <p class="font-black text-lg ${amtColor}">${sign}₩${Math.round(dispAmt).toLocaleString()}</p>
                    ${tk && r.qty ? `<p class="text-[9px] text-slate-500">${r.qty}주</p>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');

    lucide.createIcons();
}

/* ══════════════════════════════════════════
   수정 모달
══════════════════════════════════════════ */
function openEditModal(id) {
    // id는 bigint(숫자) 또는 uuid(문자열) 모두 처리
    const r = state.records.find(x => String(x.id) === String(id));
    if (!r) { console.warn('Record not found for id:', id); return; }
    editingId = r.id; // DB 원본 id 그대로 보존 (숫자면 숫자, 문자면 문자)
    console.log('Editing record id:', editingId, typeof editingId);

    // 분류 값 설정
    const catVal = r.type + '|' + r.cat;
    document.getElementById('edit-cat').value = catVal;
    onEditCatChange();

    // 주식이면 주식 필드, 아니면 금액 필드
    const isStock = r.cat === '주식(국내)' || r.cat === '주식(해외)';
    if (isStock) {
        document.getElementById('edit-ticker').value = r.ticker || '';
        document.getElementById('edit-qty').value    = r.qty    || '';
        try {
            const extra = JSON.parse(r.raw_desc || '{}');
            document.getElementById('edit-unit').value = extra.unitPrice || '';
        } catch {}
    } else {
        document.getElementById('edit-amt').value = r.amt || '';
    }

    document.getElementById('edit-memo').value = r.memo || '';
    document.getElementById('edit-date').value = r.date || '';

    document.getElementById('edit-modal').classList.remove('hidden');
    lucide.createIcons();
}

function closeEditModal() {
    editingId = null;
    document.getElementById('edit-modal').classList.add('hidden');
}

async function submitEdit() {
    if (editingId === null || editingId === undefined || String(editingId) === 'null') {
        alert('이 항목은 ID가 없어 수정할 수 없습니다. Supabase에서 직접 삭제해주세요.');
        closeEditModal();
        return;
    }
    const r = state.records.find(x => String(x.id) === String(editingId));
    if (!r) return;

    const catVal  = document.getElementById('edit-cat').value;
    const [type, cat] = catVal.split('|');
    const dateVal = document.getElementById('edit-date').value;
    const memoVal = document.getElementById('edit-memo').value.trim();
    const isKR    = cat === '주식(국내)', isUS = cat === '주식(해외)';
    const isStock = isKR || isUS;

    if (!dateVal) { alert('날짜를 선택해주세요.'); return; }

    let amount, description;
    if (isStock) {
        const ticker    = document.getElementById('edit-ticker').value.trim().toUpperCase();
        const qty       = parseFloat(document.getElementById('edit-qty').value) || 0;
        const unitPrice = parseFloat(document.getElementById('edit-unit').value) || 0;
        if (!ticker || !qty) { alert('티커와 수량을 입력해주세요.'); return; }
        if (isUS && usdRate <= 0) await fetchUsdRate();
        let priceKRW = unitPrice, priceRaw = unitPrice;
        const live = await getPrice(ticker, isUS);
        if (live) { priceKRW = live.krw; priceRaw = live.raw; livePrice[ticker] = live; }
        amount      = Math.round(priceKRW * qty);
        description = JSON.stringify({ ticker, qty, unitPrice, currentPrice: priceRaw, usdRate: isUS ? usdRate : null, memo: memoVal });
    } else {
        amount = Number(document.getElementById('edit-amt').value);
        if (!amount || amount <= 0) { alert('금액을 입력해주세요.'); return; }
        description = memoVal;
    }

    const payload = { writer: writerName(state.editWriter || state.writer), type, cat, amt: amount, memo: description, date: dateVal };

    // 낙관적 업데이트
    const idx = state.records.findIndex(x => String(x.id) === String(editingId));
    const oldRec = { ...state.records[idx] };
    state.records[idx] = { ...state.records[idx], type, cat, amt: amount, date: dateVal, memo: memoVal, raw_desc: description,
        ticker: isStock ? document.getElementById('edit-ticker').value.trim().toUpperCase() : null,
        qty: isStock ? parseFloat(document.getElementById('edit-qty').value) : null, isUS };
    render();
    closeEditModal();

    // editingId를 DB 원본 타입에 맞게 변환
    // account_v3의 id가 bigint면 Number, uuid/text면 String
    console.log('[수정] id:', editingId, 'payload:', JSON.stringify(payload));
    const { data: updData, error } = await sb.from(TABLE).update(payload).eq('id', editingId).select();
    console.log('[수정 결과]', updData, error);
    if (error) {
        state.records[idx] = oldRec;
        render();
        alert('수정 실패: ' + error.message);
    }
}

async function confirmDelete() {
    if (editingId === null || editingId === undefined || String(editingId) === 'null') {
        alert('이 항목은 ID가 없어 삭제할 수 없습니다. Supabase에서 직접 삭제해주세요.');
        closeEditModal();
        return;
    }
    if (!confirm('이 내역을 삭제할까요?')) return;

    const id      = editingId;
    const removed = state.records.find(r => String(r.id) === String(id));
    state.records = state.records.filter(r => String(r.id) !== String(id));
    render();
    closeEditModal();

    const { error } = await sb.from(TABLE).delete().eq('id', id);
    if (error) {
        if (removed) state.records.unshift(removed);
        render();
        alert('삭제 실패: ' + error.message);
    }
}

/* ══════════════════════════════════════════
   저장
══════════════════════════════════════════ */
window.saveData = async () => {
    const catVal  = document.getElementById('field-cat').value;
    const [type, cat] = catVal.split('|');
    const dateVal = document.getElementById('field-date').value;
    const memoVal = document.getElementById('field-memo').value.trim();
    const isKR    = cat === '주식(국내)', isUS = cat === '주식(해외)';
    const isStock = isKR || isUS;

    if (!dateVal) { alert('날짜를 선택해주세요.'); return; }

    let amount, description;
    if (isStock) {
        const ticker    = document.getElementById('field-ticker').value.trim().toUpperCase();
        const qty       = parseFloat(document.getElementById('field-qty').value) || 0;
        const unitPrice = parseFloat(document.getElementById('field-unit').value) || 0;
        if (!ticker) { alert('티커를 입력해주세요.'); return; }
        if (!qty)    { alert('수량을 입력해주세요.'); return; }
        // 환율 미로드 시 먼저 조회
        if (isUS && usdRate <= 0) await fetchUsdRate();
        let priceKRW = unitPrice, priceRaw = unitPrice;
        const live = await getPrice(ticker, isUS);
        if (live) {
            priceKRW = live.krw;
            priceRaw = live.raw;
            // livePrice 캐시 갱신 (화면 표시용)
            livePrice[ticker] = live;
        }
        amount      = Math.round(priceKRW * qty);
        description = JSON.stringify({ ticker, qty, unitPrice, currentPrice: priceRaw, usdRate: isUS ? usdRate : null, memo: memoVal });
    } else {
        amount = Number(document.getElementById('field-amt').value);
        if (!amount || amount <= 0) { document.getElementById('field-amt').focus(); return; }
        description = memoVal;
    }

    const writerName_ = writerName(state.writer);
    // nhgr_budget: id는 Date.now() 문자열로 직접 생성 (uuid 타입 아님)
    const newId = String(Date.now()) + '_' + Math.random().toString(36).slice(2,7);
    const payload = { id: newId, writer: writerName_, type, cat, amt: amount, memo: description, date: dateVal };

    // 폼 초기화
    document.getElementById('field-memo').value = '';
    document.getElementById('field-amt').value  = '';
    if (isStock) {
        ['field-ticker','field-qty','field-unit'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('price-info').classList.add('hidden');
    }

    // 저장 버튼 비활성화
    const saveBtn = document.getElementById('btn-save');
    saveBtn.disabled = true; saveBtn.textContent = '저장 중...';

    // 낙관적 업데이트 (즉시 화면 반영)
    const _ticker = isStock ? document.getElementById('field-ticker').value.trim().toUpperCase() : null;
    const _qty    = isStock ? parseFloat(document.getElementById('field-qty').value) || null : null;
    const optimistic = { id: newId, writer: writerName(state.writer), type, cat, amt: amount,
        memo: memoVal, raw_desc: description, date: dateVal, ticker: _ticker, qty: _qty, isUS };
    state.records.unshift(optimistic);
    render();

    console.log('[저장 시작] TABLE:', TABLE, 'payload:', JSON.stringify(payload));
    let data, error;
    try {
        const res = await sb.from(TABLE).insert([payload]).select().single();
        data  = res.data;
        error = res.error;
    } catch(e) {
        error = { message: e.message || String(e) };
    }
    saveBtn.disabled = false; saveBtn.textContent = '저장';
    console.log('[저장 결과] data:', JSON.stringify(data), 'error:', JSON.stringify(error));

    if (error) {
        state.records = state.records.filter(r => r.id !== newId);
        render();
        alert('저장 실패: ' + error.message);
        return;
    }
    // 임시 id → 실제 DB id로 교체
    const oidx = state.records.findIndex(r => r.id === newId);
    if (oidx !== -1 && data) state.records[oidx] = toView(data);
    else if (oidx !== -1 && !data) state.records[oidx] = {...optimistic};
};

window.setFilter = (f) => {
    state.filter = f;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.toggle('tab-active', b.id === 'f-' + f));
    render();
};

function setStatus(type, msg) {
    const el = document.getElementById('status-text');
    el.className = 'text-[10px] font-bold uppercase tracking-widest ' +
        (type === 'live' ? 'text-emerald-500' : type === 'error' ? 'text-rose-500' : 'text-amber-400');
    el.innerText = '● ' + msg;
}

window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();

    const session  = loadSession();
    const accts    = loadAccounts();

    if (session && accts) {
        // 세션이 있으면 바로 앱 시작
        const user = accts[session.key] || session;
        startApp(user);
    } else if (!accts) {
        // 계정 자체가 없으면 온보딩
        showOnboarding();
    } else {
        // 계정은 있는데 세션 없으면 로그인
        showLogin();
    }
});
