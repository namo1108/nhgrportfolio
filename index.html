<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NH&GR Asset Intelligence v8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .card { background: white; border-radius: 1.5rem; border: 1px solid rgba(0,0,0,0.05); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .edit-active { border: 2px solid #3b82f6 !important; background-color: #f8faff !important; box-shadow: 0 20px 25px -5px rgba(59, 130, 246, 0.1); }
        .btn-navy { background-color: #0f172a; color: white; }
        .spinner { width: 14px; height: 14px; border: 2px solid #e2e8f0; border-top: 2px solid #3b82f6; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        input, select { outline: none; transition: border 0.2s; }
        input:focus, select:focus { border-color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-8 pb-32">
    <div class="max-w-2xl mx-auto space-y-6">
        <!-- 상단 평가 금액 섹션 -->
        <header class="card p-8 bg-[#0f172a] text-white relative overflow-hidden shadow-2xl">
            <div class="relative z-10">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">실시간 순자산 평가액</p>
                    <div id="sync-indicator" class="flex items-center gap-2 text-[10px] font-bold text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded-full">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        LIVE
                    </div>
                </div>
                <h1 id="total-asset-display" class="text-4xl font-black font-mono tracking-tighter italic">₩0</h1>
                <div class="mt-6 grid grid-cols-2 gap-4">
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">USD 환율 (실시간)</p>
                        <p id="exchange-rate-display" class="text-sm font-mono font-bold text-blue-300">₩1,420.0</p>
                    </div>
                    <div class="bg-white/5 p-3 rounded-xl border border-white/10">
                        <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">마지막 업데이트</p>
                        <p id="last-update-time" class="text-sm font-mono font-bold text-slate-300">--:--:--</p>
                    </div>
                </div>
            </div>
            <!-- 배경 장식 -->
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-blue-600/20 rounded-full blur-3xl"></div>
        </header>

        <!-- 입력 및 수정 폼 -->
        <section id="main-form" class="card p-6 space-y-5 shadow-sm border-2 border-transparent">
            <div class="flex justify-between items-center">
                <h2 id="form-mode-title" class="text-lg font-black tracking-tight text-slate-800">📝 내역 입력</h2>
                <div class="flex items-center bg-slate-100 rounded-xl p-1 font-mono text-[11px] font-bold">
                    <button onclick="moveMonth(-1)" class="px-2 text-slate-400 hover:text-black">◀</button>
                    <span id="month-label" class="px-2">2026.04</span>
                    <button onclick="moveMonth(1)" class="px-2 text-slate-400 hover:text-black">▶</button>
                </div>
            </div>

            <!-- 유저 및 유형 선택 -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="updateState('user_name', '남편')" id="btn-user-h" class="py-4 rounded-2xl border-2 font-black text-xs btn-navy">남편</button>
                <button onclick="updateState('user_name', '아내')" id="btn-user-w" class="py-4 rounded-2xl border-2 font-black text-xs bg-white text-slate-300 border-slate-100">아내</button>
            </div>
            <div class="flex p-1.5 bg-slate-100 rounded-2xl">
                <button onclick="updateState('type', '수입')" id="btn-type-in" class="flex-1 py-3 rounded-xl font-black text-xs bg-white shadow-sm">수입/자산</button>
                <button onclick="updateState('type', '지출')" id="btn-type-out" class="flex-1 py-3 rounded-xl font-black text-xs text-slate-400">지출</button>
            </div>

            <!-- 기본 정보 입력 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">날짜</label>
                    <input type="date" id="input-date" class="w-full p-4 rounded-2xl border bg-white text-xs font-bold shadow-sm">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">금액 (원가/평단가)</label>
                    <input type="number" id="input-amount" placeholder="0" class="w-full p-4 rounded-2xl border text-xs font-bold shadow-sm">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="text-[10px] font-black text-slate-400 ml-1 uppercase">카테고리</label>
                <select id="input-category" onchange="toggleStockFields()" class="w-full p-4 rounded-2xl border bg-white text-xs font-bold shadow-sm"></select>
            </div>

            <!-- 주식 전용 필드 (수량/티커) -->
            <div id="stock-fields" class="hidden p-5 bg-blue-50 border border-blue-100 rounded-2xl space-y-4">
                <p class="text-[10px] font-black text-blue-500 uppercase flex items-center gap-2">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                    실시간 자산 평가 정보
                </p>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="input-ticker" placeholder="티커 (AAPL / 005930)" class="p-4 rounded-xl border text-[10px] font-black uppercase outline-none focus:ring-2 ring-blue-500/20">
                    <input type="number" id="input-qty" placeholder="보유 수량" step="0.000001" class="p-4 rounded-xl border text-[10px] font-black outline-none focus:ring-2 ring-blue-500/20">
                </div>
                <p class="text-[9px] text-blue-400 font-medium">* 미국 주식은 원화로 자동 환산, 한국 주식은 종가로 계산됩니다.</p>
            </div>

            <input type="text" id="input-desc" placeholder="메모 (상세내역)" class="w-full p-4 rounded-2xl border text-xs font-bold shadow-sm">

            <!-- 저장 및 수정/삭제 버튼 -->
            <div id="form-actions" class="pt-2">
                <button id="main-submit-btn" onclick="handleSave()" class="w-full py-5 btn-navy rounded-2xl font-black text-sm shadow-xl active:scale-[0.98] transition-transform">
                    데이터 저장하기
                </button>
                <div id="edit-mode-actions" class="hidden grid grid-cols-2 gap-2 mt-2">
                    <button onclick="cancelEdit()" class="py-4 bg-slate-200 text-slate-600 rounded-2xl font-black text-xs">수정 취소</button>
                    <button onclick="handleDelete()" class="py-4 bg-rose-50 text-rose-500 border border-rose-100 rounded-2xl font-black text-xs hover:bg-rose-100">내역 삭제</button>
                </div>
            </div>
        </section>

        <!-- 필터 탭 -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
            <button onclick="setTab('all')" id="tab-all" class="px-6 py-3 rounded-2xl text-[11px] font-black btn-navy shadow-lg">전체내역</button>
            <button onclick="setTab('asset')" id="tab-asset" class="px-6 py-3 rounded-2xl text-[11px] font-black bg-white text-slate-400 border border-slate-100">자산현황</button>
            <button onclick="setTab('income')" id="tab-income" class="px-6 py-3 rounded-2xl text-[11px] font-black bg-white text-slate-400 border border-slate-100">수입</button>
            <button onclick="setTab('expense')" id="tab-expense" class="px-6 py-3 rounded-2xl text-[11px] font-black bg-white text-slate-400 border border-slate-100">지출</button>
        </div>

        <!-- 리스트 렌더링 영역 -->
        <div id="list-container" class="space-y-3 min-h-[300px]">
            <!-- 데이터가 비었을 때의 기본 스켈레톤 -->
            <div class="py-20 text-center">
                <span class="spinner"></span>
                <p class="text-[10px] font-bold text-slate-300 mt-4 uppercase tracking-widest">데이터 동기화 중...</p>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        let sb, allRecords = [], currentTab = 'all', editingId = null;
        let usdRate = 1420, livePrices = {}, viewMonth = new Date();
        
        const state = { user_name: '남편', type: '수입' };
        const categories = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '생활용품', '교통', '여가', '경조사', '의료', '통신', '보험', '기타'],
            '자산': ['보증금', '저축/예금', '적금', '주식 (해외)', '주식 (국내)', '연금/퇴직금']
        };

        window.onload = async () => {
            sb = supabase.createClient(SB_URL, SB_KEY);
            document.getElementById('input-date').valueAsDate = new Date();
            updateMonthUI();
            updateCategoryList();
            
            // 환율 및 데이터 로드 시작
            await Promise.all([fetchUsdRate(), refreshData()]);
        };

        // 환율 정보 (실시간)
        async function fetchUsdRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json());
                if(res?.rates?.KRW) {
                    usdRate = res.rates.KRW;
                    document.getElementById('exchange-rate-display').innerText = `₩${usdRate.toLocaleString(undefined, {minimumFractionDigits:1})}`;
                }
            } catch(e) { console.error("환율 로드 오류"); }
        }

        // 주가 정보 (개별 티커별 최신가 조회)
        async function fetchStockPrice(ticker) {
            if (!ticker || livePrices[ticker]) return;
            let symbol = ticker.toUpperCase().trim();
            const isKR = /^\d{6}$/.test(symbol); // 6자리 숫자는 한국 주식
            if (isKR) symbol += '.KS';

            const url = `https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + symbol)}`;
            try {
                const response = await fetch(url).then(r => r.json());
                const data = JSON.parse(response.contents);
                const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
                if (price) {
                    // 해외 주식은 환율 곱함, 국내 주식은 그대로
                    livePrices[ticker] = isKR ? price : (price * usdRate);
                }
            } catch (e) { console.error(`${ticker} 조회 실패`); }
        }

        // 전체 데이터 리프레시
        async function refreshData() {
            setLoadingUI(true);
            try {
                const { data, error } = await sb.from('account_v3').select('*').order('date', { ascending: false });
                if (data) {
                    allRecords = data;
                    // 티커 중복 제거 후 가격 병렬 조회
                    const tickers = [...new Set(allRecords.filter(r => r.ticker).map(r => r.ticker))];
                    await Promise.allSettled(tickers.map(fetchStockPrice));
                    calculateAndRender();
                }
            } finally {
                setLoadingUI(false);
            }
        }

        function calculateAndRender() {
            let totalEvaluated = 15800000; // 기초 보증금 고정값
            
            // 전체 자산 합산 로직 (평가액 반영)
            allRecords.forEach(r => {
                let val = Number(r.amount) || 0;
                const isStock = r.category?.includes("주식");
                
                // 주식인 경우 실시간 주가 반영 (수량 * 현재가)
                if (isStock && r.ticker && livePrices[r.ticker]) {
                    val = livePrices[r.ticker] * (Number(r.qty) || 0);
                }

                // 자산성 카테고리거나 수입인 경우 합산
                if (["보증금", "주식", "저축", "적금", "연금"].some(c => r.category?.includes(c))) {
                    totalEvaluated += val;
                } else if (r.type === '수입') {
                    totalEvaluated += val;
                }
                // 지출은 순자산 총계에서 제외하거나, 수입에서 이미 차감된 개념이므로 합산에서 제외 (가계부 성격)
            });

            document.getElementById('total-asset-display').innerText = `₩${Math.round(totalEvaluated).toLocaleString()}`;
            renderList();
        }

        function renderList() {
            const container = document.getElementById('list-container');
            const filtered = allRecords.filter(r => {
                const dp = r.date.split('.');
                const isThisMonth = parseInt(dp[0]) === viewMonth.getFullYear() && parseInt(dp[1]) === (viewMonth.getMonth() + 1);
                
                if (currentTab === 'all') return isThisMonth;
                if (currentTab === 'asset') return ["보증금","주식","저축","적금","연금"].some(c => r.category?.includes(c));
                if (currentTab === 'income') return isThisMonth && r.type === '수입';
                if (currentTab === 'expense') return isThisMonth && r.type === '지출';
                return false;
            });

            container.innerHTML = filtered.length ? filtered.map(r => {
                let displayAmt = Number(r.amount) || 0;
                let isLive = false;
                if (r.category?.includes("주식") && r.ticker && livePrices[r.ticker]) {
                    displayAmt = livePrices[r.ticker] * (Number(r.qty) || 0);
                    isLive = true;
                }

                return `
                <div onclick="initiateEdit(${r.id})" class="card p-5 flex justify-between items-center cursor-pointer hover:border-blue-400 active:scale-[0.98] group">
                    <div class="space-y-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[8px] font-black px-2 py-0.5 rounded bg-slate-100 text-slate-500 uppercase tracking-tighter">${r.category}</span>
                            <span class="text-[9px] font-bold text-blue-500">${r.user_name}</span>
                        </div>
                        <p class="text-sm font-bold text-slate-800 group-hover:text-blue-600 transition-colors">${r.description || r.category}</p>
                        <p class="text-[8px] font-mono text-slate-400">${r.date} ${r.ticker ? '• ' + r.ticker : ''}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[14px] font-black font-mono ${r.type==='지출'?'text-rose-500':'text-emerald-500'}">
                            ${r.type==='지출' ? '-' : '+'}₩${Math.round(displayAmt).toLocaleString()}
                        </p>
                        ${isLive ? '<span class="text-[7px] font-black text-blue-400 bg-blue-50 px-1 rounded">평가액 반영됨</span>' : ''}
                    </div>
                </div>`;
            }).join('') : '<div class="py-20 text-center text-slate-300 text-[10px] font-black uppercase tracking-widest italic">기록된 내역이 없습니다</div>';
        }

        // --- 수정 및 삭제 기능의 핵심 ---
        function initiateEdit(id) {
            const target = allRecords.find(r => r.id === id);
            if (!target) return;

            editingId = id; // 현재 수정 중인 고유 ID 저장
            
            // UI 상태 변경
            const form = document.getElementById('main-form');
            form.classList.add('edit-active');
            document.getElementById('form-mode-title').innerText = "✏️ 내역 수정 모드";
            document.getElementById('main-submit-btn').innerText = "변경사항 저장하기";
            document.getElementById('edit-mode-actions').classList.remove('hidden');

            // 데이터 폼에 채우기
            updateState('user_name', target.user_name);
            updateState('type', target.type);
            
            // 날짜 변환 (YYYY. MM. DD. -> YYYY-MM-DD)
            const dStr = target.date.replace(/ /g, '').replace(/\./g, '-').substring(0, 10);
            document.getElementById('input-date').value = dStr;
            document.getElementById('input-amount').value = target.amount;
            document.getElementById('input-desc').value = target.description || '';
            
            // 카테고리 및 주식 정보 (Select 로딩 대기)
            setTimeout(() => {
                document.getElementById('input-category').value = target.category;
                if (target.ticker) {
                    document.getElementById('input-ticker').value = target.ticker;
                    document.getElementById('input-qty').value = target.qty;
                }
                toggleStockFields();
            }, 50);

            // 상단으로 스크롤 이동
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function handleSave() {
            const amt = Number(document.getElementById('input-amount').value);
            if (!amt) return alert("금액을 입력하세요.");

            const payload = {
                user_name: state.user_name,
                type: state.type,
                category: document.getElementById('input-category').value,
                amount: amt,
                date: document.getElementById('input-date').value.replace(/-/g, '. ') + '. ',
                description: document.getElementById('input-desc').value,
                ticker: document.getElementById('input-ticker').value.toUpperCase().trim() || null,
                qty: Number(document.getElementById('input-qty').value) || null
            };

            let res;
            if (editingId) {
                // 수정: 해당 ID의 데이터 업데이트
                res = await sb.from('account_v3').update(payload).eq('id', editingId);
            } else {
                // 신규: 데이터 삽입
                res = await sb.from('account_v3').insert([payload]);
            }

            if (!res.error) {
                cancelEdit();
                await refreshData();
            } else {
                alert("처리 중 오류가 발생했습니다.");
            }
        }

        async function handleDelete() {
            if (!editingId || !confirm("이 내역을 정말 삭제하시겠습니까?")) return;
            
            const { error } = await sb.from('account_v3').delete().eq('id', editingId);
            if (!error) {
                cancelEdit();
                await refreshData();
            }
        }

        function cancelEdit() {
            editingId = null;
            const form = document.getElementById('main-form');
            form.classList.remove('edit-active');
            document.getElementById('form-mode-title').innerText = "📝 내역 입력";
            document.getElementById('main-submit-btn').innerText = "데이터 저장하기";
            document.getElementById('edit-mode-actions').classList.add('hidden');
            
            document.getElementById('input-amount').value = '';
            document.getElementById('input-desc').value = '';
            document.getElementById('input-ticker').value = '';
            document.getElementById('input-qty').value = '';
            document.getElementById('input-date').valueAsDate = new Date();
            toggleStockFields();
        }

        // --- 기타 UI 헬퍼 ---
        function updateState(key, val) {
            state[key] = val;
            if (key === 'user_name') {
                document.getElementById('btn-user-h').className = val === '남편' ? 'py-4 rounded-2xl border-2 font-black text-xs btn-navy' : 'py-4 rounded-2xl border-2 font-black text-xs bg-white text-slate-300 border-slate-100';
                document.getElementById('btn-user-w').className = val === '아내' ? 'py-4 rounded-2xl border-2 font-black text-xs btn-navy' : 'py-4 rounded-2xl border-2 font-black text-xs bg-white text-slate-300 border-slate-100';
            } else {
                document.getElementById('btn-type-in').className = val === '수입' ? 'flex-1 py-3 rounded-xl font-black text-xs bg-white shadow-sm' : 'flex-1 py-3 rounded-xl font-black text-xs text-slate-400';
                document.getElementById('btn-type-out').className = val === '지출' ? 'flex-1 py-3 rounded-xl font-black text-xs bg-white shadow-sm' : 'flex-1 py-3 rounded-xl font-black text-xs text-slate-400';
                updateCategoryList();
            }
        }

        function updateCategoryList() {
            const list = state.type === '수입' ? [...categories.수입, ...categories.자산] : categories.지출;
            document.getElementById('input-category').innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStockFields();
        }

        function toggleStockFields() {
            const isStock = document.getElementById('input-category').value.includes("주식");
            document.getElementById('stock-fields').classList.toggle('hidden', !isStock);
        }

        function setTab(t) {
            currentTab = t;
            const tabs = ['all', 'asset', 'income', 'expense'];
            tabs.forEach(tab => {
                document.getElementById('tab-' + tab).className = t === tab ? 'px-6 py-3 rounded-2xl text-[11px] font-black btn-navy shadow-lg' : 'px-6 py-3 rounded-2xl text-[11px] font-black bg-white text-slate-400 border border-slate-100';
            });
            renderList();
        }

        function moveMonth(d) { viewMonth.setMonth(viewMonth.getMonth() + d); updateMonthUI(); renderList(); }
        function updateMonthUI() { document.getElementById('month-label').innerText = `${viewMonth.getFullYear()}.${String(viewMonth.getMonth()+1).padStart(2,'0')}`; }
        
        function setLoadingUI(b) {
            document.getElementById('sync-indicator').innerHTML = b ? '<span class="spinner"></span> SYNCING' : '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> LIVE';
            if(!b) document.getElementById('last-update-time').innerText = new Date().toLocaleTimeString();
        }
    </script>
</body>
</html>
