<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0b0e14; color: #f8fafc; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: #161a23; border: 1px solid rgba(255, 255, 255, 0.03); }
        input, select { outline: none; transition: all 0.2s; border: 1px solid transparent; }
        input:focus { border-color: #6366f1 !important; background-color: #fff !important; color: #000; }
        
        .toggle-btn.active { background-color: #6366f1 !important; color: white !important; }
        .tab-btn.active { background-color: #6366f1 !important; border-color: #6366f1 !important; color: white !important; }
        button:active { transform: scale(0.97); }
        
        /* Loading Overlay */
        #loading-overlay { position: fixed; inset: 0; background: rgba(11, 14, 20, 0.8); z-index: 50; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    </style>
</head>
<body class="p-4 md:p-10">

    <!-- 전역 로딩 인디케이터 -->
    <div id="loading-overlay">
        <div class="flex flex-col items-center">
            <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-sm font-bold text-slate-400">데이터 연동 중...</p>
        </div>
    </div>

    <div class="max-w-6xl mx-auto">
        <!-- 상단 대시보드 (통계) -->
        <header class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
            <div class="bg-indigo-600 p-7 rounded-[32px] shadow-lg">
                <p class="text-indigo-200 text-[11px] font-bold uppercase tracking-wider mb-1">총 자산 합계</p>
                <h2 class="text-3xl font-black text-white" id="stat-total">₩0</h2>
            </div>
            <div class="glass-card p-7 rounded-[32px]">
                <p class="text-slate-500 text-[11px] font-bold uppercase mb-1">이번 달 수입</p>
                <h2 class="text-2xl font-bold text-emerald-400" id="stat-income">₩0</h2>
            </div>
            <div class="glass-card p-7 rounded-[32px]">
                <p class="text-slate-500 text-[11px] font-bold uppercase mb-1">이번 달 지출</p>
                <h2 class="text-2xl font-bold text-rose-400" id="stat-expense">₩0</h2>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- 입력 영역 (왼쪽) -->
            <div class="lg:col-span-5">
                <div class="bg-white text-slate-900 p-8 rounded-[40px] shadow-2xl">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-2xl font-black">내역 추가</h3>
                        <button id="btn-refresh" class="p-2 text-slate-400 hover:text-indigo-600 transition-colors">
                            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-slate-100 p-1 rounded-2xl flex">
                                <button onclick="setWriter('남호')" id="w-namho" class="writer-btn active flex-1 py-2.5 rounded-xl text-sm font-bold transition-all">남호</button>
                                <button onclick="setWriter('가람')" id="w-garam" class="writer-btn flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-400 transition-all">가람</button>
                            </div>
                            <div class="bg-slate-100 p-1 rounded-2xl flex">
                                <button onclick="setType('asset')" id="t-asset" class="type-btn active flex-1 py-2.5 rounded-xl text-sm font-bold transition-all">자산</button>
                                <button onclick="setType('flow')" id="t-flow" class="type-btn flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-400 transition-all">수지</button>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-slate-400 block mb-2 px-1">분류 카테고리</label>
                            <select id="field-category" class="w-full bg-slate-100 border-none rounded-2xl p-4 font-bold text-slate-700 appearance-none"></select>
                        </div>

                        <!-- 자산 전용 입력 (주식/코인) -->
                        <div id="stock-fields" class="hidden bg-indigo-50 p-6 rounded-3xl border border-indigo-100 space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" id="field-ticker" placeholder="종목명" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm">
                                <input type="number" id="field-qty" placeholder="수량" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm">
                            </div>
                            <input type="number" id="field-price" placeholder="현재가 (₩)" class="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm">
                            <p class="text-right text-xs font-bold text-indigo-600" id="stock-total-preview">평가액: ₩0</p>
                        </div>

                        <!-- 일반 금액 입력 -->
                        <div id="amount-field">
                            <label class="text-[11px] font-bold text-slate-400 block mb-2 px-1">금액 (₩)</label>
                            <input type="number" id="field-amount" class="w-full bg-slate-100 border-none rounded-2xl p-4 text-2xl font-black" placeholder="0">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <input type="date" id="field-date" class="bg-slate-100 border-none rounded-2xl p-3.5 text-xs font-bold">
                            <input type="text" id="field-memo" placeholder="상세 메모" class="bg-slate-100 border-none rounded-2xl p-3.5 text-xs font-bold">
                        </div>

                        <button onclick="handleSave()" class="w-full py-5 bg-[#0b0e14] hover:bg-black text-white font-black rounded-2xl shadow-xl flex items-center justify-center gap-2 mt-4 transition-all">
                            <i data-lucide="check-circle" class="w-5 h-5"></i> 데이터 저장하기
                        </button>
                    </div>
                </div>
            </div>

            <!-- 목록 영역 (오른쪽) -->
            <div class="lg:col-span-7">
                <div class="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-2">
                    <button onclick="setFilter('all')" id="f-all" class="filter-btn tab-btn active px-6 py-2.5 rounded-xl text-sm font-bold border border-slate-800">전체</button>
                    <button onclick="setFilter('asset')" id="f-asset" class="filter-btn tab-btn px-6 py-2.5 rounded-xl text-sm font-bold border border-slate-800 text-slate-500">자산현황</button>
                    <button onclick="setFilter('income')" id="f-income" class="filter-btn tab-btn px-6 py-2.5 rounded-xl text-sm font-bold border border-slate-800 text-slate-500">수입</button>
                    <button onclick="setFilter('expense')" id="f-expense" class="filter-btn tab-btn px-6 py-2.5 rounded-xl text-sm font-bold border border-slate-800 text-slate-500">지출</button>
                </div>

                <div id="record-list" class="space-y-4">
                    <!-- 스켈레톤 또는 빈 상태가 여기에 표시됨 -->
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 설정
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-v1';

        // 앱 상태 관리
        let state = {
            writer: '남호',
            type: 'asset',
            filter: 'all',
            records: []
        };

        const categories = {
            asset: ['주식(국내)', '주식(해외)', '코인', '예적금', '보험', '현금', '기타'],
            flow: ['수입(급여)', '수입(기타)', '지출(식비)', '지출(생활비)', '지출(교통/차량)', '지출(쇼핑)', '지출(기타)']
        };

        // UI 함수
        window.setWriter = (w) => {
            state.writer = w;
            document.querySelectorAll('.writer-btn').forEach(b => {
                b.classList.toggle('active', b.id === `w-${w.toLowerCase() === '남호' ? 'namho' : 'garam'}`);
                b.classList.toggle('text-white', b.id === `w-${w.toLowerCase() === '남호' ? 'namho' : 'garam'}`);
                if (b.id !== `w-${w.toLowerCase() === '남호' ? 'namho' : 'garam'}`) b.classList.add('text-slate-400');
            });
        };

        window.setType = (t) => {
            state.type = t;
            document.querySelectorAll('.type-btn').forEach(b => {
                b.classList.toggle('active', b.id === `t-${t}`);
                b.classList.toggle('text-white', b.id === `t-${t}`);
                if (b.id !== `t-${t}`) b.classList.add('text-slate-400');
            });
            renderCategories();
        };

        window.setFilter = (f) => {
            state.filter = f;
            document.querySelectorAll('.filter-btn').forEach(b => {
                const isActive = b.id === `f-${f}`;
                b.className = `filter-btn tab-btn px-6 py-2.5 rounded-xl text-sm font-bold border transition-all ${isActive ? 'active border-indigo-500 text-white' : 'border-slate-800 text-slate-500'}`;
            });
            renderList();
        };

        const renderCategories = () => {
            const select = document.getElementById('field-category');
            const list = state.type === 'asset' ? categories.asset : categories.flow;
            select.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            handleCategoryChange();
        };

        const handleCategoryChange = () => {
            const cat = document.getElementById('field-category').value;
            const isInvest = cat.includes('주식') || cat.includes('코인');
            document.getElementById('stock-fields').classList.toggle('hidden', !isInvest);
            document.getElementById('amount-field').classList.toggle('hidden', isInvest);
        };

        // 데이터베이스 함수
        const fetchAll = async () => {
            if (!auth.currentUser) return;
            showLoading(true);
            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'records');
                const querySnapshot = await getDocs(colRef);
                state.records = querySnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                renderList();
            } catch (e) {
                console.error(e);
            } finally {
                showLoading(false);
            }
        };

        window.handleSave = async () => {
            const category = document.getElementById('field-category').value;
            const isInvest = category.includes('주식') || category.includes('코인');
            
            let amount = 0;
            let ticker = "";
            
            if (isInvest) {
                const qty = Number(document.getElementById('field-qty').value);
                const price = Number(document.getElementById('field-price').value);
                ticker = document.getElementById('field-ticker').value;
                amount = qty * price;
            } else {
                amount = Number(document.getElementById('field-amount').value);
            }

            if (!amount || amount <= 0) return alert("금액을 입력해주세요.");

            showLoading(true);
            const docId = `rec_${Date.now()}`;
            const data = {
                writer: state.writer,
                type: category.includes('수입') ? 'income' : (category.includes('지출') ? 'expense' : 'asset'),
                category,
                amount,
                ticker,
                memo: document.getElementById('field-memo').value,
                date: document.getElementById('field-date').value,
                timestamp: serverTimestamp()
            };

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', docId), data);
                resetForm();
                await fetchAll(); // 명시적 새로고침
            } catch (e) {
                alert("저장 실패");
            } finally {
                showLoading(false);
            }
        };

        window.handleDelete = async (id) => {
            if (!confirm("삭제하시겠습니까?")) return;
            showLoading(true);
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
                await fetchAll();
            } catch (e) {
                alert("삭제 실패");
            } finally {
                showLoading(false);
            }
        };

        const renderList = () => {
            const listEl = document.getElementById('record-list');
            const thisMonth = new Date().toISOString().slice(0, 7);
            
            let stats = { total: 0, income: 0, expense: 0 };
            
            // 데이터 정렬 (최신순)
            const sorted = [...state.records].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(r => {
                const amt = Number(r.amount) || 0;
                if (r.type === 'asset') stats.total += amt;
                else if (r.date && r.date.startsWith(thisMonth)) {
                    if (r.type === 'income') stats.income += amt;
                    else stats.expense += amt;
                }
            });

            document.getElementById('stat-total').innerText = `₩${stats.total.toLocaleString()}`;
            document.getElementById('stat-income').innerText = `₩${stats.income.toLocaleString()}`;
            document.getElementById('stat-expense').innerText = `₩${stats.expense.toLocaleString()}`;

            const filtered = sorted.filter(r => state.filter === 'all' || r.type === state.filter);
            
            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-20 text-slate-600 font-bold opacity-30">데이터가 없습니다.</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(r => `
                <div class="glass-card p-5 rounded-3xl flex justify-between items-center group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-[10px] ${r.writer === '남호' ? 'bg-indigo-600' : 'bg-rose-500'}">
                            ${r.writer}
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[9px] font-bold px-2 py-0.5 bg-slate-800 text-slate-400 rounded-full uppercase">${r.category}</span>
                                <span class="text-[10px] text-slate-600 font-medium">${r.date}</span>
                            </div>
                            <h4 class="font-bold text-slate-200 text-sm">
                                ${r.ticker ? `<span class="text-indigo-400">[${r.ticker}]</span> ` : ''}${r.memo || '내역 없음'}
                            </h4>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="text-lg font-black ${r.type === 'expense' ? 'text-rose-400' : (r.type === 'income' ? 'text-emerald-400' : 'text-white')}">
                            ${r.type === 'expense' ? '-' : ''}₩${r.amount.toLocaleString()}
                        </p>
                        <button onclick="handleDelete('${r.id}')" class="opacity-0 group-hover:opacity-100 p-2 text-slate-600 hover:text-rose-500 transition-all">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        };

        const resetForm = () => {
            ['field-amount', 'field-ticker', 'field-qty', 'field-price', 'field-memo'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('stock-total-preview').innerText = '평가액: ₩0';
        };

        const showLoading = (show) => {
            document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
        };

        // 초기화
        const init = async () => {
            document.getElementById('field-date').value = new Date().toISOString().split('T')[0];
            renderCategories();
            document.getElementById('field-category').onchange = handleCategoryChange;
            document.getElementById('field-qty').oninput = () => {
                const q = Number(document.getElementById('field-qty').value);
                const p = Number(document.getElementById('field-price').value);
                document.getElementById('stock-total-preview').innerText = `평가액: ₩${(q * p).toLocaleString()}`;
            };
            document.getElementById('field-price').oninput = document.getElementById('field-qty').oninput;
            document.getElementById('btn-refresh').onclick = fetchAll;

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                onAuthStateChanged(auth, (user) => { if (user) fetchAll(); });
            } catch (e) {
                console.error(e);
                showLoading(false);
            }
        };

        init();
    </script>
</body>
</html>
