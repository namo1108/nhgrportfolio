<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0;
            padding: 24px;
            overflow-x: hidden;
        }
        .glass-card { 
            background: rgba(30, 41, 59, 0.4); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 20px;
        }
        .input-card {
            background: white;
            border-radius: 24px;
            color: #1e293b;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .btn-writer, .btn-type {
            background: #f1f5f9;
            color: #94a3b8;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 13px;
        }
        .btn-writer.active, .btn-type.active {
            background: #6366f1;
            color: white;
        }
        .filter-btn {
            background: rgba(30, 41, 59, 0.6);
            color: #64748b;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid transparent;
            transition: all 0.3s;
        }
        .filter-btn.active {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }
        .list-item {
            background: rgba(30, 41, 59, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .list-item:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(4px);
        }
        input, select {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            width: 100%;
            outline: none;
            font-size: 14px;
        }
        .chart-container { height: 180px; position: relative; }
        label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; display: block; }
        
        /* Neon Effects */
        .neon-text-blue { color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.6); }
        .neon-shadow-indigo { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.8)); }
        .neon-shadow-rose { filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.8)); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-6">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-[9px] font-black tracking-widest text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded uppercase">Total Net Worth</span>
                    <span class="text-[9px] text-emerald-400 font-bold animate-pulse">● LIVE MARKET CONNECTED</span>
                </div>
                <h1 class="text-5xl font-black tracking-tighter" id="total-wealth">₩0</h1>
            </div>
            
            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                <div class="glass-card px-4 py-3 flex-1 md:flex-none min-w-[120px] border-l-4 border-l-indigo-500">
                    <p class="text-[9px] text-slate-500 font-bold mb-0.5 uppercase">자산 총액</p>
                    <p class="text-sm font-black text-indigo-400" id="stat-asset">₩0</p>
                </div>
                <div class="glass-card px-4 py-3 flex-1 md:flex-none min-w-[100px] border-l-4 border-l-emerald-500">
                    <p class="text-[9px] text-slate-500 font-bold mb-0.5 uppercase">이번달 수입</p>
                    <p class="text-sm font-black text-emerald-400" id="stat-income">₩0</p>
                </div>
                <div class="glass-card px-4 py-3 flex-1 md:flex-none min-w-[100px] border-l-4 border-l-rose-500">
                    <p class="text-[9px] text-slate-500 font-bold mb-0.5 uppercase">이번달 지출</p>
                    <p class="text-sm font-black text-rose-400" id="stat-expense">₩0</p>
                </div>
                <div class="glass-card px-4 py-3 flex-1 md:flex-none min-w-[100px] border-l-4 border-l-sky-500 bg-sky-500/5">
                    <p class="text-[9px] text-slate-500 font-bold mb-0.5 uppercase">현재 환율 (USD)</p>
                    <p class="text-sm font-black neon-text-blue" id="exchange-rate">₩1,481.50</p>
                </div>
            </div>
        </header>

        <!-- 대시보드 그래프 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass-card p-5">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">ASSET ALLOCATION</p>
                <div class="chart-container neon-shadow-indigo"><canvas id="assetChart"></canvas></div>
            </div>
            <div class="glass-card p-5">
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">EXPENSE TREND (NEON CURVE)</p>
                <div class="chart-container neon-shadow-rose"><canvas id="expenseChart"></canvas></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- 왼쪽: 기록 폼 -->
            <aside class="lg:col-span-4">
                <div class="input-card">
                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-xl font-black" id="form-title">기록하기</h2>
                    </div>
                    
                    <div class="space-y-4">
                        <input type="hidden" id="edit-id">
                        
                        <div class="flex p-1 bg-slate-100 rounded-xl mb-2">
                            <button onclick="setWriter('남호')" id="w-namho" class="btn-writer flex-1 py-2 active">남호</button>
                            <button onclick="setWriter('가람')" id="w-garam" class="btn-writer flex-1 py-2">가람</button>
                        </div>

                        <div class="flex p-1 bg-slate-100 rounded-xl">
                            <button onclick="setType('asset')" id="t-asset" class="btn-type flex-1 py-2 active">자산</button>
                            <button onclick="setType('income')" id="t-income" class="btn-type flex-1 py-2">수입</button>
                            <button onclick="setType('expense')" id="t-expense" class="btn-type flex-1 py-2">지출</button>
                        </div>

                        <div>
                            <label>Category</label>
                            <select id="i-category" onchange="handleCategoryChange()">
                                <!-- JS에서 동적으로 채워짐 -->
                            </select>
                        </div>

                        <!-- 주식 입력 필드 -->
                        <div id="stock-group" class="space-y-3">
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label>Ticker (티커)</label>
                                    <input type="text" id="i-ticker" placeholder="예: AAPL" onblur="fetchAutoInfo()">
                                </div>
                                <div>
                                    <label>Quantity (수량)</label>
                                    <input type="number" id="i-quantity" placeholder="0" oninput="calcTotal()">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label id="price-label">Price</label>
                                    <input type="number" id="i-price" step="0.01" placeholder="0" oninput="calcTotal()">
                                </div>
                                <div>
                                    <label>Calculated (원화)</label>
                                    <input type="text" id="i-display-amount" readonly class="bg-slate-50 font-bold text-indigo-600">
                                    <input type="hidden" id="i-amount-val">
                                </div>
                            </div>
                        </div>

                        <div id="normal-group" class="hidden">
                            <label>Amount (금액)</label>
                            <input type="number" id="i-amount" placeholder="0">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label>Date (날짜)</label>
                                <input type="date" id="i-date">
                            </div>
                            <div>
                                <label>Item Name (내용)</label>
                                <input type="text" id="i-name" placeholder="항목명">
                            </div>
                        </div>

                        <button onclick="save()" id="save-btn" class="w-full py-4 bg-slate-900 text-white font-black rounded-xl shadow-lg hover:bg-indigo-600 transition-all">데이터 저장</button>
                        <button id="cancel-btn" onclick="resetForm()" class="w-full py-2 text-xs font-bold text-slate-400 hidden uppercase tracking-widest">Cancel Edit</button>
                    </div>
                </div>
            </aside>

            <!-- 오른쪽: 리스트 -->
            <section class="lg:col-span-8">
                <div class="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-2">
                    <button onclick="setFilter('all')" id="f-all" class="filter-btn active">전체보기</button>
                    <button onclick="setFilter('asset')" id="f-asset" class="filter-btn">자산현황</button>
                    <button onclick="setFilter('income')" id="f-income" class="filter-btn">수입내역</button>
                    <button onclick="setFilter('expense')" id="f-expense" class="filter-btn">지출내역</button>
                </div>
                <div id="main-list" class="space-y-3"></div>
            </section>
        </div>
    </div>

    <script type="module">
        const apiKey = "";
        const USD_RATE = 1481.5;
        let records = [];
        let curWriter = '남호';
        let curType = 'asset';
        let curFilter = 'all';
        let assetChart, expenseChart;

        const categories = {
            asset: ['주식(국내)', '주식(해외)', '현금/예적금', '보증금', '연금/퇴직금'],
            income: ['급여', '보너스', '부수입', '이자/배당'],
            expense: ['생활비', '주거/통신', '교통/차량', '기기구입', '경조사', '기타지출']
        };

        // 초기 샘플 데이터
        const initialData = [
            { id: '1', user: '남호', type: 'asset', category: '주식(국내)', ticker: '005930', name: '삼성전자', quantity: 100, price: 61600, amount: 6160000, date: '2026-04-10' },
            { id: '2', user: '가람', type: 'asset', category: '주식(해외)', ticker: 'NVDA', name: '엔비디아', quantity: 10, price: 850, amount: 12592750, date: '2026-04-15' },
            { id: '3', user: '남호', type: 'income', category: '급여', name: '4월 월급', amount: 4500000, date: '2026-04-25' },
            { id: '4', user: '가람', type: 'expense', category: '주거/통신', name: '관리비', amount: 250000, date: '2026-04-20' },
            { id: '5', user: '남호', type: 'expense', category: '기기구입', name: '아이패드', amount: 1200000, date: '2026-04-22' }
        ];

        document.getElementById('i-date').value = new Date().toISOString().split('T')[0];

        window.setWriter = (w) => {
            curWriter = w;
            document.querySelectorAll('.btn-writer').forEach(b => b.classList.toggle('active', b.innerText === w));
        };

        window.setType = (t) => {
            curType = t;
            document.querySelectorAll('.btn-type').forEach(b => b.classList.toggle('active', b.id === 't-' + t));
            
            // 카테고리 셀렉트박스 업데이트
            const select = document.getElementById('i-category');
            select.innerHTML = categories[t].map(cat => `<option value="${cat}">${cat}</option>`).join('');
            
            handleCategoryChange();
        };

        window.handleCategoryChange = () => {
            const cat = document.getElementById('i-category').value;
            const isStock = cat.includes('주식');
            document.getElementById('stock-group').classList.toggle('hidden', !isStock);
            document.getElementById('normal-group').classList.toggle('hidden', isStock);
            document.getElementById('price-label').innerText = cat === '주식(해외)' ? 'Price ($)' : 'Price (₩)';
            calcTotal();
        };

        window.calcTotal = () => {
            const cat = document.getElementById('i-category').value;
            const qty = parseFloat(document.getElementById('i-quantity').value) || 0;
            const price = parseFloat(document.getElementById('i-price').value) || 0;
            const total = qty * price;
            if (cat === '주식(해외)') {
                const krw = Math.round(total * USD_RATE);
                document.getElementById('i-display-amount').value = `₩${krw.toLocaleString()}`;
                document.getElementById('i-amount-val').value = krw;
            } else {
                document.getElementById('i-display-amount').value = `₩${total.toLocaleString()}`;
                document.getElementById('i-amount-val').value = total;
            }
        };

        window.fetchAutoInfo = async () => {
            const ticker = document.getElementById('i-ticker').value.trim().toUpperCase();
            if (!ticker) return;
            const cat = document.getElementById('i-category').value;
            try {
                const prompt = `${cat} 시장 티커 '${ticker}'의 한글 종목명과 현재가를 JSON으로. {"name": "...", "price": 0}`;
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const result = await resp.json();
                const info = JSON.parse(result.candidates[0].content.parts[0].text);
                if (info.name) document.getElementById('i-name').value = info.name;
                if (info.price) {
                    document.getElementById('i-price').value = info.price;
                    calcTotal();
                }
            } catch (e) { console.error(e); }
        };

        window.save = () => {
            const cat = document.getElementById('i-category').value;
            const isStock = cat.includes('주식');
            const editId = document.getElementById('edit-id').value;
            let finalAmount = isStock ? parseInt(document.getElementById('i-amount-val').value) : parseInt(document.getElementById('i-amount').value);
            const data = {
                user: curWriter,
                type: curType,
                category: cat,
                name: document.getElementById('i-name').value,
                ticker: isStock ? document.getElementById('i-ticker').value.toUpperCase() : '',
                quantity: isStock ? parseFloat(document.getElementById('i-quantity').value) : 0,
                price: isStock ? parseFloat(document.getElementById('i-price').value) : 0,
                amount: finalAmount || 0,
                date: document.getElementById('i-date').value
            };
            if (editId) {
                records = records.map(r => r.id === editId ? { ...data, id: editId } : r);
            } else {
                records.push({ ...data, id: 'ID-' + Date.now() });
            }
            localStorage.setItem('nh_gr_v5_final', JSON.stringify(records));
            render();
            resetForm();
        };

        window.editItem = (id) => {
            const r = records.find(x => x.id === id);
            if (!r) return;
            document.getElementById('edit-id').value = r.id;
            setWriter(r.user);
            setType(r.type);
            document.getElementById('i-category').value = r.category;
            handleCategoryChange();
            document.getElementById('i-name').value = r.name;
            document.getElementById('i-date').value = r.date;
            if (r.category.includes('주식')) {
                document.getElementById('i-ticker').value = r.ticker;
                document.getElementById('i-quantity').value = r.quantity;
                document.getElementById('i-price').value = r.price;
                calcTotal();
            } else {
                document.getElementById('i-amount').value = r.amount;
            }
            document.getElementById('form-title').innerText = "내역 수정";
            document.getElementById('cancel-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.resetForm = () => {
            document.getElementById('edit-id').value = "";
            document.getElementById('i-name').value = "";
            document.getElementById('i-ticker').value = "";
            document.getElementById('i-quantity').value = "";
            document.getElementById('i-price').value = "";
            document.getElementById('i-amount').value = "";
            document.getElementById('i-display-amount').value = "";
            document.getElementById('i-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('form-title').innerText = "기록하기";
            document.getElementById('cancel-btn').classList.add('hidden');
        };

        window.setFilter = (f) => {
            curFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.id === 'f-' + f));
            render();
        };

        function render() {
            const listEl = document.getElementById('main-list');
            const filtered = records.filter(r => curFilter === 'all' || r.type === curFilter);
            
            let totalAsset = 0;
            let totalIncome = 0;
            let totalExpense = 0;
            let assetDist = {};
            let expenseTimeline = {};

            listEl.innerHTML = filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => {
                if (r.type === 'asset') {
                    totalAsset += r.amount;
                    assetDist[r.category] = (assetDist[r.category] || 0) + r.amount;
                } else if (r.type === 'income') {
                    totalIncome += r.amount;
                } else {
                    totalExpense += r.amount;
                    expenseTimeline[r.date] = (expenseTimeline[r.date] || 0) + r.amount;
                }

                const colorClass = r.type === 'asset' ? 'text-indigo-400' : (r.type === 'income' ? 'text-emerald-400' : 'text-rose-400');
                const badgeClass = r.type === 'asset' ? 'bg-indigo-600' : (r.type === 'income' ? 'bg-emerald-500' : 'bg-rose-500');

                return `
                <div class="list-item flex justify-between items-center group mb-2" onclick="editItem('${r.id}')">
                    <div class="flex gap-4 items-center">
                        <div class="w-10 h-10 rounded-xl ${badgeClass} flex items-center justify-center font-bold text-[10px] shadow-lg">${r.user}</div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[9px] ${colorClass} font-bold uppercase">${r.category}</span>
                                ${r.ticker ? `<span class="text-[8px] bg-slate-800 text-indigo-400 px-1 rounded font-bold">${r.ticker}</span>` : ''}
                            </div>
                            <h4 class="text-sm font-black text-slate-100">${r.name} 
                                <span class="text-[10px] text-slate-500 font-normal ml-2">${r.quantity > 0 ? r.quantity + '주' : ''}</span>
                            </h4>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-black ${colorClass}">
                            ${r.type==='expense'?'-':'+'}₩${r.amount.toLocaleString()}
                        </p>
                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-tight">${r.date}</p>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('total-wealth').innerText = '₩' + (totalAsset + totalIncome - totalExpense).toLocaleString();
            document.getElementById('stat-asset').innerText = '₩' + totalAsset.toLocaleString();
            document.getElementById('stat-income').innerText = '₩' + totalIncome.toLocaleString();
            document.getElementById('stat-expense').innerText = '₩' + totalExpense.toLocaleString();
            
            updateCharts(assetDist, expenseTimeline);
        }

        function updateCharts(dist, timeline) {
            const aCtx = document.getElementById('assetChart').getContext('2d');
            if(assetChart) assetChart.destroy();
            assetChart = new Chart(aCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(dist),
                    datasets: [{ 
                        data: Object.values(dist), 
                        backgroundColor: ['#6366f1', '#10b981', '#fbbf24', '#f43f5e', '#ec4899', '#38bdf8'], 
                        borderWidth: 0,
                        hoverOffset: 12
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    plugins: { legend: { position: 'right', labels: { color: '#94a3b8', font: { size: 10, weight: 'bold' } } } },
                    animation: { animateScale: true }
                }
            });

            const eCtx = document.getElementById('expenseChart').getContext('2d');
            if(expenseChart) expenseChart.destroy();
            const sortedDates = Object.keys(timeline).sort();
            const dataValues = sortedDates.map(d => timeline[d]);

            expenseChart = new Chart(eCtx, {
                type: 'line',
                data: {
                    labels: sortedDates,
                    datasets: [{ 
                        label: '지출액', 
                        data: dataValues, 
                        borderColor: '#f43f5e', 
                        backgroundColor: 'rgba(244, 63, 94, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 4,
                        pointBackgroundColor: '#f43f5e',
                        pointBorderColor: '#fff',
                        pointRadius: 4
                    }]
                },
                options: { 
                    maintainAspectRatio: false, 
                    scales: { 
                        y: { display: false }, 
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 9 } } } 
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        const saved = localStorage.getItem('nh_gr_v5_final');
        records = saved ? JSON.parse(saved) : initialData;
        setType('asset'); // 초기 설정
        render();

    </script>
</body>
</html>
