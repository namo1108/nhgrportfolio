<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asset Intelligence Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        
        :root {
            --primary: #1a1f2c;
            --accent: #3b82f6;
            --bg: #f8fafc;
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: #0f172a; 
            -webkit-tap-highlight-color: transparent;
            line-height: 1.5;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-gradient {
            background: linear-gradient(135deg, #1a1f2c 0%, #2d364d 100%);
            border-radius: 2rem;
        }

        .btn-navy { background-color: var(--primary); color: white; border-radius: 1rem; border: none; cursor: pointer; }
        .btn-navy:hover { opacity: 0.9; transform: translateY(-1px); }

        .input-premium {
            width: 100%; padding: 0.875rem 1rem; border-radius: 1rem;
            border: 1.5px solid #e2e8f0; background: white;
            font-weight: 600; font-size: 0.95rem; transition: all 0.2s;
        }

        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid white; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <div class="max-w-6xl mx-auto p-4 md:p-8 lg:p-12 min-h-screen">
        
        <!-- Header -->
        <header class="main-gradient p-8 md:p-12 text-white shadow-2xl mb-8 relative overflow-hidden">
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                <div>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="px-2 py-0.5 bg-blue-500/20 text-blue-400 text-[10px] font-black rounded-full border border-blue-500/30 uppercase tracking-widest">Total Net Worth</span>
                        <div id="sync-indicator" class="flex items-center gap-1.5 text-[10px] font-bold text-slate-400">
                            <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> SYNCED
                        </div>
                    </div>
                    <h1 id="display-total" class="text-4xl md:text-6xl font-black font-mono tracking-tighter italic">₩0</h1>
                </div>
                <div class="grid grid-cols-2 md:flex gap-4 md:gap-8 font-mono">
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center min-w-[120px]">
                        <p class="text-[10px] text-slate-500 mb-1 uppercase">USD/KRW</p>
                        <p id="display-rate" class="text-lg font-bold text-blue-300">1,420.0</p>
                    </div>
                    <div class="bg-white/5 p-4 rounded-2xl border border-white/10 text-center min-w-[120px]">
                        <p class="text-[10px] text-slate-500 mb-1 uppercase">Month Flow</p>
                        <p id="display-flow" class="text-lg font-bold text-emerald-400">+₩0</p>
                    </div>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-[400px_1fr] gap-8">
            <!-- Form -->
            <aside class="space-y-6">
                <section id="form-card" class="glass-card p-6 md:p-8 shadow-xl lg:sticky lg:top-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 id="form-title" class="text-xl font-black">📝 내역 입력</h2>
                        <div class="flex items-center bg-slate-100 rounded-xl p-1 font-mono text-xs font-bold">
                            <button onclick="changeViewMonth(-1)" class="w-8 h-8 flex items-center justify-center">◀</button>
                            <span id="month-label" class="px-3 min-w-[80px] text-center">2026. 04</span>
                            <button onclick="changeViewMonth(1)" class="w-8 h-8 flex items-center justify-center">▶</button>
                        </div>
                    </div>

                    <div class="space-y-5">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="updateFormState('user_name', '남편')" id="user-h" class="py-3.5 font-black text-sm border-2 rounded-2xl transition-all">남편</button>
                            <button onclick="updateFormState('user_name', '아내')" id="user-w" class="py-3.5 font-black text-sm border-2 rounded-2xl transition-all">아내</button>
                        </div>

                        <div class="flex p-1.5 bg-slate-100 rounded-2xl">
                            <button onclick="updateFormState('type', '수입')" id="type-in" class="flex-1 py-3 rounded-xl font-black text-xs transition-all">수입/자산</button>
                            <button onclick="updateFormState('type', '지출')" id="type-out" class="flex-1 py-3 rounded-xl font-black text-xs transition-all">지출</button>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1.5">
                                <label class="text-[10px] font-black text-slate-400 uppercase">날짜</label>
                                <input type="date" id="f-date" class="input-premium">
                            </div>
                            <div class="space-y-1.5">
                                <label id="label-amount" class="text-[10px] font-black text-slate-400 uppercase flex justify-between">
                                    <span>입력 금액</span>
                                    <span id="currency-indicator" class="text-blue-500">KRW</span>
                                </label>
                                <input type="number" id="f-amount" placeholder="0" class="input-premium">
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black text-slate-400 uppercase">카테고리</label>
                            <select id="f-cat" onchange="handleCatChange()" class="input-premium"></select>
                        </div>

                        <div id="stock-section" class="hidden p-5 bg-blue-50/50 border border-blue-100 rounded-2xl space-y-4">
                            <div class="grid grid-cols-2 gap-3">
                                <div class="space-y-1.5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase">티커 (Ticker)</label>
                                    <input type="text" id="f-ticker" placeholder="AAPL / 005930" class="input-premium text-xs uppercase">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="text-[9px] font-black text-slate-400 uppercase">수량 (Qty)</label>
                                    <input type="number" id="f-qty" placeholder="0.00" step="0.000001" class="input-premium text-xs">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="text-[10px] font-black text-slate-400 uppercase">메모</label>
                            <input type="text" id="f-desc" placeholder="메모 입력" class="input-premium">
                        </div>

                        <div class="pt-4 space-y-2">
                            <button id="btn-main-action" onclick="handleSubmit()" class="w-full py-5 btn-navy font-black text-base shadow-lg">저장하기</button>
                            <div id="edit-actions" class="hidden grid grid-cols-2 gap-3">
                                <button onclick="exitEditMode()" class="py-4 bg-slate-200 text-slate-600 rounded-2xl font-black text-xs">취소</button>
                                <button onclick="handleDelete()" class="py-4 bg-rose-50 text-rose-500 border border-rose-100 rounded-2xl font-black text-xs">삭제</button>
                            </div>
                        </div>
                    </div>
                </section>
            </aside>

            <!-- List -->
            <main class="space-y-4">
                <div class="flex gap-2 overflow-x-auto no-scrollbar py-2 sticky top-0 z-20 bg-[#f8fafc]/80 backdrop-blur-md">
                    <button onclick="setFilter('all')" id="tab-all" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">전체</button>
                    <button onclick="setFilter('asset')" id="tab-asset" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">자산</button>
                    <button onclick="setFilter('income')" id="tab-income" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">수입</button>
                    <button onclick="setFilter('expense')" id="tab-expense" class="flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all">지출</button>
                </div>
                <div id="list-container" class="space-y-4 min-h-[500px]"></div>
            </main>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        let supabaseClient, records = [], filter = 'all', editId = null;
        let exchangeRate = 1420, priceMap = {}, viewDate = new Date();
        
        const form = { user_name: '남편', type: '수입' };
        const categories = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '생활용품', '교통', '여가', '경조사', '의료', '통신', '보험', '기타'],
            '자산': ['보증금', '저축/예금', '적금', '주식 (해외)', '주식 (국내)', '연금/퇴직금', '청약']
        };

        window.addEventListener('DOMContentLoaded', async () => {
            supabaseClient = supabase.createClient(SB_URL, SB_KEY);
            document.getElementById('f-date').valueAsDate = new Date();
            initForm();
            updateMonthUI();
            updateFormState('user_name', '남편');
            await fetchExchangeRate();
            await loadData();
            
            document.getElementById('list-container').addEventListener('click', (e) => {
                const card = e.target.closest('[data-id]');
                if (card) enterEditMode(card.getAttribute('data-id'));
            });
        });

        async function fetchExchangeRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json());
                if(res?.rates?.KRW) {
                    exchangeRate = res.rates.KRW;
                    document.getElementById('display-rate').innerText = exchangeRate.toLocaleString(undefined, {minimumFractionDigits:1});
                }
            } catch(e) { console.error("환율 정보 로드 실패", e); }
        }

        async function loadData() {
            setSyncing(true);
            try {
                const { data, error } = await supabaseClient.from('account_v3').select('*').order('date', { ascending: false });
                if(data) {
                    records = data;
                    const tickers = [...new Set(records.filter(r => r.ticker).map(r => r.ticker.toUpperCase().trim()))];
                    if (tickers.length > 0) {
                        // 모든 티커의 가격을 병렬로 가져오되, 성공할 때마다 렌더링 호출
                        tickers.forEach(t => fetchStockPrice(t).then(() => render()));
                    }
                    render();
                }
            } catch (err) { console.error("데이터 로드 실패:", err); } 
            finally { setSyncing(false); }
        }

        async function fetchStockPrice(ticker) {
            const originalTicker = ticker.toUpperCase().trim();
            const isKR = /^\d{6}$/.test(originalTicker);
            
            const tryFetch = async (symbol) => {
                // 1분 간격의 실시간 데이터를 요청하여 2026년 4월 21일의 실시간성을 보장
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/' + symbol + '?interval=1m&range=1d')}`;
                const response = await fetch(proxyUrl);
                const result = await response.json();
                const data = JSON.parse(result.contents);
                return data?.chart?.result?.[0]?.meta?.regularMarketPrice;
            };

            try {
                let p = null;
                if(isKR) {
                    // 국내 주식은 코스피(.KS) 먼저 시도 후 코스닥(.KQ) 시도
                    p = await tryFetch(originalTicker + '.KS');
                    if(!p) p = await tryFetch(originalTicker + '.KQ');
                } else {
                    p = await tryFetch(originalTicker);
                }
                if(p) priceMap[originalTicker] = p;
            } catch(e) { console.warn(`주가 정보 업데이트 실패: ${originalTicker}`); }
        }

        function calculateValue(item) {
            const cat = item.category || "";
            const isStock = cat.includes("주식");
            const ticker = item.ticker ? item.ticker.toUpperCase().trim() : null;
            const qty = Number(item.qty) || 0;
            const isOverseas = cat.includes("해외");
            
            // 실시간 주가 반영 로직
            if (isStock && ticker && qty > 0 && priceMap[ticker]) {
                const currentMarketPrice = priceMap[ticker];
                // 해외 주식은 달러 주가 * 환율 적용, 국내 주식은 그대로
                const unitPriceInKRW = isOverseas ? (currentMarketPrice * exchangeRate) : currentMarketPrice;
                return unitPriceInKRW * qty;
            }
            
            // 일반 자산 또는 주가 정보 없는 경우 입력된 단가(amount)를 총액으로 환산
            // 단, 해외 주식 카테고리에 단가(amount)가 입력되어 있다면 환율 적용
            const baseAmt = Number(item.amount) || 0;
            if (isStock && qty > 0) {
                // 주식인데 실시간 주가가 안 불러와졌을 때는 입력한 단가 * 수량으로 계산
                return isOverseas ? (baseAmt * qty * exchangeRate) : (baseAmt * qty);
            }
            // 일반 예적금 등은 amount 자체를 가치로 사용
            return isOverseas ? (baseAmt * exchangeRate) : baseAmt;
        }

        function render() {
            let totalWealth = 0, monthlyIn = 0, monthlyOut = 0;

            records.forEach(r => {
                const val = calculateValue(r);
                const isAsset = ["보증금", "주식", "저축", "적금", "연금", "청약"].some(c => r.category?.includes(c));
                
                if (isAsset) totalWealth += val;
                else {
                    if (r.type === '수입') totalWealth += val;
                    if (r.type === '지출') totalWealth -= val;
                }

                const rd = r.date?.match(/\d+/g) || [];
                if(parseInt(rd[0]) === viewDate.getFullYear() && parseInt(rd[1]) === (viewDate.getMonth() + 1)) {
                    if(r.type === '수입') monthlyIn += val;
                    else if(r.type === '지출') monthlyOut += val;
                }
            });

            document.getElementById('display-total').innerText = '₩' + Math.round(totalWealth).toLocaleString();
            const flow = monthlyIn - monthlyOut;
            const flowEl = document.getElementById('display-flow');
            flowEl.innerText = (flow >= 0 ? '+₩' : '-₩') + Math.abs(flow).toLocaleString();
            flowEl.className = 'text-lg font-bold ' + (flow >= 0 ? 'text-emerald-400' : 'text-rose-400');

            const container = document.getElementById('list-container');
            const filtered = records.filter(r => {
                const rd = r.date?.match(/\d+/g) || [];
                const isMonth = parseInt(rd[0]) === viewDate.getFullYear() && parseInt(rd[1]) === (viewDate.getMonth() + 1);
                if(filter === 'all') return isMonth;
                if(filter === 'asset') return ["보증금", "주식", "저축", "적금", "연금", "청약"].some(c => r.category?.includes(c));
                return isMonth && r.type === (filter === 'income' ? '수입' : '지출');
            });

            container.innerHTML = filtered.map(r => {
                const val = calculateValue(r);
                const isOverseas = r.category?.includes("해외");
                const hasPrice = r.ticker && priceMap[r.ticker.toUpperCase().trim()];
                
                return `
                <div data-id="${r.id}" class="glass-card p-6 flex justify-between items-center cursor-pointer border-2 border-transparent hover:border-blue-100">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-500 text-[9px] font-black">${r.category}</span>
                            <span class="text-[10px] font-bold text-blue-500">${r.user_name}</span>
                        </div>
                        <p class="text-base font-bold text-slate-800">${r.description || r.category}</p>
                        <p class="text-[10px] font-mono text-slate-400">
                            ${r.date || ''} ${r.ticker ? '• ' + r.ticker : ''} ${r.qty ? '• ' + r.qty + '주' : ''} ${isOverseas && r.amount ? '• $' + r.amount : ''}
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-black font-mono ${r.type === '지출' ? 'text-rose-500' : 'text-emerald-500'}">
                            ₩${Math.round(val).toLocaleString()}
                        </p>
                        ${hasPrice ? '<span class="text-[8px] font-black text-blue-400 uppercase tracking-widest bg-blue-50 px-1 rounded animate-pulse">LIVE MARKET</span>' : ''}
                    </div>
                </div>`;
            }).join('');
        }

        async function handleSubmit() {
            const amt = document.getElementById('f-amount').value;
            const cat = document.getElementById('f-cat').value;
            const payload = {
                user_name: form.user_name,
                type: form.type,
                category: cat,
                amount: Number(amt) || 0,
                date: document.getElementById('f-date').value.replace(/-/g, '. ') + '. ',
                description: document.getElementById('f-desc').value,
                ticker: document.getElementById('f-ticker').value?.toUpperCase().trim() || null,
                qty: Number(document.getElementById('f-qty').value) || null
            };

            try {
                setSyncing(true);
                if(editId) await supabaseClient.from('account_v3').update(payload).eq('id', editId);
                else await supabaseClient.from('account_v3').insert([payload]);
                
                // 새로운 티커면 가격 즉시 패치
                if(payload.ticker) await fetchStockPrice(payload.ticker);
                
                exitEditMode();
                await loadData();
            } catch (err) { alert("저장 중 오류가 발생했습니다."); }
            finally { setSyncing(false); }
        }

        function handleCatChange() {
            const cat = document.getElementById('f-cat').value;
            const isStock = cat?.includes("주식");
            const isOverseas = cat?.includes("해외");
            
            document.getElementById('stock-section').classList.toggle('hidden', !isStock);
            document.getElementById('currency-indicator').innerText = isOverseas ? "USD ($)" : "KRW (₩)";
            document.getElementById('label-amount').innerText = isStock ? "매수 단가" : "금액";
        }

        function updateFormState(key, val) {
            form[key] = val;
            if(key === 'user_name') {
                document.getElementById('user-h').className = 'py-3.5 font-black text-sm border-2 rounded-2xl transition-all ' + (val === '남편' ? 'bg-[#1a1f2c] text-white border-[#1a1f2c]' : 'bg-white text-slate-300 border-slate-50');
                document.getElementById('user-w').className = 'py-3.5 font-black text-sm border-2 rounded-2xl transition-all ' + (val === '아내' ? 'bg-[#1a1f2c] text-white border-[#1a1f2c]' : 'bg-white text-slate-300 border-slate-50');
            } else {
                document.getElementById('type-in').className = 'flex-1 py-3 rounded-xl font-black text-xs transition-all ' + (val === '수입' ? 'bg-white text-[#1a1f2c] shadow-sm' : 'text-slate-400');
                document.getElementById('type-out').className = 'flex-1 py-3 rounded-xl font-black text-xs transition-all ' + (val === '지출' ? 'bg-white text-[#1a1f2c] shadow-sm' : 'text-slate-400');
                initForm();
            }
        }

        function initForm() {
            const list = form.type === '수입' ? [...categories.수입, ...categories.자산] : categories.지출;
            document.getElementById('f-cat').innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            handleCatChange();
        }

        function enterEditMode(id) {
            const item = records.find(r => String(r.id) === String(id));
            if(!item) return;
            editId = id;
            document.getElementById('form-title').innerText = "✏️ 내역 수정";
            document.getElementById('edit-actions').classList.remove('hidden');
            document.getElementById('f-amount').value = item.amount;
            document.getElementById('f-desc').value = item.description || '';
            document.getElementById('f-ticker').value = item.ticker || '';
            document.getElementById('f-qty').value = item.qty || '';
            updateFormState('user_name', item.user_name);
            document.getElementById('f-cat').value = item.category;
            handleCatChange();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function exitEditMode() {
            editId = null;
            document.getElementById('form-title').innerText = "📝 내역 입력";
            document.getElementById('edit-actions').classList.add('hidden');
            ['f-amount', 'f-desc', 'f-ticker', 'f-qty'].forEach(id => document.getElementById(id).value = '');
            initForm();
        }

        async function handleDelete() {
            if(!confirm("정말로 삭제하시겠습니까?")) return;
            await supabaseClient.from('account_v3').delete().eq('id', editId);
            exitEditMode();
            await loadData();
        }

        function setFilter(f) {
            filter = f;
            ['all','asset','income','expense'].forEach(x => {
                document.getElementById('tab-'+x).className = 'flex-none px-6 py-3 rounded-2xl text-[11px] font-black transition-all ' + (f === x ? 'bg-[#1a1f2c] text-white shadow-lg' : 'bg-white text-slate-400');
            });
            render();
        }

        function changeViewMonth(delta) { 
            viewDate.setMonth(viewDate.getMonth() + delta); 
            updateMonthUI(); 
            render(); 
        }

        function updateMonthUI() { 
            document.getElementById('month-label').innerText = viewDate.getFullYear() + '. ' + String(viewDate.getMonth()+1).padStart(2,'0'); 
        }

        function setSyncing(b) { 
            document.getElementById('sync-indicator').innerHTML = b ? 
                '<div class="flex items-center gap-1"><div class="spinner"></div> UPDATING</div>' : 
                '<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> SYNCED'; 
        }
    </script>
</body>
</html>
