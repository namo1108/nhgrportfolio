<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 가계부 - Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        :root { --primary: #1a1f2c; --accent: #3b82f6; --bg: #f8fafc; }
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: var(--bg); 
            color: #0f172a; 
            word-break: keep-all; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 헤더 영역이 아래 요소를 가리지 않도록 설정 */
        header { 
            background: linear-gradient(135deg, #1a1f2c 0%, #2d364d 100%); 
            border-radius: 0 0 2rem 2rem;
            position: relative;
            z-index: 10;
        }

        /* 카드 및 버튼들이 클릭을 잘 받도록 z-index 부여 */
        .interactive-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            border: 1px solid #e2e8f0;
            position: relative;
            z-index: 20; /* 헤더보다 높게 설정 */
        }

        .btn-active { background-color: var(--primary) !important; color: white !important; font-weight: 800; }
        .tab-active { background-color: var(--primary) !important; color: white !important; border-color: var(--primary) !important; }
        
        .input-premium { 
            width: 100%; padding: 0.75rem; border-radius: 0.75rem; 
            border: 1.5px solid #e2e8f0; font-size: 14px; outline: none;
        }
        
        .swipe-item { 
            position: relative; overflow: hidden; border-radius: 1rem; margin-bottom: 0.75rem;
            z-index: 5;
        }
        .swipe-content { 
            background: white; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1.25rem;
            position: relative; z-index: 10; cursor: pointer;
        }

        .spinner { 
            width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); 
            border-top: 2px solid white; border-radius: 50%; animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 필터 바가 가려지지 않도록 설정 */
        #filter-nav {
            position: sticky;
            top: 10px;
            z-index: 50;
            background: rgba(248, 250, 252, 0.8);
            padding: 0.5rem 0;
        }
    </style>
</head>
<body class="pb-20">
    <header class="p-6 md:p-10 text-white shadow-xl mb-6">
        <div class="max-w-6xl mx-auto space-y-4">
            <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 bg-blue-500/30 text-blue-300 text-[10px] font-black rounded border border-blue-500/30">CLOUD</span>
                <div id="sync-status" class="text-[10px] font-bold text-slate-400 flex items-center gap-1">
                    <span id="status-dot" class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span>
                    <span id="status-text">연결됨</span>
                </div>
            </div>
            <h1 id="total-wealth" class="text-4xl font-black font-mono">₩0</h1>
            <div class="flex gap-4 text-[11px] font-bold">
                <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/10">
                    환율: <span id="rate-display" class="text-blue-300">1,400</span>
                </div>
                <div class="bg-white/10 px-3 py-1.5 rounded-lg border border-white/10">
                    이번달 흐름: <span id="flow-display" class="text-emerald-400">+₩0</span>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-[360px_1fr] gap-6">
        <!-- 기록하기 섹션 -->
        <aside class="relative">
            <div id="input-card" class="interactive-card p-6 shadow-lg border-t-4 border-t-blue-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="input-title" class="text-lg font-black">기록하기</h2>
                    <div class="flex items-center bg-slate-100 rounded-lg p-1 text-[11px] font-bold">
                        <button onclick="moveMonth(-1)" class="p-1.5">◀</button>
                        <span id="current-month" class="px-2">2026. 04</span>
                        <button onclick="moveMonth(1)" class="p-1.5">▶</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-user-h" onclick="toggleUser('남호')" class="py-2.5 rounded-xl text-xs font-black btn-active">남호</button>
                        <button id="btn-user-w" onclick="toggleUser('가람')" class="py-2.5 rounded-xl text-xs font-black bg-slate-100 text-slate-400 border border-transparent">가람</button>
                    </div>
                    
                    <div class="flex p-1 bg-slate-100 rounded-xl">
                        <button id="btn-type-in" onclick="toggleType('수입')" class="flex-1 py-2 rounded-lg font-black text-[11px] bg-white shadow-sm">수입/자산</button>
                        <button id="btn-type-out" onclick="toggleType('지출')" class="flex-1 py-2 rounded-lg font-black text-[11px] text-slate-400">지출</button>
                    </div>

                    <div class="space-y-2">
                        <input type="date" id="input-date" class="input-premium font-bold">
                        <input type="number" id="input-amount" placeholder="금액" class="input-premium font-mono font-bold">
                        <select id="input-cat" onchange="toggleStockFields()" class="input-premium font-bold"></select>
                    </div>

                    <div id="stock-fields" class="hidden p-3 bg-blue-50 rounded-xl space-y-2">
                        <input type="text" id="input-ticker" placeholder="티커 (예: AAPL)" class="input-premium text-xs uppercase">
                        <input type="number" id="input-qty" placeholder="수량" step="any" class="input-premium text-xs">
                    </div>

                    <input type="text" id="input-desc" placeholder="메모 (상세 내용)" class="input-premium">

                    <button id="btn-save" onclick="saveData()" class="w-full py-4 bg-slate-900 text-white rounded-xl font-black shadow-lg hover:bg-black transition-all flex justify-center items-center gap-2">
                        <span id="save-text">데이터 저장하기</span>
                        <div id="save-loader" class="spinner hidden"></div>
                    </button>
                    <button id="btn-cancel-edit" onclick="cancelEdit()" class="hidden w-full py-2 text-slate-400 font-bold text-xs">수정 취소</button>
                </div>
            </div>
        </aside>

        <!-- 리스트 섹션 -->
        <section>
            <div id="filter-nav" class="flex gap-2 overflow-x-auto no-scrollbar mb-4">
                <button onclick="setFilter('all')" id="f-all" class="flex-none px-5 py-2.5 rounded-xl text-[11px] font-black border border-slate-200 bg-white tab-active">전체보기</button>
                <button onclick="setFilter('income')" id="f-income" class="flex-none px-5 py-2.5 rounded-xl text-[11px] font-black border border-slate-200 bg-white text-slate-400">수입</button>
                <button onclick="setFilter('expense')" id="f-expense" class="flex-none px-5 py-2.5 rounded-xl text-[11px] font-black border border-slate-200 bg-white text-slate-400">지출</button>
                <button onclick="setFilter('asset')" id="f-asset" class="flex-none px-5 py-2.5 rounded-xl text-[11px] font-black border border-slate-200 bg-white text-slate-400">자산현황</button>
            </div>
            
            <div id="main-list" class="space-y-3"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'nhgr-portfolio';

        let dataRecords = [], currentFilter = 'all', viewDate = new Date();
        let exchangeRate = 1400, livePrices = {}, user = null;
        const state = { user: '남호', type: '수입', editId: null };

        const categorySet = {
            '수입': ['월급', '상여금', '이자/배당', '기타'],
            '지출': ['식비', '주거', '금융', '의류', '생활', '교통', '문화', '의료', '통신', '보험', '기타'],
            '자산': ['저축/예금', '주식 (해외)', '주식 (국내)', '보증금', '연금/퇴직금', '청약']
        };

        window.onload = async () => {
            document.getElementById('input-date').valueAsDate = new Date();
            updateMonthLabel();
            updateCategoryUI();
            fetchRate();
            await signInAnonymously(auth);
        };

        onAuthStateChanged(auth, (u) => {
            if (u) { user = u; initSync(); }
        });

        async function fetchRate() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD').then(r => r.json());
                if(res.rates.KRW) {
                    exchangeRate = res.rates.KRW;
                    document.getElementById('rate-display').innerText = exchangeRate.toLocaleString();
                }
            } catch(e) {}
        }

        function initSync() {
            const coll = collection(db, 'artifacts', appId, 'public', 'data', 'account_book');
            onSnapshot(coll, (snap) => {
                dataRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                render();
            });
        }

        function render() {
            let total = 0, flowAsset = 0, flowExp = 0;
            const vY = viewDate.getFullYear(), vM = viewDate.getMonth() + 1;

            dataRecords.forEach(r => {
                const isAsset = r.type === '자산' || categorySet.자산.includes(r.category);
                const val = Number(r.amount) || 0;
                if(isAsset) total += val;

                const d = r.date.split('. ');
                if(parseInt(d[0]) === vY && parseInt(d[1]) === vM) {
                    if(isAsset) flowAsset += val;
                    else if(r.type === '지출') flowExp += val;
                }
            });

            document.getElementById('total-wealth').innerText = '₩' + Math.round(total).toLocaleString();
            document.getElementById('flow-display').innerText = '+₩' + Math.round(flowAsset - flowExp).toLocaleString();

            const filtered = dataRecords.filter(r => {
                const isAsset = r.type === '자산' || categorySet.자산.includes(r.category);
                if(currentFilter === 'asset') return isAsset;
                const d = r.date.split('. ');
                const isMonth = parseInt(d[0]) === vY && parseInt(d[1]) === vM;
                if(currentFilter === 'all') return !isAsset && isMonth;
                if(currentFilter === 'income') return r.type === '수입' && !isAsset && isMonth;
                if(currentFilter === 'expense') return r.type === '지출' && isMonth;
                return false;
            }).sort((a,b) => b.date.localeCompare(a.date));

            const listArea = document.getElementById('main-list');
            if(filtered.length === 0) {
                listArea.innerHTML = '<p class="text-center py-20 text-slate-300 font-bold">표시할 데이터가 없습니다</p>';
                return;
            }

            listArea.innerHTML = filtered.map(r => `
                <div class="swipe-item">
                    <div class="swipe-content flex justify-between items-center" onclick="startEdit('${r.id}')">
                        <div>
                            <div class="text-[10px] font-black space-x-2 mb-1">
                                <span class="${r.user_name === '남호' ? 'text-blue-500' : 'text-purple-500'}">${r.user_name}</span>
                                <span class="text-slate-300">|</span>
                                <span class="text-slate-500">${r.category}</span>
                            </div>
                            <p class="font-bold text-slate-800">${r.description || r.category}</p>
                            <p class="text-[10px] font-mono text-slate-400">${r.date}</p>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <p class="font-black font-mono ${r.type === '지출' ? 'text-rose-500' : 'text-emerald-500'}">
                                ${r.type === '지출' ? '-' : ''}₩${Number(r.amount).toLocaleString()}
                            </p>
                            <button onclick="event.stopPropagation(); deleteItem('${r.id}')" class="w-8 h-8 flex items-center justify-center bg-slate-50 rounded-full text-slate-300 hover:text-rose-500">
                                <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M3 6h18v2H3V6m2 3h14v13c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2V9m3 3v7h2v-7H8m4 0v7h2v-7h-2m4 0v7h2v-7h-2z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.saveData = async () => {
            const amt = document.getElementById('input-amount').value;
            if(!amt) return alert("금액을 입력해주세요");
            
            const btn = document.getElementById('btn-save');
            btn.disabled = true;
            document.getElementById('save-loader').classList.remove('hidden');

            const date = document.getElementById('input-date').value.split('-');
            const cat = document.getElementById('input-cat').value;
            const id = state.editId || Date.now().toString();

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'account_book', id), {
                    user_name: state.user,
                    type: state.type,
                    category: cat,
                    amount: Number(amt),
                    date: `${date[0]}. ${date[1]}. ${date[2]}.`,
                    description: document.getElementById('input-desc').value,
                    ticker: document.getElementById('input-ticker').value,
                    qty: document.getElementById('input-qty').value,
                    ts: Date.now()
                });
                if(state.editId) cancelEdit();
                else {
                    document.getElementById('input-amount').value = '';
                    document.getElementById('input-desc').value = '';
                }
            } catch(e) { alert("저장 실패"); }
            btn.disabled = false;
            document.getElementById('save-loader').classList.add('hidden');
        };

        window.deleteItem = async (id) => {
            if(confirm("삭제할까요?")) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'account_book', id));
        };

        window.startEdit = (id) => {
            const r = dataRecords.find(x => x.id === id);
            if(!r) return;
            state.editId = id;
            toggleUser(r.user_name);
            toggleType(r.type);
            document.getElementById('input-amount').value = r.amount;
            document.getElementById('input-desc').value = r.description;
            document.getElementById('input-cat').value = r.category;
            document.getElementById('btn-save').classList.add('bg-amber-500');
            document.getElementById('save-text').innerText = "내역 수정하기";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            window.scrollTo({top:0, behavior:'smooth'});
        };

        window.cancelEdit = () => {
            state.editId = null;
            document.getElementById('btn-save').classList.remove('bg-amber-500');
            document.getElementById('save-text').innerText = "데이터 저장하기";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
            document.getElementById('input-amount').value = '';
            document.getElementById('input-desc').value = '';
        };

        window.toggleUser = (u) => {
            state.user = u;
            document.getElementById('btn-user-h').className = `py-2.5 rounded-xl text-xs font-black ${u === '남호' ? 'btn-active' : 'bg-slate-100 text-slate-400'}`;
            document.getElementById('btn-user-w').className = `py-2.5 rounded-xl text-xs font-black ${u === '가람' ? 'btn-active' : 'bg-slate-100 text-slate-400'}`;
        };

        window.toggleType = (t) => {
            state.type = t;
            document.getElementById('btn-type-in').className = `flex-1 py-2 rounded-lg font-black text-[11px] ${t === '수입' ? 'bg-white shadow-sm' : 'text-slate-400'}`;
            document.getElementById('btn-type-out').className = `flex-1 py-2 rounded-lg font-black text-[11px] ${t === '지출' ? 'bg-white shadow-sm' : 'text-slate-400'}`;
            updateCategoryUI();
        };

        function updateCategoryUI() {
            const cats = state.type === '수입' ? categorySet.수입.concat(categorySet.자산) : categorySet.지출;
            document.getElementById('input-cat').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        window.setFilter = (f) => {
            currentFilter = f;
            ['all', 'income', 'expense', 'asset'].forEach(k => {
                document.getElementById('f-'+k).className = `flex-none px-5 py-2.5 rounded-xl text-[11px] font-black border ${f === k ? 'tab-active' : 'bg-white text-slate-400 border-slate-200'}`;
            });
            render();
        };

        window.moveMonth = (v) => { viewDate.setMonth(viewDate.getMonth() + v); updateMonthLabel(); render(); };
        function updateMonthLabel() { document.getElementById('current-month').innerText = `${viewDate.getFullYear()}. ${String(viewDate.getMonth()+1).padStart(2,'0')}`; }
        window.toggleStockFields = () => {
            const isStock = document.getElementById('input-cat').value.includes("주식");
            document.getElementById('stock-fields').classList.toggle('hidden', !isStock);
        };
    </script>
</body>
</html>
