<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2인 스마트 가계부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-slate-800">🏠 2인 가구 자산관리</h1>
            <div class="flex gap-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center min-w-[150px]">
                    <p class="text-xs text-slate-500 uppercase tracking-wider">가용 자산</p>
                    <p id="available-assets" class="text-xl font-bold text-blue-600">₩0</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 text-center min-w-[150px]">
                    <p class="text-xs text-slate-500 uppercase tracking-wider">투자 자산(미환산)</p>
                    <p id="invest-assets" class="text-xl font-bold text-purple-600">₩0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <section class="md:col-span-1 bg-white p-6 rounded-3xl shadow-lg border border-slate-50">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold">기록하기</h2>
                    <select id="user-select" class="bg-slate-100 border-none rounded-full px-3 py-1 text-sm font-semibold">
                        <option value="남편">🧔 남편</option>
                        <option value="아내">👩 아내</option>
                    </select>
                </div>

                <form id="finance-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">구분</label>
                        <select id="type-select" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200" onchange="updateCategories()">
                            <option value="수입">💰 수입</option>
                            <option value="지출">💸 지출</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">상세 항목</label>
                        <select id="category-select" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200">
                            </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">금액</label>
                        <input type="number" id="amount-input" placeholder="₩ 0" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 focus:ring-2 focus:ring-blue-400 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">설명</label>
                        <input type="text" id="desc-input" placeholder="내용 입력" class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none">
                    </div>

                    <button type="submit" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold hover:bg-slate-800 transition-all mt-4">
                        저장하기
                    </button>
                    <button type="button" onclick="loadFixedExpenses()" class="w-full border border-slate-200 text-slate-600 p-3 rounded-2xl font-semibold text-sm hover:bg-slate-50">
                        기본 고정지출 불러오기
                    </button>
                </form>
            </section>

            <section class="md:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-50 overflow-hidden">
                    <h2 class="text-lg font-bold mb-4">최근 내역</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-slate-400 text-xs uppercase border-b">
                                    <th class="py-3 px-2">사용자</th>
                                    <th class="py-3 px-2">항목</th>
                                    <th class="py-3 px-2 text-right">금액</th>
                                    <th class="py-3 px-2"></th>
                                </tr>
                            </thead>
                            <tbody id="history-list" class="text-sm">
                                </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('myAccountData')) || [];

        const categories = {
            "수입": ["월급", "주식", "주식(미환산이익)", "기타"],
            "지출": ["신용카드", "체크카드", "현금"]
        };

        function updateCategories() {
            const type = document.getElementById('type-select').value;
            const catSelect = document.getElementById('category-select');
            catSelect.innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
        }

        document.getElementById('finance-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const record = {
                id: Date.now(),
                user: document.getElementById('user-select').value,
                type: document.getElementById('type-select').value,
                category: document.getElementById('category-select').value,
                amount: parseInt(document.getElementById('amount-input').value) || 0,
                desc: document.getElementById('desc-input').value,
                date: new Date().toLocaleDateString()
            };
            records.unshift(record);
            saveAndRender();
            e.target.reset();
        });

        function loadFixedExpenses() {
            if(!confirm("매월 나가는 고정 지출을 불러오시겠습니까?")) return;
            const fixed = [
                { id: Date.now()+1, user: "남편", type: "지출", category: "현금", amount: 250000, desc: "아파트 관리비", date: new Date().toLocaleDateString() },
                { id: Date.now()+2, user: "아내", type: "지출", category: "현금", amount: 15000, desc: "OTT 구독료", date: new Date().toLocaleDateString() }
            ];
            records = [...fixed, ...records];
            saveAndRender();
        }

        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('myAccountData', JSON.stringify(records));
            render();
        }

        function render() {
            const list = document.getElementById('history-list');
            list.innerHTML = records.map(r => `
                <tr class="border-b last:border-0 hover:bg-slate-50 transition-colors">
                    <td class="py-4 px-2 font-semibold ${r.user === '남편' ? 'text-blue-500' : 'text-rose-500'}">${r.user}</td>
                    <td class="py-4 px-2">
                        <p class="font-bold text-slate-800">${r.desc || r.category}</p>
                        <p class="text-xs text-slate-400">${r.category} | ${r.date}</p>
                    </td>
                    <td class="py-4 px-2 text-right font-bold ${r.type === '수입' ? 'text-green-600' : 'text-slate-700'}">
                        ${r.type === '수입' ? '+' : '-'} ${r.amount.toLocaleString()}
                    </td>
                    <td class="py-4 px-2 text-right">
                        <button onclick="deleteRecord(${r.id})" class="text-slate-300 hover:text-red-500 transition-colors text-lg">×</button>
                    </td>
                </tr>
            `).join('');

            // 자산 계산
            let realIncome = 0;
            let unrealizedGain = 0;
            let totalExpense = 0;

            records.forEach(r => {
                if (r.type === "수입") {
                    if (r.category === "주식(미환산이익)") unrealizedGain += r.amount;
                    else realIncome += r.amount;
                } else {
                    totalExpense += r.amount;
                }
            });

            document.getElementById('available-assets').innerText = `₩ ${(realIncome - totalExpense).toLocaleString()}`;
            document.getElementById('invest-assets').innerText = `₩ ${unrealizedGain.toLocaleString()}`;
        }

        updateCategories();
        render();
    </script>
</body>
</html>
