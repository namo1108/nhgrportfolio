<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>남호가람 자산관리 | 데이터 복구 및 필터 완성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --accent: #6366f1; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #f8fafc; letter-spacing: -0.02em; }
        .glass-card { background: var(--card); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-active { background: #1e293b !important; color: white !important; border: 2px solid #6366f1 !important; }
        .stock-badge { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .gradient-text { background: linear-gradient(135deg, #fff 30%, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input, select { background: rgba(255,255,255,0.03) !important; color: white !important; border: 1px solid rgba(255,255,255,0.1) !important; }
        input:focus { border-color: var(--accent) !important; outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-20">

    <!-- Header Section -->
    <header class="pt-12 pb-8 px-6 max-w-6xl mx-auto">
        <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <p class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-2">Total Net Worth</p>
                <h1 class="text-5xl md:text-6xl font-black tracking-tight gradient-text mb-4" id="total-wealth">₩0</h1>
                <div class="flex items-center gap-2 text-slate-400 text-xs">
                    <div class="flex -space-x-1">
                        <div class="w-6 h-6 rounded-full bg-indigo-500 border border-slate-900 flex items-center justify-center text-[8px] font-bold">남</div>
                        <div class="w-6 h-6 rounded-full bg-rose-500 border border-slate-900 flex items-center justify-center text-[8px] font-bold">가</div>
                    </div>
                    <span>가족 멤버 (남호&가람)</span>
                </div>
            </div>
            
            <div class="flex gap-4">
                <div class="glass-card px-6 py-4 rounded-3xl min-w-[140px]">
                    <p class="text-[9px] font-bold text-slate-500 mb-1">이번달 지출</p>
                    <p class="text-lg font-black text-rose-400" id="monthly-expense">₩0</p>
                </div>
                <div class="glass-card px-6 py-4 rounded-3xl min-w-[140px]">
                    <p class="text-[9px] font-bold text-slate-500 mb-1">환율 (USD)</p>
                    <p class="text-lg font-black text-emerald-400">₩1,481.5</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">
            <div class="glass-card rounded-[2rem] p-6 h-[220px]">
                <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4">Asset Allocation</h3>
                <div class="h-[150px] flex items-center justify-center">
                    <canvas id="assetChart"></canvas>
                </div>
            </div>
            <div class="glass-card rounded-[2rem] p-6 h-[220px]">
                <h3 class="text-[10px] font-black text-slate-500 uppercase mb-4">Expense Volatility</h3>
                <div class="h-[150px]">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-10">
        <!-- Input Form Section -->
        <aside class="lg:col-span-4">
            <div class="glass-card rounded-[2.5rem] p-8 sticky top-8">
                <h2 class="text-2xl font-black mb-8 flex justify-between items-center">
                    기록하기
                    <span class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-lg">+</span>
                </h2>
                
                <div class="space-y-6">
                    <div class="flex p-1 bg-white/5 rounded-2xl">
                        <button onclick="setWriter('남호')" id="w-namho" class="flex-1 py-3 text-xs font-black rounded-xl transition-all btn-active">남호</button>
                        <button onclick="setWriter('가람')" id="w-garam" class="flex-1 py-3 text-xs font-black rounded-xl transition-all text-slate-500">가람</button>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="setType('asset')" id="t-asset" class="py-3 text-xs font-black rounded-xl border border-white/10 bg-indigo-600/20 text-indigo-400">자산/수입</button>
                        <button onclick="setType('expense')" id="t-expense" class="py-3 text-xs font-black rounded-xl border border-white/10 bg-white/5 text-slate-500">지출/소비</button>
                    </div>

                    <div class="space-y-4">
                        <input type="date" id="i-date" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                        
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="i-amount" placeholder="금액 (₩)" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                            <input type="number" id="i-quantity" placeholder="수량" class="w-full px-5 py-4 rounded-2xl text-sm font-bold hidden">
                        </div>

                        <select id="i-category" onchange="toggleStockFields()" class="w-full px-5 py-4 rounded-2xl text-sm font-bold appearance-none"></select>
                        
                        <input type="text" id="i-name" placeholder="항목 이름 (예: 삼성전자, 월급)" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                        
                        <div id="stock-fields" class="hidden space-y-4">
                            <input type="text" id="i-ticker" placeholder="티커 (예: 005930, AAPL)" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                            <input type="number" id="i-avgPrice" placeholder="평단가" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                        </div>

                        <input type="text" id="i-memo" placeholder="메모 (선택사항)" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                    </div>
                    
                    <button id="save-btn" onclick="save()" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl hover:bg-indigo-500 active:scale-95 transition-all shadow-lg shadow-indigo-500/20 disabled:opacity-50">저장하기</button>
                </div>
            </div>
        </aside>

        <!-- List Section -->
        <section class="lg:col-span-8">
            <div class="flex gap-4 mb-8 overflow-x-auto no-scrollbar">
                <button onclick="setFilter('all')" id="f-all" class="px-8 py-3 text-xs font-black rounded-full btn-active whitespace-nowrap">전체 내역</button>
                <button onclick="setFilter('asset')" id="f-asset" class="px-8 py-3 text-xs font-black rounded-full bg-white/5 text-slate-500 whitespace-nowrap">자산</button>
                <button onclick="setFilter('income')" id="f-income" class="px-8 py-3 text-xs font-black rounded-full bg-white/5 text-slate-500 whitespace-nowrap">수입</button>
                <button onclick="setFilter('expense')" id="f-expense" class="px-8 py-3 text-xs font-black rounded-full bg-white/5 text-slate-500 whitespace-nowrap">지출</button>
            </div>
            
            <div id="main-list" class="space-y-4"></div>
            <div id="empty-state" class="hidden py-40 text-center">
                <p class="text-slate-600 font-black">데이터를 불러오고 있거나 내역이 없습니다.</p>
            </div>
        </section>
    </main>

    <!-- Modal for Edit -->
    <div id="edit-modal" class="fixed inset-0 z-[100] items-center justify-center bg-slate-950/80 backdrop-blur-md hidden p-4">
        <div class="glass-card w-full max-w-lg rounded-[2.5rem] p-10">
            <h3 class="text-xl font-black mb-8">내역 상세 수정</h3>
            <div id="edit-form" class="space-y-4"></div>
            <div class="flex gap-3 mt-10">
                <button onclick="delRecord()" class="px-6 py-4 bg-rose-500/10 text-rose-500 font-black rounded-2xl">삭제</button>
                <button onclick="updateRecord()" class="flex-1 py-4 bg-indigo-600 text-white font-black rounded-2xl">업데이트</button>
                <button onclick="closeEdit()" class="px-6 py-4 bg-white/5 font-black rounded-2xl">취소</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-8 py-4 bg-white text-slate-900 text-xs font-black rounded-full shadow-2xl opacity-0 transition-all z-[200] pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-v1';
        const apiKey = ""; 

        let user = null;
        let records = [];
        let curWriter = '남호';
        let curType = 'asset';
        let curFilter = 'all';
        let editingId = null;
        let assetChart, expenseChart;
        let stockPrices = {};
        let syncUnsubscribe = null;
        const RATE = 1481.5;

        // 초기 데이터셋 (원복용)
        const INITIAL_DATA = [
            { user: '남호', type: 'asset', category: '주식(국내)', name: 'KODEX200', amount: 2646000, date: '2026-04-24', ticker: '069500' },
            { user: '남호', type: 'asset', category: '주식(국내)', name: '삼성전자', amount: 6161591, date: '2026-04-24', ticker: '005930' },
            { user: '남호', type: 'asset', category: '주식(국내)', name: '우리금융지주', amount: 8590, date: '2026-04-24', ticker: '316140' },
            { user: '남호', type: 'asset', category: '주식(국내)', name: '이스트에이드', amount: 382796, date: '2026-04-24', ticker: '047560' },
            { user: '남호', type: 'asset', category: '연금/퇴직금', name: '퇴직연금', amount: 18898783, date: '2026-04-24' },
            { user: '남호', type: 'asset', category: '청약', name: '주택청약', amount: 5760000, date: '2026-04-24' },
            { user: '남호', type: 'asset', category: '보증금', name: '아파트보증금', amount: 15800000, date: '2026-04-24' },
            { user: '남호', type: 'asset', category: '저축/예금', name: '청년도약적금', amount: 7000000, date: '2026-04-24' },
            { user: '남호', type: 'asset', category: '저축/예금', name: '연지곤지', amount: 3510000, date: '2026-04-24' },
            { user: '가람', type: 'asset', category: '주식(국내)', name: '주식(국내) 합산', amount: 9165000, date: '2026-04-24' },
            { user: '가람', type: 'asset', category: '주식(해외)', name: 'QQQ', amount: 665882, date: '2026-04-24', ticker: 'QQQ' },
            { user: '가람', type: 'asset', category: '주식(해외)', name: 'SCHD', amount: 36307, date: '2026-04-24', ticker: 'SCHD' },
            { user: '가람', type: 'asset', category: '연금/퇴직금', name: '퇴직금', amount: 5000000, date: '2026-04-24' },
            { user: '가람', type: 'asset', category: '청약', name: '주택청약', amount: 6200000, date: '2026-04-24' },
            { user: '가람', type: 'expense', category: '주거/통신', name: '관리비', amount: 251200, date: '2026-04-24' },
            { user: '가람', type: 'expense', category: '교통', name: '자동차보험', amount: 154200, date: '2026-04-20' },
            { user: '남호', type: 'income', category: '월급', name: '4월 급여', amount: 4500000, date: '2026-04-25' }
        ];

        async function fetchStockPrice(ticker) {
            if (!ticker) return 0;
            if (stockPrices[ticker]) return stockPrices[ticker];
            const prompt = `Return ONLY the current numeric stock price of ${ticker}. No currency symbols, no text. If you can't find it, return 0.`;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                const priceText = data.candidates?.[0]?.content?.parts?.[0]?.text || "0";
                const price = parseFloat(priceText.replace(/[^0-9.]/g, '')) || 0;
                stockPrices[ticker] = price;
                return price;
            } catch (e) { return 0; }
        }

        const initAuth = async () => {
            if (auth.currentUser) return;
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) { console.error("Auth error:", error); }
        };

        const startSync = (u) => {
            if (!u) return;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'records');
            
            syncUnsubscribe = onSnapshot(colRef, async (snap) => {
                if (snap.empty) {
                    // 데이터가 없으면 원복 데이터 삽입
                    const batch = writeBatch(db);
                    INITIAL_DATA.forEach(item => {
                        const newDoc = doc(colRef);
                        batch.set(newDoc, item);
                    });
                    await batch.commit();
                    return;
                }
                
                records = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const tickers = [...new Set(records.filter(r => r.ticker).map(r => r.ticker))];
                for (let t of tickers) if(!stockPrices[t]) await fetchStockPrice(t);
                render();
            }, (err) => {
                if (err.code === 'permission-denied') initAuth();
            });
        };

        onAuthStateChanged(auth, (u) => {
            if (u) {
                user = u;
                document.getElementById('save-btn').disabled = false;
                startSync(u);
            } else {
                user = null;
                document.getElementById('save-btn').disabled = true;
                if (syncUnsubscribe) syncUnsubscribe();
                initAuth();
            }
        });

        window.setWriter = (w) => {
            curWriter = w;
            document.getElementById('w-namho').className = `flex-1 py-3 text-xs font-black rounded-xl transition-all ${w==='남호'?'btn-active':'text-slate-500'}`;
            document.getElementById('w-garam').className = `flex-1 py-3 text-xs font-black rounded-xl transition-all ${w==='가람'?'btn-active':'text-slate-500'}`;
        };

        window.setType = (t) => {
            curType = t;
            document.getElementById('t-asset').className = `py-3 text-xs font-black rounded-xl border ${t==='asset'?'bg-indigo-600/20 text-indigo-400 border-indigo-500/50':'bg-white/5 text-slate-500 border-white/10'}`;
            document.getElementById('t-expense').className = `py-3 text-xs font-black rounded-xl border ${t==='expense'?'bg-rose-600/20 text-rose-400 border-rose-500/50':'bg-white/5 text-slate-500 border-white/10'}`;
            
            const cats = {
                asset: ["주식(국내)", "주식(해외)", "현금", "연금/퇴직금", "청약", "보증금", "저축/예금", "월급", "보너스"],
                expense: ["식비", "주거/통신", "쇼핑", "교통", "의료", "문화/생활", "기타"]
            };
            document.getElementById('i-category').innerHTML = cats[t].map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStockFields();
        };

        window.toggleStockFields = () => {
            const cat = document.getElementById('i-category').value;
            const isStock = cat.includes('주식');
            document.getElementById('stock-fields').className = isStock ? 'space-y-4' : 'hidden';
            document.getElementById('i-quantity').className = isStock ? 'w-full px-5 py-4 rounded-2xl text-sm font-bold' : 'hidden';
        };

        window.save = async () => {
            if (!user) return;
            const cat = document.getElementById('i-category').value;
            const isStock = cat.includes('주식');
            const type = (cat === '월급' || cat === '보너스') ? 'income' : curType;
            
            const data = {
                user: curWriter,
                type: type,
                category: cat,
                date: document.getElementById('i-date').value || new Date().toISOString().split('T')[0],
                name: document.getElementById('i-name').value,
                amount: parseInt(document.getElementById('i-amount').value) || 0,
                memo: document.getElementById('i-memo').value,
                createdAt: Date.now()
            };

            if (isStock) {
                data.ticker = document.getElementById('i-ticker').value.toUpperCase();
                data.quantity = parseFloat(document.getElementById('i-quantity').value) || 0;
                data.avgPrice = parseFloat(document.getElementById('i-avgPrice').value) || 0;
                if (!data.amount) data.amount = Math.round(data.quantity * data.avgPrice);
            }

            try {
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'records');
                await setDoc(doc(colRef), data);
                showToast("저장되었습니다.");
            } catch (e) { showToast("저장 실패"); }
        };

        window.setFilter = (f) => {
            curFilter = f;
            ['all', 'asset', 'income', 'expense'].forEach(id => {
                const el = document.getElementById('f-'+id);
                if(el) el.className = `px-8 py-3 text-xs font-black rounded-full transition-all ${id===f?'btn-active':'bg-white/5 text-slate-500'}`;
            });
            render();
        };

        function render() {
            const filtered = records
                .filter(r => curFilter === 'all' || r.type === curFilter)
                .sort((a,b) => new Date(b.date) - new Date(a.date));

            let total = 0, mExp = 0, assetMap = {}, expTrend = {};
            const now = new Date();
            const currentYM = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}`;

            const listEl = document.getElementById('main-list');
            if (filtered.length === 0) {
                listEl.innerHTML = ''; 
                document.getElementById('empty-state').classList.remove('hidden');
            } else {
                document.getElementById('empty-state').classList.add('hidden');
                listEl.innerHTML = filtered.map(r => {
                    let val = r.amount || 0;
                    let isLive = false;
                    
                    if (r.ticker && r.quantity && stockPrices[r.ticker]) {
                        isLive = true;
                        const price = stockPrices[r.ticker];
                        val = Math.round(r.category.includes('해외') ? price * r.quantity * RATE : price * r.quantity);
                    }

                    if (r.type === 'asset') {
                        total += val;
                        assetMap[r.category] = (assetMap[r.category]||0) + val;
                    } else if (r.type === 'expense') {
                        if (r.date.startsWith(currentYM)) mExp += val;
                        const m = r.date.substring(0, 7);
                        expTrend[m] = (expTrend[m]||0) + val;
                    }

                    const typeColor = r.type === 'expense' ? 'text-rose-400' : (r.type === 'income' ? 'text-sky-400' : 'text-emerald-400');
                    const badgeColor = r.type === 'expense' ? 'bg-rose-500/10 text-rose-500' : (r.type === 'income' ? 'bg-sky-500/10 text-sky-500' : 'bg-emerald-500/10 text-emerald-500');

                    return `
                    <div class="glass-card p-6 rounded-[1.5rem] flex justify-between items-center cursor-pointer hover:bg-white/10 transition-all" onclick="openEdit('${r.id}')">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-[10px] ${r.user==='남호'?'bg-indigo-500/20 text-indigo-400':'bg-rose-500/20 text-rose-400'}">
                                ${r.user}
                            </div>
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-[8px] font-bold px-1.5 py-0.5 ${badgeColor} rounded uppercase">${r.category}</span>
                                    <h4 class="font-bold text-sm text-white">${r.name}</h4>
                                    ${isLive ? '<span class="stock-badge text-[7px] px-1 py-0.5 rounded animate-pulse">LIVE</span>' : ''}
                                </div>
                                <p class="text-[10px] text-slate-500 font-medium">${r.date} ${r.ticker ? '• '+r.ticker : ''}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-base ${typeColor}">
                                ₩${val.toLocaleString()}
                            </p>
                        </div>
                    </div>`;
                }).join('');
            }

            document.getElementById('total-wealth').innerText = '₩' + total.toLocaleString();
            document.getElementById('monthly-expense').innerText = '₩' + mExp.toLocaleString();
            updateCharts(assetMap, expTrend);
        }

        function updateCharts(assetMap, expTrend) {
            const assetCtx = document.getElementById('assetChart');
            if (assetChart) assetChart.destroy();
            assetChart = new Chart(assetCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(assetMap),
                    datasets: [{
                        data: Object.values(assetMap),
                        backgroundColor: ['#6366f1', '#a855f7', '#ec4899', '#10b981', '#f59e0b', '#3b82f6'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { display: false } } }
            });

            const months = Object.keys(expTrend).sort();
            const expCtx = document.getElementById('expenseChart');
            if (expenseChart) expenseChart.destroy();
            expenseChart = new Chart(expCtx, {
                type: 'line',
                data: {
                    labels: months.map(m => m.split('-')[1]+'월'),
                    datasets: [{
                        data: months.map(m => expTrend[m]),
                        borderColor: '#f43f5e',
                        backgroundColor: 'rgba(244, 63, 94, 0.1)',
                        fill: true, tension: 0.4, borderWidth: 3
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { x: { grid: { display: false } }, y: { display: false } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        window.openEdit = (id) => {
            const r = records.find(x => x.id === id);
            if (!r) return;
            editingId = id;
            document.getElementById('edit-form').innerHTML = `
                <div class="space-y-4">
                    <input type="text" id="e-name" value="${r.name}" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                    <input type="number" id="e-amount" value="${r.amount}" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                    <input type="date" id="e-date" value="${r.date}" class="w-full px-5 py-4 rounded-2xl text-sm font-bold">
                </div>
            `;
            document.getElementById('edit-modal').style.display = 'flex';
        };

        window.closeEdit = () => { document.getElementById('edit-modal').style.display = 'none'; };

        window.updateRecord = async () => {
            if (!user) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', editingId);
                await updateDoc(docRef, {
                    name: document.getElementById('e-name').value,
                    amount: parseInt(document.getElementById('e-amount').value) || 0,
                    date: document.getElementById('e-date').value
                });
                closeEdit(); showToast("업데이트되었습니다.");
            } catch (e) { showToast("실패"); }
        };

        window.delRecord = async () => {
            if (!user) return;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', editingId);
                await deleteDoc(docRef);
                closeEdit(); showToast("삭제되었습니다.");
            } catch (e) { showToast("실패"); }
        };

        function showToast(m) {
            const t = document.getElementById('toast'); 
            t.innerText = m; 
            t.style.opacity = '1';
            setTimeout(() => { t.style.opacity = '0'; }, 3000);
        }

        document.getElementById('i-date').valueAsDate = new Date();
        setType('asset');
        initAuth();
    </script>
</body>
</html>
