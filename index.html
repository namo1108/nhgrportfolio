<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>남호가람 스마트 자산관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f121a; color: #f8fafc; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-card { background: #1a1f2e; border: 1px solid rgba(255, 255, 255, 0.05); }
        input, select { outline: none; transition: all 0.2s; border: 1px solid transparent; }
        input:focus { border-color: #6366f1 !important; background-color: #fff !important; color: #000; }
        
        .toggle-btn.active { background-color: #6366f1 !important; color: white !important; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .tab-btn.active { background-color: #6366f1 !important; border-color: #6366f1 !important; color: white !important; }
        button:active { transform: scale(0.96); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- 상단 대시보드 -->
        <header class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
            <div class="bg-gradient-to-br from-indigo-600 to-violet-700 p-6 rounded-[32px] shadow-2xl">
                <p class="text-indigo-100 text-[10px] font-bold uppercase tracking-widest mb-1">총 자산</p>
                <h2 class="text-3xl font-black text-white" id="stat-total">₩0</h2>
            </div>
            <div class="glass-card p-6 rounded-[32px]">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-1">이번달 수입</p>
                <h2 class="text-2xl font-bold text-emerald-400" id="stat-income">₩0</h2>
            </div>
            <div class="glass-card p-6 rounded-[32px]">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-1">이번달 지출</p>
                <h2 class="text-2xl font-bold text-rose-400" id="stat-expense">₩0</h2>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 입력 영역 -->
            <div class="lg:col-span-5">
                <div class="bg-white text-slate-900 p-8 rounded-[40px] shadow-2xl sticky top-8">
                    <div class="flex justify-between items-center mb-8">
                        <h3 class="text-2xl font-black">내역 추가</h3>
                        <button id="btn-reset-form" class="text-slate-400 text-xs flex items-center gap-1 hover:text-indigo-500 transition-colors">
                            <i data-lucide="rotate-ccw" class="w-3 h-3"></i> 입력창 비우기
                        </button>
                    </div>

                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2 uppercase">작성자</label>
                                <div class="flex bg-slate-100 p-1 rounded-2xl">
                                    <button id="btn-writer-namho" data-writer="남호" class="writer-btn toggle-btn active flex-1 py-2 rounded-xl text-sm font-bold">남호</button>
                                    <button id="btn-writer-garam" data-writer="가람" class="writer-btn toggle-btn flex-1 py-2 rounded-xl text-sm font-bold text-slate-400">가람</button>
                                </div>
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2 uppercase">유형</label>
                                <div class="flex bg-slate-100 p-1 rounded-2xl">
                                    <button id="btn-type-asset" data-type="asset" class="type-btn toggle-btn active flex-1 py-2 rounded-xl text-sm font-bold">자산</button>
                                    <button id="btn-type-flow" data-type="flow" class="type-btn toggle-btn flex-1 py-2 rounded-xl text-sm font-bold text-slate-400">흐름</button>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="text-[11px] font-bold text-slate-400 block mb-2">카테고리</label>
                            <select id="field-category" class="w-full bg-slate-100 border-none rounded-2xl p-3.5 font-bold text-slate-700 cursor-pointer"></select>
                        </div>

                        <div id="stock-section" class="hidden bg-indigo-50 p-5 rounded-3xl border border-indigo-100 space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-[10px] font-bold text-indigo-400 block mb-1">티커/종목</label>
                                    <input type="text" id="field-ticker" placeholder="예: 삼성전자" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm">
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-indigo-400 block mb-1">수량</label>
                                    <input type="number" id="field-qty" placeholder="0" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-indigo-400 block mb-1">현재가 (KRW)</label>
                                <input type="number" id="field-price" placeholder="0" class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-sm">
                            </div>
                            <div class="pt-2 border-t border-indigo-100">
                                <p class="text-[10px] font-bold text-slate-400 mb-1">평가액 합계</p>
                                <p class="text-2xl font-black text-indigo-600" id="display-calc">₩0</p>
                            </div>
                        </div>

                        <div id="amount-section">
                            <label class="text-[11px] font-bold text-slate-400 block mb-2">금액 (₩)</label>
                            <input type="number" id="field-amount" class="w-full bg-slate-100 border-none rounded-2xl p-4 text-2xl font-black outline-none" placeholder="0">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2">날짜</label>
                                <input type="date" id="field-date" class="w-full bg-slate-100 border-none rounded-xl p-3 text-xs">
                            </div>
                            <div>
                                <label class="text-[11px] font-bold text-slate-400 block mb-2">메모</label>
                                <input type="text" id="field-memo" placeholder="상세내용" class="w-full bg-slate-100 border-none rounded-xl p-3 text-xs">
                            </div>
                        </div>

                        <button id="btn-save" class="w-full py-5 bg-[#141824] hover:bg-black text-white font-black rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2">
                            <i data-lucide="plus-circle" class="w-5 h-5"></i> 저장하기
                        </button>
                    </div>
                </div>
            </div>

            <!-- 내역 리스트 영역 -->
            <div class="lg:col-span-7">
                <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
                    <button data-filter="all" class="filter-btn tab-btn active px-5 py-2 rounded-xl text-sm font-bold border border-slate-800 bg-[#1a1f2e] text-slate-500">전체내역</button>
                    <button data-filter="asset" class="filter-btn tab-btn px-5 py-2 rounded-xl text-sm font-bold border border-slate-800 bg-[#1a1f2e] text-slate-500">자산현황</button>
                    <button data-filter="income" class="filter-btn tab-btn px-5 py-2 rounded-xl text-sm font-bold border border-slate-800 bg-[#1a1f2e] text-slate-500">수입내역</button>
                    <button data-filter="expense" class="filter-btn tab-btn px-5 py-2 rounded-xl text-sm font-bold border border-slate-800 bg-[#1a1f2e] text-slate-500">지출내역</button>
                </div>

                <div id="record-list" class="space-y-4">
                    <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-slate-600">
                        <i data-lucide="database" class="w-12 h-12 mb-4 opacity-20"></i>
                        <p class="font-bold">데이터를 연결하는 중...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, getDocs, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. Firebase Config & Initialization
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 경로 고정 (권한 안정성 확보)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namho-garam-v1-stable';

        // 2. State
        let records = [];
        let state = { writer: '남호', type: 'asset', filter: 'all' };

        const categories = {
            asset: ['주식(국내)', '주식(해외)', '코인', '예적금', '보험', '현금', '기타'],
            flow: ['수입(급여)', '수입(기타)', '지출(생활비)', '지출(식비)', '지출(교통)', '지출(쇼핑)', '지출(기타)']
        };

        // 3. UI Update Helpers
        const updateWriterUI = (selectedWriter) => {
            state.writer = selectedWriter;
            document.querySelectorAll('.writer-btn').forEach(btn => {
                const isActive = btn.dataset.writer === selectedWriter;
                btn.classList.toggle('active', isActive);
                btn.classList.toggle('text-white', isActive);
                btn.classList.toggle('text-slate-400', !isActive);
            });
        };

        const updateTypeUI = (selectedType) => {
            state.type = selectedType;
            document.querySelectorAll('.type-btn').forEach(btn => {
                const isActive = btn.dataset.type === selectedType;
                btn.classList.toggle('active', isActive);
                btn.classList.toggle('text-white', isActive);
                btn.classList.toggle('text-slate-400', !isActive);
            });
            updateCategoryList();
        };

        const updateCategoryList = () => {
            const select = document.getElementById('field-category');
            const list = state.type === 'asset' ? categories.asset : categories.flow;
            select.innerHTML = list.map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStockView();
        };

        const toggleStockView = () => {
            const cat = document.getElementById('field-category').value;
            const isStock = cat.includes('주식') || cat.includes('코인');
            document.getElementById('stock-section').classList.toggle('hidden', !isStock);
            document.getElementById('amount-section').classList.toggle('hidden', isStock);
        };

        const calcStock = () => {
            const qty = Number(document.getElementById('field-qty').value) || 0;
            const price = Number(document.getElementById('field-price').value) || 0;
            document.getElementById('display-calc').innerText = `₩${(qty * price).toLocaleString()}`;
        };

        // 4. Data Handling
        const fetchData = async () => {
            // RULE 3: Auth Before Queries
            if (!auth.currentUser) {
                console.warn("인증되지 않은 사용자입니다.");
                return;
            }

            try {
                // RULE 1: Strict Paths
                const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'records');
                const q = query(colRef);
                const querySnapshot = await getDocs(q);
                records = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            } catch (err) {
                console.error("데이터 로드 실패:", err);
                if (err.code === 'permission-denied') {
                    document.getElementById('record-list').innerHTML = `
                        <div class="text-center py-10 text-rose-500 font-bold">
                            데이터 접근 권한이 없습니다.<br>잠시 후 다시 시도해 주세요.
                        </div>
                    `;
                }
            }
        };

        const render = () => {
            const listEl = document.getElementById('record-list');
            const thisMonth = new Date().toISOString().slice(0, 7);
            let total = 0, inc = 0, exp = 0;

            const sorted = [...records].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sorted.forEach(r => {
                const amt = Number(r.amount) || 0;
                if (r.type === 'asset') total += amt;
                else if (r.date && r.date.startsWith(thisMonth)) {
                    if (r.type === 'income') inc += amt;
                    if (r.type === 'expense') exp += amt;
                }
            });

            document.getElementById('stat-total').innerText = `₩${total.toLocaleString()}`;
            document.getElementById('stat-income').innerText = `₩${inc.toLocaleString()}`;
            document.getElementById('stat-expense').innerText = `₩${exp.toLocaleString()}`;

            const filtered = sorted.filter(r => state.filter === 'all' || r.type === state.filter);
            
            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="text-center py-20 text-slate-700 font-bold opacity-30">내역이 없습니다.</div>';
                return;
            }

            listEl.innerHTML = filtered.map(r => `
                <div class="glass-card p-5 rounded-[24px] flex justify-between items-center group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-[11px] ${r.writer === '남호' ? 'bg-blue-500 text-white' : 'bg-purple-500 text-white'}">
                            ${r.writer}
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-0.5">
                                <span class="text-[9px] font-black px-1.5 py-0.5 bg-slate-800 text-slate-400 rounded uppercase tracking-tighter">${r.category || '기타'}</span>
                                <span class="text-[9px] text-slate-600 font-bold">${r.date || ''}</span>
                            </div>
                            <h4 class="font-bold text-slate-300 text-sm">
                                ${r.ticker ? `<span class="text-indigo-400 font-black">[${r.ticker}]</span> ` : ''}${r.memo || '상세내역 없음'}
                            </h4>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="text-lg font-black ${r.type === 'expense' ? 'text-rose-400' : (r.type === 'income' ? 'text-emerald-400' : 'text-white')}">
                            ${r.type === 'expense' ? '-' : ''}₩${Number(r.amount).toLocaleString()}
                        </p>
                        <button class="btn-delete p-2 text-slate-700 hover:text-rose-500 transition-all" data-id="${r.id}">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.onclick = () => deleteRecord(btn.dataset.id);
            });
            lucide.createIcons();
        };

        const saveRecord = async () => {
            if (!auth.currentUser) return;

            const cat = document.getElementById('field-category').value;
            const isStock = cat.includes('주식') || cat.includes('코인');
            let amount = isStock 
                ? (Number(document.getElementById('field-qty').value) * Number(document.getElementById('field-price').value)) 
                : Number(document.getElementById('field-amount').value);

            if (!amount || amount <= 0) {
                alert("금액을 정확히 입력해주세요.");
                return;
            }

            const data = {
                writer: state.writer,
                type: cat.includes('수입') ? 'income' : (cat.includes('지출') ? 'expense' : 'asset'),
                category: cat,
                ticker: document.getElementById('field-ticker').value || "",
                amount: amount,
                memo: document.getElementById('field-memo').value || "",
                date: document.getElementById('field-date').value,
                updatedAt: serverTimestamp()
            };

            try {
                const docId = `rec_${Date.now()}`;
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', docId);
                await setDoc(docRef, data);
                resetForm();
                await fetchData();
            } catch (e) { 
                console.error("저장 오류:", e);
                alert("저장 실패. 권한을 확인해 주세요."); 
            }
        };

        const deleteRecord = async (id) => {
            if (!auth.currentUser || !confirm("삭제하시겠습니까?")) return;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
                await fetchData();
            } catch (e) { console.error("삭제 실패:", e); }
        };

        const resetForm = () => {
            ['field-ticker', 'field-qty', 'field-price', 'field-amount', 'field-memo'].forEach(id => {
                document.getElementById(id).value = '';
            });
            document.getElementById('display-calc').innerText = '₩0';
        };

        // 5. Initial Setup
        const init = async () => {
            document.getElementById('field-date').value = new Date().toISOString().split('T')[0];
            updateCategoryList();
            
            // Event bindings
            document.getElementById('btn-writer-namho').onclick = () => updateWriterUI('남호');
            document.getElementById('btn-writer-garam').onclick = () => updateWriterUI('가람');
            document.getElementById('btn-type-asset').onclick = () => updateTypeUI('asset');
            document.getElementById('btn-type-flow').onclick = () => updateTypeUI('flow');
            document.getElementById('field-category').onchange = toggleStockView;
            document.getElementById('field-qty').oninput = calcStock;
            document.getElementById('field-price').oninput = calcStock;
            document.getElementById('btn-reset-form').onclick = resetForm;
            document.getElementById('btn-save').onclick = saveRecord;

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.onclick = () => {
                    state.filter = btn.dataset.filter;
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('active', 'bg-indigo-50', 'text-indigo-600', 'bg-indigo-500', 'text-white');
                        b.classList.add('bg-[#1a1f2e]', 'text-slate-500');
                    });
                    btn.classList.add('active', 'bg-indigo-500', 'text-white');
                    render();
                };
            });

            lucide.createIcons();

            // RULE 3: Secure Auth Initialization
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (err) {
                    console.error("인증 실패:", err);
                }
            };

            await initAuth();
            
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    fetchData();
                }
            });
        };

        init();
    </script>
</body>
</html>
