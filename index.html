<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NH&GR 가계부</title>
    <link rel="icon" href="https://fav.farm/💰" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #1e293b; letter-spacing: -0.025em; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04); transition: transform 0.2s ease; }
        .input-style { width: 100%; padding: 0.85rem; border-radius: 1rem; border: 1px solid #e2e8f0; outline: none; font-size: 16px; transition: border-color 0.2s; }
        .input-style:focus { border-color: #0f172a; }
        .btn-active { background-color: #0f172a !important; color: white !important; }
        #list::-webkit-scrollbar { width: 4px; }
        #list::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">💰 NH&GR 가계부</h1>
                <p id="last-sync" class="text-[10px] text-slate-400 font-bold uppercase mt-1">Real-time Asset Sync v6.9</p>
            </div>
            <div class="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-100 font-bold">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-50 rounded-lg text-slate-400">◀</button>
                <span id="month-display" class="min-w-[90px] text-center text-slate-700">2026.04</span>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-50 rounded-lg text-slate-400">▶</button>
            </div>
        </header>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-10 text-center">
            <div class="card p-5 border-t-4 border-blue-500"><p class="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider">Cash</p><p id="sum-avail" class="text-lg font-black">₩0</p></div>
            <div class="card p-5 border-t-4 border-emerald-500"><p class="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider">Savings</p><p id="sum-save" class="text-lg font-black">₩0</p></div>
            <div class="card p-5 border-t-4 border-purple-600"><p class="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider">Stocks</p><p id="sum-stock" class="text-lg font-black">₩0</p></div>
            <div class="card p-5 border-t-4 border-orange-500"><p class="text-[10px] text-slate-400 font-bold mb-1 uppercase tracking-wider">Future</p><p id="sum-future" class="text-lg font-black">₩0</p></div>
            <div class="card p-5 bg-slate-900 border-t-4 border-slate-900 text-white shadow-xl shadow-slate-200 col-span-2 md:col-span-1">
                <p class="text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-widest">Total Net Worth</p>
                <p id="sum-total" class="text-xl font-black text-emerald-400 tracking-tighter">₩0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="card p-6 min-h-[320px]">
                        <h3 class="font-bold text-[11px] text-slate-400 mb-6 uppercase tracking-widest">지출 분석</h3>
                        <div class="h-[200px] flex justify-center"><canvas id="expenseChart"></canvas></div>
                    </div>
                    <div class="card p-6 min-h-[320px]">
                        <h3 class="font-bold text-[11px] text-slate-400 mb-6 uppercase tracking-widest">현금 흐름</h3>
                        <div class="h-[200px] flex justify-center"><canvas id="flowChart"></canvas></div>
                    </div>
                </div>
                <div id="list" class="space-y-3 max-h-[600px] overflow-y-auto pr-1"></div>
            </div>

            <div class="lg:col-span-5">
                <section class="card p-6 sticky top-8 border-2 border-slate-50">
                    <form id="finance-form" class="space-y-4">
                        <div class="flex gap-2">
                            <button type="button" onclick="setUser('남편')" id="btn-h" class="flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white">🧔 남편</button>
                            <button type="button" onclick="setUser('아내')" id="btn-w" class="flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white">👩 아내</button>
                            <input type="hidden" id="user-name" value="남편">
                        </div>
                        <div class="flex bg-slate-100 p-1 rounded-2xl">
                            <button type="button" onclick="setType('수입')" id="btn-inc" class="flex-1 py-2 rounded-xl font-bold text-sm transition-all">수입/자산</button>
                            <button type="button" onclick="setType('지출')" id="btn-exp" class="flex-1 py-2 rounded-xl font-bold text-sm transition-all text-slate-500">지출</button>
                            <input type="hidden" id="type-select" value="수입">
                        </div>
                        <div id="method-container" class="hidden">
                            <select id="method-select" class="input-style font-bold">
                                <option value="신용카드">💳 신용카드</option><option value="체크카드">💳 체크카드</option>
                                <option value="현금">💵 현금</option><option value="계좌이체">📲 계좌이체</option>
                            </select>
                        </div>
                        <select id="category-select" class="input-style font-bold text-slate-700" onchange="toggleStock()"></select>
                        <div id="stock-inputs" class="hidden space-y-3 p-5 bg-blue-50/50 rounded-2xl border border-blue-100">
                            <input type="text" id="ticker" placeholder="AAPL 또는 005930.KS" class="input-style uppercase font-bold text-blue-600">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="number" id="buy-price" placeholder="평단($ 또는 ₩)" class="input-style font-bold">
                                <input type="number" id="qty" step="0.01" placeholder="수량" class="input-style font-bold">
                            </div>
                        </div>
                        <div id="amt-container"><input type="number" id="amount" placeholder="금액 ₩" class="input-style font-bold text-lg"></div>
                        <input type="text" id="desc" placeholder="상세 내용" class="input-style">
                        <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all text-lg">기록 저장하기</button>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let stockCache = {}, exchangeRate = 1380, charts = { exp: null, flow: null }, currentMonth = new Date();

        async function getCommonData() {
            try {
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await res.json();
                exchangeRate = data.rates.KRW;
            } catch(e) { console.warn("환율 로드 실패"); }
        }

        async function getPrice(ticker) {
            if (!ticker) return 0;
            if (stockCache[ticker]) return stockCache[ticker];
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`)}`);
                const json = await res.json();
                let price = JSON.parse(json.contents).chart.result[0].meta.regularMarketPrice;
                if (!ticker.includes('.KS')) price *= exchangeRate;
                stockCache[ticker] = price;
                return price;
            } catch (e) { return 0; }
        }

        function changeMonth(val) { currentMonth.setMonth(currentMonth.getMonth() + val); document.getElementById('month-display').innerText = `${currentMonth.getFullYear()}.${String(currentMonth.getMonth() + 1).padStart(2, '0')}`; fetchData(); }

        function setUser(name) {
            document.getElementById('user-name').value = name;
            document.getElementById('btn-h').className = name === '남편' ? 'flex-1 py-3 rounded-xl border-2 font-bold text-sm btn-active border-slate-900' : 'flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white text-slate-400 border-slate-100';
            document.getElementById('btn-w').className = name === '아내' ? 'flex-1 py-3 rounded-xl border-2 font-bold text-sm btn-active border-slate-900' : 'flex-1 py-3 rounded-xl border-2 font-bold text-sm bg-white text-slate-400 border-slate-100';
        }

        function setType(type) {
            document.getElementById('type-select').value = type;
            document.getElementById('btn-inc').className = type === '수입' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('btn-exp').className = type === '지출' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('method-container').classList.toggle('hidden', type === '수입');
            const cat = { "수입": ["월급", "주식", "주식(미환산이익)", "저축/예금", "적금", "청약", "퇴직연금", "퇴직금", "기타"], "지출": ["식비/마트", "카페/외식", "주거비", "통신/OTT", "교통/차량", "보험료", "의료비", "취미/문화", "경조사", "기타"] };
            document.getElementById('category-select').innerHTML = cat[type].map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStock();
        }

        function toggleStock() { const isStock = document.getElementById('category-select').value.includes("주식"); document.getElementById('stock-inputs').style.display = isStock ? 'block' : 'none'; document.getElementById('amt-container').style.display = isStock ? 'none' : 'block'; }

        async function fetchData() {
            await getCommonData();
            const { data } = await sb.from('account_v3').select('*').order('created_at', { ascending: false });
            if (data) {
                const filtered = data.filter(r => { const p = r.date.split('. '); return parseInt(p[0]) === currentMonth.getFullYear() && parseInt(p[1]) === (currentMonth.getMonth() + 1); });
                const tickers = [...new Set(filtered.filter(r => r.ticker).map(r => r.ticker))];
                await Promise.all(tickers.map(t => getPrice(t)));
                render(filtered);
                updateCharts(filtered);
            }
        }

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const type = document.getElementById('type-select').value;
            const isStock = document.getElementById('category-select').value.includes("주식");
            const ticker = document.getElementById('ticker').value.toUpperCase();
            let finalAmt = parseInt(document.getElementById('amount').value) || 0;
            if (isStock && ticker) { finalAmt = Math.round(parseFloat(document.getElementById('buy-price').value) || 0); }
            const record = { user_name: document.getElementById('user-name').value, type, category: document.getElementById('category-select').value + (type === '지출' ? ` (${document.getElementById('method-select').value})` : ''), amount: finalAmt, ticker, qty: parseFloat(document.getElementById('qty').value) || 0, description: document.getElementById('desc').value, date: `${currentMonth.getFullYear()}. ${currentMonth.getMonth() + 1}. ${new Date().getDate()}.` };
            const btn = document.getElementById('submit-btn'); btn.innerText = "저장 중..."; btn.disabled = true;
            await sb.from('account_v3').insert([record]);
            e.target.reset(); setType('수입'); fetchData();
            btn.innerText = "저장하기"; btn.disabled = false;
        };

        function render(records) {
            let sums = { avail: 0, save: 0, stock: 0, future: 0 };
            document.getElementById('list').innerHTML = records.map(r => {
                let currentVal = r.amount * (r.qty || 1);
                if (r.ticker && stockCache[r.ticker]) currentVal = Math.round(stockCache[r.ticker] * r.qty);
                else if (r.ticker && !r.ticker.includes('.KS')) currentVal = Math.round(r.amount * exchangeRate * (r.qty || 1));

                if (r.type === "수입") {
                    if (["월급", "기타"].includes(r.category)) sums.avail += r.amount;
                    else if (["저축/예금", "적금", "청약"].includes(r.category)) sums.save += r.amount;
                    else if (["퇴직연금", "퇴직금"].includes(r.category)) sums.future += r.amount;
                    else if (r.category.includes("주식")) sums.stock += currentVal;
                } else sums.avail -= r.amount;

                return `<div class="card p-4 flex justify-between items-center transition-transform hover:scale-[1.01]"><div class="flex items-center gap-4"><div class="w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-xs ${r.user_name === '남편' ? 'bg-slate-900 text-white shadow-lg' : 'bg-rose-500 text-white shadow-lg'}">${r.user_name[0]}</div><div><p class="font-bold text-slate-800 text-sm mb-0.5">${r.description || r.category}</p><p class="text-[10px] text-slate-400 font-bold">${r.ticker || r.category}</p></div></div><div class="flex items-center gap-4 text-right"><span class="font-black text-sm ${r.type === '수입' ? 'text-emerald-600' : 'text-slate-600'}">${r.type === '수입' ? '+' : '-'} ${currentVal.toLocaleString()}</span><button onclick="deleteItem('${r.id}')" class="text-slate-200 hover:text-red-500 font-bold px-1 text-xl">×</button></div></div>`;
            }).join('');

            document.getElementById('sum-avail').innerText = `₩${sums.avail.toLocaleString()}`;
            document.getElementById('sum-save').innerText = `₩${sums.save.toLocaleString()}`;
            document.getElementById('sum-stock').innerText = `₩${sums.stock.toLocaleString()}`;
            document.getElementById('sum-future').innerText = `₩${sums.future.toLocaleString()}`;
            document.getElementById('sum-total').innerText = `₩${(sums.avail + sums.save + sums.stock + sums.future).toLocaleString()}`;
        }

        function updateCharts(records) {
            const exp = {}, flow = { in: 0, out: 0 };
            records.forEach(r => {
                if (r.type === "지출") { const c = r.category.split(' (')[0]; exp[c] = (exp[c] || 0) + r.amount; flow.out += r.amount; }
                else { let val = r.amount * (r.qty || 1); if (r.ticker && !r.ticker.includes('.KS')) val *= exchangeRate; flow.in += val; }
            });
            const ctx1 = document.getElementById('expenseChart').getContext('2d');
            if (charts.exp) charts.exp.destroy();
            charts.exp = new Chart(ctx1, { type: 'doughnut', data: { labels: Object.keys(exp), datasets: [{ data: Object.values(exp), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } } });
            const ctx2 = document.getElementById('flowChart').getContext('2d');
            if (charts.flow) charts.flow.destroy();
            charts.flow = new Chart(ctx2, { type: 'bar', data: { labels: ['수입', '지출'], datasets: [{ data: [flow.in, flow.out], backgroundColor: ['#10b981', '#ef4444'] }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { display: false }, grid: { display: false } }, x: { grid: { display: false } } } } });
        }

        async function deleteItem(id) { if (confirm("삭제?")) { await sb.from('account_v3').delete().eq('id', id); fetchData(); } }
        setUser('남편'); setType('수입'); fetchData();
    </script>
</body>
</html>
