<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>부부 자산관리 v6.1 (안정화 버전)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .card { background: white; border-radius: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .input-style { width: 100%; padding: 0.75rem; border-radius: 0.75rem; border: 1px solid #e2e8f0; outline: none; font-size: 16px; }
        .btn-active { background-color: #1e293b !important; color: white !important; }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #3b82f6; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <h1 class="text-xl font-bold text-slate-800">📊 실시간 자산 통합 관리</h1>
            <div class="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
                <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-50 rounded-lg">◀</button>
                <span id="month-display" class="font-bold text-md px-2">2026.04</span>
                <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-50 rounded-lg">▶</button>
            </div>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
            <div class="card p-4 border-l-4 border-blue-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">가용 현금</p>
                <p id="sum-avail" class="text-lg font-extrabold text-slate-700">₩0</p>
            </div>
            <div class="card p-4 border-l-4 border-emerald-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">예적금/청약</p>
                <p id="sum-save" class="text-lg font-extrabold text-slate-700">₩0</p>
            </div>
            <div class="card p-4 border-l-4 border-purple-500 relative">
                <p class="text-[10px] text-slate-400 font-bold mb-1 flex justify-between">
                    주식 평가액 <span id="stock-status" class="hidden"><span class="spinner"></span></span>
                </p>
                <p id="sum-stock" class="text-lg font-extrabold text-slate-700">₩0</p>
            </div>
            <div class="card p-4 border-l-4 border-orange-500">
                <p class="text-[10px] text-slate-400 font-bold mb-1">미래/퇴직금</p>
                <p id="sum-future" class="text-lg font-extrabold text-slate-700">₩0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-7 space-y-6">
                <div class="card p-6 min-h-[350px]">
                    <h3 class="text-sm font-bold mb-4 flex justify-between">지출 분포 <button onclick="fetchData()" class="text-blue-500">새로고침 🔄</button></h3>
                    <div class="h-[250px]"><canvas id="expenseChart"></canvas></div>
                </div>
                <div class="card p-6">
                    <h3 class="text-sm font-bold mb-4">입력 내역</h3>
                    <div id="list" class="space-y-2 max-h-[400px] overflow-y-auto"></div>
                </div>
            </div>

            <div class="lg:col-span-5">
                <section class="card p-6 sticky top-4 border border-slate-100">
                    <form id="finance-form" class="space-y-4">
                        <div class="flex gap-2">
                            <button type="button" onclick="setUser('남편')" id="btn-h" class="flex-1 py-3 rounded-xl border font-bold text-sm bg-white">🧔 남편</button>
                            <button type="button" onclick="setUser('아내')" id="btn-w" class="flex-1 py-3 rounded-xl border font-bold text-sm bg-white">👩 아내</button>
                            <input type="hidden" id="user-name" value="남편">
                        </div>
                        <div class="flex bg-slate-100 p-1 rounded-xl">
                            <button type="button" onclick="setType('수입')" id="btn-inc" class="flex-1 py-2 rounded-lg font-bold text-sm">수입</button>
                            <button type="button" onclick="setType('지출')" id="btn-exp" class="flex-1 py-2 rounded-lg font-bold text-sm">지출</button>
                            <input type="hidden" id="type-select" value="수입">
                        </div>
                        <select id="category-select" class="input-style" onchange="toggleStock()"></select>
                        <div id="method-container" class="hidden">
                            <select id="method-select" class="input-style">
                                <option value="신용카드">💳 신용카드</option>
                                <option value="체크카드">💳 체크카드</option>
                                <option value="현금">💵 현금</option>
                                <option value="계좌이체">📲 계좌이체</option>
                            </select>
                        </div>
                        <div id="stock-inputs" class="hidden space-y-3 p-4 bg-blue-50 rounded-xl border border-blue-100">
                            <input type="text" id="ticker" placeholder="삼성전자: 005930.KS / 애플: AAPL" class="input-style text-sm">
                            <input type="number" id="qty" step="0.01" placeholder="수량(예: 10.5)" class="input-style text-sm">
                        </div>
                        <div id="amt-container">
                            <input type="number" id="amount" placeholder="금액 ₩" class="input-style font-bold">
                        </div>
                        <input type="text" id="desc" placeholder="상세 내용" class="input-style">
                        <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold shadow-lg transition-all active:scale-95">데이터 저장</button>
                    </form>
                </section>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://gtuwbqowucdegcucwcvk.supabase.co';
        const SB_KEY = 'sb_publishable_kl5FAdM9mGEZttyFqzbNfw_TlLSgRLY';
        const sb = supabase.createClient(SB_URL, SB_KEY);

        let currentDate = new Date();
        let chartInstance = null;
        let stockCache = {};

        const categories = {
            "수입": ["월급", "주식", "주식(미환산이익)", "저축/예금", "적금", "청약", "퇴직연금", "퇴직금", "기타수입"],
            "지출": ["식비/마트", "카페/외식", "주거비", "통신/OTT", "교통/차량", "보험료", "의료비", "취미/문화", "경조사", "기타지출"]
        };

        // 주가 API 호출 (타임아웃 3초 설정하여 무한 로딩 방지)
        async function getStockPrice(ticker) {
            if (!ticker) return 0;
            if (stockCache[ticker]) return stockCache[ticker];
            
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000); // 3초 지나면 취소
                
                const resp = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}`)}`, { signal: controller.signal });
                const json = await resp.json();
                const data = JSON.parse(json.contents);
                const price = data.chart.result[0].meta.regularMarketPrice;
                
                stockCache[ticker] = price;
                clearTimeout(timeoutId);
                return price;
            } catch (e) {
                console.warn(ticker + " 주가 실패, 수동 모드");
                return 0;
            }
        }

        function changeMonth(val) {
            currentDate.setMonth(currentDate.getMonth() + val);
            document.getElementById('month-display').innerText = `${currentDate.getFullYear()}.${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
            fetchData();
        }

        function setUser(name) {
            document.getElementById('user-name').value = name;
            document.getElementById('btn-h').className = name === '남편' ? 'flex-1 py-3 rounded-xl border font-bold text-sm btn-active shadow-inner' : 'flex-1 py-3 rounded-xl border font-bold text-sm bg-white text-slate-400';
            document.getElementById('btn-w').className = name === '아내' ? 'flex-1 py-3 rounded-xl border font-bold text-sm btn-active shadow-inner' : 'flex-1 py-3 rounded-xl border font-bold text-sm bg-white text-slate-400';
        }

        function setType(type) {
            document.getElementById('type-select').value = type;
            document.getElementById('btn-inc').className = type === '수입' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('btn-exp').className = type === '지출' ? 'flex-1 py-2 rounded-lg font-bold text-sm btn-active' : 'flex-1 py-2 rounded-lg font-bold text-sm text-slate-500';
            document.getElementById('method-container').classList.toggle('hidden', type === '수입');
            document.getElementById('category-select').innerHTML = categories[type].map(c => `<option value="${c}">${c}</option>`).join('');
            toggleStock();
        }

        function toggleStock() {
            const isStock = document.getElementById('category-select').value.includes("주식");
            document.getElementById('stock-inputs').style.display = isStock ? 'block' : 'none';
            document.getElementById('amt-container').style.display = isStock ? 'none' : 'block';
        }

        async function fetchData() {
            document.getElementById('stock-status').classList.remove('hidden');
            const { data, error } = await sb.from('account_v3').select('*').order('created_at', { ascending: false });
            
            if (data) {
                const filtered = data.filter(r => {
                    const [y, m] = r.date.split('. ');
                    return parseInt(y) === currentDate.getFullYear() && parseInt(m) === (currentDate.getMonth() + 1);
                });

                // 주식 데이터 필터링 후 가격 병렬 업데이트
                const tickers = [...new Set(filtered.filter(r => r.ticker).map(r => r.ticker))];
                await Promise.all(tickers.map(t => getStockPrice(t)));

                render(filtered);
                updateChart(filtered);
            }
            document.getElementById('stock-status').classList.add('hidden');
        }

        document.getElementById('finance-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "저장 중...";

            const cat = document.getElementById('category-select').value;
            const ticker = document.getElementById('ticker').value.toUpperCase();
            let amount = parseInt(document.getElementById('amount').value) || 0;

            if (cat.includes("주식") && ticker) {
                const p = await getStockPrice(ticker);
                const q = parseFloat(document.getElementById('qty').value) || 0;
                amount = p > 0 ? Math.round(p * q) : amount; // 주가 못 가져오면 입력한 금액 사용
            }

            const record = {
                user_name: document.getElementById('user-name').value,
                type: document.getElementById('type-select').value,
                category: cat + (document.getElementById('type-select').value === '지출' ? ` (${document.getElementById('method-select').value})` : ''),
                amount: amount,
                ticker: ticker,
                qty: parseFloat(document.getElementById('qty').value) || 0,
                description: document.getElementById('desc').value,
                date: `${currentDate.getFullYear()}. ${currentDate.getMonth() + 1}. ${new Date().getDate()}.`
            };

            await sb.from('account_v3').insert([record]);
            e.target.reset(); setType('수입'); fetchData();
            btn.disabled = false; btn.innerText = "데이터 저장";
        };

        async function deleteItem(id) {
            if (confirm("삭제하시겠습니까?")) {
                await sb.from('account_v3').delete().eq('id', id);
                fetchData();
            }
        }

        function updateChart(records) {
            const expenseData = {};
            records.filter(r => r.type === "지출").forEach(r => {
                const cat = r.category.split(' (')[0];
                expenseData[cat] = (expenseData[cat] || 0) + r.amount;
            });
            const ctx = document.getElementById('expenseChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(expenseData),
                    datasets: [{
                        data: Object.values(expenseData),
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } }
            });
        }

        function render(records) {
            let sums = { avail: 0, save: 0, stock: 0, future: 0 };
            const list = document.getElementById('list');

            list.innerHTML = records.map(r => {
                let displayAmt = r.amount;
                if (r.ticker && stockCache[r.ticker]) {
                    displayAmt = Math.round(stockCache[r.ticker] * r.qty);
                }

                if (r.type === "수입") {
                    if (["월급", "기타수입"].includes(r.category)) sums.avail += displayAmt;
                    else if (["저축/예금", "적금", "청약"].includes(r.category)) sums.save += displayAmt;
                    else if (["퇴직연금", "퇴직금"].includes(r.category)) sums.future += displayAmt;
                    else if (r.category.includes("주식")) sums.stock += displayAmt;
                } else { sums.avail -= r.amount; }

                return `
                <div class="flex justify-between items-center p-3 bg-white rounded-xl border border-slate-50 shadow-sm text-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-[10px] ${r.user_name === '남편' ? 'bg-blue-100 text-blue-600' : 'bg-rose-100 text-rose-600'}">${r.user_name[0]}</div>
                        <div>
                            <p class="font-bold text-slate-700 leading-tight">${r.description || r.category}</p>
                            <p class="text-[9px] text-slate-400 font-medium uppercase">${r.ticker ? r.ticker + ' ' + r.qty + '주' : r.category}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold ${r.type === '수입' ? 'text-emerald-600' : 'text-slate-600'}">${r.type === '수입' ? '+' : '-'} ${displayAmt.toLocaleString()}</span>
                        <button onclick="deleteItem('${r.id}')" class="text-slate-200 hover:text-red-500 font-bold px-1">×</button>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('sum-avail').innerText = `₩${sums.avail.toLocaleString()}`;
            document.getElementById('sum-save').innerText = `₩${sums.save.toLocaleString()}`;
            document.getElementById('sum-stock').innerText = `₩${sums.stock.toLocaleString()}`;
            document.getElementById('sum-future').innerText = `₩${sums.future.toLocaleString()}`;
        }

        setUser('남편'); setType('수입'); fetchData();
    </script>
</body>
</html>
